<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>VET GODS — Apex Intervention</title>
<style>
:root{
  --bg:#050b10;--bg2:#0a141c;--panel:#0d1c26;--panel2:#122532;--edge:#1e3a47;
  --ink:#e8f4f8;--muted:#7a9eab;--cyan:#3ad4ff;--teal:#4ef0c8;--amber:#ffd166;
  --red:#ff6b7a;--lime:#9dff7b;--violet:#b89cff;--gold:#f0c14b;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 15% -10%,rgba(58,212,255,.14),transparent 40%),
    radial-gradient(ellipse at 85% 5%,rgba(184,156,255,.10),transparent 35%),
    linear-gradient(180deg,#03080c 0%,var(--bg) 30%,#071018 100%);
  color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 90%);
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.shell{max-width:1280px;margin:0 auto;padding:0 16px 80px}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:50;margin:0 -16px;padding:12px 16px;
  background:rgba(3,10,15,.92);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(58,212,255,.15);display:flex;align-items:center;gap:14px;
}
.sigil{
  width:44px;height:44px;border-radius:14px;
  background:conic-gradient(from 200deg,var(--cyan),var(--teal),var(--violet),var(--cyan));
  padding:2px;box-shadow:0 0 28px rgba(58,212,255,.25);
}
.sigil i{display:grid;place-items:center;width:100%;height:100%;border-radius:12px;background:#061018;font-style:normal;font-weight:900;font-size:15px;letter-spacing:.05em}
.brand{font-size:18px;font-weight:900;letter-spacing:.14em}
.subtitle{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:1px}
.spacer{flex:1}
.funds-box{
  padding:8px 14px;border:1px solid #2a4d5c;border-radius:12px;background:#0a1a24;
  font-size:13px;font-weight:700;
}
.funds-box b{color:var(--lime);margin-left:4px}
.top-actions{display:flex;gap:8px;align-items:center}
.top-btn{
  padding:8px 12px;border-radius:10px;border:1px solid #2d4e5c;
  background:#0c1e28;font-size:12px;font-weight:800;letter-spacing:.04em;
  transition:.15s;
}
.top-btn:hover{border-color:var(--cyan);background:#102a38}
.top-btn.shop{border-color:#3d6a7a;background:linear-gradient(180deg,#143040,#0f2430)}

/* SCREENS */
.screen{display:none}.screen.active{display:block}

/* CARDS & LAYOUT */
.card{
  background:linear-gradient(165deg,rgba(16,38,50,.95),rgba(8,22,30,.97));
  border:1px solid rgba(70,140,165,.22);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
}
.pad{padding:18px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin:16px 0}
.grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin:14px 0}
.h1{font-size:clamp(26px,3.8vw,42px);font-weight:950;letter-spacing:-.03em;line-height:1.05;margin:6px 0 10px}
.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.lede{color:#a8c0c9;max-width:640px;line-height:1.55}
.notice{
  margin-top:12px;padding:11px 13px;border-radius:12px;
  background:rgba(58,212,255,.06);border:1px solid rgba(58,212,255,.18);
  font-size:13px;line-height:1.45;color:#c5e2eb;
}
.notice b{color:var(--ink)}
.phase-rail{
  display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px;
}
.phase{
  font-size:11px;padding:6px 10px;border-radius:999px;
  border:1px solid #2a4550;color:#6e8f9c;font-weight:700;letter-spacing:.04em;
}
.phase.done{color:#7ee0c4;border-color:#2d6a5c;background:rgba(78,240,200,.08)}
.phase.now{color:#fff;border-color:var(--cyan);background:rgba(58,212,255,.15);box-shadow:0 0 18px rgba(58,212,255,.12)}

/* PATIENT VISUAL */
.patient-visual{
  min-height:280px;position:relative;
  background:radial-gradient(circle at 50% 40%,rgba(58,212,255,.16),transparent 40%),
    linear-gradient(145deg,#081420,#0e2430);
  display:grid;place-items:center;
}
.patient-visual svg{width:min(320px,88%);filter:drop-shadow(0 16px 28px rgba(0,0,0,.4))}
.scanline{
  position:absolute;left:8%;right:8%;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:0 0 16px var(--cyan);animation:scan 3.8s ease-in-out infinite;
}
@keyframes scan{0%,100%{top:16%;opacity:.25}50%{top:80%;opacity:.9}}
.patient-tags{
  position:absolute;left:12px;right:12px;bottom:12px;
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.kpi{
  padding:11px;border:1px solid #243f4a;border-radius:14px;background:rgba(6,18,25,.8);
}
.kpi small{display:block;color:#6e8f9c;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.kpi strong{font-size:20px;font-weight:800}
.kpi .bar{height:4px;margin-top:7px;border-radius:99px;background:#152a34;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),var(--cyan))}

/* TELEMETRY */
.readout{display:grid;gap:8px}
.meter{
  padding:10px 12px;border:1px solid #213e49;border-radius:12px;background:#081820;
}
.meterhead{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.meterbar{height:8px;margin-top:7px;border-radius:99px;background:#142a34;overflow:hidden}
.meterbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width .35s ease}
.meter.danger .meterbar i{background:linear-gradient(90deg,var(--amber),var(--red))}

/* INSTRUMENTS */
.instrument-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.instrument{
  padding:14px;border:1px solid #2a4652;border-radius:14px;
  background:linear-gradient(180deg,#0f2430,#0a1a24);text-align:left;
  transition:.15s transform,.15s border-color;min-height:110px;
}
.instrument:hover:not(:disabled){transform:translateY(-2px);border-color:#4ab5ce}
.instrument:disabled{opacity:.4;cursor:not-allowed}
.instrument .dial{
  width:40px;height:40px;border-radius:50%;margin-bottom:8px;
  background:conic-gradient(var(--accent,var(--cyan)) var(--pct,65%),#1a3540 0);padding:4px;
}
.instrument .dial::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#0a1a24;box-shadow:inset 0 0 0 1px #2a4652}
.instrument b{display:block;margin-bottom:3px;font-size:14px}
.instrument small{color:#7a9eab;font-size:12px;line-height:1.35}

/* BUTTONS */
.action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{
  padding:10px 14px;border-radius:12px;border:1px solid #2f5563;
  background:#102632;font-weight:700;font-size:13px;transition:.15s;
}
.btn:hover:not(:disabled){border-color:#4a8a9e;background:#143040}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#17485c,#113040);border-color:#3a8ea8}
.btn.good{background:linear-gradient(180deg,#184a40,#11352e);border-color:#3a8a76}
.btn.warn{background:linear-gradient(180deg,#4a3820,#332616);border-color:#8a6c34}
.btn.danger{background:linear-gradient(180deg,#4a2028,#33151c);border-color:#8a3a4a}

/* LOG */
.log{
  margin-top:12px;padding:11px;border-radius:12px;background:#06141c;
  border:1px solid #1e3a46;max-height:160px;overflow-y:auto;font-size:13px;
}
.log div{padding:5px 0;border-bottom:1px solid rgba(100,160,180,.08);color:#a0b8c2}
.log div:last-child{border-bottom:0}
.log time{color:#5a7e8c;margin-right:8px;font-size:12px}

/* FINAL GATE */
.final-gate{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px;border:1px solid #3d6545;border-radius:14px;
  background:rgba(157,255,123,.06);margin-top:12px;
}

/* PETS */
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.pet-card{
  padding:15px;border:1px solid #2a4a56;border-radius:16px;
  background:linear-gradient(180deg,#0f2430,#0a1a24);
}
.pet-face{
  height:110px;border-radius:12px;background:radial-gradient(circle at 50% 50%,rgba(157,255,123,.1),transparent 50%),#08141c;
  display:grid;place-items:center;font-size:52px;margin-bottom:10px;
}
.pet-meters{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0;font-size:12px}
.pet-meters span{padding:4px 7px;border-radius:7px;background:#0a1822;border:1px solid #243e4a}
.pet-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pet-actions button{
  min-height:36px;border-radius:8px;border:1px solid #2f4e5c;
  background:#122a38;font-size:11px;font-weight:700;
}
.pet-actions button:hover{border-color:#4a8a9e}
.pet-memory{margin-top:8px;padding:8px;border-left:3px solid #5a8aa0;background:#0a1620;border-radius:6px;font-size:12px;line-height:1.4;color:#9ab4be}

/* MODALS */
.modal{
  position:fixed;inset:0;z-index:200;background:rgba(2,8,12,.82);
  display:none;place-items:center;padding:20px;
}
.modal.show{display:grid}
.modal-box{
  max-width:520px;width:100%;border-radius:22px;background:#0c1e2a;
  border:1px solid #3a7a90;box-shadow:0 30px 100px #000;padding:24px;text-align:center;
}
.modal-box .reward{font-size:56px;margin-bottom:6px}
.modal-box h2{font-size:28px;margin:6px 0 10px}
.reward-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* SHOP */
#shop-screen{
  position:fixed;inset:0;z-index:180;background:#071018;overflow-y:auto;
  padding:16px;display:none;
}
#shop-screen.open{display:block}
.shop-inner{max-width:900px;margin:0 auto}
.shop-top{
  position:sticky;top:0;z-index:2;background:#071018;padding:8px 0 14px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.shop-card{
  padding:14px;border:1px solid #2e4e60;border-radius:14px;background:#0e2030;
}
.shop-card h3{margin:4px 0 6px;font-size:15px}
.shop-price{font-size:22px;font-weight:900;color:var(--lime);margin:4px 0}
.shop-card ul{padding-left:16px;font-size:12px;line-height:1.5;color:#9ab4be;margin:8px 0}
.shop-buy{
  width:100%;min-height:44px;border-radius:10px;border:1px solid #4a7a90;
  background:#183850;font-weight:800;margin-top:8px;
}
.shop-buy:disabled{opacity:.5}

/* TOOLS */
#tools-dock{position:fixed;right:14px;bottom:16px;z-index:100}
#tools-btn{
  min-width:96px;min-height:48px;border-radius:13px;border:1px solid #4a9ac0;
  background:#123448;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4);
}
#tools-panel{
  position:fixed;inset:0;z-index:190;background:rgba(2,8,12,.85);
  display:none;place-items:center;padding:16px;
}
#tools-panel.open{display:grid}
.tools-box{
  width:min(680px,100%);max-height:90vh;overflow:auto;
  border-radius:18px;background:#0b1c2a;border:1px solid #3a6a80;padding:18px;
}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.tool-card{padding:12px;border:1px solid #2a4a5c;border-radius:12px;background:#0e2230}
.tool-card h3{font-size:14px;margin-bottom:4px}
.tool-card button{width:100%;min-height:40px;margin-top:8px;border-radius:8px;border:1px solid #3a6a80;background:#163848;font-weight:800}
.tool-profile{margin-top:14px;padding:12px;border:1px solid #2e5a6e;border-radius:12px;background:#0c1e2c}
.tool-line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.tool-tag{display:inline-block;margin:3px 3px 0 0;padding:4px 8px;border-radius:999px;background:#132a3a;border:1px solid #3a5a6e;font-size:11px}

/* TOAST */
#toast-host{
  position:fixed;left:12px;right:12px;top:70px;z-index:300;
  display:flex;justify-content:center;pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:12px;background:#102838;border:1px solid #4a8ab0;
  font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:toastIn 2.8s forwards;
}
@keyframes toastIn{
  0%{opacity:0;transform:translateY(-10px)}
  12%,75%{opacity:1;transform:none}
  100%{opacity:0;transform:translateY(-8px)}
}

/* HOME BAR */
.home-bar{margin:12px 0;padding:12px;border:1px solid #2e4e60;border-radius:14px;background:#0c1c28}

/* RESPONSIVE */
@media(max-width:900px){
  .hero,.grid-2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .instrument-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .shell{padding:0 10px 80px}
  .topbar{margin:0 -10px;padding:10px}
  .brand{font-size:15px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .instrument-grid{grid-template-columns:1fr}
  .pet-grid{grid-template-columns:1fr}
  .h1{font-size:28px}
}
</style>

<style id="vg-apex-polish-css">
/* APEX POLISH PASS — additive layer, original engine preserved */
:root{--ok:#9dff7b;--locked:#526a75}
.header-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.meta-chip{padding:6px 9px;border:1px solid #274a59;border-radius:999px;background:#091923;font-size:10px;font-weight:850;letter-spacing:.05em;white-space:nowrap}
.meta-chip b{color:var(--teal)}
.tutorial-card{margin:10px 0;padding:11px 12px;border:1px solid rgba(255,209,102,.38);border-radius:12px;background:rgba(255,209,102,.07);font-size:12px;line-height:1.45}
.tutorial-card b{color:var(--amber)}
.route-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.route-btn{padding:11px;border:1px solid #284956;border-radius:12px;background:#0d202b;text-align:left;min-height:78px;transition:.15s}
.route-btn.current{border-color:var(--cyan);box-shadow:0 0 20px rgba(58,212,255,.12)}
.route-btn.done{border-color:#315e50;background:#0d221d}
.route-btn.locked{opacity:.35;filter:saturate(.45);cursor:not-allowed}
.route-btn b{display:block;font-size:12px;margin-bottom:4px}.route-btn small{font-size:10px;color:var(--muted)}
.status-rack{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}
.status-light{padding:8px 9px;border:1px solid #264652;border-radius:10px;background:#081820;font-size:10px;line-height:1.3}
.status-light::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#38515b;box-shadow:0 0 0 transparent}
.status-light.on{border-color:#376d59;color:#d5f9e8}.status-light.on::before{background:var(--teal);box-shadow:0 0 11px rgba(78,240,200,.7)}
.cockpit{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.cockpit-cell{position:relative;padding:9px;border:1px solid #244553;border-radius:11px;background:#061720;overflow:hidden;min-height:72px}
.cockpit-cell small{display:block;color:#6f96a5;font-size:9px;letter-spacing:.1em;text-transform:uppercase}.cockpit-cell strong{display:block;font-size:18px;margin-top:3px}.cockpit-cell em{font-style:normal;font-size:9px;color:#6d8c98}
.wave{height:18px;margin-top:5px;opacity:.8;background:linear-gradient(135deg,transparent 0 12%,var(--teal) 13% 15%,transparent 16% 25%,var(--teal) 26% 28%,transparent 29% 42%,var(--cyan) 43% 45%,transparent 46% 60%,var(--teal) 61% 63%,transparent 64%);background-size:46px 18px;animation:waveMove 3.8s linear infinite}
@keyframes waveMove{to{background-position:92px 0}}
.evidence-board{margin:10px 0;padding:11px;border:1px solid #2a5361;border-radius:12px;background:#091b25}
.evidence-board h3{font-size:13px;margin:0 0 7px}.evidence-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;line-height:1.4}.evidence-row:last-child{border-bottom:0}.evidence-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:0 0 auto;background:#415a65}.evidence-row.found .evidence-dot{background:var(--teal);box-shadow:0 0 9px rgba(78,240,200,.55)}
.case-objective{margin:10px 0;padding:10px;border-left:3px solid var(--violet);background:rgba(184,156,255,.06);border-radius:8px;font-size:12px;line-height:1.45}
.scorecard{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:13px 0;text-align:left}.score-line{padding:8px 9px;border:1px solid #2a4d5c;border-radius:10px;background:#091a24;font-size:11px}.score-line b{float:right;color:var(--lime)}.case-grade{font-size:52px;font-weight:950;line-height:1;color:var(--gold);text-shadow:0 0 24px rgba(240,193,75,.22)}
.home-command{display:grid;grid-template-columns:1.3fr .7fr;gap:10px;margin:12px 0}.home-level{padding:12px;border:1px solid #31576a;border-radius:13px;background:#0b1e2a}.daily-want{padding:12px;border:1px solid #4b496b;border-radius:13px;background:rgba(184,156,255,.06)}
.pet-card.focus{border-color:#3a7185}.pet-bigface{height:145px;border-radius:13px;background:radial-gradient(circle,rgba(58,212,255,.12),transparent 60%),#071720;display:grid;place-items:center;font-size:70px;position:relative;overflow:hidden}.pet-bigface::after{content:"HOME HABITAT";position:absolute;bottom:7px;font-size:8px;letter-spacing:.18em;color:#628391}
.pet-want{margin-top:8px;padding:7px 8px;border-radius:8px;background:rgba(255,209,102,.06);border:1px solid rgba(255,209,102,.2);font-size:10px}.pet-want.done{border-color:rgba(157,255,123,.3);background:rgba(157,255,123,.06)}
.pet-actions{grid-template-columns:repeat(3,1fr)}
.hardware-note{font-size:10px;color:#78a9b8;margin-top:8px}.unlock-note{font-size:10px;color:var(--amber);margin-top:4px}
@media(max-width:760px){.route-grid{grid-template-columns:1fr 1fr}.status-rack{grid-template-columns:1fr 1fr}.cockpit{grid-template-columns:1fr 1fr}.home-command{grid-template-columns:1fr}.header-meta{display:none}}
@media(max-width:440px){.route-grid,.status-rack{grid-template-columns:1fr}.pet-actions{grid-template-columns:repeat(2,1fr)}}
</style>


<style id="vg-last-sanctuary-css">
#vgCampaignDock{position:fixed;left:14px;bottom:16px;z-index:101}
#vgCampaignBtn{min-height:48px;border-radius:13px;border:1px solid #7fb2c9;background:#173b4d;color:#eefaff;font-weight:900;padding:0 14px;box-shadow:0 10px 30px #0008}
#vgCampaignPanel{position:fixed;inset:0;z-index:210;background:rgba(2,8,12,.9);display:none;overflow:auto;padding:14px}
#vgCampaignPanel.open{display:block}
.vgc-wrap{max-width:920px;margin:auto}
.vgc-top{position:sticky;top:0;z-index:3;background:#071018;padding:8px 0 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.vgc-card{border:1px solid #31566b;border-radius:16px;background:#0d2030;padding:14px;margin:10px 0}
.vgc-title{font-size:clamp(25px,6vw,42px);font-weight:1000;letter-spacing:-1px}
.vgc-chapter{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.vgc-num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid #5f93aa;background:#122f40;font-weight:1000}
.vgc-lock{opacity:.45}
.vgc-done{border-color:#4f8d70}
.vgc-objective{padding:9px;border-left:3px solid #71b6d4;background:#091924;border-radius:7px;margin-top:8px;font-size:13px}
.vgc-radio{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;color:#a9c9d6}
.vgc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:7px}
.vgc-stat{padding:9px;border:1px solid #294859;border-radius:10px;background:#091923;font-size:12px}
.vgc-stat b{display:block;font-size:18px;color:#dff7ff}
.vgc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vgc-actions button{min-height:42px;border-radius:9px;border:1px solid #4b7d93;background:#15384a;color:#effbff;font-weight:850;padding:0 12px}
.vgc-actions button:disabled{opacity:.4}
.vgc-flash{animation:vgcPulse 1.1s ease 2}
@keyframes vgcPulse{50%{box-shadow:0 0 0 3px #8ed8ff66,0 0 30px #55bde455}}
.vgc-banner{padding:12px;border:1px solid #5a7c8c;border-radius:12px;background:linear-gradient(135deg,#102b3a,#0b1a26);margin:10px 0}
.vgc-companion{display:inline-block;padding:4px 8px;margin:3px;border-radius:999px;border:1px solid #477084;background:#112a38;font-size:11px}
.vgc-final{border-color:#846f45;background:linear-gradient(135deg,#201d14,#0d1d28)}
@media(max-width:560px){#vgCampaignDock{left:10px;bottom:72px}.vgc-chapter{grid-template-columns:1fr}.vgc-num{width:36px;height:36px}}

</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="sigil"><i>VG</i></div>
    <div>
      <div class="brand">VET GODS</div>
      <div class="subtitle">Apex Intervention Command</div>
    </div>
    <div class="spacer"></div>
    <div class="funds-box">CLINIC <b id="funds-display">$2,400</b></div>
    <div class="top-actions">
      <button class="top-btn" id="btn-pets">MY PETS</button>
      <button class="top-btn shop" id="btn-shop">SHOP</button>
    </div>
  </header>

  <main>
    <section id="clinic" class="screen active"></section>
    <section id="stabilize" class="screen"></section>
    <section id="diagnostics" class="screen"></section>
    <section id="treatment" class="screen"></section>
    <section id="surgery" class="screen"></section>
    <section id="recovery" class="screen"></section>
    <section id="discharge" class="screen"></section>
    <section id="pets" class="screen"></section>
  </main>
</div>

<!-- Reward Modal -->
<div class="modal" id="reward-modal">
  <div class="modal-box">
    <div class="reward">✦</div>
    <div class="eyebrow">Case Complete</div>
    <h2 id="reward-title">Patient is safe.</h2>
    <p id="reward-text" style="color:#a8c0c9;margin:8px 0 0"></p>
    <div class="reward-btns">
      <button class="btn good" id="btn-keep">Keep in My Pets</button>
      <button class="btn primary" id="btn-next">Next Patient</button>
    </div>
  </div>
</div>

<!-- Shop Screen -->
<div id="shop-screen"></div>

<!-- Tools -->
<div id="tools-dock"><button id="tools-btn">🧰 TOOLS</button></div>
<div id="tools-panel"></div>
<div id="toast-host"></div>

<script>
/* ============================================================
   VET GODS — APEX INTERVENTION
   Complete clean overhaul
   ============================================================ */

const STAGES = ["Intake","Stabilize","Diagnose","Treat","Surgery","Recovery","Discharge"];
const PATIENTS = [
  {
    name:"Kota", species:"Canine", breed:"Husky mix", sex:"Male", surgical:false, emoji:"🐕",
    condition:"Trauma with dehydration",
    story:"Found exhausted beside a winter service road after slipping from a damaged transport crate. Coat soaked, pads scraped, long without water. A highway worker stayed with him until rescue arrived.",
    personality:{
      archetype:"Cautious Loyalist",
      traits:["Loyal","Cautious","Vocal","Stubborn","Food-motivated"],
      sociability:62, confidence:45, fear:58, curiosity:72, foodDrive:90,
      affection:74, independence:58, patience:42, energy:78, handling:48, noiseTolerance:52,
      preferences:["Treats","Calm voice","Outdoor movement"],
      dislikes:["Scanner noise","Paw handling","Rushed restraint"]
    }
  },
  {
    name:"Mira", species:"Feline", breed:"Silver tabby", sex:"Female", surgical:true, emoji:"🐈",
    condition:"Deep paw laceration",
    story:"Rescued from an abandoned machine shed. She survived by hiding beneath shelving. A torn rear paw stopped her from bearing weight, yet she still leaned into the rescuer who carried her out.",
    personality:{
      archetype:"Independent Observer",
      traits:["Independent","Touch-sensitive","Curious","Selective","Quietly affectionate"],
      sociability:44, confidence:54, fear:52, curiosity:81, foodDrive:64,
      affection:58, independence:88, patience:56, energy:55, handling:32, noiseTolerance:46,
      preferences:["Quiet spaces","Slow approach","Warm bedding"],
      dislikes:["Repeated handling","Loud tools","Crowding"]
    }
  },
  {
    name:"Orion", species:"Avian", breed:"Barn owl", sex:"Male", surgical:false, emoji:"🦉",
    condition:"Wing strain and shock",
    story:"Recovered at dawn beneath a farm windbreak after a violent storm. Alert but stunned, holding one wing low. Wildlife team transported him in a dark quiet carrier.",
    personality:{
      archetype:"Silent Sentinel",
      traits:["Watchful","Noise-sensitive","Reserved","Patient","Highly alert"],
      sociability:24, confidence:61, fear:63, curiosity:48, foodDrive:40,
      affection:22, independence:92, patience:80, energy:50, handling:26, noiseTolerance:18,
      preferences:["Darkness","Quiet rest","Minimal handling"],
      dislikes:["Bright activity","Noise","Frequent restraint"]
    }
  },
  {
    name:"Juniper", species:"Canine", breed:"Shepherd mix", sex:"Female", surgical:true, emoji:"🐕‍🦺",
    condition:"Foreign-body injury",
    story:"Brought in by a trail crew after limping near an old fence line. She stayed close to the workers instead of running. Imaging needed before definitive repair.",
    personality:{
      archetype:"Handler-Focused Guardian",
      traits:["Cooperative","Protective","Eager to please","Brave","People-focused"],
      sociability:82, confidence:70, fear:36, curiosity:66, foodDrive:72,
      affection:86, independence:38, patience:72, energy:74, handling:78, noiseTolerance:68,
      preferences:["Praise","Stay nearby","Training-style cues"],
      dislikes:["Isolation","Chaotic handling","Being left alone"]
    }
  }
];

const DEFAULT_STATS = () => ({
  health:68, pain:61, oxygen:91, hydration:46, stress:72, trust:29,
  mobility:35, comfort:30, hunger:56, thirst:64, energy:42
});

/* ---------- STATE ---------- */
let state = load() || {
  idx:0, stage:0, funds:2400,
  stats: DEFAULT_STATS(),
  tests:{exam:false, imaging:false, lab:false},
  tx:{fluids:false, oxygen:false, pain:false, definitive:false, surgery:false},
  pets:[], log:[], rewarded:false,
  hospitalTier:0, reputation:0, streak:0,
  ownedTools:{}, ownedUpgrades:{},
  tempPacks:{}, learned:{}
};

function load(){
  try{ return JSON.parse(localStorage.getItem("vetgods_apex_v1")); }catch(e){ return null; }
}
function save(){ localStorage.setItem("vetgods_apex_v1", JSON.stringify(state)); }

function p(){ return PATIENTS[state.idx % PATIENTS.length]; }
function clamp(){ for(const k in state.stats) state.stats[k] = Math.max(0, Math.min(100, state.stats[k])); }
function spend(n){ state.funds = Math.max(0, state.funds - n); }
function money(n){ state.funds = Math.max(0, state.funds + n); }

function log(msg){
  state.log.unshift({t: new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), msg});
  state.log = state.log.slice(0, 8);
  save(); render();
}

function toast(msg){
  const host = document.getElementById("toast-host");
  host.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=> host.innerHTML = "", 2800);
}

/* ---------- PERSONALITY ---------- */
function pers(){
  const base = p().personality;
  const mods = (state.learned[p().name] || {});
  return {
    ...base,
    confidence: Math.max(0, Math.min(100, base.confidence + (mods.confidence||0))),
    handling: Math.max(0, Math.min(100, base.handling + (mods.handling||0))),
    noiseTolerance: Math.max(0, Math.min(100, base.noiseTolerance + (mods.noiseTolerance||0))),
    patience: Math.max(0, Math.min(100, base.patience + (mods.patience||0)))
  };
}

function behaviorState(){
  const s = state.stats, q = pers();
  if(s.stress >= 78) return "Frightened";
  if(s.stress >= 58) return "Nervous";
  if(s.trust >= 75 && s.stress < 45) return "Attached";
  if(s.trust >= 55) return "Cooperative";
  if(s.trust >= 38) return "Curious";
  return q.independence > 72 ? "Reserved" : "Wary";
}

function pReact(kind){
  const q = pers(), s = state.stats;
  let trust=0, stress=0, comfort=0, energy=0, mobility=0, msg="";

  if(kind==="water"){
    trust = 2 + (q.sociability>65?2:0); stress = -2;
    msg = q.independence>75 ? `${p().name} drinks once the bowl is set down and space is given.` : `${p().name} accepts the water and watches you more comfortably.`;
  }
  if(kind==="food"){
    trust = Math.round(2 + q.foodDrive/18); stress = -Math.round(q.foodDrive/35); energy = Math.round(q.foodDrive/25);
    msg = q.foodDrive>=75 ? `${p().name} brightens immediately at the food.` : `${p().name} investigates the food carefully before accepting it.`;
  }
  if(kind==="comfort"){
    trust = Math.round(4 + q.affection/12); stress = -Math.round(4 + q.affection/14); comfort = Math.round(3 + q.affection/18);
    if(q.independence>75){ trust = Math.max(2, trust-4); stress = Math.min(-2, stress+4);
      msg = `${p().name} prefers calm company without much touching.`; }
    else msg = `${p().name} responds to your presence; posture softens.`;
  }
  if(kind==="exam"){
    trust = Math.round(q.handling/28); stress = Math.round((100-q.handling)/11);
    msg = q.handling<40 ? `${p().name} tolerates the exam only in short careful bursts.` : `${p().name} allows the exam with manageable tension.`;
  }
  if(kind==="scanner"){
    trust = Math.round(q.curiosity/35); stress = Math.round((100-q.noiseTolerance)/9);
    msg = q.noiseTolerance<35 ? `${p().name} reacts strongly to the scanner noise.` : `${p().name} notices the scanner but remains workable.`;
  }
  if(kind==="lab"){
    trust = Math.round(q.patience/40); stress = Math.round((100-q.patience)/14);
    msg = q.patience>70 ? `${p().name} remains unusually patient through sample collection.` : `${p().name} grows restless during sample collection.`;
  }
  if(kind==="rest"){
    stress = -Math.round(5 + q.independence/18); energy = Math.round(12 + q.patience/10); comfort = Math.round(q.independence/28);
    msg = q.independence>70 ? `${p().name} settles best when the room becomes quiet.` : `${p().name} settles once the room quiets down.`;
  }
  if(kind==="walk"){
    const brave = (q.confidence + q.energy)/2;
    mobility = Math.round(8 + brave/10); trust = Math.round(q.sociability/25);
    energy = -Math.round(5 + q.energy/20); stress = q.confidence<45 ? 4 : -3;
    msg = q.confidence>=65 ? `${p().name} takes the lead once moving.` : `${p().name} moves cautiously, checking back with you.`;
  }
  if(kind==="anesthesia"){
    stress = -Math.round(8 + q.handling/12); trust = Math.round(q.handling/35);
    msg = `${p().name}'s handling tolerance changes how smoothly pre-op preparation goes.`;
  }

  // Permanent upgrade bonuses
  if(state.ownedUpgrades.scanner && ["scanner","lab","exam"].includes(kind)){ stress -= 3; trust += 2; }
  if(state.ownedUpgrades.recovery && ["water","food","comfort","rest","walk"].includes(kind)){ comfort += 3; energy += 2; }
  if(state.ownedUpgrades.surgery && kind==="anesthesia"){ stress -= 5; s.oxygen = Math.min(100, s.oxygen+2); }
  if(state.ownedUpgrades.hospital) trust += 1;
  if(state.ownedUpgrades.celestial){ trust += 2; comfort += 2; }

  s.trust += trust; s.stress += stress; s.comfort += comfort; s.energy += energy; s.mobility += mobility;
  clamp();
  log(`${msg} (trust ${trust>=0?"+":""}${trust}, stress ${stress>=0?"+":""}${stress})`);
}

/* ---------- RENDER HELPERS ---------- */
function phaseStrip(){
  const idx = Math.min(state.stage, 6);
  return `<div class="phase-rail">${STAGES.map((name,i)=>
    `<span class="phase ${i<idx?"done":i===idx?"now":""}">${name}</span>`
  ).join("")}</div>`;
}

function petArt(){
  const q = p();
  const key = (q.species + " " + q.breed).toLowerCase();
  let art = "";
  if(key.includes("owl")){
    art = `<svg viewBox="0 0 360 240" aria-label="barn owl"><ellipse cx="180" cy="207" rx="96" ry="14" fill="#000" opacity=".25"/><path d="M118 111c-37 7-61 35-67 73 27-7 54-18 77-38M242 111c37 7 61 35 67 73-27-7-54-18-77-38" fill="#b88c62" stroke="#e9c89e" stroke-width="5"/><ellipse cx="180" cy="126" rx="65" ry="77" fill="#caa477"/><path d="M140 84c18-28 62-28 80 0 18 25 10 63-40 89-50-26-58-64-40-89z" fill="#f3e9d4"/><circle cx="158" cy="111" r="17" fill="#4a2d20"/><circle cx="202" cy="111" r="17" fill="#4a2d20"/><circle cx="158" cy="111" r="6" fill="#05090b"/><circle cx="202" cy="111" r="6" fill="#05090b"/><path d="M180 124l-9 16h18z" fill="#e5b25b"/><path d="M145 62l-17-25 30 13M215 62l17-25-30 13" fill="#aa7f58" stroke="#e0bc8e" stroke-width="4"/><path d="M161 184v26M199 184v26" stroke="#d9ad71" stroke-width="7" stroke-linecap="round"/></svg>`;
  } else if(key.includes("cat")||key.includes("feline")||key.includes("tabby")){
    art = `<svg viewBox="0 0 360 240" aria-label="silver tabby"><ellipse cx="180" cy="207" rx="108" ry="15" fill="#000" opacity=".25"/><ellipse cx="174" cy="142" rx="88" ry="55" fill="#8fb8cb"/><circle cx="253" cy="104" r="43" fill="#8fb8cb"/><path d="M226 74l7-43 29 34M271 67l34-34-5 48" fill="#8097a7" stroke="#d6edf6" stroke-width="5"/><circle cx="240" cy="103" r="6" fill="#15303d"/><circle cx="270" cy="103" r="6" fill="#15303d"/><path d="M255 116l-7 7h14z" fill="#e7a7b5"/><path d="M246 126c6 6 12 6 18 0" stroke="#426474" stroke-width="3" fill="none"/><path d="M105 135c-38-3-55-27-41-51" stroke="#879eac" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M125 165l-9 38M174 174l-5 31M220 171l8 34" stroke="#91a8b5" stroke-width="12" stroke-linecap="round"/></svg>`;
  } else if(key.includes("husky")){
    art = `<svg viewBox="0 0 360 240" aria-label="husky mix"><ellipse cx="180" cy="208" rx="120" ry="16" fill="#000" opacity=".25"/><ellipse cx="168" cy="148" rx="91" ry="54" fill="#8199a8"/><circle cx="260" cy="103" r="48" fill="#738b9b"/><path d="M225 79l12-50 30 39M274 67l37-37-10 55" fill="#596f7d" stroke="#d9f3ff" stroke-width="6"/><path d="M229 93c10-23 25-30 31-31 9 3 22 13 31 35-10 30-20 42-31 44-14-3-25-18-31-48z" fill="#edf8fc"/><path d="M110 137c-40-11-52-41-31-64" stroke="#748b99" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M124 171l-8 37M174 176l-3 32M221 171l8 37" stroke="#d8edf5" stroke-width="14" stroke-linecap="round"/><circle cx="244" cy="99" r="7" fill="#49bfff"/><circle cx="277" cy="99" r="7" fill="#49bfff"/><ellipse cx="260" cy="120" rx="10" ry="7" fill="#172830"/><path d="M251 132c7 7 13 7 20 0" stroke="#29444f" stroke-width="4" fill="none"/></svg>`;
  } else {
    art = `<svg viewBox="0 0 360 240" aria-label="shepherd mix"><ellipse cx="180" cy="208" rx="120" ry="16" fill="#000" opacity=".25"/><ellipse cx="166" cy="148" rx="92" ry="54" fill="#b88c5d"/><circle cx="257" cy="104" r="47" fill="#b88c5d"/><path d="M222 77l7-49 31 39M273 68l32-35 0 48" fill="#3c3128" stroke="#d5b282" stroke-width="6"/><path d="M231 89c7-20 18-31 27-34 10 5 21 17 28 36l-8 41-20 15-21-15z" fill="#40342a"/><path d="M103 140c-42-7-57-36-39-61" stroke="#8c6949" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M119 171l-8 37M170 176l-4 32M220 172l8 36" stroke="#c49a69" stroke-width="14" stroke-linecap="round"/><circle cx="243" cy="101" r="6" fill="#241b14"/><circle cx="274" cy="101" r="6" fill="#241b14"/><ellipse cx="259" cy="122" rx="10" ry="7" fill="#1a1410"/><path d="M250 133c7 7 14 7 21 0" stroke="#201812" stroke-width="4" fill="none"/></svg>`;
  }
  return `<div class="patient-visual"><div class="scanline"></div>${art}<div class="patient-tags"><span class="phase now">${q.species}</span><span class="phase">${q.breed}</span><span class="phase">${q.sex}</span></div></div>`;
}

function kpis(){
  const s = state.stats;
  const items = [["Health",s.health],["Pain",100-s.pain],["O₂",s.oxygen],["Hydration",s.hydration],["Trust",s.trust],["Mobility",s.mobility]];
  return `<div class="kpis">${items.map(([n,v])=>`
    <div class="kpi"><small>${n}</small><strong>${Math.round(n==="Pain"?100-v:v)}${n==="O₂"?"%":""}</strong>
    <div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div>`;
}

function telemetry(keys=["health","pain","oxygen","hydration","stress","trust","mobility","comfort"]){
  return `<div class="readout">${keys.map(k=>{
    const v = state.stats[k];
    const bad = (k==="pain"||k==="stress") && v>45;
    const display = Math.round(v);
    const bar = (k==="pain"||k==="stress") ? 100-v : v;
    return `<div class="meter ${bad?"danger":""}"><div class="meterhead"><span>${k[0].toUpperCase()+k.slice(1)}</span><b>${display}${k==="oxygen"?"%":""}</b></div>
      <div class="meterbar"><i style="width:${bar}%"></i></div></div>`;
  }).join("")}</div>`;
}

function logBox(){
  return `<div class="log">${state.log.length ? state.log.map(x=>`<div><time>${x.t}</time>${x.msg}</div>`).join("") : "<div>Hospital event log ready.</div>"}</div>`;
}

function personalityBand(){
  const q = pers();
  return `<div class="notice"><b>PERSONALITY • ${q.archetype}</b><br>${q.traits.join(" • ")}<br>
    <span style="opacity:.75">Behavior: <b>${behaviorState()}</b> • Likes: ${q.preferences.join(", ")} • Dislikes: ${q.dislikes.join(", ")}</span></div>`;
}

function control(label, desc, js, pct=65, accent="var(--cyan)", disabled=false){
  return `<button class="instrument" ${disabled?"disabled":""} onclick="${js}">
    <div class="dial" style="--pct:${pct}%;--accent:${accent}"></div>
    <b>${label}</b><small>${desc}</small></button>`;
}

function areaTemplate(title, eyebrow, desc, controls, rightKeys, finish){
  return `
  <div class="hero">
    <div class="card pad">
      <div class="eyebrow">${eyebrow}</div>
      <div class="h1">${title}</div>
      <p class="lede">${desc}</p>
      <div class="notice"><b>${p().breed} • ${p().sex}</b><br>${p().story}</div>
      ${personalityBand()}
      ${phaseStrip()}
    </div>
    <div class="card">${petArt()}</div>
  </div>
  <div class="grid-2">
    <div class="card pad">
      <div style="display:flex;align-items:end;gap:10px;margin-bottom:12px">
        <h2 style="font-size:17px;margin:0">Work Surface</h2>
        <span style="color:var(--muted);font-size:12px">Tap instruments to change patient state</span>
      </div>
      <div class="instrument-grid">${controls}</div>
      ${finish||""}
      ${logBox()}
    </div>
    <div class="card pad">
      <div style="display:flex;align-items:end;gap:10px;margin-bottom:12px">
        <h2 style="font-size:17px;margin:0">Department Readout</h2>
      </div>
      ${telemetry(rightKeys)}
    </div>
  </div>`;
}

/* ---------- SCREENS ---------- */
function clinicHTML(){
  return `
  <div class="hero">
    <div class="card pad">
      <div class="eyebrow">Active Rescue // ${p().species}</div>
      <div class="h1">${p().name}</div>
      <p class="lede">${p().breed} • ${p().sex} • ${p().condition}. Enter a department, work the case, then choose where to go next.</p>
      <div class="notice"><b>Rescue Story:</b> ${p().story}</div>
      <div class="notice"><b>${p().name} is a ${pers().archetype}.</b><br>${pers().traits.join(" • ")}<br>
        <span style="opacity:.75">Behavior now: ${behaviorState()}. Your care choices strengthen trust, lower stress, or push this patient away.</span></div>
      ${phaseStrip()}
      <div class="action-row">
        <button class="btn primary" onclick="go('${nextArea()}')">Enter Next Department</button>
        <button class="btn" onclick="go('pets')">Open My Pets</button>
      </div>
    </div>
    <div class="card">${petArt()}</div>
  </div>
  ${kpis()}
  <div class="grid-2">
    <div class="card pad">
      <h2 style="font-size:17px;margin-bottom:10px">Command Console</h2>
      <div class="instrument-grid">
        ${[["stabilize","Stabilize","Correct immediate risks"],["diagnostics","Diagnostics","Reveal evidence"],["treatment","Treatment","Support + definitive care"],
           ["surgery","Surgery","Procedure only if required"],["recovery","Recovery","Playable aftercare"],["discharge","Discharge","Readiness proof"]]
          .map(([id,l,note],i)=>`<button class="instrument" onclick="go('${id}')">
            <div class="dial" style="--pct:${50+i*6}%;--accent:${i%2?"var(--teal)":"var(--cyan)"}"></div>
            <b>${l}</b><small>${note}</small></button>`).join("")}
      </div>
    </div>
    <div class="card pad">
      <h2 style="font-size:17px;margin-bottom:10px">Live Telemetry</h2>
      ${telemetry(["health","pain","oxygen","hydration","stress","trust"])}
    </div>
  </div>
  ${logBox()}`;
}

function nextArea(){
  const map = ["stabilize","stabilize","diagnostics","treatment", p().surgical?"surgery":"recovery","recovery","recovery","discharge"];
  return map[state.stage] || "discharge";
}

function stabilizeHTML(){
  let c = "";
  c += control("Oxygen Support","Raise saturation + calm breathing",
    `state.stats.oxygen+=5;state.stats.stress-=6;spend(5);clamp();pReact('comfort');state.stage=Math.max(state.stage,1);log('Oxygen support completed.');`,77);
  c += control("IV Fluids","Restore hydration gradually",
    `state.stats.hydration+=16;state.stats.health+=4;state.tx.fluids=true;spend(5);clamp();pReact('exam');state.stage=Math.max(state.stage,1);log('IV fluids improved hydration.');`,62,"var(--teal)");

function finishCase(){
  if(state.rewarded) return;
  let base = 250;
  let bonus = 0;
  const s = state.stats;
  if(s.pain <= 25) bonus += 100;
  if(s.hydration >= 80) bonus += 75;
  if(s.trust >= 65) bonus += 100;
  if(state.tests.exam && state.tests.imaging && state.tests.lab) bonus += 150;
  if(readiness() >= 90) bonus += 200 + (state.ownedUpgrades.recovery ? 100 : 0);
  if(state.ownedUpgrades.hospital) bonus += 250;
  if(state.ownedUpgrades.celestial) bonus += 750;
  if(p().surgical && state.tx.surgery) bonus += 150 + (state.ownedUpgrades.surgery ? 200 : 0);

  state.streak = (state.streak || 0) + 1;
  const mult = state.streak >= 5 ? 1.5 : state.streak >= 3 ? 1.25 : 1;
  const total = Math.round((base + bonus) * mult);
  money(total);
  state.reputation = (state.reputation || 0) + Math.round(total / 2);
  state.rewarded = true;
  state.stage = 6;
  save();

  document.getElementById("reward-title").textContent = `${p().name} is safe.`;
  document.getElementById("reward-text").textContent = `Case reward: $${total.toLocaleString()} clinic funding (base + performance + streak ×${mult}). Reputation +${Math.round(total/2)}. Keep this rescue or continue to a fresh patient.`;
  document.getElementById("reward-modal").classList.add("show");
  render();
  toast(`CASE COMPLETE • +$${total.toLocaleString()}`);
}

  pet.stats = pet.stats || {};

  Object.keys(d).forEach(k => { if(typeof pet.stats[k] !== "number") pet.stats[k] = d[k]; });

function petCare(i, type){
  const pet = ensurePet(state.pets[i]); if(!pet) return;
  const s = pet.stats;
  const q = pet.personality || {foodDrive:50, affection:50, independence:50, patience:50};
  const cap = v => Math.max(0, Math.min(100, Math.round(v)));
  let memory = "";
  if(type==="water"){ s.hydration=cap((s.hydration||0)+15); s.trust=cap((s.trust||0)+2); memory="Fresh water offered"; }
  if(type==="food"){ s.hunger=cap((s.hunger||50)-20); s.energy=cap((s.energy||0)+10+Math.round((q.foodDrive||50)/20)); s.trust=cap((s.trust||0)+Math.round(2+(q.foodDrive||50)/20)); memory="Ate a meal"; }
  if(type==="comfort"){ let gain=Math.round(3+(q.affection||50)/10); if((q.independence||50)>75) gain=Math.max(2,gain-5); s.comfort=cap((s.comfort||0)+10+gain); s.trust=cap((s.trust||0)+gain); s.bond=cap((s.bond||0)+gain); memory="Shared quiet comfort"; }
  if(type==="rest"){ s.energy=cap((s.energy||0)+14+Math.round((q.patience||50)/12)); memory="Rested safely at home"; }
  if(type==="groom"){ s.hygiene=cap((s.hygiene||75)+20); s.comfort=cap((s.comfort||0)+5); s.bond=cap((s.bond||0)+3); memory="Grooming session"; }
  if(type==="play"){ s.fun=cap((s.fun||55)+22); s.happiness=cap((s.happiness||70)+15); s.energy=cap((s.energy||0)-8); s.bond=cap((s.bond||0)+5); memory="Played together"; }
  if(type==="train"){ s.training=cap((s.training||0)+8); s.fun=cap((s.fun||55)+7); s.bond=cap((s.bond||0)+4); s.energy=cap((s.energy||0)-5); memory="Training session"; }
  if(type==="walk"){ s.mobility=cap((s.mobility||0)+6); s.energy=cap((s.energy||0)-7); s.happiness=cap((s.happiness||70)+10); s.fun=cap((s.fun||55)+10); memory="Went outside for a gentle walk"; }
  if(type==="medicine"){ s.health=cap((s.health||0)+5); s.pain=cap((s.pain||0)-6); s.comfort=cap((s.comfort||0)+4); memory="Home medicine/support completed"; }
  if(memory){ pet.memories.unshift(memory); pet.memories = pet.memories.slice(0,8); }
  save(); renderScreen("pets");
}
function careAll(){ state.pets.forEach((_,i)=>["water","food","comfort","rest","groom"].forEach(t=>petCare(i,t))); }

function keepPet(){
  const currentIndex = state.idx;
  if(!state.pets.some(x => x.caseId === currentIndex)){
    state.pets.push({
      caseId: currentIndex,
      name: p().name, species: p().species, breed: p().breed, sex: p().sex,
      story: p().story, emoji: p().emoji,
      personality: JSON.parse(JSON.stringify(p().personality||{})),
      memories: ["Survived emergency treatment","Joined the Rescue Habitat"],
      stats: Object.assign({hygiene:75, happiness:72, bond: Math.max(35, state.stats.trust||35), fun:55, training:0}, {...state.stats})
    });
  }
  // Advance to next patient automatically after keeping
  state.idx = (currentIndex + 1) % PATIENTS.length;
  state.stage = 0;
  state.stats = DEFAULT_STATS();
  state.tests = {exam:false, imaging:false, lab:false};
  state.tx = {fluids:false, oxygen:false, pain:false, definitive:false, surgery:false};
  state.log = [];
  state.rewarded = false;
  save();
  document.getElementById("reward-modal").classList.remove("show");
  go("pets");
}

function nextPatient(){
  state.idx = (state.idx + 1) % PATIENTS.length;
  state.stage = 0;
  state.stats = DEFAULT_STATS();
  state.tests = {exam:false, imaging:false, lab:false};
  state.tx = {fluids:false, oxygen:false, pain:false, definitive:false, surgery:false};
  state.log = [];
  state.rewarded = false;
  // Small chance of donation
  if(Math.random() < 0.22){
    const events = [["LOCAL RESCUE DONATION",300],["COMMUNITY FUNDRAISER",500],["ANONYMOUS ANIMAL LOVER",750],["EMERGENCY GRANT",1000]];
    const ev = events[Math.floor(Math.random()*events.length)];
    money(ev[1]);
    state.reputation = (state.reputation||0) + 40;
    toast(ev[0] + " • +$" + ev[1]);
  }
  save();
  document.getElementById("reward-modal").classList.remove("show");
  go("clinic");
}

      <div class="tool-line"><span>Temperament</span><b>${q.archetype}</b></div>
      <div class="tool-line"><span>Behavior now</span><b>${behaviorState()}</b></div>
      <div class="tool-line"><span>Trust / Stress / Comfort</span><b>${state.stats.trust} / ${state.stats.stress} / ${state.stats.comfort}</b></div>
      <div style="margin-top:8px"><b>Learned temperament</b><br>
        Confidence +${learned.confidence||0} • Handling +${learned.handling||0} • Noise +${learned.noiseTolerance||0}
      </div>
    </div>
  </div>`;
  panel.classList.add("open");

function runTemperament(){
  const q = pers();
  const trait = q.traits[Math.floor(Math.random()*q.traits.length)];
  state.stats.trust = Math.min(100, state.stats.trust + 1);
  clamp();
  log(`Temperament scanner: discovered ${trait}. ${p().name} is currently ${behaviorState()}.`);
  toast("Trait discovered: " + trait);
  save(); render();
}
function runSkeletal(){
  const msgs = {
    Kota: "No unstable fracture detected. Paw and distal-limb soft-tissue strain pattern; guarded loading is the main mobility limitation.",
    Mira: "Skeletal alignment is preserved around the injured paw. Dominant problem is painful soft-tissue damage.",
    Orion: "Wing alignment remains intact without obvious displaced fracture. Strain and shock limit safe movement.",
    Juniper: "No gross long-bone displacement. Foreign-body region associated with focal pain and guarded limb use."
  };
  const msg = msgs[p().name] || "Skeletal alignment scan complete.";
  log("Skeletal scan: " + msg + ` Mobility ${state.stats.mobility} • Pain ${state.stats.pain}.`);
  toast("Skeletal scan complete");
  save(); render();
}
function runBehavior(){
  log(`Behavior scan: ${p().name} is ${behaviorState()}. Trust ${state.stats.trust}, stress ${state.stats.stress}, comfort ${state.stats.comfort}.`);
  toast("Behavior: " + behaviorState());
  save(); render();
}
function runRelationship(){
  const s = state.stats;
  const level = s.trust>=75?"Strong bond":s.trust>=55?"Working trust":s.trust>=35?"Emerging trust":"Low trust";
  log(`Relationship readout: ${level}. Trust ${s.trust}, comfort ${s.comfort}, stress ${s.stress}.`);
  toast(level);
  save(); render();
}
function condition(kind){
  if(!state.ownedTools.conditioning) return;
  const name = p().name;
  state.learned[name] = state.learned[name] || {};
  const cur = state.learned[name][kind] || 0;
  if(cur >= 15){ toast("Maximum learned for this trait"); return; }
  state.learned[name][kind] = Math.min(15, cur + 3);
  if(kind==="confidence"){ state.stats.trust=Math.min(100,state.stats.trust+4); state.stats.stress=Math.max(0,state.stats.stress-4); }
  if(kind==="handling"){ state.stats.trust=Math.min(100,state.stats.trust+3); state.stats.stress=Math.max(0,state.stats.stress-2); }
  if(kind==="noiseTolerance"){ state.stats.trust=Math.min(100,state.stats.trust+2); }
  clamp();
  log(`Behavior shaping: ${kind} +3 learned. Core personality unchanged.`);
  toast("LEARNED " + kind.toUpperCase() + " +3");
  save(); render(); openTools();
}

/* ---------- NAVIGATION & RENDER ---------- */
function go(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  renderScreen(id);
}

function renderScreen(id){
  document.getElementById("funds-display").textContent = "$" + state.funds.toLocaleString();
  const el = document.getElementById(id);
  if(id==="clinic") el.innerHTML = clinicHTML();
  if(id==="stabilize") el.innerHTML = stabilizeHTML();
  if(id==="diagnostics") el.innerHTML = diagnosticsHTML();
  if(id==="treatment") el.innerHTML = treatmentHTML();
  if(id==="surgery") el.innerHTML = surgeryHTML();
  if(id==="recovery") el.innerHTML = recoveryHTML();
  if(id==="discharge") el.innerHTML = dischargeHTML();
  if(id==="pets") el.innerHTML = petsHTML();
}

function render(){
  document.getElementById("funds-display").textContent = "$" + state.funds.toLocaleString();
  const active = document.querySelector(".screen.active")?.id || "clinic";
  renderScreen(active);
}

go("clinic");

};

function vgScoreBreakdown(){
 const s=state.stats,b=[];b.push(['Patient Saved',250]);if(s.pain<=25)b.push(['Pain Control',100]);if(s.hydration>=80)b.push(['Hydration Excellence',75]);if(s.trust>=65)b.push(['Trust Bonus',100]);if(state.tests.exam&&state.tests.imaging&&state.tests.lab)b.push(['Perfect Diagnostics',150]);if(readiness()>=90)b.push(['Recovery Excellence',200+(state.ownedUpgrades.recovery?100:0)]);if(state.ownedUpgrades.hospital)b.push(['Advanced Hospital',250]);if(state.ownedUpgrades.celestial)b.push(['Celestial Center',750]);if(p().surgical&&state.tx.surgery)b.push(['Surgical Success',150+(state.ownedUpgrades.surgery?200:0)]);if(state.ownedUpgrades.scanner&&state.tests.imaging)b.push(['Precision Evidence',50]);if(state.ownedUpgrades.icu)b.push(['ICU Stabilization',75]);return b;
}
function vgCaseGrade(total){if(readiness()>=94&&state.stats.pain<=20&&state.stats.trust>=75)return 'S';if(readiness()>=90&&state.stats.pain<=30)return 'A';if(readiness()>=84)return 'B';return 'C'}
window.finishCase=function(){
 if(state.rewarded)return;const b=vgScoreBreakdown();let subtotal=b.reduce((n,x)=>n+x[1],0);state.streak=(state.streak||0)+1;const mult=state.streak>=5?1.5:state.streak>=3?1.25:1;const total=Math.round(subtotal*mult);money(total);state.reputation=(state.reputation||0)+Math.round(total/2);state.rewarded=true;state.stage=6;save();
 const grade=vgCaseGrade(total);document.getElementById('reward-title').textContent=`${p().name} is safe • Grade ${grade}`;
 const text=document.getElementById('reward-text');text.innerHTML=`<div class="case-grade">${grade}</div><div>Case reward <b>$${total.toLocaleString()}</b> • Reputation +${Math.round(total/2)} • Streak ×${mult}</div><div class="scorecard">${b.map(x=>`<div class="score-line">${x[0]}<b>+$${x[1]}</b></div>`).join('')}</div><div style="font-size:11px;opacity:.7">Keep this rescue in My Pets or move directly to the next patient.</div>`;
 document.getElementById('reward-modal').classList.add('show');render();toast(`CASE COMPLETE • GRADE ${grade} • +$${total.toLocaleString()}`);
};
window.dischargeHTML=function(){const r=readiness(),g=vgReadyDetails();return `<div class="hero"><div class="card pad"><div class="eyebrow">Final Gate</div><div class="h1">Discharge ${p().name}</div><p class="lede">Finish once, receive a full performance scorecard, then choose My Pets or the next case.</p>${vgTutorial()}${phaseStrip()}${vgObjective()}${vgStatusRack()}<div class="final-gate"><div><b>Readiness ${r}%</b><div style="font-size:12px;opacity:.7">Unique goal: ${g.pr.recoveryGoal} • ${g.extra?'MET':'NOT MET'}</div></div><button class="btn good" ${r>=82&&g.extra?'':'disabled'} onclick="finishCase()">Complete Case + Score</button></div>${logBox()}</div><div class="card">${petArt()}</div></div>${kpis()}`};

/* Tools now create persistent optional case evidence. */
window.runTemperament=function(){vgEnsure();const q=pers(),trait=q.traits[Math.floor(Math.random()*q.traits.length)];state.caseEvidence[p().name].temperament=`${trait} • ${behaviorState()} • prefers ${q.preferences[0]}`;state.stats.trust=Math.min(100,state.stats.trust+1);clamp();log(`Temperament evidence: ${state.caseEvidence[p().name].temperament}.`);toast('Trait discovered: '+trait);save();render();};
window.runSkeletal=function(){vgEnsure();const msg=vgProtocol().diag.imaging;state.caseEvidence[p().name].skeletal=msg+` Mobility ${state.stats.mobility} • Pain ${state.stats.pain}.`;log('Skeletal tool evidence: '+state.caseEvidence[p().name].skeletal);toast('Skeletal evidence added');save();render();};
window.runBehavior=function(){vgEnsure();state.caseEvidence[p().name].behavior=`${behaviorState()} • trust ${state.stats.trust} • stress ${state.stats.stress} • comfort ${state.stats.comfort}`;log('Behavior evidence: '+state.caseEvidence[p().name].behavior+'.');toast('Behavior: '+behaviorState());save();render();};
window.runRelationship=function(){vgEnsure();const s=state.stats,level=s.trust>=75?'Strong bond':s.trust>=55?'Working trust':s.trust>=35?'Emerging trust':'Low trust';state.caseEvidence[p().name].relationship=`${level} • trust ${s.trust}`;log('Relationship evidence: '+state.caseEvidence[p().name].relationship+'.');toast(level);save();render();};

/* Richer My Pets with habitat progression and daily wants. */
function vgPetWant(pet){const wants=['water','food','comfort','rest','groom','play','train','walk'];const day=Math.floor(Date.now()/86400000);let h=0;for(const ch of pet.name)h+=ch.charCodeAt(0);return wants[(day+h)%wants.length]}
function vgWantLabel(w){return {water:'Fresh Water',food:'Favorite Meal',comfort:'Quiet Company',rest:'Long Rest',groom:'Grooming',play:'Playtime',train:'Training',walk:'Gentle Walk'}[w]||w}
window.ensurePet=function(pet){pet.stats=pet.stats||{};const d={hygiene:75,happiness:70,bond:Math.max(30,pet.stats.trust||30),fun:55,training:0,social:60};Object.keys(d).forEach(k=>{if(typeof pet.stats[k]!=='number')pet.stats[k]=d[k]});pet.memories=pet.memories||[];pet.wantDone=pet.wantDone||{};return pet};
window.petCare=function(i,type){const pet=ensurePet(state.pets[i]);if(!pet)return;const s=pet.stats,q=pet.personality||{foodDrive:50,affection:50,independence:50,patience:50};const cap=v=>Math.max(0,Math.min(100,Math.round(v)));let memory='';if(type==='water'){s.hydration=cap((s.hydration||0)+15);s.trust=cap((s.trust||0)+2);memory='Fresh water offered'}if(type==='food'){s.hunger=cap((s.hunger||50)-20);s.energy=cap((s.energy||0)+10+Math.round((q.foodDrive||50)/20));s.trust=cap((s.trust||0)+Math.round(2+(q.foodDrive||50)/20));memory='Ate a favorite meal'}if(type==='comfort'){let gain=Math.round(3+(q.affection||50)/10);if((q.independence||50)>75)gain=Math.max(2,gain-5);s.comfort=cap((s.comfort||0)+10+gain);s.trust=cap((s.trust||0)+gain);s.bond=cap((s.bond||0)+gain);memory='Shared quiet comfort'}if(type==='rest'){s.energy=cap((s.energy||0)+14+Math.round((q.patience||50)/12));memory='Rested safely at home'}if(type==='groom'){s.hygiene=cap((s.hygiene||75)+20);s.comfort=cap((s.comfort||0)+5);s.bond=cap((s.bond||0)+3);memory='Grooming session'}if(type==='play'){s.fun=cap((s.fun||55)+22);s.happiness=cap((s.happiness||70)+15);s.energy=cap((s.energy||0)-8);s.bond=cap((s.bond||0)+5);s.social=cap((s.social||60)+6);memory='Played together'}if(type==='train'){s.training=cap((s.training||0)+8+Math.round((q.patience||50)/20));s.fun=cap((s.fun||55)+7);s.bond=cap((s.bond||0)+4);s.energy=cap((s.energy||0)-5);memory='Training session'}if(type==='walk'){s.mobility=cap((s.mobility||0)+6);s.energy=cap((s.energy||0)-7);s.happiness=cap((s.happiness||70)+10);s.fun=cap((s.fun||55)+10);memory='Went outside for a gentle walk'}if(type==='medicine'){s.health=cap((s.health||0)+5);s.pain=cap((s.pain||0)-6);s.comfort=cap((s.comfort||0)+4);memory='Home medicine/support completed'}if(type==='adventure'){s.happiness=cap((s.happiness||70)+16);s.fun=cap((s.fun||55)+18);s.social=cap((s.social||60)+10);s.energy=cap((s.energy||0)-12);s.bond=cap((s.bond||0)+7);memory='Went on a safe adventure'}if(type==='photo'){s.bond=cap((s.bond||0)+2);memory='Took a habitat photo together'}const want=vgPetWant(pet),day=Math.floor(Date.now()/86400000);if(type===want&&!pet.wantDone[day]){pet.wantDone[day]=true;s.happiness=cap((s.happiness||70)+12);s.bond=cap((s.bond||0)+6);memory+=' • Daily want fulfilled'}if(memory){pet.memories.unshift(memory);pet.memories=pet.memories.slice(0,10)}save();renderScreen('pets')};
window.careAll=function(){state.pets.forEach((_,i)=>['water','food','comfort','rest','groom'].forEach(t=>petCare(i,t)));toast('ALL PETS RECEIVED DAILY CARE')};
window.vgUpgradeHabitat=function(){const cost=500*(state.homeLevel||1);if(state.funds<cost){toast('NEED $'+cost.toLocaleString()+' FOR HABITAT UPGRADE');return}spend(cost);state.homeLevel=(state.homeLevel||1)+1;state.homeName=['','Rescue Habitat','Comfort Habitat','Enrichment Home','Sanctuary Home','Vet Gods Sanctuary'][Math.min(state.homeLevel,5)]||'Vet Gods Sanctuary';save();render();toast(state.homeName.toUpperCase()+' UNLOCKED')};
window.petsHTML=function(){vgEnsure();const back=`<div class="action-row"><button class="btn primary" onclick="go('clinic')">← Return to Clinic</button></div>`;const cost=500*(state.homeLevel||1);const home=`<div class="home-command"><div class="home-level"><div class="eyebrow">${state.homeName} • LEVEL ${state.homeLevel}</div><h2 style="margin:4px 0 5px">Rescue Home Command</h2><div style="font-size:11px;color:var(--muted)">Habitat progression is separate from clinical case state. Upgrade it with clinic funding after successful rescues.</div><div class="action-row"><button class="btn good" onclick="careAll()">Care For All Pets</button><button class="btn" onclick="vgUpgradeHabitat()">Upgrade Home • $${cost.toLocaleString()}</button></div></div><div class="daily-want"><div class="eyebrow">DAILY WANTS</div><div style="font-size:12px;margin-top:5px">Each rescue has one personality-flavored want. Fulfilling it gives extra happiness and bond.</div></div></div>`;if(!state.pets.length)return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">Completed patients you keep will live here permanently.</p>${back}${home}<div class="notice">No rescued pets yet. Finish a case and choose “Keep in My Pets.”</div></div>`;return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">A persistent second game with daily wants, memories, training, adventures and habitat progression.</p>${back}${home}</div><div class="pet-grid">${state.pets.map((raw,i)=>{const x=ensurePet(raw),s=x.stats,q=x.personality||{},mem=(x.memories||[]).slice(0,4),want=vgPetWant(x),day=Math.floor(Date.now()/86400000),done=!!x.wantDone[day];return `<div class="pet-card focus"><div class="pet-bigface">${x.emoji}</div><h3 style="margin:9px 0 2px">${x.name}</h3><div style="font-size:12px;color:var(--muted)">${x.species} • ${x.breed}${x.sex?' • '+x.sex:''}</div>${q.archetype?`<div class="notice" style="margin-top:8px"><b>${q.archetype}</b><br>${(q.traits||[]).join(' • ')}</div>`:''}<div class="pet-want ${done?'done':''}"><b>${done?'✓ DAILY WANT COMPLETE':'TODAY WANTS'}</b><br>${vgWantLabel(want)}</div><div class="pet-meters"><span>Health <b>${Math.round(s.health||0)}</b></span><span>Pain <b>${Math.round(s.pain||0)}</b></span><span>Water <b>${Math.round(s.hydration||0)}</b></span><span>Trust <b>${Math.round(s.trust||0)}</b></span><span>Energy <b>${Math.round(s.energy||0)}</b></span><span>Bond <b>${Math.round(s.bond||0)}</b></span><span>Happiness <b>${Math.round(s.happiness||0)}</b></span><span>Fun <b>${Math.round(s.fun||0)}</b></span><span>Hygiene <b>${Math.round(s.hygiene||0)}</b></span><span>Training <b>${Math.round(s.training||0)}</b></span></div><div class="pet-actions"><button onclick="petCare(${i},'water')">💧 Water</button><button onclick="petCare(${i},'food')">🍲 Food</button><button onclick="petCare(${i},'comfort')">🤍 Comfort</button><button onclick="petCare(${i},'rest')">🛏 Rest</button><button onclick="petCare(${i},'groom')">🧼 Groom</button><button onclick="petCare(${i},'play')">🎾 Play</button><button onclick="petCare(${i},'train')">🎓 Train</button><button onclick="petCare(${i},'walk')">🐾 Walk</button><button onclick="petCare(${i},'medicine')">💊 Meds</button><button onclick="petCare(${i},'adventure')">🗺 Adventure</button><button onclick="petCare(${i},'photo')">📸 Photo</button></div><div class="pet-memory"><b>Recent memories</b><br>${mem.length?mem.join(' • '):'No home memories yet.'}</div></div>`}).join('')}</div>`};

/* Safe case handoff also resets new evidence, never pets/upgrades. */
window.keepPet=function(){const currentIndex=state.idx;if(!state.pets.some(x=>x.caseId===currentIndex)){state.pets.push({caseId:currentIndex,name:p().name,species:p().species,breed:p().breed,sex:p().sex,story:p().story,emoji:p().emoji,personality:JSON.parse(JSON.stringify(p().personality||{})),memories:['Survived emergency treatment','Joined the Rescue Habitat'],stats:Object.assign({hygiene:75,happiness:72,bond:Math.max(35,state.stats.trust||35),fun:55,training:0,social:60},{...state.stats})})}state.idx=(currentIndex+1)%PATIENTS.length;state.stage=0;state.stats=DEFAULT_STATS();state.tests={exam:false,imaging:false,lab:false};state.tx={fluids:false,oxygen:false,pain:false,definitive:false,surgery:false};state.log=[];state.rewarded=false;vgResetCaseExtras();save();document.getElementById('reward-modal').classList.remove('show');go('pets')};
window.nextPatient=function(){state.idx=(state.idx+1)%PATIENTS.length;state.stage=0;state.stats=DEFAULT_STATS();state.tests={exam:false,imaging:false,lab:false};state.tx={fluids:false,oxygen:false,pain:false,definitive:false,surgery:false};state.log=[];state.rewarded=false;vgResetCaseExtras();if(Math.random()<.22){const events=[['LOCAL RESCUE DONATION',300],['COMMUNITY FUNDRAISER',500],['ANONYMOUS ANIMAL LOVER',750],['EMERGENCY GRANT',1000]],ev=events[Math.floor(Math.random()*events.length)];money(ev[1]);state.reputation=(state.reputation||0)+40;toast(ev[0]+' • +$'+ev[1])}save();document.getElementById('reward-modal').classList.remove('show');go('clinic')};

const vgOldRender=window.render;window.render=function(){vgEnsure();vgOldRender();vgUpdateHeader()};
const vgOldRenderScreen=window.renderScreen;window.renderScreen=function(id){vgEnsure();vgOldRenderScreen(id);vgUpdateHeader()};
vgEnsure();render();vgUpdateHeader();
})();
</script>


<script id="vg-last-sanctuary-js">
(function(){
const KEY='vetgods_last_sanctuary_v1';
const CHAPTERS=[
 {n:1,title:'THE NIGHT SHIFT',patient:'Kota',desc:'03:17 AM. A winter storm has closed the highway. A worker arrives carrying a soaked Husky mix. Apex has one job: keep the doors open.',goal:'Stabilize, diagnose, treat and safely discharge Kota.'},
 {n:2,title:'THE MACHINE SHED',patient:'Mira',desc:'A rescue team searches an abandoned machine shed and finds a silver tabby hiding beneath shelving. She is hurt, wary, and highly sensitive to handling.',goal:'Earn Mira’s trust while completing a surgical rescue.'},
 {n:3,title:'AFTER THE STORM',patient:'Orion',desc:'Wildlife transport arrives at dawn. A barn owl is in shock with a low-held wing. Noise and bright activity are now clinical problems.',goal:'Complete a quiet wildlife recovery without overwhelming Orion.'},
 {n:4,title:'THE GUARDIAN',patient:'Juniper',desc:'A shepherd mix arrives from a difficult field rescue. She watches every person in the room and refuses to give up.',goal:'Complete Juniper’s advanced treatment and surgical pathway.'},
 {n:5,title:'THE NETWORK',patient:null,desc:'Calls multiply. Small shelters are full and rural services are stretched thin. Apex is becoming the place everyone calls when there is nowhere else to call.',goal:'Build hospital hardware, own at least 2 Tools, and establish a rescue habitat.'},
 {n:6,title:'RED BARN',patient:null,desc:'Evidence from an incoming case points toward an isolated property. A field team requests authorization to search.',goal:'Fund and complete a rescue-team dispatch, then prepare for multiple inbound patients.'},
 {n:7,title:'KEEP THE DOORS OPEN',patient:null,desc:'A regional emergency overwhelms the network. Everything you built—funding, hospital hardware, Tools, reputation, sanctuary companions—now matters.',goal:'Reach an established Apex facility and complete the final emergency readiness test.'}
];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{chapter:1,completed:{},dispatch:false,final:false,radio:[]}}catch(e){return {chapter:1,completed:{},dispatch:false,final:false,radio:[]}}}
function saveC(c){localStorage.setItem(KEY,JSON.stringify(c))}
function toolCount(){return Object.values(state.ownedTools||{}).filter(Boolean).length}
function upgradeCount(){return Object.values(state.ownedUpgrades||{}).filter(Boolean).length}
function rescueCount(){return (state.pets||[]).length}
function chapterUnlocked(n,c){
 if(n===1)return true;
 if(n<=4)return !!c.completed[n-1];
 if(n===5)return !!c.completed[4];
 if(n===6)return !!c.completed[5];
 if(n===7)return !!c.completed[6];
 return false;
}
function currentPatientChapter(){
 let nm=(typeof p==='function'&&p())?p().name:'';
 return {Kota:1,Mira:2,Orion:3,Juniper:4}[nm]||0;
}
function evaluate(){
 let c=load(), changed=false;
 // Patient chapters complete only after case reward is earned.
 let pc=currentPatientChapter();
 if(pc && state.rewarded && !c.completed[pc]){c.completed[pc]=true;c.chapter=Math.max(c.chapter,pc+1);changed=true;pushRadio(c,'CASE '+String(pc).padStart(2,'0')+' COMPLETE • '+p().name.toUpperCase()+' SAFE');}
 // Chapter 5: actual systems already in the game.
 if(c.completed[4] && !c.completed[5] && upgradeCount()>=2 && toolCount()>=2 && rescueCount()>=1){
   c.completed[5]=true;c.chapter=Math.max(c.chapter,6);changed=true;pushRadio(c,'RESCUE NETWORK STATUS • APEX FACILITY RECOGNIZED');
 }
 if(c.dispatch && !c.completed[6]){c.completed[6]=true;c.chapter=Math.max(c.chapter,7);changed=true}
 // Final: meaningful endgame thresholds but achievable.
 if(c.completed[6] && !c.completed[7] && upgradeCount()>=4 && toolCount()>=3 && (state.reputation||0)>=1500 && rescueCount()>=2){
   c.completed[7]=true;c.final=true;changed=true;pushRadio(c,'REGIONAL BOARD • NO PATIENTS WAITING');
 }
 if(changed)saveC(c);
 return c;
}
function pushRadio(c,msg){c.radio=c.radio||[];c.radio.unshift(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' — '+msg);c.radio=c.radio.slice(0,8)}
function companions(){
 let pets=(state.pets||[]);
 if(!pets.length)return 'No sanctuary companions available yet.';
 return pets.map(x=>'<span class="vgc-companion">🐾 '+x.name+' • '+((x.personality||{}).archetype||'Rescue Companion')+'</span>').join('');
}
function rank(){
 let r=state.reputation||0;
 return r>=5000?'VET GODS':r>=3000?'National Intervention Center':r>=1800?'State Rescue Network':r>=900?'Regional Hospital':'Local Rescue';
}
function objectiveState(n,c){
 if(n<=4)return c.completed[n]?'PATIENT SAFE • COMPLETE':'Complete this patient’s full clinical pathway.';
 if(n===5)return 'Hospital upgrades '+upgradeCount()+'/2 • Tools '+toolCount()+'/2 • Sanctuary residents '+rescueCount()+'/1';
 if(n===6)return c.dispatch?'FIELD TEAM RETURNED • COMPLETE':'Authorize the Red Barn field rescue for $500.';
 if(n===7)return 'Hospital upgrades '+upgradeCount()+'/4 • Tools '+toolCount()+'/3 • Reputation '+(state.reputation||0)+'/1500 • Sanctuary residents '+rescueCount()+'/2';
 return '';
}
window.vgOpenCampaign=function(){
 let c=evaluate(),panel=document.getElementById('vgCampaignPanel'); if(!panel)return;
 let completed=Object.values(c.completed||{}).filter(Boolean).length;
 panel.innerHTML='<div class="vgc-wrap"><div class="vgc-top"><div><b>VET GODS</b> • THE LAST SANCTUARY</div><button class="btn" onclick="vgCloseCampaign()">✕ CLOSE</button></div>'+
 '<div class="vgc-banner"><div class="eyebrow">APEX RESCUE NETWORK</div><div class="vgc-title">KEEP THE DOORS OPEN.</div><p>Build the hospital, save the animals, grow the sanctuary, and become the rescue network’s last line of care.</p></div>'+
 '<div class="vgc-stats"><div class="vgc-stat">CAMPAIGN<b>'+completed+'/7</b></div><div class="vgc-stat">RESCUES KEPT<b>'+rescueCount()+'</b></div><div class="vgc-stat">REPUTATION<b>'+(state.reputation||0).toLocaleString()+'</b></div><div class="vgc-stat">NETWORK RANK<b style="font-size:12px">'+rank()+'</b></div><div class="vgc-stat">HARDWARE<b>'+upgradeCount()+'</b></div><div class="vgc-stat">TOOLS<b>'+toolCount()+'</b></div></div>'+
 CHAPTERS.map(ch=>{let unlocked=chapterUnlocked(ch.n,c),done=!!c.completed[ch.n];
   return '<div class="vgc-card vgc-chapter '+(!unlocked?'vgc-lock ':'')+(done?'vgc-done ':'')+(ch.n===7?'vgc-final':'')+'"><div class="vgc-num">'+(done?'✓':ch.n)+'</div><div><div class="eyebrow">CHAPTER '+ch.n+'</div><h2 style="margin:3px 0">'+ch.title+'</h2><p style="color:#a9c0ca;line-height:1.55">'+ch.desc+'</p><div class="vgc-objective"><b>OBJECTIVE</b><br>'+ch.goal+'<br><span style="opacity:.7">'+objectiveState(ch.n,c)+'</span></div>'+
   (ch.n===6&&unlocked&&!done?'<div class="vgc-actions"><button onclick="vgDispatchRedBarn()">📻 AUTHORIZE FIELD TEAM • $500</button></div>':'')+
   (ch.n===7&&done?'<div class="vgc-banner"><b>THE DOORS ARE STILL OPEN.</b><br>Free Play is now your continuing rescue network. Your sanctuary animals remain with you and Apex keeps accepting cases.</div>':'')+
   '</div></div>'}).join('')+
 '<div class="vgc-card"><h3>🐾 SANCTUARY COMPANIONS</h3><p style="font-size:12px;opacity:.75">Animals you keep become part of the story. Their bond and personality represent the rescue family growing around Apex.</p>'+companions()+'</div>'+
 '<div class="vgc-card"><h3>📻 RESCUE RADIO</h3><div class="vgc-radio">'+((c.radio||[]).length?c.radio.join('<br>'):'03:17 — Emergency power stable. Highway closed. Someone is at the clinic door.')+'</div></div></div>';
 panel.classList.add('open');
};
window.vgCloseCampaign=function(){document.getElementById('vgCampaignPanel')?.classList.remove('open')};
window.vgDispatchRedBarn=function(){
 let c=load(); if(!c.completed[5]||c.dispatch)return;
 if((state.funds||0)<500){if(typeof toast==='function')toast('FIELD TEAM REQUIRES $500');return}
 if(typeof spend==='function')spend(500);else state.funds-=500;
 c.dispatch=true;pushRadio(c,'RED BARN • FIELD TEAM DISPATCHED');pushRadio(c,'FIELD TEAM • FOUR CARRIERS REQUESTED • MULTIPLE ANIMALS LOCATED');saveC(c);
 if(typeof save==='function')save(); if(typeof render==='function')render();
 setTimeout(vgOpenCampaign,80);
};
function inject(){
 if(document.getElementById('vgCampaignDock'))return;
 let dock=document.createElement('div');dock.id='vgCampaignDock';dock.innerHTML='<button id="vgCampaignBtn" onclick="vgOpenCampaign()">📻 CAMPAIGN</button>';document.body.appendChild(dock);
 let panel=document.createElement('div');panel.id='vgCampaignPanel';document.body.appendChild(panel);
}
function storyHint(){
 let c=evaluate();
 let clinic=document.getElementById('clinic');
 if(!clinic||!clinic.classList.contains('active'))return;
 if(clinic.querySelector('.vgc-story-hint'))return;
 let ch=CHAPTERS[Math.min((currentPatientChapter()||c.chapter),7)-1];
 if(!ch)return;
 let box=document.createElement('div');box.className='notice vgc-story-hint';box.innerHTML='<b>📻 '+ch.title+'</b><br><span style="font-size:12px">'+ch.desc+'</span>';
 let first=clinic.querySelector('.card'); if(first)first.insertAdjacentElement('afterbegin',box);
}
document.addEventListener('click',()=>{setTimeout(evaluate,80);setTimeout(storyHint,120)},true);
addEventListener('load',()=>{inject();evaluate();setTimeout(storyHint,120)});
setTimeout(()=>{inject();evaluate();storyHint()},180);
})();
</script>
