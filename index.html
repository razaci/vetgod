<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>VET GODS — Reimagined</title>
<style>
:root{
  --bg:#071015;--bg2:#0b1820;--panel:#0e2029;--panel2:#132a35;--edge:#254451;
  --ink:#eaf7fb;--muted:#84a7b4;--cyan:#38d7ff;--teal:#5ef0cb;--amber:#ffd66b;
  --red:#ff6b7a;--lime:#9dff7b;--violet:#b99cff;--shadow:0 18px 50px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:
 radial-gradient(circle at 10% 0%,rgba(56,215,255,.12),transparent 28%),
 radial-gradient(circle at 90% 8%,rgba(185,156,255,.11),transparent 24%),
 linear-gradient(180deg,#050b0f,var(--bg) 30%,#08141a 100%);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
button{font:inherit}.shell{max-width:1440px;margin:auto;padding:0 16px 70px}
.topbar{position:sticky;top:0;z-index:30;margin:0 -16px;padding:10px 16px;background:rgba(5,12,17,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(92,183,209,.18)}
.brandrow{display:flex;align-items:center;gap:12px;min-height:54px}.sigil{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 200deg,var(--cyan),var(--teal),var(--violet),var(--cyan));padding:2px;box-shadow:0 0 32px rgba(56,215,255,.23)}.sigil>i{display:grid;place-items:center;width:100%;height:100%;border-radius:12px;background:#071219;font-style:normal;font-weight:900}.brand{font-size:19px;font-weight:900;letter-spacing:.12em}.subtitle{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}.spacer{flex:1}.funds{padding:8px 12px;border:1px solid #365c68;border-radius:12px;background:#0b1c24}.funds b{color:var(--lime)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:1px solid #294a56;background:#0b1b23;color:#a9c4ce;border-radius:12px;padding:9px 12px;cursor:pointer}.nav button.active{color:white;border-color:rgba(56,215,255,.62);background:linear-gradient(180deg,rgba(56,215,255,.18),rgba(56,215,255,.05));box-shadow:inset 0 0 20px rgba(56,215,255,.06)}
.hero{margin:18px 0 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:14px}.card{background:linear-gradient(180deg,rgba(17,42,54,.92),rgba(9,25,33,.94));border:1px solid rgba(92,166,187,.24);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:18px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.18em}.h1{font-size:clamp(28px,4vw,52px);line-height:1;margin:8px 0 10px;font-weight:950;letter-spacing:-.045em}.lede{max-width:780px;color:#b6cbd3}.phasebar{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.phase{font-size:12px;padding:7px 9px;border-radius:999px;border:1px solid #294753;color:#7597a3}.phase.done{color:#91e6cf;border-color:#2e6c60;background:rgba(94,240,203,.07)}.phase.now{color:white;border-color:#4bdfff;background:rgba(56,215,255,.13);box-shadow:0 0 24px rgba(56,215,255,.11)}
.patientVisual{min-height:270px;position:relative;background:radial-gradient(circle at 50% 42%,rgba(56,215,255,.18),transparent 32%),linear-gradient(135deg,#0a1720,#102633)}.animal{position:absolute;inset:24px;display:grid;place-items:center}.animal svg{width:min(330px,86%);filter:drop-shadow(0 18px 28px rgba(0,0,0,.35))}.scanline{position:absolute;left:7%;right:7%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 18px var(--cyan);animation:scan 3.6s ease-in-out infinite}@keyframes scan{0%,100%{top:18%;opacity:.2}50%{top:82%;opacity:.9}}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.kpi{padding:13px;border:1px solid #274753;border-radius:16px;background:rgba(7,20,27,.77)}.kpi small{display:block;color:#7999a5;text-transform:uppercase;font-size:10px;letter-spacing:.12em}.kpi strong{font-size:21px}.kpi .mini{height:5px;margin-top:8px;border-radius:99px;background:#162c35;overflow:hidden}.kpi .mini i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:inherit}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.sectionTitle{display:flex;align-items:end;gap:12px;margin-bottom:12px}.sectionTitle h2{font-size:19px;margin:0}.sectionTitle p{margin:0;color:var(--muted);font-size:12px}
.instrumentGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.instrument{padding:14px;border:1px solid #2b4a55;border-radius:16px;background:linear-gradient(180deg,#102630,#0b1b22);min-height:118px;cursor:pointer;color:white;text-align:left;transition:.16s transform,.16s border-color}.instrument:hover{transform:translateY(-2px);border-color:#4fb5ce}.instrument:active{transform:scale(.985)}.instrument b{display:block;margin-bottom:5px}.instrument small{color:#80a4b0}.dial{width:44px;height:44px;border-radius:50%;margin-bottom:9px;background:conic-gradient(var(--accent,var(--cyan)) var(--pct,70%),#1d3942 0);padding:5px}.dial:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#0b1b22;box-shadow:inset 0 0 0 1px #2b4b55}
.readout{display:grid;gap:10px}.meter{padding:11px 12px;border:1px solid #24434e;border-radius:14px;background:#0a1b22}.meterhead{display:flex;justify-content:space-between;gap:10px}.meterbar{height:9px;margin-top:8px;border-radius:999px;background:#17313a;overflow:hidden}.meterbar i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:inherit}.meter.danger .meterbar i{background:linear-gradient(90deg,var(--amber),var(--red))}
.actionRow{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{border:1px solid #315561;border-radius:13px;padding:10px 13px;color:white;background:#102731;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#17445a,#113140);border-color:#3c91aa}.btn.good{background:linear-gradient(180deg,#194a42,#11352f);border-color:#3b8b79}.btn.warn{background:linear-gradient(180deg,#4b3920,#332617);border-color:#8a6e35}.btn:disabled{opacity:.38;cursor:not-allowed}
.log{margin-top:14px;padding:12px;border-radius:14px;background:#08181e;border:1px solid #213e48;min-height:90px}.log div{padding:6px 0;border-bottom:1px solid rgba(100,160,180,.1);color:#a9c0c8}.log div:last-child{border-bottom:0}.log time{color:#5f8491;margin-right:8px}
.notice{padding:12px;border:1px solid #335967;border-radius:14px;background:rgba(56,215,255,.055);color:#c6e8f0}.screen{display:none}.screen.active{display:block}
.petGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.petCard{padding:15px;border:1px solid #2d4d58;border-radius:18px;background:linear-gradient(180deg,#102831,#0b1a21)}.petFace{height:130px;border-radius:15px;background:radial-gradient(circle at 50% 50%,rgba(157,255,123,.13),transparent 45%),#09171d;display:grid;place-items:center;margin-bottom:12px;font-size:60px}.petStats{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px;color:#9cb4bd}
.finalGate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #4b6545;border-radius:16px;background:rgba(157,255,123,.06);margin-top:14px}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,8,11,.74);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalBox{max-width:560px;width:100%;border-radius:24px;background:#0d212a;border:1px solid #3d7c8f;box-shadow:0 30px 100px #000;padding:24px;text-align:center}.reward{font-size:62px}.modalBox h2{font-size:32px;margin:8px 0}.rewardBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:900px){.hero,.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.petGrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.shell{padding:0 10px 70px}.topbar{margin:0 -10px;padding:8px 10px}.brand{font-size:16px}.subtitle{font-size:9px}.funds{font-size:12px}.hero{margin-top:12px}.pad{padding:14px}.instrumentGrid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.petGrid{grid-template-columns:1fr}.patientVisual{min-height:230px}.actionRow .btn{flex:1 1 42%}.h1{font-size:35px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <div class="brandrow"><div class="sigil"><i>VG</i></div><div><div class="brand">VET GODS</div><div class="subtitle">Veterinary Intervention Command</div></div><div class="spacer"></div><div class="funds">CLINIC <b id="funds">$2,400</b></div></div>
 <nav class="nav" id="nav"></nav>
</header>

<main>
<section id="clinic" class="screen active"></section>
<section id="stabilize" class="screen"></section>
<section id="diagnostics" class="screen"></section>
<section id="treatment" class="screen"></section>
<section id="surgery" class="screen"></section>
<section id="recovery" class="screen"></section>
<section id="discharge" class="screen"></section>
<section id="pets" class="screen"></section>
</main>
</div>
<div class="modal" id="rewardModal"><div class="modalBox"><div class="reward">✦</div><div class="eyebrow">Case Complete</div><h2 id="rewardTitle">Kota is safe.</h2><p id="rewardText"></p><div class="rewardBtns"><button class="btn good" id="keepPet">Keep in My Pets</button><button class="btn primary" id="nextPatient">Next Patient</button></div></div></div>
<script>
const stages=['Intake','Stabilize','Diagnose','Treat','Surgery','Recovery','Prove Ready','Discharge'];
const navItems=[['clinic','Clinic'],['stabilize','Stabilize'],['diagnostics','Diagnostics'],['treatment','Treatment'],['surgery','Surgery'],['recovery','Recovery'],['discharge','Discharge'],['pets','My Pets']];
const patients=[
 {name:'Kota',species:'Canine',breed:'Husky mix',condition:'Trauma with dehydration',surgical:false,emoji:'🐕'},
 {name:'Mira',species:'Feline',breed:'Silver tabby',condition:'Deep paw laceration',surgical:true,emoji:'🐈'},
 {name:'Orion',species:'Avian',breed:'Barn owl',condition:'Wing strain and shock',surgical:false,emoji:'🦉'},
 {name:'Juniper',species:'Canine',breed:'Shepherd mix',condition:'Foreign-body injury',surgical:true,emoji:'🐕‍🦺'}
];
const defaults=()=>({health:68,pain:61,oxygen:91,hydration:46,stress:72,trust:29,mobility:35,comfort:30,hunger:56,thirst:64,energy:42});
let state=JSON.parse(localStorage.getItem('vetgods_reimagined')||'null')||{idx:0,stage:0,funds:2400,stats:defaults(),tests:{exam:false,imaging:false,lab:false},tx:{fluids:false,oxygen:false,pain:false,definitive:false,surgery:false},pets:[],log:[],rewarded:false};
function p(){return patients[state.idx%patients.length]}
function save(){localStorage.setItem('vetgods_reimagined',JSON.stringify(state))}
function log(msg){state.log.unshift({t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),msg});state.log=state.log.slice(0,7);save();render()}
function spend(n){state.funds=Math.max(0,state.funds-n)}
function clamp(){for(const k in state.stats)state.stats[k]=Math.max(0,Math.min(100,state.stats[k]))}
function phaseStrip(){return `<div class="phasebar">${stages.map((x,i)=>`<span class="phase ${i<state.stage?'done':i===state.stage?'now':''}">${x}</span>`).join('')}</div>`}
function petArt(){return `<div class="patientVisual"><div class="scanline"></div><div class="animal"><svg viewBox="0 0 360 240" aria-label="stylized patient silhouette"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#69e8ff"/><stop offset="1" stop-color="#a993ff"/></linearGradient></defs><ellipse cx="180" cy="205" rx="120" ry="18" fill="#000" opacity=".28"/><path d="M84 132c10-44 40-72 84-77 36-4 69 8 89 31l29-10 20 16-23 25 4 52-24 4-7-42-40 8-15 48-24-1 7-46-62 2-10 45-23-2 5-53z" fill="url(#g)" opacity=".88"/><circle cx="279" cy="74" r="28" fill="url(#g)"/><path d="M264 51l-6-24 24 17M295 51l11-21 10 31" stroke="#8cf0ff" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="289" cy="71" r="4" fill="#051117"/><path d="M73 126c-25-8-34-30-23-45" stroke="#7be7ff" stroke-width="11" fill="none" stroke-linecap="round"/></svg></div></div>`}
function kpis(){const s=state.stats;return `<div class="kpis">${[['Health',s.health],['Pain',100-s.pain],['O₂',s.oxygen],['Hydration',s.hydration],['Trust',s.trust],['Mobility',s.mobility]].map(([n,v])=>`<div class="kpi"><small>${n}</small><strong>${Math.round(n==='Pain'?100-v:v)}${n==='O₂'?'%':''}</strong><div class="mini"><i style="--v:${v}%"></i></div></div>`).join('')}</div>`}
function telemetry(keys=['health','pain','oxygen','hydration','stress','trust','mobility','comfort']){return `<div class="readout">${keys.map(k=>{let v=state.stats[k],bad=(k==='pain'||k==='stress')&&v>45;return `<div class="meter ${bad?'danger':''}"><div class="meterhead"><span>${k[0].toUpperCase()+k.slice(1)}</span><b>${Math.round(v)}${k==='oxygen'?'%':''}</b></div><div class="meterbar"><i style="--v:${k==='pain'||k==='stress'?100-v:v}%"></i></div></div>`}).join('')}</div>`}
function logBox(){return `<div class="log">${state.log.length?state.log.map(x=>`<div><time>${x.t}</time>${x.msg}</div>`).join(''):'<div>Hospital event log ready.</div>'}</div>`}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,label])=>`<button data-go="${id}">${label}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));renderScreen(id)}
function clinic(){return `<div class="hero"><div class="card pad"><div class="eyebrow">Active Rescue // ${p().species}</div><div class="h1">${p().name}</div><p class="lede">${p().breed} • ${p().condition}. The hospital never moves you automatically. Enter a department, work there, finish it, then choose where to go next.</p>${phaseStrip()}<div class="actionRow"><button class="btn primary" onclick="go('${nextArea()}')">Enter Next Department</button><button class="btn" onclick="go('pets')">Open My Pets</button></div></div><div class="card">${petArt()}</div></div>${kpis()}<div class="grid"><div class="card pad"><div class="sectionTitle"><h2>Command Console</h2><p>Department access stays deliberate.</p></div><div class="instrumentGrid">${navItems.slice(1,7).map(([id,l],i)=>`<button class="instrument" onclick="go('${id}')"><div class="dial" style="--pct:${45+i*7}%;--accent:${i%2?'var(--teal)':'var(--cyan)'}"></div><b>${l}</b><small>${areaNote(id)}</small></button>`).join('')}</div></div><div class="card pad"><div class="sectionTitle"><h2>Live Telemetry</h2><p>No timer redraws.</p></div>${telemetry(['health','pain','oxygen','hydration','stress','trust'])}</div></div>${logBox()}`}
function nextArea(){return ['stabilize','stabilize','diagnostics','treatment',p().surgical?'surgery':'recovery','recovery','recovery','discharge'][state.stage]||'discharge'}
function areaNote(id){return ({stabilize:'Correct immediate risks',diagnostics:'Reveal evidence',treatment:'Support + definitive care',surgery:'Procedure only if required',recovery:'Playable aftercare',discharge:'Readiness proof'})[id]||''}
function areaTemplate(title,eyebrow,desc,controls,rightKeys,finish){return `<div class="hero"><div class="card pad"><div class="eyebrow">${eyebrow}</div><div class="h1">${title}</div><p class="lede">${desc}</p><div class="notice">Actions on this page stay on this page. Nothing below can secretly move you elsewhere.</div></div><div class="card">${petArt()}</div></div><div class="grid"><div class="card pad"><div class="sectionTitle"><h2>Work Surface</h2><p>Tap instruments to change patient state.</p></div><div class="instrumentGrid">${controls}</div>${finish||''}${logBox()}</div><div class="card pad"><div class="sectionTitle"><h2>Department Readout</h2><p>Immediate local feedback.</p></div>${telemetry(rightKeys)}</div></div>`}
function control(label,desc,js,pct=65,accent='var(--cyan)',disabled=false){return `<button class="instrument" ${disabled?'disabled':''} onclick="${js}"><div class="dial" style="--pct:${pct}%;--accent:${accent}"></div><b>${label}</b><small>${desc}</small></button>`}
function advance(to,msg){state.stage=Math.max(state.stage,to);log(msg)}
function stabilize(){let c='';c+=control('Oxygen Support','Raise saturation + calm breathing',"state.stats.oxygen+=5; state.stats.stress-=6; spend(5); clamp(); advance(1,'Oxygen support completed.');",77);c+=control('IV Fluids','Restore hydration gradually',"state.stats.hydration+=16; state.stats.health+=4; state.tx.fluids=true; spend(5); clamp(); advance(1,'IV fluids improved hydration.');",62,'var(--teal)');c+=control('Pain Control','Reduce pain before mobility',"state.stats.pain-=18; state.stats.comfort+=9; state.tx.pain=true; spend(5); clamp(); advance(1,'Pain control administered.');",55,'var(--amber)');return areaTemplate(`${p().name} // Stabilization`,'Department 01','Correct the dangerous basics before chasing a diagnosis.',c,['oxygen','hydration','pain','stress','health'],`<div class="actionRow"><button class="btn primary" onclick="advance(2,'Stabilization signed off.');go('diagnostics')">Finish Area → Diagnostics</button><button class="btn" onclick="go('clinic')">Return to Clinic</button></div>`)}
function diagnostics(){let c='';c+=control('Physical Exam',state.tests.exam?'Completed':'Check perfusion, tenderness, neuro signs',"state.tests.exam=true; spend(5); log('Physical exam: localized tenderness, stable neurologic status.');",72);c+=control('Imaging',state.tests.imaging?'Completed':'Reveal structural injury',"state.tests.imaging=true; spend(5); log('Imaging: no unstable fracture; soft-tissue injury visible.');",67,'var(--violet)');c+=control('Laboratory',state.tests.lab?'Completed':'Check hydration and inflammation',"state.tests.lab=true; spend(5); log('Lab: dehydration confirmed; no severe anemia.');",58,'var(--teal)');let ready=state.tests.exam&&state.tests.imaging&&state.tests.lab;return areaTemplate(`${p().name} // Diagnostics`,'Evidence Deck','Diagnosis becomes available only after evidence is collected.',c,['health','pain','hydration','stress','oxygen'],`<div class="finalGate"><div><b>${ready?'Evidence complete':'Evidence incomplete'}</b><div class="subtitle">${ready?'Trauma + dehydration confirmed':'Run all three diagnostic stations'}</div></div><button class="btn primary" ${ready?'':'disabled'} onclick="advance(3,'Diagnosis locked: trauma with dehydration.');go('treatment')">Lock Diagnosis</button></div>`)}
function treatment(){let c='';c+=control('Fluid Bolus','Support perfusion + hydration',"state.stats.hydration+=13;state.stats.health+=5;state.tx.fluids=true;spend(5);clamp();log('Supportive fluids delivered.');",70,'var(--teal)');c+=control('Analgesia','Control pain, improve comfort',"state.stats.pain-=20;state.stats.comfort+=12;state.tx.pain=true;spend(5);clamp();log('Analgesia response: pain reduced.');",52,'var(--amber)');c+=control('Definitive Care',p().surgical?'Prepare wound for procedure':'Wound care, bandage, medication plan',"state.stats.health+=12;state.stats.stress-=10;state.tx.definitive=true;spend(10);clamp();advance(4,'Definitive treatment completed.');",82,'var(--lime)');let done=state.tx.definitive;return areaTemplate(`${p().name} // Treatment`,'Therapeutics','Supportive care improves stability; definitive care resolves the actual problem.',c,['health','pain','hydration','comfort','stress'],`<div class="actionRow"><button class="btn primary" ${done?'':'disabled'} onclick="go('${p().surgical?'surgery':'recovery'}')">${p().surgical?'Proceed to Surgery':'Surgery Skipped → Recovery'}</button><button class="btn" onclick="go('clinic')">Return to Clinic</button></div>`)}
function surgery(){if(!p().surgical)return areaTemplate('Surgery // Not Required','Procedure Deck','This case is nonsurgical. The game says so clearly instead of leaving a dead end.',control('Surgery Skipped','No procedure indicated',"advance(5,'Surgery visibly skipped for nonsurgical case.');",100,'var(--lime)',true),['health','pain','oxygen'],`<div class="actionRow"><button class="btn primary" onclick="advance(5,'Surgery skipped; recovery authorized.');go('recovery')">Continue to Recovery</button></div>`);let c='';c+=control('Anesthesia','Stabilize plane + oxygen',"state.stats.oxygen+=4;state.stats.stress-=16;spend(10);clamp();log('Anesthesia plane stable.');",72);c+=control('Repair','Complete controlled procedure',"state.stats.health+=14;state.stats.pain+=8;state.tx.surgery=true;spend(25);clamp();advance(5,'Surgical repair complete.');",78,'var(--violet)');c+=control('Closure','Protect site + recovery plan',"state.stats.comfort+=8;state.stats.pain-=5;spend(5);clamp();log('Closure and dressing complete.');",64,'var(--teal)');return areaTemplate(`${p().name} // Surgery`,'Operating Theater','A focused procedure deck with no navigation surprises.',c,['oxygen','health','pain','stress','comfort'],`<div class="actionRow"><button class="btn primary" ${state.tx.surgery?'':'disabled'} onclick="go('recovery')">Finish Procedure → Recovery</button></div>`)}
function recovery(){let c='';c+=control('Offer Water','Hydration + thirst relief',"state.stats.hydration+=12;state.stats.thirst-=20;state.stats.trust+=3;clamp();log('Water accepted.');",62,'var(--teal)');c+=control('Offer Food','Nutrition + energy',"state.stats.hunger-=22;state.stats.energy+=12;state.stats.trust+=3;clamp();log('Food accepted.');",60,'var(--lime)');c+=control('Comfort','Stress down, trust up',"state.stats.comfort+=14;state.stats.stress-=12;state.stats.trust+=10;clamp();log('Comfort session improved trust.');",74,'var(--violet)');c+=control('Pain Support','Pain must be controlled before walking',"state.stats.pain-=14;state.stats.comfort+=6;clamp();log('Pain support improved comfort.');",48,'var(--amber)');c+=control('Quiet Rest','Restore energy',"state.stats.energy+=20;state.stats.stress-=8;clamp();log('Quiet rest completed.');",68);c+=control('Gentle Walk','Mobility + confidence',"if(state.stats.pain>45){log('Walk blocked: pain must be 45 or lower.')}else{state.stats.mobility+=15;state.stats.energy-=8;state.stats.trust+=4;clamp();log('Gentle walk completed safely.');}",58,'var(--teal)');let ready=readiness()>=82 && state.stats.pain<=45 && state.stats.hydration>=60 && state.stats.mobility>=55;return areaTemplate(`${p().name} // Recovery`,'Aftercare Habitat','This is gameplay, not a waiting room. Hydrate, feed, rest, control pain, and prove mobility.',c,['health','pain','hydration','mobility','comfort','trust','energy'],`<div class="finalGate"><div><b>Readiness ${readiness()}%</b><div class="subtitle">Need pain ≤45 • hydration ≥60 • mobility ≥55 • score ≥82</div></div><button class="btn good" ${ready?'':'disabled'} onclick="advance(7,'Recovery proof complete.');go('discharge')">Prove Ready</button></div>`)}
function readiness(){let s=state.stats;return Math.round((s.health+(100-s.pain)+s.hydration+s.mobility+s.comfort+s.trust)/6)}
function discharge(){let r=readiness();return `<div class="hero"><div class="card pad"><div class="eyebrow">Final Gate</div><div class="h1">Discharge ${p().name}</div><p class="lede">The case ends once, visibly, with a reward and a clean handoff to My Pets or the next patient.</p>${phaseStrip()}<div class="finalGate"><div><b>Readiness ${r}%</b><div class="subtitle">Current evidence and aftercare state</div></div><button class="btn good" ${r>=82?'':'disabled'} onclick="finishCase()">Complete Case</button></div>${logBox()}</div><div class="card">${petArt()}</div></div>${kpis()}`}
function finishCase(){if(!state.rewarded){state.funds+=250;state.rewarded=true;state.stage=7;save()}document.getElementById('rewardTitle').textContent=`${p().name} is safe.`;document.getElementById('rewardText').textContent='Case reward: $250 clinic funding. You can keep this rescue in My Pets or continue to a fresh patient.';document.getElementById('rewardModal').classList.add('show');render()}
function pets(){if(!state.pets.length)return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">Completed patients you keep will live here with persistent needs, care actions, and their own recovery history.</p><div class="notice">No rescued pets yet. Finish a case and choose “Keep in My Pets.”</div></div>`;return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">Persistent rescued animals. Care updates happen inline and never kick you out of this screen.</p><div class="actionRow"><button class="btn good" onclick="careAll()">Care For All Pets</button></div></div><div class="petGrid" style="margin-top:14px">${state.pets.map((x,i)=>`<div class="petCard"><div class="petFace">${x.emoji}</div><h3>${x.name}</h3><div class="subtitle">${x.species} • ${x.breed}</div><div class="petStats"><span>Health <b>${x.stats.health}</b></span><span>Pain <b>${x.stats.pain}</b></span><span>Water <b>${x.stats.hydration}</b></span><span>Trust <b>${x.stats.trust}</b></span><span>Mobility <b>${x.stats.mobility}</b></span><span>Energy <b>${x.stats.energy}</b></span></div><div class="actionRow"><button class="btn" onclick="petCare(${i},'water')">Water</button><button class="btn" onclick="petCare(${i},'food')">Food</button><button class="btn" onclick="petCare(${i},'comfort')">Comfort</button><button class="btn" onclick="petCare(${i},'rest')">Rest</button></div></div>`).join('')}</div>`}
function petCare(i,type){let s=state.pets[i].stats;if(type==='water'){s.hydration=Math.min(100,s.hydration+15);s.thirst=Math.max(0,s.thirst-20)}if(type==='food'){s.hunger=Math.max(0,s.hunger-20);s.energy=Math.min(100,s.energy+10)}if(type==='comfort'){s.comfort=Math.min(100,s.comfort+14);s.trust=Math.min(100,s.trust+8)}if(type==='rest'){s.energy=Math.min(100,s.energy+18);s.stress=Math.max(0,s.stress-8)}save();renderScreen('pets')}
function careAll(){state.pets.forEach((_,i)=>['water','food','comfort','rest'].forEach(t=>petCare(i,t)));save();renderScreen('pets')}
function keepPet(){if(!state.pets.some(x=>x.caseId===state.idx)){state.pets.push({caseId:state.idx,name:p().name,species:p().species,breed:p().breed,emoji:p().emoji,stats:{...state.stats}});save()}document.getElementById('rewardModal').classList.remove('show');go('pets')}
function nextPatient(){state.idx=(state.idx+1)%patients.length;state.stage=0;state.stats=defaults();state.tests={exam:false,imaging:false,lab:false};state.tx={fluids:false,oxygen:false,pain:false,definitive:false,surgery:false};state.log=[];state.rewarded=false;save();document.getElementById('rewardModal').classList.remove('show');go('clinic')}
function renderScreen(id){document.getElementById('funds').textContent='$'+state.funds.toLocaleString();const el=document.getElementById(id);if(id==='clinic')el.innerHTML=clinic();if(id==='stabilize')el.innerHTML=stabilize();if(id==='diagnostics')el.innerHTML=diagnostics();if(id==='treatment')el.innerHTML=treatment();if(id==='surgery')el.innerHTML=surgery();if(id==='recovery')el.innerHTML=recovery();if(id==='discharge')el.innerHTML=discharge();if(id==='pets')el.innerHTML=pets()}
function render(){document.getElementById('funds').textContent='$'+state.funds.toLocaleString();const active=document.querySelector('.screen.active')?.id||'clinic';renderScreen(active)}
document.getElementById('keepPet').onclick=keepPet;document.getElementById('nextPatient').onclick=nextPatient;renderNav();go('clinic');
</script>
</body>
</html>
