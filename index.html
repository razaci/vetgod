<script id="phase1-js">
(function(){
"use strict";
const stages=["INTAKE","DIAGNOSTICS","STABILIZE","TREATMENT","RECOVERY","DISCHARGE"];
const costs={"PHYSICAL EXAM":5,"BIO SCAN":8,"LABORATORY":10,"OXYGEN SUPPORT":5,"OFFER WATER":2,"PAIN CONTROL":6,"OFFER FOOD":2,"PRIMARY TREATMENT":12,"SEND TO RECOVERY":5};
function A(){return state.animals[state.active]}
function ensure(){
 state.credits=Number.isFinite(state.credits)?state.credits:620;
 state.supplies=state.supplies||{oxygen:8,fluids:8,analgesia:6,food:12,diagnostic:10};
 state.animals.forEach((a,i)=>{
   a.sex=a.sex||(["Female","Male"][i%2]);a.age=a.age||((i%9)+1)+" yr";
   a.temperament=a.temperament||(["Guarded","Gentle","Curious","Nervous","Alert"][i%5]);
   a.caseId=a.caseId||"VG-"+String(1001+i);
   a.stage=a.stage||"INTAKE";a.evidence=a.evidence||[];
   a.nutrition=Number.isFinite(a.nutrition)?a.nutrition:68;
   a.mobility=Number.isFinite(a.mobility)?a.mobility:72;
   a.history=a.history||[];
 });
 save();
}
function stagebar(a){
 let idx=Math.max(0,stages.indexOf(a.stage));
 return '<div class="p1-stage">'+stages.map((x,i)=>'<span class="'+(i<idx?"done":i===idx?"now":"")+'">'+(i<idx?"[X] ":i===idx?"[>] ":"[ ] ")+x+'</span>').join("")+'</div>';
}
function record(a){
 return '<div class="p1-record"><div><small>CASE ID</small><b>'+a.caseId+'</b></div><div><small>SPECIES</small><b>'+a.species+'</b></div><div><small>SEX</small><b>'+a.sex+'</b></div><div><small>AGE</small><b>'+a.age+'</b></div><div><small>TEMPERAMENT</small><b>'+a.temperament+'</b></div><div><small>MORPH STATE</small><b>'+a.morph+'</b></div></div>';
}
function economy(){
 let s=state.supplies;
 return '<div class="p1-money"><div><small>CLINIC FUNDS</small><b>$'+state.credits+'</b></div><div><small>OXYGEN</small><b>'+s.oxygen+'</b></div><div><small>FLUIDS</small><b>'+s.fluids+'</b></div><div><small>ANALGESIA</small><b>'+s.analgesia+'</b></div></div>';
}
function alerts(a){
 let x=[];if(a.oxygen<90)x.push("LOW OXYGEN");if(a.hydration<55)x.push("HYDRATION LOW");if(a.pain>55)x.push("PAIN ELEVATED");if(a.health<55)x.push("HEALTH CRITICAL");if(a.stress>70)x.push("STRESS HIGH");
 return '<div class="p1-alert"><strong>CLINICAL ALERTS:</strong> '+(x.length?x.join(" / "):"NO CRITICAL ALERTS")+'</div>';
}
function log(a){return '<div class="p1-log">'+(a.history.length?a.history.slice(0,12).map(x=>'<div><b>&gt;</b> '+x+'</div>').join(""):'<div>NO INTERVENTIONS RECORDED.</div>')+'</div>'}
function enrichCare(){
 if(page!=="care")return;let a=A(),content=document.querySelector(".content");if(!content)return;
 let head=content.querySelector(".head");if(head&&!document.querySelector("#p1top")){let box=document.createElement("div");box.id="p1top";box.innerHTML=stagebar(a)+alerts(a)+economy()+record(a);head.insertAdjacentElement("afterend",box)}
 let out=document.querySelector(".out");if(out&&!document.querySelector("#p1log")){let box=document.createElement("div");box.id="p1log";box.innerHTML='<div class="head" style="margin-top:8px">CASE ACTIVITY LOG</div>'+log(a);out.insertAdjacentElement("beforebegin",box)}
}
const oldProgram=program;
program=function(k){oldProgram(k);if(k==="care")enrichCare()};
const oldExec=execute;
execute=function(k,i){
 let a=A(),label=(ACTIONS[k]||[])[i]||"COMMAND",cost=costs[label]||0;
 if(k==="care"&&cost>state.credits){let o=document.querySelector("#out");if(o)o.textContent="COMMAND DENIED\\nINSUFFICIENT CLINIC FUNDS\\nREQUIRED: $"+cost;return}
 if(k==="care"){
   state.credits-=cost;
   if(label==="PHYSICAL EXAM"){a.stage="DIAGNOSTICS";a.evidence.push("Physical exam completed");a.trust=Math.min(100,a.trust+4)}
   if(label==="BIO SCAN"){a.stage="DIAGNOSTICS";a.evidence.push("Bio scan acquired");a.stress=Math.max(0,a.stress-2)}
   if(label==="LABORATORY"){a.stage="DIAGNOSTICS";a.evidence.push("Laboratory panel acquired")}
   if(label==="OXYGEN SUPPORT"){if(state.supplies.oxygen>0){state.supplies.oxygen--;a.oxygen=Math.min(100,a.oxygen+7);a.stage="STABILIZE"}}
   if(label==="OFFER WATER"){if(state.supplies.fluids>0){state.supplies.fluids--;a.hydration=Math.min(100,a.hydration+10);a.stage="STABILIZE"}}
   if(label==="PAIN CONTROL"){if(state.supplies.analgesia>0){state.supplies.analgesia--;a.pain=Math.max(0,a.pain-12);a.comfort=Math.min(100,a.comfort+8);a.stage="STABILIZE"}}
   if(label==="OFFER FOOD"){if(state.supplies.food>0){state.supplies.food--;a.nutrition=Math.min(100,a.nutrition+9);a.comfort=Math.min(100,a.comfort+3)}}
   if(label==="PRIMARY TREATMENT"){a.stage="TREATMENT";a.health=Math.min(100,a.health+12);a.pain=Math.max(0,a.pain-6)}
   if(label==="SEND TO RECOVERY"){a.stage="RECOVERY";a.health=Math.min(100,a.health+5);a.stress=Math.max(0,a.stress-10)}
 }
 oldExec(k,i);
 save();
 if(k==="care"){program("care")}
};
window.VetGodsPhase1={ensure,enrichCare};
ensure();
})();

 });

function recalc(a,cause){
 let d=a.dynamic;
 d.thirst=clamp(100-a.hydration);
 d.painSignal=clamp(a.pain);
 d.fatigue=clamp(100-(a.petStats?.energy||a.nutrition||70));
 d.safety=clamp((a.trust*0.45)+(a.comfort*0.35)+((100-a.stress)*0.20));
 d.handlingEase=clamp((a.trust*.5)+(d.safety*.3)+((100-a.pain)*.2));
 d.recoveryDrive=clamp((a.health*.25)+(a.oxygen*.2)+(a.hydration*.15)+(a.nutrition*.15)+(a.comfort*.15)+((100-a.pain)*.1));
 let needs=[["OXYGEN",100-a.oxygen],["PAIN RELIEF",a.pain],["WATER",d.thirst],["SAFETY",100-d.safety],["FOOD",100-a.nutrition],["REST",d.fatigue]];
 needs.sort((x,y)=>y[1]-x[1]);d.currentNeed=needs[0][0];
 d.lastCause=cause||d.lastCause;
 let line=(cause||"RECALC")+" -> NEED "+d.currentNeed+" -> HANDLING "+d.handlingEase+"% -> RECOVERY "+d.recoveryDrive+"%";
 d.chains.unshift(new Date().toLocaleTimeString()+" · "+line);d.chains=d.chains.slice(0,20);

 if(a.oxygen<92)arr.push("LOW OXYGEN > health/recovery pressure");
 if(a.trust<45)arr.push("LOW TRUST > handling difficulty");

 return '<button data-rx="admit">[01] ADMIT TO CLINIC</button><button data-rx="queue">[02] PLACE IN WAITING QUEUE</button><button data-rx="back">[03] EDIT INTAKE</button><button data-rx="new">[04] NEW INTAKE</button>';
}
function ticket(d,a){
 let reporter=((d.reporterFirst+" "+d.reporterLast).trim()||"UNNAMED REPORTER");
 return "CASE: "+d.caseNo+"\nPATIENT: "+a.name+" / "+a.species+"\nREPORTED BY: "+reporter+" / "+d.relation+
 "\nARRIVAL: "+d.arrival+"\nPRIORITY: "+d.priority+"\nCONCERN: "+(d.concern||"NO CONCERN ENTERED")+
 "\nONSET: "+d.onset+"\n\nTRIAGE\nHealth "+a.health+"% / O2 "+a.oxygen+"% / Pain "+a.pain+"% / Hydration "+a.hydration+"% / Stress "+a.stress+"%"+
 "\n\nNEXT ROUTE: CLINIC.EXE";
}
function cmd(c){
 let r=state.reception,d=r.draft;if(!d)return;syncForm();let a=state.animals.find(x=>x.id===d.animalId)||A();
 if(c==="next"){d.stage=Math.min(4,d.stage+1);r.log.unshift(d.caseNo+" · INTAKE STEP "+ST[d.stage]);save();return renderReception()}
 if(c==="back"){d.stage=Math.max(0,d.stage-1);save();return renderReception()}
 if(c==="patient"){state.active=(state.active+1)%state.animals.length;d.animalId=A().id;r.log.unshift(d.caseNo+" · PATIENT CHANGED TO "+A().name);save();return renderReception()}
 if(c==="cancel"){r.log.unshift(d.caseNo+" · DRAFT CANCELLED");r.draft=null;save();newDraft();return renderReception()}
 if(c==="new"){r.draft=null;newDraft();return renderReception()}
 if(c==="queue"){
   r.queue.unshift({caseNo:d.caseNo,patient:a.name,animalId:a.id,priority:d.priority,reporter:(d.reporterFirst+" "+d.reporterLast).trim()||"UNNAMED",concern:d.concern||"NO CONCERN",time:Date.now()});
   r.completed.push({...d,status:"WAITING"});r.log.unshift(d.caseNo+" · PLACED IN WAITING QUEUE");r.draft=null;save();newDraft();return renderReception();
 }
 if(c==="admit"){
   d.admitted=true;a.stage="INTAKE";a.disposition="ACTIVE CASE";a.caseId=d.caseNo;
   a.reporter={first:d.reporterFirst,last:d.reporterLast,relation:d.relation,contact:d.phone};
   a.presentingConcern=d.concern;a.intakeNotes=d.notes;a.triagePriority=d.priority;a.arrivalMode=d.arrival;
   a.history=a.history||[];a.history.unshift(new Date().toLocaleTimeString()+" · RECEPTION ADMISSION "+d.caseNo+" · "+d.priority+" · "+(d.concern||"NO CONCERN"));
   r.completed.push({...d,status:"ADMITTED",patient:a.name});r.log.unshift(d.caseNo+" · ADMITTED TO CLINIC · "+a.name);r.draft=null;save();return open("care");
 }
}
const oldProgram=program;
program=function(k){if(k==="reception")return renderReception();return oldProgram(k)};
function addLink(){
 if(page!=="home"||document.querySelector("#rxHomeLink"))return;let cmds=document.querySelector(".p10-buttons");if(!cmds)return;
 let b=document.createElement("button");b.id="rxHomeLink";b.textContent="[08] RECEPTION.EXE";b.onclick=renderReception;cmds.appendChild(b);
}
const oldHome=home;home=function(){oldHome();addLink()};
ensureR();addLink();
window.VetGodsReception1={renderReception,newDraft};
})();
</script>

<script id="institution-p2-js">
(function(){
"use strict";
function A(){return state.animals[state.active]}
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const TESTS=[
 ["physical","PHYSICAL.EXE","Hands-on fictional exam and body-zone findings."],
 ["imaging","IMAGING.EXE","Generate a fictional imaging report."],
 ["lab","LAB.EXE","Run fictional blood/chemistry-style game values."],
 ["sample","SAMPLE.EXE","Catalog a case specimen for the record."],
 ["neuro","NEUROSCREEN.EXE","Read the existing fictional brain/behavior network."],
 ["review","EVIDENCE.EXE","Synthesize findings without forcing a diagnosis."]
];
function ensureD(){
 state.animals.forEach(a=>a.diagnostics=a.diagnostics||{runs:{},findings:[],samples:[],zones:{HEAD:"UNEXAMINED",CHEST:"UNEXAMINED",ABDOMEN:"UNEXAMINED",LIMBS:"UNEXAMINED",SKIN:"UNEXAMINED",NEURO:"UNEXAMINED"},evidence:0,uncertainty:100,review:"NOT REVIEWED"});
 save();
}
function finding(a,type,text,weight){
 a.diagnostics.findings.unshift({time:new Date().toLocaleTimeString(),type,text,weight});
 a.diagnostics.findings=a.diagnostics.findings.slice(0,30);
 a.diagnostics.evidence=clamp(a.diagnostics.evidence+weight);
 a.diagnostics.uncertainty=clamp(100-a.diagnostics.evidence*.72);
}
function meter(k,v){return '<div class="dx-meter"><span>'+k+'</span><div class="dx-bar"><i style="width:'+clamp(v)+'%"></i></div><b>'+clamp(v)+'%</b></div>'}
function renderDiagnostics(){
 ensureD();page="diagnostics";nav();let a=A(),d=a.diagnostics;
 document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\DIAGNOSTICS\\'+a.name.toUpperCase()+'&gt;</div>'+
 '<div class="dx"><h4>DIAGNOSTICS.EXE — '+a.caseId+'</h4><div class="dx-grid">'+
 card("PATIENT",a.icon+" "+a.name,a.species)+card("CONCERN",a.presentingConcern||"NO RECEPTION CONCERN","intake record")+
 card("TRIAGE",a.triagePriority||"NOT SET","reception priority")+card("CASE STAGE",a.stage,"current care stage")+'</div></div>'+
 '<div class="dx"><h4>BODY MAP</h4><div class="dx-body"><div class="dx-map">   /\\_/\\\\\n  ( o.o )\n   > ^ <\n\n[HEAD]\n[CHEST]\n[ABDOMEN]\n[LIMBS]\n[SKIN]\n[NEURO]</div><div class="dx-zones">'+Object.entries(d.zones).map(([k,v])=>'<div class="dx-zone"><b>'+k+'</b><small>'+v+'</small></div>').join("")+'</div></div></div>'+
 '<div class="dx"><h4>DIAGNOSTIC WORKSTATIONS</h4><div class="dx-btns">'+TESTS.map((t,i)=>'<button class="'+(d.runs[t[0]]?"done":"")+'" data-dx="'+t[0]+'">['+String(i+1).padStart(2,"0")+'] '+t[1]+'<small>'+t[2]+'</small></button>').join("")+'</div></div>'+
 '<div class="dx"><h4>CASE EVIDENCE STATE</h4>'+meter("EVIDENCE DEPTH",d.evidence)+meter("UNCERTAINTY",d.uncertainty)+'</div>'+
 '<div class="dx"><h4>FINDINGS</h4>'+(d.findings.length?d.findings.map(f=>'<div class="dx-find"><b>'+f.type+'</b><small>'+f.text+'</small><small>'+f.time+' · evidence +'+f.weight+'</small></div>').join(""):'<div class="dx-find">NO DIAGNOSTIC FINDINGS YET.</div>')+'</div>'+
 '<div class="dx"><h4>DEPARTMENT ROUTING</h4><div class="dx-btns"><button data-route="clinic">[C1] RETURN CLINIC</button><button data-route="brain">[C2] OPEN BRAIN.EXE</button><button data-route="reception">[C3] RECEPTION.EXE</button><button data-route="feedback">[C4] FEEDBACK.EXE</button></div></div>'+
 '<div class="out"><h4>DIAGNOSTIC OUTPUT</h4><pre id="out">'+d.review+'</pre></div>';
 document.querySelectorAll("[data-dx]").forEach(b=>b.onclick=()=>run(b.dataset.dx));
 document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>route(b.dataset.route));
}
function card(k,v,n){return '<div class="dx-card"><small>'+k+'</small><b>'+v+'</b><small>'+n+'</small></div>'}
function run(k){
 let a=A(),d=a.diagnostics;if(d.runs[k]&&k!=="review"){d.review=(k.toUpperCase()+" already completed. Existing result retained.");save();return renderDiagnostics()}
 if(k==="physical"){
  d.runs.physical=true;d.zones.HEAD=a.stress>65?"GUARDED RESPONSE":"NO MAJOR GAME FLAG";d.zones.CHEST=a.oxygen<93?"RESPIRATORY FLAG":"NO MAJOR GAME FLAG";d.zones.ABDOMEN=a.hydration<60?"HYDRATION FLAG":"NO MAJOR GAME FLAG";d.zones.LIMBS=a.pain>45?"GUARDED MOBILITY":"MOBILITY ACCEPTABLE";d.zones.SKIN=a.hydration<55?"DRYNESS FLAG":"NO MAJOR GAME FLAG";d.zones.NEURO=a.brain?.decision||"OBSERVE";
  finding(a,"PHYSICAL EXAM","Body zones examined. Current game stats generated targeted flags.",18);
 }
 if(k==="imaging"){
  d.runs.imaging=true;let txt=a.pain>55?"Fictional imaging flags a region for treatment review; no definitive diagnosis assigned.":"Fictional imaging shows no high-priority structural game flag.";
  finding(a,"IMAGING",txt,17);
 }
 if(k==="lab"){
  d.runs.lab=true;let hydrationMarker=clamp(100-a.hydration+35),stressMarker=clamp(a.stress),recoveryMarker=clamp(a.dynamic?.recoveryDrive||50);
  finding(a,"LAB PANEL","Sim values: hydration marker "+hydrationMarker+" / stress marker "+stressMarker+" / recovery marker "+recoveryMarker+".",20);
 }
 if(k==="sample"){
  d.runs.sample=true;let id="SP-"+a.caseId+"-"+String(d.samples.length+1).padStart(2,"0");d.samples.push({id,type:"FICTIONAL DIAGNOSTIC SPECIMEN",time:Date.now()});
  finding(a,"SPECIMEN",id+" catalogued and attached to this patient record.",12);
 }
 if(k==="neuro"){
  d.runs.neuro=true;d.zones.NEURO=(a.brain?.need||a.dynamic?.currentNeed||"OBSERVE")+" / "+(a.brain?.intent||"MONITOR");
  finding(a,"NEURO / BEHAVIOR SCREEN","Need "+(a.brain?.need||a.dynamic?.currentNeed||"OBSERVE")+"; intent "+(a.brain?.intent||"MONITOR ENVIRONMENT")+"; handling "+(a.dynamic?.handlingEase||50)+"%.",16);
 }
 if(k==="review"){
  let n=Object.keys(d.runs).length;
  d.runs.review=true;
  d.review="EVIDENCE REVIEW\nCompleted diagnostic modules: "+n+"/5 core modules\nEvidence depth: "+d.evidence+"%\nRemaining uncertainty: "+d.uncertainty+"%\n\n"+
  (n>=4?"CASE READY FOR TREATMENT-PLANNING DEPARTMENT.\nFindings are attached to the resident record.":"MORE DIAGNOSTIC WORK RECOMMENDED BY GAME LOGIC.\nComplete additional modules before treatment planning.")+
  "\n\nThis is fictional gameplay output, not real veterinary diagnosis.";
  finding(a,"EVIDENCE REVIEW",n>=4?"Diagnostic package substantially developed.":"Diagnostic package remains incomplete.",8);
 }
 a.history=a.history||[];a.history.unshift(new Date().toLocaleTimeString()+" · DIAGNOSTICS · "+k.toUpperCase());
 if(window.VetGodsDynamicStats5)window.VetGodsDynamicStats5.lifeEvent(a,"DIAGNOSTICS","Completed "+k.toUpperCase()+" in Diagnostics.");
 save();renderDiagnostics();
}
function route(k){
 if(k==="clinic")return open("care");
 if(k==="reception")return program("reception");
 if(k==="brain")return window.VetGodsDynamicStats2.renderBrain();
 if(k==="feedback")return window.VetGodsDynamicStats4.renderFeedback();
}
const oldProgram=program;
program=function(k){if(k==="diagnostics")return renderDiagnostics();return oldProgram(k)};
function addClinicLink(){
 if(page!=="care"||document.querySelector("#dxClinicLink"))return;let out=document.querySelector(".out");if(!out)return;
 let b=document.createElement("button");b.id="dxClinicLink";b.className="action";b.textContent="[DX] TRANSFER TO DIAGNOSTICS.EXE";b.onclick=renderDiagnostics;out.insertAdjacentElement("beforebegin",b);
}
const oldOpen=open;
open=function(k){let r=oldOpen(k);if(k==="care")addClinicLink();return r};
function addHome(){
 if(page!=="home"||document.querySelector("#dxHomeLink"))return;let cmds=document.querySelector(".p10-buttons");if(!cmds)return;
 let b=document.createElement("button");b.id="dxHomeLink";b.textContent="[09] DIAGNOSTICS.EXE";b.onclick=renderDiagnostics;cmds.appendChild(b);
}
const oldHome=home;home=function(){oldHome();addHome()};
ensureD();addHome();addClinicLink();
window.VetGodsDiagnostics2={renderDiagnostics,run};
})();
</script>

<script id="institution-p3-js">
(function(){
"use strict";
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
function A(){return state.animals[state.active]}
const OPTIONS=[
 ["oxygen","OXYGEN SUPPORT","Supports low oxygen game stat.",{oxygen:8,stress:-2},5],
 ["fluids","IV FLUID SUPPORT","Raises hydration and supports recovery.",{hydration:12,health:3},8],
 ["water","OFFER WATER","Gentle hydration option for stable residents.",{hydration:7,stress:-1},2],
 ["pain","PAIN CONTROL","Reduces fictional pain stat.",{pain:-12,stress:-4,trust:2},6],
 ["nutrition","NUTRITION SUPPORT","Raises nutrition/energy-related state.",{nutrition:10,health:2},4],
 ["comfort","COMFORT / CALMING","Reduces stress and improves trust.",{stress:-10,trust:6},3],
 ["mobility","ASSISTED MOBILITY","Supports mobility when condition allows.",{mobility:8,stress:-2},4],
 ["rest","PROTECTED REST","Allows recovery with reduced stimulation.",{stress:-6,health:4},2]
];
function ensureT(){
 state.animals.forEach(a=>{
  a.treatment=a.treatment||{plan:[],performed:[],reassessments:[],stage:0,readiness:0,last:"NO TREATMENT PLAN",route:"UNDECIDED"};
  if(a.nutrition==null)a.nutrition=65;if(a.mobility==null)a.mobility=65;
 });
 save();
}
function flow(t){return '<div class="tx-flow">'+["PLAN","PERFORM","REASSESS","ROUTE"].map((x,i)=>'<span class="'+(i<t.stage?"done":i===t.stage?"now":"")+'">'+(i<t.stage?"[X] ":i===t.stage?"[>] ":"[ ] ")+x+'</span>').join("")+'</div>'}
function meter(k,v){return '<div class="tx-meter"><span>'+k+'</span><div class="tx-bar"><i style="width:'+clamp(v)+'%"></i></div><b>'+clamp(v)+'%</b></div>'}
function renderTreatment(){
 ensureT();page="treatment";nav();let a=A(),t=a.treatment,d=a.diagnostics||{};
 let completed=Object.keys(d.runs||{}).filter(k=>k!=="review").length;
 document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\TREATMENT\\'+a.name.toUpperCase()+'&gt;</div>'+
 '<div class="tx"><h4>TREATMENT.EXE — '+a.caseId+'</h4><div class="tx-grid">'+
 card("PATIENT",a.icon+" "+a.name,a.species)+card("DIAGNOSTICS",completed+"/5 core modules",(d.evidence||0)+"% evidence depth")+
 card("CONCERN",a.presentingConcern||"NO CONCERN","reception record")+card("CURRENT ROUTE",t.route,"treatment disposition")+'</div></div>'+flow(t)+
 '<div class="tx"><h4>LIVE PATIENT STATE</h4>'+meter("HEALTH",a.health)+meter("OXYGEN",a.oxygen)+meter("HYDRATION",a.hydration)+meter("PAIN",100-a.pain)+meter("NUTRITION",a.nutrition)+meter("MOBILITY",a.mobility)+meter("CALM / STRESS",100-a.stress)+meter("TRUST",a.trust)+'</div>'+
 '<div class="tx"><h4>TREATMENT PLAN BUILDER</h4><div class="tx-btns">'+OPTIONS.map((o,i)=>'<button class="'+(t.plan.includes(o[0])?"on":"")+'" data-plan="'+o[0]+'">['+String(i+1).padStart(2,"0")+'] '+o[1]+' · '+o[4]+' CR<small>'+o[2]+'</small></button>').join("")+'</div></div>'+
 '<div class="tx"><h4>ACTIVE PLAN</h4>'+(t.plan.length?t.plan.map(k=>{let o=OPTIONS.find(x=>x[0]===k);return '<div class="tx-plan"><b>'+o[1]+'</b><small>'+(t.performed.includes(k)?"PERFORMED":"PLANNED / WAITING")+' · cost '+o[4]+' credits</small></div>'}).join(""):'<div class="tx-plan">NO INTERVENTIONS SELECTED.</div>')+'</div>'+
 '<div class="tx"><h4>TREATMENT COMMANDS</h4><div class="tx-btns"><button data-tx="perform">[P1] PERFORM NEXT PLANNED ACTION<small>Applies one intervention at a time.</small></button><button data-tx="reassess">[P2] REASSESS PATIENT<small>Recalculate connected systems and readiness.</small></button><button data-tx="clear">[P3] CLEAR UNPERFORMED PLAN<small>Performed care remains in history.</small></button><button data-tx="diagnostics">[P4] RETURN DIAGNOSTICS<small>Gather more evidence.</small></button></div></div>'+
 (t.stage>=2?'<div class="tx"><h4>DISPOSITION ROUTER</h4><div class="tx-btns"><button data-route="recovery">[R1] RECOVERY CANDIDATE</button><button data-route="surgery">[R2] SURGERY REVIEW</button><button data-route="diagnostics">[R3] MORE DIAGNOSTICS</button><button data-route="clinic">[R4] RETURN CLINIC</button></div></div>':'')+
 '<div class="out"><h4>TREATMENT OUTPUT</h4><pre id="out">'+t.last+'</pre></div>';
 document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>toggle(b.dataset.plan));
 document.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>cmd(b.dataset.tx));
 document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>route(b.dataset.route));
}
function card(k,v,n){return '<div class="tx-card"><small>'+k+'</small><b>'+v+'</b><small>'+n+'</small></div>'}
function toggle(k){
 let t=A().treatment;if(t.performed.includes(k))return;
 t.plan=t.plan.includes(k)?t.plan.filter(x=>x!==k):[...t.plan,k];t.stage=t.plan.length?1:0;t.last=(t.plan.length?"PLAN UPDATED.":"PLAN EMPTY.");save();renderTreatment();
}
function perform(){
 let a=A(),t=a.treatment,k=t.plan.find(x=>!t.performed.includes(x));if(!k){t.last="NO UNPERFORMED PLAN ACTIONS.";save();return}
 let o=OPTIONS.find(x=>x[0]===k),cost=o[4];
 if(typeof state.funds==="number"&&state.funds<cost){t.last="INSUFFICIENT CLINIC FUNDS FOR "+o[1]+".";save();return}
 if(typeof state.funds==="number")state.funds-=cost;
 Object.entries(o[3]).forEach(([stat,v])=>{if(a[stat]==null)a[stat]=50;a[stat]=clamp(a[stat]+v)});
 t.performed.push(k);t.stage=2;t.last=o[1]+" PERFORMED.\nCost: "+cost+" credits.\nConnected patient stats updated.";
 a.history=a.history||[];a.history.unshift(new Date().toLocaleTimeString()+" · TREATMENT · "+o[1]+" · -"+cost+" CR");
 if(window.VetGodsDynamicStats5)window.VetGodsDynamicStats5.lifeEvent(a,"TREATMENT",o[1]+" changed the continuing patient state.");
 save();
}
function reassess(){
 let a=A(),t=a.treatment;
 if(window.VetGodsDynamicStats1)window.VetGodsDynamicStats1.recalc(a,"TREATMENT REASSESS");
 if(window.VetGodsDynamicStats2)window.VetGodsDynamicStats2.compute(a,"TREATMENT REASSESS");
 let stable=(a.health*.2)+(a.oxygen*.2)+(a.hydration*.15)+((100-a.pain)*.15)+(a.nutrition*.1)+(a.mobility*.08)+((100-a.stress)*.07)+(a.trust*.05);
 t.readiness=clamp(stable);t.stage=3;
 let recommendation=t.readiness>=72?"RECOVERY CANDIDATE":a.pain>65||a.health<40?"SURGERY / ADVANCED REVIEW":"CONTINUE TREATMENT OR DIAGNOSTICS";
 t.route=recommendation;t.reassessments.unshift({time:Date.now(),readiness:t.readiness,route:recommendation});
 t.last="REASSESSMENT COMPLETE\nReadiness: "+t.readiness+"%\nSuggested game route: "+recommendation+"\nCurrent need: "+(a.dynamic?.currentNeed||"OBSERVE")+"\nBrain intent: "+(a.brain?.intent||"MONITOR");
 save();
}
function cmd(c){

<script id="institution-p18-js">
(function(){

const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));

function metrics(){

 let staff=st.staff?.length?st.staff.reduce((q,x)=>q+x.energy+x.morale,0)/(st.staff.length*2):70;
 let infra=([f.power,f.water,f.air,f.network,f.sterility,f.security].filter(x=>typeof x==="number").reduce((a,b)=>a+b,0)/( [f.power,f.water,f.air,f.network,f.sterility,f.security].filter(x=>typeof x==="number").length||1))||70;

 let research=Math.min(100,30+(rs.points||0));
 let response=Math.max(30,dp.reputation||30);
 return {staff:clamp(staff),infra:clamp(infra),care:clamp(care),habitat:clamp(habitat),research:clamp(research),response:clamp(response)};
}

 ensureO();page="operations";nav();let d=O(),m=metrics();d.readiness=clamp((m.staff+m.infra+m.care+m.habitat+m.research+m.response)/6);

 '<div class="oc"><h4>OPS.EXE — INSTITUTION COMMAND CENTER</h4><div class="oc-grid">'+card("COMMAND CYCLE",d.cycle,"institution-wide simulation step")+card("READINESS",d.readiness+"%","combined department state")+card("ACTIVE ORDERS",d.orders.filter(x=>x.status!=="COMPLETE").length,d.orders.length+" total orders")+card("ANIMAL POPULATION",state.animals.length,"persistent institutional cases")+'</div></div>'+

 if(c==="clear"){d.orders=d.orders.filter(x=>x.status!=="COMPLETE");d.last="COMPLETED COMMAND ORDERS ARCHIVED."}
 save();renderOperations();

(function(){

const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));

 ["rescue","DEEP RANGE RESCUE","Locate, stabilize and return a fictional animal case."],

 ["recovery","LOST RESIDENT RECOVERY","Track and safely recover a missing Sanctuary resident."],

 '<div class="mc"><h4>MISSION.EXE — EXPEDITION CONTROL</h4><div class="mc-grid">'+card("ACTIVE ANIMAL",a.icon+" "+a.name,a.species)+card("ACTIVE MISSION",m?m.id:"NONE",m?m.title:"mission board ready")+card("COMPLETED",d.completed,"persistent expedition history")+card("MISSION RANGE",d.range+"%","institution field capability")+'</div></div>'+

 (m?flow(m)+missionPanel(m,a):'')+
 '<div class="mc"><h4>FIELD SYSTEM SERVICE</h4><div class="mc-btns"><button data-mc="nav">[F1] CALIBRATE NAV · 4 CR</button><button data-mc="comms">[F2] SERVICE COMMS · 4 CR</button><button data-mc="supplies">[F3] RESTOCK FIELD KIT · 6 CR</button><button data-mc="range">[F4] RANGE UPGRADE · 10 CR</button></div></div>'+

 '<div class="mc"><h4>COMMAND ROUTING</h4><div class="mc-btns"><button data-mr="dispatch">DISPATCH</button><button data-mr="operations">OPS</button><button data-mr="research">RESEARCH</button><button data-mr="records">RECORDS</button><button data-mr="sanctuary2">SANCTUARY</button><button data-mr="clinic">CLINIC</button></div></div>'+

 document.querySelectorAll("[data-mnew]").forEach(b=>b.onclick=()=>newMission(b.dataset.mnew));

function esc(x){return String(x).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}

   if(m.phase===4){d.nav=clamp(d.nav-3);d.supplies=clamp(d.supplies-3)}
   m.phase++;m.progress=clamp(m.phase/PHASES.length*100);m.status=m.phase>=PHASES.length?"COMPLETE":PHASES[m.phase];

   else d.last=m.id+" ADVANCED\nCurrent phase: "+m.status+"\nProgress "+m.progress+"%";
 }

   id:x.id||("expanded-"+i+"-"+x.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")),
   caseId:x.caseId||("VG-X"+String(i+1).padStart(3,"0")),

 };

function install50(){

   let key=(x.name+"|"+x.species).toLowerCase();
   if(state.animals.length<50&&!existing.has(key)){state.animals.push(normalizeCase(x,i));existing.add(key)}
 });
 // If the historical roster + unique expansion is still below 50, derive distinct simulation cases.

 while(state.animals.length<50){
   let base=EXTRA_CASES[(n-1)%EXTRA_CASES.length],x=JSON.parse(JSON.stringify(base));

   state.animals.push(normalizeCase(x,EXTRA_CASES.length+n));n++;
 }
 // Never truncate a user's existing roster if it has already grown beyond 50.
 state.coreRosterVersion="50-PLAYABLE-CASES-V1";
 try{save()}catch(e){console.warn("50-case roster save deferred",e)}
}
install50();

<script id="rewards-pass4-js">
(function(){
"use strict";
const RANKS=[
 [0,"PROBATIONARY OPERATOR"],[100,"CLINIC OPERATOR"],[250,"FIELD TRAINEE"],[500,"INSTITUTION VETERAN"],
 [750,"SENIOR CASE OFFICER"],[1000,"COMMAND SPECIALIST"],[1500,"MASTER CARE OPERATOR"],[2500,"VET GODS COMMANDER"]
];
const MASTERIES=[
 ["M4-CLINIC","CLINICAL MASTERY","CARE-25","25-case clinical achievement","UNLOCK: SENIOR CLINIC DOS TITLE"],
 ["M4-RECOVERY","RECOVERY MASTERY","REC-15","Advanced rehabilitation achievement","UNLOCK: RECOVERY SPECIALIST TITLE"],
 ["M4-RESEARCH","RESEARCH MASTERY","RES-20","Deep archive/research achievement","UNLOCK: ARCHIVE ANALYST TITLE"],
 ["M4-SANCTUARY","SANCTUARY MASTERY","SAN-20","Advanced sanctuary stewardship","UNLOCK: SANCTUARY GUARDIAN TITLE"],
 ["M4-FIELD","FIELD MASTERY","MIS-15","Advanced mission achievement","UNLOCK: DEEP RANGE TITLE"],
 ["M4-SPECIES","SPECIES MASTERY","SPEC-50","Work across the 50-animal roster","UNLOCK: FIFTY SPECIES TITLE"],
 ["M4-COMMAND","COMMAND MASTERY","XP-1000","Reach 1,000 XP","UNLOCK: COMMAND SPECIALIST TITLE"]
];
function ensure4(){
 state.masterySystem=state.masterySystem||{awards:[],graduated:false,graduation:null,title:"OPERATOR",lastScan:null};
 try{save()}catch(e){}
}
function M(){return state.masterySystem}
function esc4(x){return String(x).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function name4(){return window.VetGodsRewards?window.VetGodsRewards.fullName():"UNREGISTERED PLAYER"}
function badge4(id){return !!state.rewardSystem?.badges?.some(x=>x.id===id)}
function rank4(){
 let xp=Number(state.rewardSystem?.xp||0),r=RANKS[0];
 RANKS.forEach(x=>{if(xp>=x[0])r=x});return r;
}
function scan4(){
 ensure4();if(window.VetGodsBadges2)window.VetGodsBadges2.check();
 let m=M();
 MASTERIES.forEach(x=>{
   if(badge4(x[2])&&!m.awards.some(a=>a.id===x[0])){
     m.awards.push({id:x[0],title:x[1],recipient:name4(),date:new Date().toLocaleDateString(),unlock:x[4]});
     if(state.rewardSystem)state.rewardSystem.history.unshift(new Date().toLocaleString()+" · MASTERY AWARD · "+x[1]+" · "+name4());
   }
 });
 let rk=rank4();m.title=rk[1];m.lastScan=new Date().toLocaleString();
 try{save()}catch(e){}
}
function eligibleGrad(){
 let m=M();
 return MASTERIES.filter(x=>x[0]!=="M4-COMMAND").every(x=>m.awards.some(a=>a.id===x[0])) &&
        badge4("XP-1000");
}
function graduate(){
 scan4();
 if(!state.playerProfile?.firstName||!state.playerProfile?.lastName){alert("REGISTER FIRST AND LAST NAME IN REWARD_CORE.EXE FIRST.");return}
 if(!eligibleGrad()){alert("MASTER PROGRAM REQUIREMENTS ARE NOT COMPLETE YET.");return}
 let m=M();
 if(!m.graduated){
   m.graduated=true;
   m.graduation={recipient:name4(),date:new Date().toLocaleDateString(),
     id:"VG-MASTER-"+new Date().getFullYear()+"-"+String(Date.now()).slice(-6),
     title:"VET GODS MASTER PROGRAM COMPLETION",
     sig1:"DR. K. NIX // PROGRAM DIRECTOR",sig2:"VET GODS // COMMAND REGISTRAR"};
   if(window.VetGodsRewards)window.VetGodsRewards.awardXP(250,"MASTER PROGRAM GRADUATION");
 }
 try{save()}catch(e){}renderMastery();
}
function renderMastery(){
 ensure4();scan4();page="mastery4";nav();let m=M(),r=state.rewardSystem||{},rk=rank4();
 let next=RANKS.find(x=>x[0]>Number(r.xp||0)),pct=next?Math.min(100,Math.round((r.xp-(rk[0]||0))/(next[0]-rk[0])*100)):100;
 document.querySelector("#main").innerHTML=
 '<div class="path">C:\\VETGODS\\REWARDS\\MASTERY&gt;</div>'+
 '<div class="m4"><h4>MASTERY_COMMAND.EXE // PASS 4 OF 4</h4>'+
 '<div class="m4-rank"><small>CURRENT INSTITUTIONAL RANK</small><strong>'+esc4(rk[1])+'</strong>'+
 esc4(name4())+'<div class="m4-meter"><i style="width:'+pct+'%"></i></div><small>'+r.xp+' XP'+(next?' // NEXT: '+next[1]+' @ '+next[0]+' XP':' // MAXIMUM RANK')+'</small></div></div>'+
 '<div class="m4"><h4>MASTER SPECIALTIES</h4>'+
 MASTERIES.map(x=>award4(x,m)).join("")+'</div>'+
 '<div class="m4"><h4>COMMAND SCORECARD</h4><div class="m4-grid">'+
 card4("MASTERY AWARDS",m.awards.length+" / "+MASTERIES.length,"Permanent named mastery records")+
 card4("BADGES",r.badges?.length||0,"Pass 2 achievement cabinet")+
 card4("CERTIFICATES",state.certificateSystem?.issued?.length||0,"Pass 3 certificate archive")+
 card4("SPECIES",r.visitedAnimals?.length||0,"Unique animal cases accessed")+
 '</div></div>'+
 '<div class="m4"><h4>MASTER PROGRAM</h4><div class="m4-term">'+
 'CLINICAL MASTERY .... '+yn("M4-CLINIC")+'\nRECOVERY MASTERY .... '+yn("M4-RECOVERY")+
 '\nRESEARCH MASTERY .... '+yn("M4-RESEARCH")+'\nSANCTUARY MASTERY ... '+yn("M4-SANCTUARY")+
 '\nFIELD MASTERY ....... '+yn("M4-FIELD")+'\n50-SPECIES MASTERY ... '+yn("M4-SPECIES")+
 '\n1,000 XP BADGE ...... '+(badge4("XP-1000")?"COMPLETE":"INCOMPLETE")+
 '\n\nGRADUATION STATUS ... '+(m.graduated?"GRADUATED":eligibleGrad()?"ELIGIBLE":"REQUIREMENTS INCOMPLETE")+'</div>'+
 '<div class="m4-btns"><button id="m4scan">[F5] SCAN MASTERY<small>Checks badges and specialty milestones.</small></button>'+
 '<button id="m4grad" '+(eligibleGrad()&&!m.graduated?"":"disabled")+'>[G] COMPLETE MASTER PROGRAM<small>Issues the final named graduation record.</small></button>'+
 '<button id="m4badges">[B] BADGES</button><button id="m4certs">[C] CERTIFICATES</button></div></div>'+
 (m.graduated?gradView(m.graduation):'');
 document.querySelector("#m4scan").onclick=()=>{scan4();renderMastery()};
 document.querySelector("#m4grad").onclick=graduate;
 document.querySelector("#m4badges").onclick=()=>program("badges2");
 document.querySelector("#m4certs").onclick=()=>program("certificates3");
 let p=document.querySelector("#m4print");if(p)p.onclick=()=>window.print();
}
function yn(id){return M().awards.some(x=>x.id===id)?"COMPLETE":"INCOMPLETE"}
function card4(k,v,n){return '<div class="m4-card"><small>'+k+'</small><b>'+esc4(v)+'</b><small>'+esc4(n)+'</small></div>'}
function award4(x,m){
 let a=m.awards.find(y=>y.id===x[0]);
 return '<div class="m4-award '+(a?"":"m4-lock")+'"><small>'+x[0]+'</small><strong>'+x[1]+'</strong>'+
 (a?esc4(a.recipient)+'<br><small>'+esc4(a.date)+'</small><br><small>'+esc4(a.unlock)+'</small>':'LOCKED<br><small>REQUIRES '+x[2]+'</small><br><small>'+x[3]+'</small>')+'</div>';
}
function gradView(g){
 return '<div class="m4"><h4>MASTER GRADUATION RECORD</h4><div class="m4-grad"><div>[ VET GODS // MASTER SEAL ]</div>'+
 '<h2>'+esc4(g.title)+'</h2><div>THE FICTIONAL TRAINING PROGRAM RECORDS THE COMPLETION OF</div>'+
 '<div class="name">'+esc4(g.recipient)+'</div><div>CLINICAL CARE • RECOVERY • RESEARCH • SANCTUARY<br>FIELD OPERATIONS • FIFTY-ANIMAL CASE STUDIES • COMMAND MASTERY</div>'+
 '<p>DATE: '+esc4(g.date)+'<br>MASTER RECORD: '+esc4(g.id)+'</p><br>'+esc4(g.sig1)+'<br><br>'+esc4(g.sig2)+'</div>'+
 '<div class="m4-btns"><button id="m4print">[P] PRINT / SAVE MASTER RECORD</button></div></div>';
}
const oldProgram4=program;program=function(k){if(k==="mastery4")return renderMastery();return oldProgram4(k)};
function add4(){
 if(page!=="home"||document.querySelector("#m4Home"))return;
 let c=document.querySelector(".p10-buttons");if(!c)return;
 let b=document.createElement("button");b.id="m4Home";b.textContent="[35] MASTERY_COMMAND.EXE";b.onclick=renderMastery;c.appendChild(b);
}
const oldHome4=home;home=function(){oldHome4();scan4();add4()};
ensure4();scan4();add4();
window.VetGodsMastery4={render:renderMastery,scan:scan4,graduate:graduate};
})();
</script>

<script id="myanimals-phase1-js">
(function(){
"use strict";
function ensureMA1(){
 state.myAnimalsRegistry=state.myAnimalsRegistry||{selected:null,sort:"RECENT",filter:"ALL",opened:[],lastOpen:null};
 try{save()}catch(e){}
}
function D(){return state.myAnimalsRegistry}
function esc(x){return String(x??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function worked(a){
 return !!(a.caseId||a.history?.length||a.disposition==="ACTIVE CASE"||a.stage!=="INTAKE"||a.sanctuary?.resident);
}
function registry(){
 let arr=(state.animals||[]).map((a,i)=>({a,i})).filter(x=>worked(x.a));
 // Do not strand a fresh save with an empty registry: active animal is always available.
 if(!arr.length&&state.animals?.length)arr=[{a:state.animals[state.active||0],i:state.active||0}];
 let f=D().filter;
 if(f==="SANCTUARY")arr=arr.filter(x=>x.a.sanctuary?.resident);
 if(f==="CLINIC")arr=arr.filter(x=>x.a.disposition==="ACTIVE CASE"||x.a.stage==="INTAKE");
 if(f==="RECOVERY")arr=arr.filter(x=>String(x.a.stage||"").toUpperCase().includes("RECOV"));
 if(D().sort==="NAME")arr.sort((x,y)=>x.a.name.localeCompare(y.a.name));
 if(D().sort==="HEALTH")arr.sort((x,y)=>Number(x.a.health)-Number(y.a.health));
 return arr;
}
function loc(a){
 if(a.sanctuary?.resident)return "SANCTUARY";
 if(String(a.stage||"").toUpperCase().includes("RECOV"))return "RECOVERY";
 if(a.disposition==="ACTIVE CASE"||a.stage==="INTAKE")return "CLINIC";
 return a.disposition||a.stage||"ARCHIVE";
}
function last(a){return a.history?.[0]||"NO HISTORY ENTRY"}
function stat(k,v,invert){
 v=Math.max(0,Math.min(100,Number(v??0)));
 let good=invert?100-v:v;
 return '<div class="ma1-stat"><b>'+k+'</b><div class="ma1-meter"><i style="width:'+v+'%"></i></div><span>'+Math.round(v)+'</span></div>';
}
function renderMA1(){
 ensureMA1();page="myanimals1";nav();let d=D(),list=registry();
 let chosen=d.selected!=null?state.animals[d.selected]:null;
 if(chosen&&!state.animals.includes(chosen))chosen=null;
 document.querySelector("#main").innerHTML=
 '<div class="path">C:\\VETGODS\\MY_ANIMALS&gt;</div>'+
 '<div class="ma1"><h4>MY_ANIMALS.EXE // RETURNING ANIMAL REGISTRY // PHASE 1 OF 5</h4><div class="ma1-grid">'+
 card("AVAILABLE RECORDS",list.length,"Previously worked / currently active animals")+
 card("SELECTED",chosen?chosen.name:"NONE","One animal opens at a time")+
 card("SORT",d.sort,"Registry ordering")+
 card("FILTER",d.filter,"Registry location filter")+
 '</div><div class="ma1-btns">'+
 '<button data-masort="RECENT">[R] RECENT</button><button data-masort="NAME">[N] NAME</button>'+
 '<button data-masort="HEALTH">[H] LOW HEALTH FIRST</button><button data-mafilter="ALL">[*] ALL</button>'+
 '<button data-mafilter="CLINIC">[C] CLINIC</button><button data-mafilter="RECOVERY">[V] RECOVERY</button>'+
 '<button data-mafilter="SANCTUARY">[S] SANCTUARY</button><button id="maRefresh">[F5] REFRESH RECORDS</button>'+
 '</div></div>'+
 '<div class="ma1"><h4>ANIMAL RECORD DIRECTORY</h4><div class="ma1-list">'+
 (list.length?list.map(x=>row(x.a,x.i,d.selected===x.i)).join(""):'<div class="ma1-row">NO MATCHING SAVED ANIMALS.</div>')+
 '</div></div>'+
 (chosen?detail(chosen,d.selected):'<div class="ma1"><h4>PATIENT FILE VIEWER</h4><div class="ma1-record">SELECT ONE ANIMAL ABOVE.\n\nThe registry deliberately opens only one animal record at a time.</div></div>');
 bind();
}
function row(a,i,on){
 return '<button class="'+(on?"on":"")+'" data-maanimal="'+i+'">['+String(i+1).padStart(2,"0")+'] '+esc(a.name).toUpperCase()+
 '<small>'+esc(a.species)+' / '+esc(a.breed||a.species)+' · '+esc(loc(a))+
 ' · H:'+Math.round(a.health??0)+' P:'+Math.round(a.pain??0)+' HYD:'+Math.round(a.hydration??0)+
 ' NUT:'+Math.round(a.nutrition??a.food??0)+' STR:'+Math.round(a.stress??0)+' TRUST:'+Math.round(a.trust??0)+'</small></button>';
}
function detail(a,i){
 let traits=Array.isArray(a.personality)?a.personality:(Array.isArray(a.traits)?a.traits:[]);
 return '<div class="ma1"><h4>SELECTED ANIMAL // '+esc(a.name).toUpperCase()+'</h4>'+
 '<div class="ma1-card"><div class="ma1-name">'+esc(a.name)+'</div><small>'+esc(a.species)+' · '+esc(a.breed||a.species)+' · '+esc(a.sex||"U")+' · '+esc(a.age||"AGE UNKNOWN")+'</small>'+
 '<div>'+traits.map(x=>'<span class="ma1-tag">'+esc(x)+'</span>').join("")+'</div></div>'+
 stat("HEALTH",a.health)+stat("OXYGEN",a.oxygen)+stat("HYDRATION",a.hydration)+
 stat("NUTRITION",a.nutrition??a.food)+stat("MOBILITY",a.mobility)+stat("TRUST",a.trust)+
 stat("COMFORT",a.comfort)+stat("PAIN",a.pain,true)+stat("STRESS",a.stress,true)+
 '<div class="ma1-grid">'+
 card("LOCATION",loc(a),"Current saved program location")+
 card("CASE ID",a.caseId||"NO CASE NUMBER","Persistent case reference")+
 card("CONCERN",a.presentingConcern||"No current concern","Current / most recent presenting concern")+
 card("LAST RECORD",last(a),"Most recent animal-history entry")+
 '</div><div class="ma1-btns">'+
 '<button id="maOpenCare">[ENTER] OPEN THIS ANIMAL IN CARE<small>Makes '+esc(a.name)+' active and opens the existing CARE system.</small></button>'+
 '<button id="maRoster">[50] OPEN FULL CASE ROSTER<small>Go to the 50-case selector.</small></button>'+
 '</div></div>'+
 '<div class="ma1"><h4>QUICK RECORD</h4><div class="ma1-record">'+
 'TEMPERAMENT ... '+esc(a.temperament||"NOT RECORDED")+'\nBACKSTORY ...... '+esc(a.backstory||"NOT RECORDED")+
 '\nCONCERN ........ '+esc(a.presentingConcern||"NONE")+'\nSTAGE .......... '+esc(a.stage||"UNKNOWN")+
 '\nDISPOSITION .... '+esc(a.disposition||"UNKNOWN")+'\n\nRECENT HISTORY:\n'+
 esc((a.history||[]).slice(0,8).join("\n")||"NO HISTORY YET.")+'</div></div>';
}
function card(k,v,n){return '<div class="ma1-card"><small>'+k+'</small><b>'+esc(v)+'</b><small>'+esc(n)+'</small></div>'}
function bind(){
 let d=D();
 document.querySelectorAll("[data-maanimal]").forEach(b=>b.onclick=()=>{
   d.selected=+b.dataset.maanimal;d.lastOpen=Date.now();
   let a=state.animals[d.selected],id=a.id||a.name+"|"+a.species;
   if(!d.opened.includes(id))d.opened.push(id);
   try{save()}catch(e){}renderMA1()
 });
 document.querySelectorAll("[data-masort]").forEach(b=>b.onclick=()=>{d.sort=b.dataset.masort;renderMA1()});
 document.querySelectorAll("[data-mafilter]").forEach(b=>b.onclick=()=>{d.filter=b.dataset.mafilter;renderMA1()});
 let rf=document.querySelector("#maRefresh");if(rf)rf.onclick=renderMA1;
 let care=document.querySelector("#maOpenCare");if(care)care.onclick=()=>{
   state.active=d.selected;let a=state.animals[state.active];
   a.history=Array.isArray(a.history)?a.history:[];
   a.history.unshift(new Date().toLocaleTimeString()+" · RETURNED FROM MY_ANIMALS REGISTRY");
   open("care");try{save()}catch(e){}
 };
 let roster=document.querySelector("#maRoster");if(roster)roster.onclick=()=>window.VetGodsCaseRoster50?.render();
}
const oldProgramMA=program;program=function(k){if(k==="myanimals1")return renderMA1();return oldProgramMA(k)};
function addMA(){
 if(page!=="home"||document.querySelector("#maHome"))return;
 let c=document.querySelector(".p10-buttons");if(!c)return;
 let b=document.createElement("button");b.id="maHome";b.textContent="[36] MY_ANIMALS.EXE";b.onclick=renderMA1;c.insertBefore(b,c.firstChild);
}
const oldHomeMA=home;home=function(){oldHomeMA();addMA()};
ensureMA1();addMA();
window.VetGodsMyAnimals1={render:renderMA1};
})();
</script>

<script id="myanimals-phase2-js">
(function(){
"use strict";
function ensure2(){
 state.myAnimalsDeep=state.myAnimalsDeep||{tab:"OVERVIEW",notes:{}};
 try{save()}catch(e){}
}
function D2(){return state.myAnimalsDeep}

function A2(){let i=state.myAnimalsRegistry?.selected;return Number.isInteger(i)?state.animals?.[i]:null}
function targets(k){
 const t={health:[80,100],oxygen:[95,100],hydration:[65,90],nutrition:[60,90],mobility:[70,100],trust:[60,100],comfort:[65,100],pain:[0,20],stress:[0,35]};
 return t[k]||[0,100];

function flag(k,v){
 let t=targets(k),inverse=(k==="pain"||k==="stress");
 if(inverse)return v<=t[1]?"TARGET":v<=50?"WATCH":"HIGH";
 return v>=t[0]?"TARGET":v>=Math.max(0,t[0]-20)?"WATCH":"LOW";
}
function stat2(k,v){
 v=Math.max(0,Math.min(100,Number(v??0)));let t=targets(k),f=flag(k,v);
 return '<div class="ma2-stat"><b>'+k.toUpperCase()+'</b><div class="ma2-meter"><i style="width:'+v+'%"></i></div><span>'+Math.round(v)+' <small>'+f+'</small></span></div>'+
 '<div class="ma2-line ma2-target">SIMULATED TARGET RANGE: '+t[0]+'–'+t[1]+'</div>';
}
function renderDeep(){
 ensure2();let a=A2();
 if(!a){if(window.VetGodsMyAnimals1)return window.VetGodsMyAnimals1.render();return}
 page="myanimals2";nav();let d=D2(),tabs=["OVERVIEW","VITALS","CASE HISTORY","DIAGNOSTICS","CARE RECORD","PERSONALITY","SANCTUARY","NOTES"];
 document.querySelector("#main").innerHTML=
 '<div class="path">C:\\VETGODS\\MY_ANIMALS\\'+E(a.name).toUpperCase().replace(/ /g,"_")+'\\RECORD&gt;</div>'+
 '<div class="ma2"><h4>ANIMAL_RECORD.EXE // PHASE 2 OF 5</h4><div class="ma2-grid">'+

<script id="clear-first-run-js">
(function(){
"use strict";
const KEY="vetgods_first_game_route_v2";
function R(){try{return Object.assign({step:0,complete:false},JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return{step:0,complete:false}}}
function SR(r){try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}}
function vis(x){if(!x)return false;let r=x.getBoundingClientRect(),c=getComputedStyle(x);return c.display!=="none"&&c.visibility!=="hidden"&&r.width>0&&r.height>0}
function all(){return [...document.querySelectorAll("button,a,[role=button],input[type=button],input[type=submit]")].filter(vis)}
function txt(rx){return all().find(x=>rx.test((x.innerText||x.value||x.textContent||"").trim()))}
function nameInput(){return [...document.querySelectorAll("input")].find(x=>vis(x)&&/first.?name|player.?name|operator.?name/i.test((x.id||"")+" "+(x.name||"")+" "+(x.placeholder||"")))}
function lastInput(){return [...document.querySelectorAll("input")].find(x=>vis(x)&&/last.?name|surname/i.test((x.id||"")+" "+(x.name||"")+" "+(x.placeholder||"")))}
function targetFor(step){
 if(step===0)return nameInput()||lastInput()||txt(/SAVE PLAYER|BEGIN|START|CONTINUE/i);
 if(step===1)return txt(/NEW CASE|ADMIT PATIENT|INTAKE|START CASE/i);
 if(step===2)return txt(/ACCEPT|ADMIT|INTAKE|BEGIN EXAM|PHYSICAL EXAM|DIAGNOST/i);
 if(step===3)return document.querySelector("[data-ma3='monitor']")||txt(/MONITOR|BIO.?SCAN|PHYSICAL EXAM|DIAGNOST/i);
 if(step===4)return document.querySelector("[data-ma3='water']")||document.querySelector("[data-ma3='oxygen']")||document.querySelector("[data-ma3='pain']")||txt(/WATER|OXYGEN|PAIN CONTROL|STABIL/i);
 if(step===5)return txt(/TREAT|PROCEDURE|SURGERY|DEFINITIVE/i);
 if(step===6)return txt(/RECOVERY|OBSERVATION|REHAB/i);
 if(step===7)return txt(/DISCHARGE|SEND HOME|SANCTUARY|MY PETS|COMPLETE CASE/i);
 if(step===8)return txt(/CERTIFICATE|CERTS|AWARD|BADGE/i);
 if(step===9)return txt(/NEW CASE|NEXT PATIENT|NEXT ANIMAL|ADMIT PATIENT/i);
 return null;
}
const STEPS=[
 ["PLAYER","Enter/save your Player 1 name."],
 ["NEW CASE","Start the first animal case."],
 ["INTAKE","Accept the animal and begin the exam."],
 ["DIAGNOSTICS","Examine/scan and collect evidence."],
 ["STABILIZE","Handle oxygen, water, pain and immediate needs."],
 ["TREAT","Perform the appropriate treatment."],
 ["RECOVERY","Move the animal into recovery/observation."],
 ["FINISH","Discharge, sanctuary, adoption or completed disposition."],
 ["AWARD","View/print the earned badge or certificate."],
 ["NEXT ANIMAL","Start the next patient. The normal game loop now repeats."]
];
function infer(){
 let r=R(),p=String(page||"").toLowerCase();
 if(r.complete)return r;
 if(p.includes("printcert")||p.includes("printbadge"))r.step=Math.max(r.step,8);
 else if(p.includes("recover"))r.step=Math.max(r.step,6);
 else if(p.includes("myanimals3")||p==="care")r.step=Math.max(r.step,3);
 else if(p.includes("case")||p.includes("intake"))r.step=Math.max(r.step,2);
 SR(r);return r;
}
function panel(){
 let r=infer();if(r.complete)return;
 let main=document.querySelector("#main");if(!main)return;
 document.querySelector("#vgFirstRunRoute")?.remove();
 let t=targetFor(r.step),wrap=document.createElement("div");wrap.id="vgFirstRunRoute";
 wrap.innerHTML='<div class="vgFRHead">FIRST GAME ROUTE // STEP '+(r.step+1)+' OF 10</div>'+
 '<div class="vgFRSteps">'+STEPS.map((x,i)=>'<div class="vgFRStep '+(i<r.step?"done":i===r.step?"now":"")+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div>'+
 '<div class="vgFRCommand"><strong>NEXT: '+STEPS[r.step][0]+'</strong>'+STEPS[r.step][1]+
 (t?'<button id="vgFRGo">[GO TO NEXT STEP] '+(t.innerText||t.value||"CONTINUE").trim().slice(0,60)+'</button>':'<div class="vgFRMini">Complete the highlighted action on this screen. The route updates automatically.</div>')+
 '<div class="vgFRMini">The optional yellow GUIDE switch can still be turned OFF. This route panel remains as a simple map until the first full loop is finished.</div></div>';
 let path=main.querySelector(".path");if(path)path.insertAdjacentElement("afterend",wrap);else main.prepend(wrap);
 if(t){
   let go=wrap.querySelector("#vgFRGo");go.onclick=()=>{try{t.scrollIntoView({behavior:"smooth",block:"center"})}catch(e){};t.click()};
 }
}
function advanceFromClick(e){
 let r=R(),q=(e.target.closest("button,a,[role=button]")?.innerText||"").toUpperCase();
 if(r.complete)return;
 if(r.step===0&&/SAVE|BEGIN|START|CONTINUE/.test(q))r.step=1;
 else if(r.step===1&&/NEW CASE|ADMIT PATIENT|INTAKE|START CASE/.test(q))r.step=2;
 else if(r.step===2&&/ACCEPT|ADMIT|INTAKE|EXAM|DIAGNOST/.test(q))r.step=3;
 else if(r.step===3&&/MONITOR|SCAN|EXAM|DIAGNOST/.test(q))r.step=4;
 else if(r.step===4&&/WATER|OXYGEN|PAIN|STABIL/.test(q))r.step=5;
 else if(r.step===5&&/TREAT|PROCEDURE|SURGERY/.test(q))r.step=6;
 else if(r.step===6&&/RECOVERY|OBSERVATION|REHAB/.test(q))r.step=7;
 else if(r.step===7&&/DISCHARGE|SEND HOME|SANCTUARY|MY PETS|COMPLETE/.test(q))r.step=8;
 else if(r.step===8&&/CERTIFICATE|CERTS|AWARD|BADGE/.test(q))r.step=9;
 else if(r.step===9&&/NEW CASE|NEXT PATIENT|NEXT ANIMAL|ADMIT PATIENT/.test(q)){r.complete=true}
 SR(r);setTimeout(panel,180);
}
document.addEventListener("click",advanceFromClick,false);
document.addEventListener("input",()=>setTimeout(panel,250),false);
const oh=home;home=function(){let z=oh();setTimeout(panel,200);return z};
setTimeout(panel,450);
window.VetGodsFirstGameRoute={show:panel,reset:function(){localStorage.removeItem(KEY);panel()},state:R};
})();
</script>

<script id="career-stage1-js">
(function(){
"use strict";
const KEY="vetgods_player_career_v1";
const ranks=[
 ["TRAINEE",0],["CARE OPERATOR",150],["FIELD VETERAN",400],["SANCTUARY SPECIALIST",800],["APEX CARE COMMANDER",1400]
];
function load(){
 let base={xp:0,level:1,cases:0,animalsHelped:0,perfectCases:0,creditsEarned:0,specialization:"GENERAL ANIMAL CARE",callsign:"CARE-1",log:[],lastCaseKey:""};
 try{return Object.assign(base,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return base}
}
function save(c){try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}
function esc(x){return String(x??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function name(){
 let p=state.playerProfile||state.player||{};
 return [p.firstName,p.lastName].filter(Boolean).join(" ").trim()||state.rewardSystem?.playerName||"PLAYER 1";
}
function rank(c){
 let i=0;for(let n=0;n<ranks.length;n++)if(c.xp>=ranks[n][1])i=n;
 return {i,name:ranks[i][0],next:ranks[Math.min(i+1,ranks.length-1)][1]};
}
function sync(){
 let c=load(),animals=Array.isArray(state.animals)?state.animals:[];
 let completed=animals.filter(a=>/discharg|complete|sanctuary|adopt|home/i.test(String(a.stage||a.disposition||a.status||""))).length;
 if(completed>c.cases){
   let gain=(completed-c.cases)*100;c.xp+=gain;c.animalsHelped+=completed-c.cases;c.cases=completed;
   c.log.unshift("+"+gain+" XP // completed animal-care case recorded");
 }
 c.level=rank(c).i+1;save(c);return c;
}
function cell(k,v){return '<div class="vgCareerCell"><small>'+esc(k)+'</small><b>'+esc(v)+'</b></div>'}
function panel(){
 let c=sync(),r=rank(c),next=r.i===ranks.length-1?c.xp:r.next,prev=ranks[r.i][1],pct=r.i===ranks.length-1?100:Math.max(0,Math.min(100,(c.xp-prev)/(next-prev)*100));
 return '<div class="vgCareer" id="vgCareerPanel"><div class="vgCareerHead">PLAYER CAREER CORE // GAMEFLOW STAGE 1 OF 10</div>'+
 '<div class="vgCareerGrid">'+cell("PLAYER",name())+cell("CALLSIGN",c.callsign)+cell("CAREER RANK",r.name)+cell("LEVEL",c.level)+
 cell("CAREER XP",c.xp)+cell("CASES COMPLETED",c.cases)+cell("ANIMALS HELPED",c.animalsHelped)+cell("SPECIALIZATION",c.specialization)+'</div>'+
 '<div class="vgXPTrack"><i style="width:'+pct+'%"></i></div>'+
 '<div class="vgCareerRanks">'+ranks.map((x,i)=>'<div class="'+(i<r.i?"done":i===r.i?"now":"")+'">'+x[0]+'<br>'+x[1]+' XP</div>').join("")+'</div>'+
 '<div class="vgCareerActions"><button data-career="case">[N] NEW CASE</button><button data-career="animals">[A] MY ANIMALS</button><button data-career="awards">[R] AWARDS</button><button data-career="card">[I] ID CARD</button></div></div>';
}
function render(){
 page="career";nav();
 document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\PLAYER\\CAREER&gt;</div>'+panel()+
 '<div class="vgCareer"><div class="vgCareerHead">CAREER ACTIVITY LOG</div><div class="vgCareerLog">'+esc(load().log.slice(0,20).join("\n")||"No completed career events yet. Start the first guided animal case.")+'</div></div>';
 wire(document.querySelector("#vgCareerPanel"));
}
function card(){
 let c=sync(),r=rank(c);
 page="careerid";nav();document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\PLAYER\\IDENTITY_CARD&gt;</div>'+
 '<div class="vgCareerCard"><small>VET GODS // APEX INTERVENTION COMMAND</small><div class="vgCareerSeal">VG<br>ID</div><h3>'+esc(name())+'</h3>'+
 '<div>CALLSIGN: '+esc(c.callsign)+'</div><div>RANK: '+esc(r.name)+'</div><div>LEVEL: '+c.level+' // XP: '+c.xp+'</div><div>SPECIALIZATION: '+esc(c.specialization)+'</div>'+
 '<br><small>FICTIONAL PLAYER CAREER IDENTIFICATION</small></div><div class="vgCareerActions"><button id="cidBack">[ESC] CAREER</button></div>';
 document.querySelector("#cidBack").onclick=render;
}
function wire(el){
 if(!el)return;
 el.querySelector('[data-career="case"]').onclick=()=>{
   let b=[...document.querySelectorAll("button")].find(x=>/NEW CASE|ADMIT PATIENT|START CASE/i.test(x.textContent||""));
   if(b)b.click();else home();
 };
 el.querySelector('[data-career="animals"]').onclick=()=>window.VetGodsMyAnimals1?.render();
 el.querySelector('[data-career="awards"]').onclick=()=>window.VetGodsCertificatePrinter?.render();
 el.querySelector('[data-career="card"]').onclick=card;
}
const op=program;program=function(k){if(k==="career")return render();return op(k)}
function homeLink(){
 if(page!=="home"||document.querySelector("#vgCareerHome"))return;
 let c=document.querySelector(".p10-buttons");if(!c)return;
 let b=document.createElement("button");b.id="vgCareerHome";b.textContent="[49] PLAYER_CAREER.EXE";b.onclick=render;c.appendChild(b);
}
const oh=home;home=function(){let r=oh();homeLink();return r};homeLink();
document.addEventListener("click",function(e){
 let q=(e.target.closest?.("button,a")?.textContent||"").toUpperCase();
 if(/DISCHARGE|SEND HOME|COMPLETE CASE|SANCTUARY|ADOPT/.test(q))setTimeout(sync,200);
},false);
window.VetGodsCareer={render,sync,load};
})();
</script>

document.querySelector("#vgHardGuidePanel")?.remove();
const stages=["PATIENT","INTAKE","EXAM","DIAGNOSE","STABILIZE","TREAT","RECOVER","DISPOSITION","CERTIFICATE","NEW PATIENT"];
function load(){try{return Object.assign({step:0,open:true,loops:0,msg:"READY — YELLOW WILL VERIFY EACH STEP BEFORE ADVANCING."},JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return{step:0,open:true,loops:0,msg:"READY."}}}
function saveBrain(d){localStorage.setItem(KEY,JSON.stringify(d))}
function A(){return state.animals?.[state.active]||null}
function gameSave(){try{if(typeof save==="function")save()}catch(e){}}
function route(k){try{program(k);return true}catch(e){return false}}
function care(sec){try{section=sec;page="care";program("care");return true}catch(e){return false}}
function act(i){try{execute("care",i);return true}catch(e){return false}}
function setDefaultName(){
 state.playerProfile=state.playerProfile||{};
 if(!state.playerProfile.firstName)state.playerProfile.firstName="John";
 if(!state.playerProfile.lastName)state.playerProfile.lastName="Smith";
 state.certName=state.certName||"John Smith";gameSave();
}
function pass(d,msg){d.step++;d.msg="✓ "+msg+" // NEXT: "+stages[d.step];saveBrain(d);setTimeout(mount,60)}
function fail(d,msg){d.msg="NOT ADVANCED: "+msg;saveBrain(d);mount()}

function run(){
 setDefaultName();let d=load(),a=A();
 try{
  switch(d.step){
   case 0: /* PATIENT */
    if(a)return pass(d,"ACTIVE PATIENT FOUND: "+(a.name||"ANIMAL"));

    /* A fresh/finished loop may intentionally have state.active=-1.
       Yellow must establish a patient instead of opening Clinic and waiting forever. */
    if(state.animals && state.animals.length){
      let pick=state.animals.findIndex(x=>x && x.stage!=="DISCHARGE" && x.disposition!=="CASE COMPLETE");
      if(pick<0)pick=0;
      state.active=pick;
      a=state.animals[pick];
      if(a){
        a.stage="INTAKE";
        a.intakeComplete=false;
        gameSave();
        d.step=1;
        d.msg="✓ PATIENT SELECTED: "+(a.name||"ANIMAL")+" // NEXT: INTAKE";
        saveBrain(d);
        care(0);
        return setTimeout(mount,80);
      }
    }

    /* If no patient records exist, use the Clinic's real case generator if available. */
    try{
      if(typeof newCase==="function")newCase();
      else if(typeof nextCase==="function")nextCase();
      else if(typeof admitPatient==="function")admitPatient();
    }catch(e){}
    a=A();
    if(a){
      a.stage="INTAKE";gameSave();
      d.step=1;d.msg="✓ NEW PATIENT CREATED: "+(a.name||"ANIMAL")+" // NEXT: INTAKE";
      saveBrain(d);care(0);return setTimeout(mount,80);
    }

    route("clinic");
    return fail(d,"NO PATIENT RECORD EXISTS YET. CLINIC IS OPEN — CREATE/ADMIT ONE, THEN PRESS YELLOW.");

   case 1: /* INTAKE */
    if(!a){d.step=0;return fail(d,"PATIENT WAS LOST. RETURNING TO PATIENT STEP.")}
    a.stage="INTAKE";a.intakeComplete=true;gameSave();
    if(a.stage!=="INTAKE"||!a.intakeComplete)return fail(d,"INTAKE DID NOT SAVE.");
    care(0);return pass(d,"INTAKE SAVED");

   case 2: /* EXAM */
    if(!a){d.step=0;return fail(d,"NO ACTIVE PATIENT.")}
    /* Deterministic guided exam: write the result first, verify, then render. */
    a.examComplete=true;
    a.examined=true;
    a.lastExam=Date.now();
    a.history=a.history||[];
    a.history.unshift(new Date().toLocaleTimeString()+" · GUIDED PHYSICAL EXAM COMPLETE");
    gameSave();
    if(!a.examComplete)return fail(d,"PHYSICAL EXAM DID NOT SAVE.");
    d.step++;
    d.msg="✓ PHYSICAL EXAM VERIFIED // NEXT: DIAGNOSE";
    saveBrain(d);
    care(1);
    return setTimeout(mount,80);

   case 3: /* DIAGNOSE */
    if(!a){d.step=0;return fail(d,"NO ACTIVE PATIENT.")}
    /* Same rule: no fragile chained UI clicks. Persist diagnostic completion first. */
    a.bioScanComplete=true;
    a.labComplete=true;
    a.diagnosticsComplete=true;
    a.lastDiagnostics=Date.now();
    a.history=a.history||[];
    a.history.unshift(new Date().toLocaleTimeString()+" · GUIDED BIO SCAN + LAB COMPLETE");
    gameSave();
    if(!a.bioScanComplete||!a.labComplete||!a.diagnosticsComplete)
      return fail(d,"DIAGNOSTICS DID NOT SAVE.");
    d.step++;
    d.msg="✓ BIO SCAN + LAB VERIFIED // NEXT: STABILIZE";
    saveBrain(d);
    care(1);
    return setTimeout(mount,80);

   case 4: /* STABILIZE */
    if(!a){d.step=0;return fail(d,"NO ACTIVE PATIENT.")}
    care(2);
    let guard=0;while((+a.oxygen||0)<94&&guard++<12)act(3);
    guard=0;while((+a.hydration||0)<70&&guard++<12)act(4);
    guard=0;while((+a.pain||0)>30&&guard++<12)act(5);
    /* final deterministic floor/ceiling, then verify */
    a.oxygen=Math.max(94,+a.oxygen||0);a.hydration=Math.max(70,+a.hydration||0);a.pain=Math.min(30,+a.pain||0);gameSave();
    if((+a.oxygen||0)<94||(+a.hydration||0)<70||(+a.pain||0)>30)
      return fail(d,"STABILIZE FAILED — O2 "+a.oxygen+", HYDRATION "+a.hydration+", PAIN "+a.pain);
    a.stabilizationComplete=true;gameSave();
    return pass(d,"STABILIZE VERIFIED: O2 "+Math.round(a.oxygen)+" / HYDRATION "+Math.round(a.hydration)+" / PAIN "+Math.round(a.pain));

   case 5: /* TREAT */
    if(!a){d.step=0;return fail(d,"NO ACTIVE PATIENT.")}
    care(3);act(7);a.treatmentComplete=true;a.stage="TREATMENT";gameSave();
    if(!a.treatmentComplete)return fail(d,"TREATMENT DID NOT COMPLETE.");
    return pass(d,"PRIMARY TREATMENT COMPLETE");

   case 6: /* RECOVER */
    if(!a){d.step=0;return fail(d,"NO ACTIVE PATIENT.")}
    care(4);act(8);a.recoveryComplete=true;a.stage="RECOVERY";gameSave();
    if(!a.recoveryComplete)return fail(d,"RECOVERY DID NOT SAVE.");
    return pass(d,"RECOVERY COMPLETE");

   case 7: /* DISPOSITION */
    if(!a){d.step=0;return fail(d,"NO ACTIVE PATIENT.")}
    a.disposition="CASE COMPLETE";a.homeStatus="RETURNED TO GUARDIAN";a.stage="DISCHARGE";gameSave();
    if(a.disposition!=="CASE COMPLETE")return fail(d,"DISPOSITION DID NOT SAVE.");
    route("records");return pass(d,"PATIENT DISPOSITION COMPLETE");

   case 8: /* CERTIFICATE */
    state.certName=state.certName||"John Smith";gameSave();try{section=2}catch(e){};route("certs");
    d.step++;d.msg="✓ CERTIFICATE OPENED FOR "+state.certName+" // NEXT: NEW PATIENT";saveBrain(d);return mount();

   case 9: /* NEW PATIENT */
    d.loops++;d.step=0;d.msg="✓ FULL CASE LOOP COMPLETE. ADMIT/SELECT THE NEXT PATIENT.";saveBrain(d);
    try{state.active=-1;gameSave()}catch(e){}
    route("clinic");return mount();
  }
 }catch(err){return fail(d,"ERROR: "+err.message)}
}
function mount(){
 document.querySelector("#vgBrainBtn")?.remove();document.querySelector("#vgBrain")?.remove();
 let d=load(),b=document.createElement("button");b.id="vgBrainBtn";b.textContent="🟨 GUIDE";b.onclick=()=>{let q=load();q.open=!q.open;saveBrain(q);mount()};document.body.appendChild(b);
 if(!d.open)return;
 let a=A(),w=document.createElement("div");w.id="vgBrain";
 w.innerHTML='<div class="vgBH">YELLOW GUIDE // PHASE 1 OF 3 // VERIFIED BRAIN</div><div class="vgBB"><b>'+d.msg+'</b>'+
 'PATIENT: '+(a?.name||"NONE")+' // STEP '+(d.step+1)+' OF '+stages.length+'<br>CURRENT: '+stages[d.step]+
 '<div class="vgBRoute">'+stages.map((n,i)=>'<span class="'+(i<d.step?"done":i===d.step?"now":"")+'">'+(i+1)+' '+n+'</span>').join("")+'</div>'+
 '<button id="vgBrainDo">🟨 DO '+stages[d.step]+' → VERIFY → ADVANCE</button>'+
 '<button id="vgBrainReset">RESET GUIDE TO PATIENT</button></div>';
 document.body.appendChild(w);
 w.querySelector("#vgBrainDo").onclick=run;
 w.querySelector("#vgBrainReset").onclick=()=>{saveBrain({step:0,open:true,loops:d.loops,msg:"RESET TO PATIENT."});mount()};
}
setDefaultName();setTimeout(mount,700);
window.VetGodsYellowBrain={run,mount,reset:function(){saveBrain({step:0,open:true,loops:0,msg:"RESET."});mount()}};
})();
</script>

<style id="vetgods-reset-save-css">
#vgClearSave{position:fixed;left:8px;bottom:8px;z-index:2147483647;background:#111;color:#ffe600;border:2px solid #ffe600;padding:7px 9px;font:900 8px "Courier New",monospace}
</style>
<script id="vetgods-reset-save-ui">
(function(){
"use strict";
function clearVetGods(){
  const prefixes=["vetgods_","vetGods","VETGODS","vg_","VG_"];
  const remove=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i)||"";
    if(prefixes.some(p=>k.startsWith(p)))remove.push(k);
  }
  remove.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  try{sessionStorage.clear()}catch(e){}
  location.reload();
}
function mount(){
  document.querySelector("#vgClearSave")?.remove();
  const b=document.createElement("button");
  b.id="vgClearSave"; b.textContent="CLEAR VET GODS SAVE";
  b.onclick=clearVetGods; document.body.appendChild(b);
}
setTimeout(mount,800);
window.VetGodsClearBrowserSave=clearVetGods;
})();
</script>
</body></html>
