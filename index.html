function execute(k,i){let a=active(),label=(ACTIONS[k]||[])[i]||"COMMAND";if(k==="care"){if(/OXYGEN/.test(label))a.oxygen=Math.min(100,a.oxygen+5);if(/WATER/.test(label))a.hydration=Math.min(100,a.hydration+8);if(/PAIN/.test(label))a.pain=Math.max(0,a.pain-10);if(/FOOD/.test(label))a.comfort=Math.min(100,a.comfort+5);if(/TREATMENT/.test(label)){a.health=Math.min(100,a.health+8);a.pain=Math.max(0,a.pain-5)}if(/RECOVERY/.test(label))a.stage="RECOVERY"}if(k==="morph"&&/FINALIZE/.test(label)){a.morph="AUTHORIZED CUSTOM FORM";a.stage="MORPH COMPLETE"}a.history.unshift(new Date().toLocaleTimeString()+" · "+label);state.logs.unshift(a.name+" · "+label);save();$("#out").textContent=`COMMAND: ${label}

<script id="phase1-js">
(function(){
"use strict";
const stages=["INTAKE","DIAGNOSTICS","STABILIZE","TREATMENT","RECOVERY","DISCHARGE"];
const costs={"PHYSICAL EXAM":5,"BIO SCAN":8,"LABORATORY":10,"OXYGEN SUPPORT":5,"OFFER WATER":2,"PAIN CONTROL":6,"OFFER FOOD":2,"PRIMARY TREATMENT":12,"SEND TO RECOVERY":5};
function A(){return state.animals[state.active]}
function ensure(){
 state.credits=Number.isFinite(state.credits)?state.credits:620;
 state.supplies=state.supplies||{oxygen:8,fluids:8,analgesia:6,food:12,diagnostic:10};
 state.animals.forEach((a,i)=>{
   a.sex=a.sex||(["Female","Male"][i%2]);a.age=a.age||((i%9)+1)+" yr";
   a.temperament=a.temperament||(["Guarded","Gentle","Curious","Nervous","Alert"][i%5]);
   a.caseId=a.caseId||"VG-"+String(1001+i);
   a.stage=a.stage||"INTAKE";a.evidence=a.evidence||[];
   a.nutrition=Number.isFinite(a.nutrition)?a.nutrition:68;
   a.mobility=Number.isFinite(a.mobility)?a.mobility:72;
   a.history=a.history||[];
 });
 save();
}
function stagebar(a){
 let idx=Math.max(0,stages.indexOf(a.stage));
 return '<div class="p1-stage">'+stages.map((x,i)=>'<span class="'+(i<idx?"done":i===idx?"now":"")+'">'+(i<idx?"[X] ":i===idx?"[>] ":"[ ] ")+x+'</span>').join("")+'</div>';
}
function record(a){
 return '<div class="p1-record"><div><small>CASE ID</small><b>'+a.caseId+'</b></div><div><small>SPECIES</small><b>'+a.species+'</b></div><div><small>SEX</small><b>'+a.sex+'</b></div><div><small>AGE</small><b>'+a.age+'</b></div><div><small>TEMPERAMENT</small><b>'+a.temperament+'</b></div><div><small>MORPH STATE</small><b>'+a.morph+'</b></div></div>';
}
function economy(){
 let s=state.supplies;
 return '<div class="p1-money"><div><small>CLINIC FUNDS</small><b>$'+state.credits+'</b></div><div><small>OXYGEN</small><b>'+s.oxygen+'</b></div><div><small>FLUIDS</small><b>'+s.fluids+'</b></div><div><small>ANALGESIA</small><b>'+s.analgesia+'</b></div></div>';
}
function alerts(a){
 let x=[];if(a.oxygen<90)x.push("LOW OXYGEN");if(a.hydration<55)x.push("HYDRATION LOW");if(a.pain>55)x.push("PAIN ELEVATED");if(a.health<55)x.push("HEALTH CRITICAL");if(a.stress>70)x.push("STRESS HIGH");
 return '<div class="p1-alert"><strong>CLINICAL ALERTS:</strong> '+(x.length?x.join(" / "):"NO CRITICAL ALERTS")+'</div>';
}
function log(a){return '<div class="p1-log">'+(a.history.length?a.history.slice(0,12).map(x=>'<div><b>&gt;</b> '+x+'</div>').join(""):'<div>NO INTERVENTIONS RECORDED.</div>')+'</div>'}
function enrichCare(){
 if(page!=="care")return;let a=A(),content=document.querySelector(".content");if(!content)return;
 let head=content.querySelector(".head");if(head&&!document.querySelector("#p1top")){let box=document.createElement("div");box.id="p1top";box.innerHTML=stagebar(a)+alerts(a)+economy()+record(a);head.insertAdjacentElement("afterend",box)}
 let out=document.querySelector(".out");if(out&&!document.querySelector("#p1log")){let box=document.createElement("div");box.id="p1log";box.innerHTML='<div class="head" style="margin-top:8px">CASE ACTIVITY LOG</div>'+log(a);out.insertAdjacentElement("beforebegin",box)}
}
const oldProgram=program;
program=function(k){oldProgram(k);if(k==="care")enrichCare()};
const oldExec=execute;
execute=function(k,i){
 let a=A(),label=(ACTIONS[k]||[])[i]||"COMMAND",cost=costs[label]||0;
 if(k==="care"&&cost>state.credits){let o=document.querySelector("#out");if(o)o.textContent="COMMAND DENIED\\nINSUFFICIENT CLINIC FUNDS\\nREQUIRED: $"+cost;return}
 if(k==="care"){
   state.credits-=cost;
   if(label==="PHYSICAL EXAM"){a.stage="DIAGNOSTICS";a.evidence.push("Physical exam completed");a.trust=Math.min(100,a.trust+4)}
   if(label==="BIO SCAN"){a.stage="DIAGNOSTICS";a.evidence.push("Bio scan acquired");a.stress=Math.max(0,a.stress-2)}
   if(label==="LABORATORY"){a.stage="DIAGNOSTICS";a.evidence.push("Laboratory panel acquired")}
   if(label==="OXYGEN SUPPORT"){if(state.supplies.oxygen>0){state.supplies.oxygen--;a.oxygen=Math.min(100,a.oxygen+7);a.stage="STABILIZE"}}
   if(label==="OFFER WATER"){if(state.supplies.fluids>0){state.supplies.fluids--;a.hydration=Math.min(100,a.hydration+10);a.stage="STABILIZE"}}
   if(label==="PAIN CONTROL"){if(state.supplies.analgesia>0){state.supplies.analgesia--;a.pain=Math.max(0,a.pain-12);a.comfort=Math.min(100,a.comfort+8);a.stage="STABILIZE"}}
   if(label==="OFFER FOOD"){if(state.supplies.food>0){state.supplies.food--;a.nutrition=Math.min(100,a.nutrition+9);a.comfort=Math.min(100,a.comfort+3)}}
   if(label==="PRIMARY TREATMENT"){a.stage="TREATMENT";a.health=Math.min(100,a.health+12);a.pain=Math.max(0,a.pain-6)}
   if(label==="SEND TO RECOVERY"){a.stage="RECOVERY";a.health=Math.min(100,a.health+5);a.stress=Math.max(0,a.stress-10)}
 }
 oldExec(k,i);
 save();
 if(k==="care"){program("care")}
};
window.VetGodsPhase1={ensure,enrichCare};
ensure();
})();
</script>

(function(){

 });

 let now=Date.now(),hours=Math.floor((now-a.lastPetTick)/3600000);
 if(hours<=0)return;
 a.petStats.food=Math.max(0,a.petStats.food-hours*2);
 a.petStats.water=Math.max(0,a.petStats.water-hours*2);
 a.petStats.comfort=Math.max(0,a.petStats.comfort-hours);

function renderSanctuary(){
 page="animals";nav();let list=residents();list.forEach(decay);save();
 let h='<div class="path">C:\\VETGODS\\SANCTUARY&gt; DIR /MY_ANIMALS</div><div class="head">MY ANIMALS / SANCTUARY — '+list.length+' RESIDENTS</div>';

 document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\SANCTUARY\\'+a.name.toUpperCase()+'&gt;</div>'+

 d.fatigue=clamp(100-(a.petStats?.energy||a.nutrition||70));

 needs.sort((x,y)=>y[1]-x[1]);d.currentNeed=needs[0][0];

 }

(function(){

function ensure2(){
 state.animals.forEach(a=>{
  a.brain=a.brain||{
   sensory:{threat:30,thirst:30,pain:a.pain||0,fatigue:30,novelty:45},
   memory:[],traitBias:{caution:50,curiosity:50,social:50},
   need:"OBSERVE",decision:"WAIT / OBSERVE",intent:"MONITOR ENVIRONMENT",confidence:50,lastTick:Date.now()
  };
 });
 save();

function compute(a,cause){
 if(window.VetGodsDynamicStats1)window.VetGodsDynamicStats1.recalc(a,cause||"BRAIN.EXE");
 let d=a.dynamic,b=a.brain;
 b.sensory.thirst=d.thirst;b.sensory.pain=d.painSignal;b.sensory.fatigue=d.fatigue;
 b.sensory.threat=clamp((100-d.safety)*.7+a.stress*.3);
 b.sensory.novelty=clamp((a.neuro?.novelty||50));
 b.traitBias.caution=clamp((a.stress*.45)+(100-a.trust)*.35+(a.pain*.2));
 b.traitBias.curiosity=clamp(a.neuro?.novelty||55);
 b.traitBias.social=clamp((a.trust*.6)+(a.neuro?.social||50)*.4);
 b.need=d.currentNeed;
 let map={
  "WATER":["SEEK WATER","APPROACH WATER STATION"],
  "PAIN RELIEF":["PROTECT BODY","SEEK LOW-MOTION SAFE AREA"],
  "OXYGEN":["REDUCE EXERTION","SEEK RESPIRATORY SUPPORT"],
  "FOOD":["SEEK FOOD","APPROACH FEEDING STATION"],
  "SAFETY":["AVOID / OBSERVE","SEEK QUIET SAFE AREA"],
  "REST":["REDUCE ACTIVITY","SEEK REST STATION"]
 };
 let q=map[b.need]||["OBSERVE","MONITOR ENVIRONMENT"];
 if(b.traitBias.caution>70&&b.need!=="OXYGEN"){q=["HESITATE / ASSESS","WAIT FOR SAFE APPROACH"]}
 if(b.traitBias.social>75&&a.trust>65&&b.need==="SAFETY"){q=["APPROACH HANDLER","SEEK FAMILIAR SUPPORT"]}
 b.decision=q[0];b.intent=q[1];
 let pressure=Math.max(b.sensory.thirst,b.sensory.pain,b.sensory.threat,b.sensory.fatigue);
 b.confidence=clamp(45+pressure*.35+(100-b.traitBias.caution)*.2);
 b.lastTick=Date.now();
}

 a.brain.memory.unshift({time:new Date().toLocaleTimeString(),type,text,weight:clamp(weight)});

function renderBrain(){
 page="neuro";nav();let a=A();compute(a,"BRAIN.EXE INSPECTION");save();let b=a.brain;
 document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\BRAIN\\'+a.name.toUpperCase()+'&gt;</div>'+
 '<div class="ds2"><h4>BRAIN.EXE — FICTIONAL DECISION NETWORK</h4><div class="ds2-pipe"><b>INPUT</b> -> SENSORY -> MEMORY -> TRAIT BIAS -> NEED -> DECISION -> ACTION INTENT</div>'+
 '<div class="ds2-grid">'+
 node("THIRST INPUT",b.sensory.thirst+"%","hydration-derived")+node("PAIN INPUT",b.sensory.pain+"%","care-derived")+
 node("THREAT INPUT",b.sensory.threat+"%","stress/safety-derived")+node("FATIGUE INPUT",b.sensory.fatigue+"%","energy-derived")+
 node("CAUTION BIAS",b.traitBias.caution+"%","experience + state")+node("CURIOSITY BIAS",b.traitBias.curiosity+"%","fictional neuro trait")+
 node("SOCIAL BIAS",b.traitBias.social+"%","trust + social response")+node("DECISION CONF.",b.confidence+"%","current signal strength")+
 '</div><div class="ds2-intent"><small>STRONGEST NEED</small><b>'+b.need+'</b><small>DECISION</small><b>'+b.decision+'</b><small>CURRENT INTENT</small><b>&gt; '+b.intent+'</b></div></div>'+
 '<div class="ds2"><h4>MEMORY BUS</h4><div class="ds2-memory">'+(b.memory.length?b.memory.map(m=>'<div><b>'+m.type+'</b> ['+m.weight+'%] '+m.text+' <small>'+m.time+'</small></div>').join(""):'<div>NO EXPERIENCE MEMORY RECORDED YET.</div>')+'</div></div>'+
 '<div class="ds2"><h4>BRAIN COMMANDS</h4><div class="ds2-actions"><button data-ds2="observe">[01] OBSERVE ENVIRONMENT</button><button data-ds2="handler">[02] FAMILIAR HANDLER CONTACT</button><button data-ds2="quiet">[03] QUIET ENVIRONMENT</button><button data-ds2="novel">[04] NOVEL OBJECT TEST</button><button data-ds2="care">[05] RETURN TO CLINIC</button><button data-ds2="neuro">[06] OPEN NEURO TESTS</button></div></div>'+
 '<div class="out"><h4>DECISION TRACE</h4><pre id="out">INPUT: thirst '+b.sensory.thirst+' / pain '+b.sensory.pain+' / threat '+b.sensory.threat+'\nMEMORY: '+b.memory.length+' stored experiences\nTRAIT: caution '+b.traitBias.caution+' / curiosity '+b.traitBias.curiosity+' / social '+b.traitBias.social+'\nNEED: '+b.need+'\nDECISION: '+b.decision+'\nACTION INTENT: '+b.intent+'</pre></div>';
 document.querySelectorAll("[data-ds2]").forEach(x=>x.onclick=()=>brainAction(x.dataset.ds2));

function brainAction(x){
 let a=A();
 if(x==="care")return open("care");
 if(x==="neuro"){return oldNeuroRenderer()}
 if(x==="observe"){a.stress=clamp(a.stress-2);remember(a,"OBSERVATION","Environment observed without intervention.",35)}
 if(x==="handler"){a.trust=clamp(a.trust+5);a.comfort=clamp(a.comfort+4);a.stress=clamp(a.stress-3);remember(a,"SOCIAL","Familiar handler contact associated with comfort.",70)}
 if(x==="quiet"){a.stress=clamp(a.stress-8);a.comfort=clamp(a.comfort+6);remember(a,"SAFETY","Quiet environment associated with lower stress.",75)}
 if(x==="novel"){a.stress=clamp(a.stress+3);remember(a,"NOVELTY","Novel object encountered and recorded.",55)}
 compute(a,x.toUpperCase());save();renderBrain();
}
let oldNeuroRenderer=window.VetGodsPhase6&&window.VetGodsPhase6.renderNeuro ? window.VetGodsPhase6.renderNeuro : function(){};
const priorProgram=program;
program=function(k){if(k==="neuro")return renderBrain();return priorProgram(k)};
const priorExec=execute;
execute=function(k,i){
 let a=A(),label=(ACTIONS[k]||[])[i]||"COMMAND";
 priorExec(k,i);
 if(k==="care"){
   let positive=["OFFER WATER","PAIN CONTROL","OXYGEN SUPPORT","OFFER FOOD","PRIMARY TREATMENT"].includes(label);
   remember(a,positive?"CARE":"CLINIC",label+" became part of the resident experience.",positive?70:40);
   compute(a,label);save();
 }
};
ensure2();
window.VetGodsDynamicStats2={renderBrain,compute,remember};
})();

<script id="dynamic-stats-p4-js">
(function(){
"use strict";
function A(){return state.animals[state.active]}
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const TRACK=["health","oxygen","hydration","pain","stress","trust","comfort","nutrition","mobility"];
function ensure4(){
 state.animals.forEach(a=>{a.feedback=a.feedback||{events:[],last:"NO INTERVENTION TRACE",score:50}});
 save();
}
function snap(a){let o={};TRACK.forEach(k=>o[k]=Number(a[k]||0));o.energy=Number(a.petStats?.energy||0);return o}
function deltas(before,a){
 let after=snap(a),arr=[];
 Object.keys(after).forEach(k=>{let d=after[k]-(before[k]||0);if(d)arr.push({k,d,v:after[k]})});
 return arr;
}
function causal(label,changes,a){
 let chain=[label];
 changes.forEach(x=>chain.push(x.k.toUpperCase()+" "+(x.d>0?"+":"")+x.d+" -> "+x.v+"%"));
 if(a.dynamic){chain.push("NEED -> "+a.dynamic.currentNeed);chain.push("HANDLING -> "+a.dynamic.handlingEase+"%");chain.push("RECOVERY -> "+a.dynamic.recoveryDrive+"%")}
 if(a.brain){chain.push("DECISION -> "+a.brain.decision);chain.push("INTENT -> "+a.brain.intent)}
 return chain.join("  =>  ");
}
function score(a){
 let d=a.dynamic||{};return clamp((a.health*.2)+(a.oxygen*.15)+(a.hydration*.12)+((100-a.pain)*.12)+((100-a.stress)*.1)+(a.trust*.1)+(a.comfort*.08)+(a.nutrition*.07)+((d.recoveryDrive||50)*.06));
}
function record(a,label,before){
 if(window.VetGodsDynamicStats1)window.VetGodsDynamicStats1.recalc(a,label);
 if(window.VetGodsDynamicStats2)window.VetGodsDynamicStats2.compute(a,label);
 let ch=deltas(before,a),line=causal(label,ch,a);a.feedback.last=line;a.feedback.score=score(a);
 a.feedback.events.unshift({time:new Date().toLocaleTimeString(),label,chain:line,changes:ch});a.feedback.events=a.feedback.events.slice(0,30);save();
}
function renderFeedback(){
 page="care";nav();let a=A(),f=a.feedback,d=a.dynamic,b=a.brain;
 document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\FEEDBACK\\'+a.name.toUpperCase()+'&gt;</div>'+
 '<div class="ds4"><h4>FEEDBACK.EXE — INTERVENTION / CONSEQUENCE NETWORK</h4><div class="ds4-grid">'+
 card("WHOLE-CASE SCORE",f.score+"%","fictional stability composite")+card("CURRENT NEED",d.currentNeed,"brain bus")+
 card("RECOVERY DRIVE",d.recoveryDrive+"%","connected body state")+card("HANDLING EASE",d.handlingEase+"%","trust/safety/pain")+

 '<button data-ds4="brain">[07] OPEN BRAIN.EXE</button><button data-ds4="clinic">[08] RETURN TO CLINIC</button></div></div>'+
 '<div class="ds4"><h4>CAUSAL TRACE HISTORY</h4><div class="ds4-trace">'+(f.events.length?f.events.map(e=>'<div class="ds4-event"><b>'+e.time+' · '+e.label+'</b>\n'+e.chain+'</div>').join(""):'<div class="ds4-event">NO INTERVENTIONS RECORDED.</div>')+'</div></div>';
 document.querySelectorAll("[data-ds4]").forEach(x=>x.onclick=()=>cmd(x.dataset.ds4));

function cmd(c){
 let a=A();if(c==="clinic")return open("care");if(c==="brain")return window.VetGodsDynamicStats2.renderBrain();
 let before=snap(a),label="";
 if(c==="water"){label="WATER INTERVENTION";a.hydration=clamp(a.hydration+10);a.stress=clamp(a.stress-2);a.comfort=clamp(a.comfort+2)}
 if(c==="pain"){label="PAIN INTERVENTION";a.pain=clamp(a.pain-12);a.mobility=clamp(a.mobility+6);a.stress=clamp(a.stress-4);a.trust=clamp(a.trust+2)}
 if(c==="oxygen"){label="OXYGEN INTERVENTION";a.oxygen=clamp(a.oxygen+7);a.health=clamp(a.health+2);a.stress=clamp(a.stress-2)}
 if(c==="food"){label="NUTRITION INTERVENTION";a.nutrition=clamp(a.nutrition+10);if(a.petStats)a.petStats.energy=clamp(a.petStats.energy+5)}
 if(c==="comfort"){label="COMFORT INTERVENTION";a.comfort=clamp(a.comfort+10);a.stress=clamp(a.stress-6);a.trust=clamp(a.trust+4)}
 if(c==="rest"){label="REST INTERVENTION";a.stress=clamp(a.stress-5);a.comfort=clamp(a.comfort+5);if(a.petStats)a.petStats.energy=clamp(a.petStats.energy+10)}
 record(a,label,before);renderFeedback();
}

execute=function(k,i){
 let a=A(),before=snap(a),label=(ACTIONS[k]||[])[i]||"COMMAND";
 priorExec(k,i);
 if(k==="care")record(a,label,before);

.ds5-grid{display:grid;grid-template-columns:repeat(2,1fr)}.ds5-cell{padding:7px;border-right:1px dotted #555;border-bottom:1px dotted #555;font-size:9px}.ds5-cell small{display:block;color:#777}.ds5-cell b{color:#fff}
.ds5-route{padding:7px;border-bottom:1px dotted #444;font-size:9px;line-height:1.55}.ds5-route b{color:#fff}
.ds5-actions{display:grid;grid-template-columns:repeat(2,1fr)}.ds5-actions button{border:0;border-right:1px dotted #555;border-bottom:1px dotted #555;background:#000;color:#c9c9c9;padding:7px;text-align:left;font:700 9px "Courier New",monospace}.ds5-actions button:hover{background:#c9c9c9;color:#000}
.ds5-history{max-height:220px;overflow:auto}.ds5-event{padding:6px;border-bottom:1px dotted #444;font-size:9px;line-height:1.45}.ds5-event b{color:#fff}
.ds5-loop{white-space:pre-wrap;padding:8px;color:#aaa;font-size:9px;line-height:1.5}.ds5-loop b{color:#fff}
@media(max-width:600px){.ds5-grid,.ds5-actions{grid-template-columns:1fr}}
</style>
<script id="dynamic-stats-p5-js">
(function(){
"use strict";
function A(){return state.animals[state.active]}
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
function ensure5(){
 state.animals.forEach(a=>{
  a.life=a.life||{experience:0,resilience:50,clinicFamiliarity:0,fieldExperience:0,sanctuaryBond:0,morphInfluence:0,neuroInfluence:0,story:[],lastContext:"INITIALIZED"};
 });
 save();
}
function sync(a,context){
 if(window.VetGodsDynamicStats1)window.VetGodsDynamicStats1.recalc(a,context||"LIFE LOOP");
 if(window.VetGodsDynamicStats2)window.VetGodsDynamicStats2.compute(a,context||"LIFE LOOP");
 let l=a.life;
 l.clinicFamiliarity=clamp(Math.min(100,(a.history||[]).length*3));
 l.fieldExperience=clamp((a.fieldRank||0)*12+(a.missionLog||[]).length*2);
 l.sanctuaryBond=clamp((a.petStats?.bond||a.trust||50));
 l.morphInfluence=clamp(a.morphLocked?75:(a.morphHistory||[]).length*5);
 l.neuroInfluence=clamp(Object.keys(a.neuroTests||{}).length*9);
 l.experience=clamp((l.clinicFamiliarity*.25)+(l.fieldExperience*.2)+(l.sanctuaryBond*.2)+(l.morphInfluence*.15)+(l.neuroInfluence*.2));
 l.resilience=clamp(((a.dynamic?.recoveryDrive||50)*.45)+(a.trust*.2)+((100-a.stress)*.15)+(l.experience*.2));
 l.lastContext=context||l.lastContext;
}
function memory(a,type,text){
 a.life.story.unshift({time:new Date().toLocaleTimeString(),type,text});
 a.life.story=a.life.story.slice(0,40);
}
function cell(k,v,n){return '<div class="ds5-cell"><small>'+k+'</small><b>'+v+'</b><small>'+n+'</small></div>'}
function renderLife(){
 let a=A();sync(a,"LIFE.EXE INSPECTION");save();let l=a.life,d=a.dynamic,b=a.brain,x=a.behavior;
 page="neuro";nav();
 document.querySelector("#main").innerHTML='<div class="path">C:\\VETGODS\\LIFE\\'+a.name.toUpperCase()+'&gt;</div>'+
 '<div class="ds5"><h4>LIFE.EXE — LIVING CHARACTER NETWORK</h4><div class="ds5-grid">'+
 cell("EXPERIENCE",l.experience+"%","combined history")+cell("RESILIENCE",l.resilience+"%","recovery + trust + experience")+
 cell("CLINIC FAMILIARITY",l.clinicFamiliarity+"%","care history")+cell("SANCTUARY BOND",l.sanctuaryBond+"%","bond / trust")+
 cell("FIELD EXPERIENCE",l.fieldExperience+"%","mission history")+cell("MORPH INFLUENCE",l.morphInfluence+"%","form history")+
 cell("NEURO INFLUENCE",l.neuroInfluence+"%","completed fictional tests")+cell("CURRENT NEED",d.currentNeed,"dynamic engine")+
 '</div><div class="ds5-route"><b>CURRENT INTERNAL ROUTE</b><br>BODY: '+d.currentNeed+' -> BRAIN: '+b.decision+' -> INTENT: '+b.intent+' -> BEHAVIOR: '+x.activity+' @ '+x.location+'</div></div>'+
 '<div class="ds5"><h4>CROSS-PROGRAM ROUTER</h4><div class="ds5-actions">'+
 '<button data-ds5="care">[01] CLINIC.EXE</button><button data-ds5="animals">[02] SANCTUARY.EXE</button>'+
 '<button data-ds5="morph">[03] MORPH.EXE</button><button data-ds5="brain">[04] BRAIN.EXE</button>'+
 '<button data-ds5="behavior">[05] BEHAVIOR.EXE</button><button data-ds5="feedback">[06] FEEDBACK.EXE</button>'+
 '<button data-ds5="missions">[07] MISSIONS.EXE</button><button data-ds5="records">[08] RECORDS.EXE</button>'+
 '<button data-ds5="cycle">[09] RUN LIVING CYCLE</button><button data-ds5="trace">[10] TRACE WHOLE NETWORK</button></div></div>'+
 '<div class="ds5"><h4>WHOLE GAME LOOP</h4><div class="ds5-loop"><b>CARE</b> -> body stats -> <b>BRAIN</b> -> need/decision -> <b>BEHAVIOR</b> -> feedback\n'+
 '<b>SANCTUARY</b> -> bond/needs -> brain memory\n<b>MORPH</b> -> persistent form influence\n<b>NEURO</b> -> fictional trait influence\n<b>MISSIONS</b> -> field experience / stress / trust\n<b>RECOVERY</b> -> resilience\n<b>RECORDS</b> -> permanent history\n\nAll paths return to the same resident state.</div></div>'+
 '<div class="ds5"><h4>LIFE HISTORY</h4><div class="ds5-history">'+(l.story.length?l.story.map(e=>'<div class="ds5-event"><b>'+e.time+' · '+e.type+'</b><br>'+e.text+'</div>').join(""):'<div class="ds5-event">NO CROSS-PROGRAM LIFE EVENTS YET.</div>')+'</div></div>'+
 '<div class="out"><h4>NETWORK OUTPUT</h4><pre id="out">LIFE NETWORK ONLINE.\nResident: '+a.name+'\nExperience: '+l.experience+'%\nResilience: '+l.resilience+'%\nCurrent need: '+d.currentNeed+'\nCurrent behavior: '+x.activity+'</pre></div>';
 document.querySelectorAll("[data-ds5]").forEach(q=>q.onclick=()=>cmd(q.dataset.ds5));
}
function cmd(c){
 let a=A();
 if(["care","animals","morph","missions","records"].includes(c))return open(c);
 if(c==="brain")return window.VetGodsDynamicStats2.renderBrain();
 if(c==="behavior")return window.VetGodsDynamicStats3.renderBehavior();
 if(c==="feedback")return window.VetGodsDynamicStats4.renderFeedback();
 if(c==="cycle"){
   window.VetGodsDynamicStats3.tick(a,true);sync(a,"MANUAL LIVING CYCLE");
   memory(a,"LIVING CYCLE","Body, brain, behavior and recovery network advanced as one cycle.");save();return renderLife();
 }
 if(c==="trace"){
   sync(a,"WHOLE NETWORK TRACE");save();
   let o=document.querySelector("#out"),d=a.dynamic,b=a.brain,x=a.behavior,l=a.life;
   o.textContent="WHOLE NETWORK TRACE\n\nBODY\n  need: "+d.currentNeed+"\n  recovery: "+d.recoveryDrive+"%\n  handling: "+d.handlingEase+"%\n\nBRAIN\n  decision: "+b.decision+"\n  intent: "+b.intent+"\n\nBEHAVIOR\n  activity: "+x.activity+"\n  location: "+x.location+"\n\nLIFE\n  experience: "+l.experience+"%\n  resilience: "+l.resilience+"%\n  clinic familiarity: "+l.clinicFamiliarity+"%\n  sanctuary bond: "+l.sanctuaryBond+"%\n  field experience: "+l.fieldExperience+"%";
 }
}
function lifeEvent(a,type,text){sync(a,type);memory(a,type,text);save()}
const oldExec=execute;
execute=function(k,i){let a=A(),label=(ACTIONS[k]||[])[i]||"COMMAND";oldExec(k,i);if(k==="care")lifeEvent(a,"CARE",label+" changed the resident's continuing life state.")};
const oldPet=typeof petAction==="function"?petAction:null;
if(oldPet)petAction=function(a,x){let r=oldPet(a,x);lifeEvent(a,"SANCTUARY",x.toUpperCase()+" became part of sanctuary experience.");return r};
function addLifeLink(){
 if(!["care","neuro"].includes(page)||document.querySelector("#ds5link"))return;let out=document.querySelector(".out");if(!out)return;
 let q=document.createElement("button");q.id="ds5link";q.className="action";q.textContent="[LIFE] OPEN LIVING CHARACTER NETWORK";q.onclick=renderLife;out.insertAdjacentElement("beforebegin",q);
}
const oldProgram=program;
program=function(k){oldProgram(k);addLifeLink()};
ensure5();addLifeLink();
window.VetGodsDynamicStats5={renderLife,sync,lifeEvent};
})();
</script>
</body></html>
