<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>VET GODS — Reimagined</title>
<style>
:root{
  --bg:#071015;--bg2:#0b1820;--panel:#0e2029;--panel2:#132a35;--edge:#254451;
  --ink:#eaf7fb;--muted:#84a7b4;--cyan:#38d7ff;--teal:#5ef0cb;--amber:#ffd66b;
  --red:#ff6b7a;--lime:#9dff7b;--violet:#b99cff;--shadow:0 18px 50px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:
 radial-gradient(circle at 10% 0%,rgba(56,215,255,.12),transparent 28%),
 radial-gradient(circle at 90% 8%,rgba(185,156,255,.11),transparent 24%),
 linear-gradient(180deg,#050b0f,var(--bg) 30%,#08141a 100%);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
button{font:inherit}.shell{max-width:1440px;margin:auto;padding:0 16px 70px}
.topbar{position:sticky;top:0;z-index:30;margin:0 -16px;padding:10px 16px;background:rgba(5,12,17,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(92,183,209,.18)}
.brandrow{display:flex;align-items:center;gap:12px;min-height:54px}.sigil{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 200deg,var(--cyan),var(--teal),var(--violet),var(--cyan));padding:2px;box-shadow:0 0 32px rgba(56,215,255,.23)}.sigil>i{display:grid;place-items:center;width:100%;height:100%;border-radius:12px;background:#071219;font-style:normal;font-weight:900}.brand{font-size:19px;font-weight:900;letter-spacing:.12em}.subtitle{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}.spacer{flex:1}.funds{padding:8px 12px;border:1px solid #365c68;border-radius:12px;background:#0b1c24}.funds b{color:var(--lime)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:1px solid #294a56;background:#0b1b23;color:#a9c4ce;border-radius:12px;padding:9px 12px;cursor:pointer}.nav button.active{color:white;border-color:rgba(56,215,255,.62);background:linear-gradient(180deg,rgba(56,215,255,.18),rgba(56,215,255,.05));box-shadow:inset 0 0 20px rgba(56,215,255,.06)}
.hero{margin:18px 0 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:14px}.card{background:linear-gradient(180deg,rgba(17,42,54,.92),rgba(9,25,33,.94));border:1px solid rgba(92,166,187,.24);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:18px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.18em}.h1{font-size:clamp(28px,4vw,52px);line-height:1;margin:8px 0 10px;font-weight:950;letter-spacing:-.045em}.lede{max-width:780px;color:#b6cbd3}.phasebar{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.phase{font-size:12px;padding:7px 9px;border-radius:999px;border:1px solid #294753;color:#7597a3}.phase.done{color:#91e6cf;border-color:#2e6c60;background:rgba(94,240,203,.07)}.phase.now{color:white;border-color:#4bdfff;background:rgba(56,215,255,.13);box-shadow:0 0 24px rgba(56,215,255,.11)}
.patientVisual{min-height:270px;position:relative;background:radial-gradient(circle at 50% 42%,rgba(56,215,255,.18),transparent 32%),linear-gradient(135deg,#0a1720,#102633)}.animal{position:absolute;inset:24px;display:grid;place-items:center}.animal svg{width:min(330px,86%);filter:drop-shadow(0 18px 28px rgba(0,0,0,.35))}.scanline{position:absolute;left:7%;right:7%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 18px var(--cyan);animation:scan 3.6s ease-in-out infinite}@keyframes scan{0%,100%{top:18%;opacity:.2}50%{top:82%;opacity:.9}}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.kpi{padding:13px;border:1px solid #274753;border-radius:16px;background:rgba(7,20,27,.77)}.kpi small{display:block;color:#7999a5;text-transform:uppercase;font-size:10px;letter-spacing:.12em}.kpi strong{font-size:21px}.kpi .mini{height:5px;margin-top:8px;border-radius:99px;background:#162c35;overflow:hidden}.kpi .mini i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:inherit}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.sectionTitle{display:flex;align-items:end;gap:12px;margin-bottom:12px}.sectionTitle h2{font-size:19px;margin:0}.sectionTitle p{margin:0;color:var(--muted);font-size:12px}
.instrumentGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.instrument{padding:14px;border:1px solid #2b4a55;border-radius:16px;background:linear-gradient(180deg,#102630,#0b1b22);min-height:118px;cursor:pointer;color:white;text-align:left;transition:.16s transform,.16s border-color}.instrument:hover{transform:translateY(-2px);border-color:#4fb5ce}.instrument:active{transform:scale(.985)}.instrument b{display:block;margin-bottom:5px}.instrument small{color:#80a4b0}.dial{width:44px;height:44px;border-radius:50%;margin-bottom:9px;background:conic-gradient(var(--accent,var(--cyan)) var(--pct,70%),#1d3942 0);padding:5px}.dial:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#0b1b22;box-shadow:inset 0 0 0 1px #2b4b55}
.readout{display:grid;gap:10px}.meter{padding:11px 12px;border:1px solid #24434e;border-radius:14px;background:#0a1b22}.meterhead{display:flex;justify-content:space-between;gap:10px}.meterbar{height:9px;margin-top:8px;border-radius:999px;background:#17313a;overflow:hidden}.meterbar i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:inherit}.meter.danger .meterbar i{background:linear-gradient(90deg,var(--amber),var(--red))}
.actionRow{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{border:1px solid #315561;border-radius:13px;padding:10px 13px;color:white;background:#102731;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#17445a,#113140);border-color:#3c91aa}.btn.good{background:linear-gradient(180deg,#194a42,#11352f);border-color:#3b8b79}.btn.warn{background:linear-gradient(180deg,#4b3920,#332617);border-color:#8a6e35}.btn:disabled{opacity:.38;cursor:not-allowed}
.log{margin-top:14px;padding:12px;border-radius:14px;background:#08181e;border:1px solid #213e48;min-height:90px}.log div{padding:6px 0;border-bottom:1px solid rgba(100,160,180,.1);color:#a9c0c8}.log div:last-child{border-bottom:0}.log time{color:#5f8491;margin-right:8px}
.notice{padding:12px;border:1px solid #335967;border-radius:14px;background:rgba(56,215,255,.055);color:#c6e8f0}.screen{display:none}.screen.active{display:block}
.petGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.petCard{padding:15px;border:1px solid #2d4d58;border-radius:18px;background:linear-gradient(180deg,#102831,#0b1a21)}.petFace{height:130px;border-radius:15px;background:radial-gradient(circle at 50% 50%,rgba(157,255,123,.13),transparent 45%),#09171d;display:grid;place-items:center;margin-bottom:12px;font-size:60px}.petStats{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px;color:#9cb4bd}
.finalGate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #4b6545;border-radius:16px;background:rgba(157,255,123,.06);margin-top:14px}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,8,11,.74);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalBox{max-width:560px;width:100%;border-radius:24px;background:#0d212a;border:1px solid #3d7c8f;box-shadow:0 30px 100px #000;padding:24px;text-align:center}.reward{font-size:62px}.modalBox h2{font-size:32px;margin:8px 0}.rewardBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

.logicHub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.logicTile{padding:14px;border:1px solid #2c4f5b;border-radius:16px;background:linear-gradient(180deg,#102932,#0a1a21);cursor:pointer;color:white;text-align:left;min-height:112px}.logicTile:hover{border-color:#56c6df}.logicTile b{display:block;font-size:15px;margin:6px 0}.logicTile small{color:#86a7b2}.logicIcon{font-size:24px}.logicBadge{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:999px;border:1px solid #355e69;color:#9ec2cc;font-size:10px}.logicBadge.ok{border-color:#367c69;color:#8ff1d1}.consoleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.consolePanel{padding:15px;border:1px solid #294b56;border-radius:18px;background:linear-gradient(180deg,#0f2630,#09191f)}.consolePanel h3{margin:0 0 8px}.consoleRead{font:700 24px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c9f5ff}.consoleSub{font-size:11px;color:#7da0ac;text-transform:uppercase;letter-spacing:.12em;margin-top:5px}.statusLights{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.light{padding:6px 8px;border-radius:999px;background:#10252d;border:1px solid #2a4a55;color:#829fa9;font-size:11px}.light.on{background:rgba(94,240,203,.08);border-color:#3f8b78;color:#9cf4da}.inventoryGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.supply{padding:12px;border-radius:15px;border:1px solid #2b4b56;background:#0a1a21}.supply b{display:flex;justify-content:space-between}.supply small{color:#80a0aa}.tiny{font-size:11px;color:#7897a2}.caseTimeline{display:grid;gap:8px}.caseEvent{padding:10px 12px;border-left:3px solid #355966;background:#0a1920;border-radius:0 12px 12px 0}.caseEvent.done{border-color:#5ef0cb}.caseEvent b{display:block}.screenBack{margin-top:16px}.screenBack .btn{min-width:150px}.wardGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.wardBed{padding:13px;border:1px solid #2b4c58;border-radius:16px;background:#0c1f27}.bigDial{width:92px;height:92px;border-radius:50%;margin:8px auto 12px;background:conic-gradient(var(--accent,var(--cyan)) calc(var(--n)*1%),#19343d 0);padding:9px;display:grid;place-items:center}.bigDial:after{content:attr(data-label);display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#0a1a21;font-weight:900;font-size:19px}.logicHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.crumb{font-size:11px;color:#78a2ae;text-transform:uppercase;letter-spacing:.14em}
@media(max-width:900px){.logicHub{grid-template-columns:repeat(2,1fr)}.inventoryGrid,.wardGrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.logicHub,.consoleGrid,.inventoryGrid,.wardGrid{grid-template-columns:1fr}.logicTile{min-height:90px}}
@media(max-width:900px){.hero,.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.petGrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.shell{padding:0 10px 70px}.topbar{margin:0 -10px;padding:8px 10px}.brand{font-size:16px}.subtitle{font-size:9px}.funds{font-size:12px}.hero{margin-top:12px}.pad{padding:14px}.instrumentGrid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.petGrid{grid-template-columns:1fr}.patientVisual{min-height:230px}.actionRow .btn{flex:1 1 42%}.h1{font-size:35px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <div class="brandrow"><div class="sigil"><i>VG</i></div><div><div class="brand">VET GODS</div><div class="subtitle">Veterinary Intervention Command</div></div><div class="spacer"></div><div class="funds">CLINIC <b id="funds">$2,400</b></div></div>
 <nav class="nav" id="nav"></nav>
</header>

<main>
<section id="clinic" class="screen active"></section>
<section id="stabilize" class="screen"></section>
<section id="diagnostics" class="screen"></section>
<section id="treatment" class="screen"></section>
<section id="surgery" class="screen"></section>
<section id="recovery" class="screen"></section>
<section id="discharge" class="screen"></section>
<section id="pets" class="screen"></section>
<section id="triage" class="screen"></section>
<section id="pharmacy" class="screen"></section>
<section id="imaging" class="screen"></section>
<section id="laboratory" class="screen"></section>
<section id="anesthesia" class="screen"></section>
<section id="paincare" class="screen"></section>
<section id="mobility" class="screen"></section>
<section id="ward" class="screen"></section>
<section id="records" class="screen"></section>
<section id="funding" class="screen"></section>
</main>
</div>
<div class="modal" id="rewardModal"><div class="modalBox"><div class="reward">✦</div><div class="eyebrow">Case Complete</div><h2 id="rewardTitle">Kota is safe.</h2><p id="rewardText"></p><div class="rewardBtns"><button class="btn good" id="keepPet">Keep in My Pets</button><button class="btn primary" id="nextPatient">Next Patient</button></div></div></div>
<script>
const stages=['Intake','Stabilize','Diagnose','Treat','Surgery','Recovery','Prove Ready','Discharge'];
const navItems=[['clinic','Clinic'],['stabilize','Stabilize'],['diagnostics','Diagnostics'],['treatment','Treatment'],['surgery','Surgery'],['recovery','Recovery'],['discharge','Discharge'],['pets','My Pets'],['records','Case File'],['funding','Funding']];
const patients=[
 {name:'Kota',species:'Canine',breed:'Husky mix',condition:'Trauma with dehydration',surgical:false,emoji:'🐕'},
 {name:'Mira',species:'Feline',breed:'Silver tabby',condition:'Deep paw laceration',surgical:true,emoji:'🐈'},
 {name:'Orion',species:'Avian',breed:'Barn owl',condition:'Wing strain and shock',surgical:false,emoji:'🦉'},
 {name:'Juniper',species:'Canine',breed:'Shepherd mix',condition:'Foreign-body injury',surgical:true,emoji:'🐕‍🦺'}
];
const defaults=()=>({health:68,pain:61,oxygen:91,hydration:46,stress:72,trust:29,mobility:35,comfort:30,hunger:56,thirst:64,energy:42});
let state=JSON.parse(localStorage.getItem('vetgods_reimagined')||'null')||{idx:0,stage:0,funds:2400,stats:defaults(),tests:{exam:false,imaging:false,lab:false},tx:{fluids:false,oxygen:false,pain:false,definitive:false,surgery:false},pets:[],log:[],rewarded:false};
state.inventory=state.inventory||{painMeds:2,fluids:3,antibiotics:2,bandages:4,oxygen:5,food:6};state.logic=state.logic||{triage:false,imagingViews:0,labPanels:0,anesthesia:false,painPlan:false,mobilityChecks:0,wardRounds:0};state.caseNotes=state.caseNotes||[];
function p(){return patients[state.idx%patients.length]}
function save(){localStorage.setItem('vetgods_reimagined',JSON.stringify(state))}
function log(msg){state.log.unshift({t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),msg});state.log=state.log.slice(0,7);save();render()}
function spend(n){state.funds=Math.max(0,state.funds-n)}
function clamp(){for(const k in state.stats)state.stats[k]=Math.max(0,Math.min(100,state.stats[k]))}
function phaseStrip(){return `<div class="phasebar">${stages.map((x,i)=>`<span class="phase ${i<state.stage?'done':i===state.stage?'now':''}">${x}</span>`).join('')}</div>`}
function petArt(){return `<div class="patientVisual"><div class="scanline"></div><div class="animal"><svg viewBox="0 0 360 240" aria-label="stylized patient silhouette"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#69e8ff"/><stop offset="1" stop-color="#a993ff"/></linearGradient></defs><ellipse cx="180" cy="205" rx="120" ry="18" fill="#000" opacity=".28"/><path d="M84 132c10-44 40-72 84-77 36-4 69 8 89 31l29-10 20 16-23 25 4 52-24 4-7-42-40 8-15 48-24-1 7-46-62 2-10 45-23-2 5-53z" fill="url(#g)" opacity=".88"/><circle cx="279" cy="74" r="28" fill="url(#g)"/><path d="M264 51l-6-24 24 17M295 51l11-21 10 31" stroke="#8cf0ff" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="289" cy="71" r="4" fill="#051117"/><path d="M73 126c-25-8-34-30-23-45" stroke="#7be7ff" stroke-width="11" fill="none" stroke-linecap="round"/></svg></div></div>`}
function kpis(){const s=state.stats;return `<div class="kpis">${[['Health',s.health],['Pain',100-s.pain],['O₂',s.oxygen],['Hydration',s.hydration],['Trust',s.trust],['Mobility',s.mobility]].map(([n,v])=>`<div class="kpi"><small>${n}</small><strong>${Math.round(n==='Pain'?100-v:v)}${n==='O₂'?'%':''}</strong><div class="mini"><i style="--v:${v}%"></i></div></div>`).join('')}</div>`}
function telemetry(keys=['health','pain','oxygen','hydration','stress','trust','mobility','comfort']){return `<div class="readout">${keys.map(k=>{let v=state.stats[k],bad=(k==='pain'||k==='stress')&&v>45;return `<div class="meter ${bad?'danger':''}"><div class="meterhead"><span>${k[0].toUpperCase()+k.slice(1)}</span><b>${Math.round(v)}${k==='oxygen'?'%':''}</b></div><div class="meterbar"><i style="--v:${k==='pain'||k==='stress'?100-v:v}%"></i></div></div>`}).join('')}</div>`}
function logBox(){return `<div class="log">${state.log.length?state.log.map(x=>`<div><time>${x.t}</time>${x.msg}</div>`).join(''):'<div>Hospital event log ready.</div>'}</div>`}
function note(msg){state.caseNotes.unshift({t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),msg});state.caseNotes=state.caseNotes.slice(0,30);save()}
function logicHub(){return `<div class="logicHub">
<button class="logicTile" onclick="go('triage')"><div class="logicIcon">🩺</div><b>Triage Station</b><small>Primary survey, perfusion, respiratory status, urgency.</small><span class="logicBadge ${state.logic.triage?'ok':''}">${state.logic.triage?'survey complete':'open station'}</span></button>
<button class="logicTile" onclick="go('pharmacy')"><div class="logicIcon">💊</div><b>Pharmacy</b><small>Acquire pain medication, fluids, antibiotics and bandages.</small><span class="logicBadge">${state.inventory.painMeds} analgesic doses</span></button>
<button class="logicTile" onclick="go('imaging')"><div class="logicIcon">🩻</div><b>Imaging Bay</b><small>Acquire views and convert scans into structural findings.</small><span class="logicBadge ${state.tests.imaging?'ok':''}">${state.logic.imagingViews} views</span></button>
<button class="logicTile" onclick="go('laboratory')"><div class="logicIcon">🧪</div><b>Laboratory</b><small>Run hydration, CBC-style and inflammatory panels.</small><span class="logicBadge ${state.tests.lab?'ok':''}">${state.logic.labPanels} panels</span></button>
<button class="logicTile" onclick="go('anesthesia')"><div class="logicIcon">😴</div><b>Anesthesia Console</b><small>Pre-op check, oxygenation and monitored procedure logic.</small><span class="logicBadge ${state.logic.anesthesia?'ok':''}">${state.logic.anesthesia?'cleared':'not cleared'}</span></button>
<button class="logicTile" onclick="go('paincare')"><div class="logicIcon">❤</div><b>Pain & Comfort</b><small>Medication, positioning, quiet care, trust and comfort.</small><span class="logicBadge ${state.logic.painPlan?'ok':''}">pain ${state.stats.pain}</span></button>
<button class="logicTile" onclick="go('mobility')"><div class="logicIcon">🐾</div><b>Mobility Lab</b><small>Guarded gait, weight bearing, balance and walk clearance.</small><span class="logicBadge">${state.logic.mobilityChecks} checks</span></button>
<button class="logicTile" onclick="go('ward')"><div class="logicIcon">🏥</div><b>Recovery Ward</b><small>Bedside water, food, rest, checks and nursing rounds.</small><span class="logicBadge">${state.logic.wardRounds} rounds</span></button>
</div>`}
function logicPage(title,kicker,body,returnTo='clinic'){return `<div class="card pad" style="margin-top:18px"><div class="logicHead"><div><div class="eyebrow">${kicker}</div><div class="h1" style="font-size:clamp(28px,5vw,44px)">${title}</div></div><div class="crumb">${p().name} • ${p().species} • ${p().condition}</div></div>${phaseStrip()}</div>${kpis()}<div style="margin-top:14px">${body}</div><div class="screenBack"><button class="btn" onclick="go('${returnTo}')">← Return to ${returnTo==='clinic'?'Clinic':returnTo}</button></div>`}
function triage(){let s=state.stats;let body=`<div class="consoleGrid"><div class="consolePanel"><h3>Primary Survey</h3><div class="consoleRead">${s.oxygen}% O₂</div><div class="consoleSub">Airway / breathing</div><div class="statusLights"><span class="light ${s.oxygen>=94?'on':''}">AIRWAY</span><span class="light ${s.health>=60?'on':''}">CIRCULATION</span><span class="light ${s.stress<65?'on':''}">CALM</span></div><div class="actionRow"><button class="btn primary" onclick="state.logic.triage=true;state.stats.stress-=6;clamp();note('Primary triage survey completed.');log('Triage: airway patent, perfusion assessed.');">Run Primary Survey</button></div></div><div class="consolePanel"><h3>Urgency Index</h3><div class="bigDial" style="--n:${Math.round((s.pain+s.stress+(100-s.hydration))/3)};--accent:var(--amber)" data-label="${Math.round((s.pain+s.stress+(100-s.hydration))/3)}"></div><div class="consoleSub">Higher value = more urgent support needs</div></div></div>`;return logicPage('Triage Station','Emergency Intake',body,'clinic')}
function pharmacy(){let inv=state.inventory;let buy=(key,label,cost,qty=1)=>`<div class="supply"><b><span>${label}</span><span>${inv[key]}</span></b><small>Stock on hand</small><div class="actionRow"><button class="btn" onclick="if(state.funds>=${cost}){spend(${cost});state.inventory.${key}+=${qty};note('${label} stocked.');log('${label} added to pharmacy.')}else log('Insufficient clinic funds.');">Buy $${cost}</button></div></div>`;let body=`<div class="card pad"><div class="sectionTitle"><h2>Medication & Supply Cabinet</h2><p>Treatment draws from real inventory.</p></div><div class="inventoryGrid">${buy('painMeds','Analgesic dose',15)}${buy('fluids','Fluid bag',12)}${buy('antibiotics','Antibiotic dose',18)}${buy('bandages','Bandage kit',8)}${buy('oxygen','Oxygen unit',10)}${buy('food','Recovery meal',6)}</div></div>`;return logicPage('Pharmacy','Supply Logic',body,'clinic')}
function imaging(){let body=`<div class="consoleGrid"><div class="consolePanel"><h3>Imaging Gantry</h3><div class="consoleRead">${state.logic.imagingViews}/2</div><div class="consoleSub">Diagnostic views acquired</div><div class="actionRow"><button class="btn primary" onclick="if(state.logic.imagingViews<2){state.logic.imagingViews++;spend(5);note('Imaging view '+state.logic.imagingViews+' acquired.');if(state.logic.imagingViews>=2){state.tests.imaging=true;log('Imaging set complete: structural injury characterized.')}else log('First imaging view captured.');}">Acquire View</button></div></div><div class="consolePanel"><h3>Structural Finding</h3><p>${state.tests.imaging?'No unstable fracture. Soft-tissue trauma/laceration pattern identified and safe for planned treatment.':'Need two views before interpretation is released.'}</p><div class="statusLights"><span class="light ${state.tests.imaging?'on':''}">ORTHOGONAL SET</span><span class="light ${state.tests.imaging?'on':''}">REPORT READY</span></div></div></div>`;return logicPage('Imaging Bay','Diagnostics Logic',body,'diagnostics')}
function laboratory(){let body=`<div class="consoleGrid"><div class="consolePanel"><h3>Sample Processor</h3><div class="consoleRead">${state.logic.labPanels}/2</div><div class="consoleSub">Panels completed</div><div class="actionRow"><button class="btn primary" onclick="if(state.logic.labPanels<2){state.logic.labPanels++;spend(5);note('Laboratory panel '+state.logic.labPanels+' completed.');if(state.logic.labPanels>=2){state.tests.lab=true;log('Laboratory work complete: dehydration pattern confirmed.')}else log('Initial blood/chemistry panel resulted.');}">Run Panel</button></div></div><div class="consolePanel"><h3>Result Stack</h3><p>${state.tests.lab?'Hydration deficit confirmed. No severe anemia pattern. Inflammation consistent with the active injury.':'Additional panel required before the result stack is complete.'}</p><div class="statusLights"><span class="light ${state.logic.labPanels>=1?'on':''}">CHEMISTRY</span><span class="light ${state.logic.labPanels>=2?'on':''}">CBC-STYLE</span></div></div></div>`;return logicPage('Laboratory','Diagnostics Logic',body,'diagnostics')}
function anesthesia(){let cleared=state.stats.oxygen>=94&&state.stats.pain<=55&&state.logic.triage;let body=`<div class="consoleGrid"><div class="consolePanel"><h3>Pre-Anesthetic Check</h3><div class="consoleRead">${cleared?'READY':'HOLD'}</div><div class="consoleSub">Requires triage, O₂ ≥94 and pain ≤55</div><div class="statusLights"><span class="light ${state.logic.triage?'on':''}">TRIAGE</span><span class="light ${state.stats.oxygen>=94?'on':''}">OXYGEN</span><span class="light ${state.stats.pain<=55?'on':''}">PAIN</span></div><div class="actionRow"><button class="btn good" ${cleared?'':'disabled'} onclick="state.logic.anesthesia=true;state.stats.stress-=10;clamp();note('Anesthesia clearance completed.');log('Anesthesia console: patient cleared for procedure.');">Clear Patient</button></div></div><div class="consolePanel"><h3>Live Monitor</h3>${meters(['oxygen','health','stress','pain'])}</div></div>`;return logicPage('Anesthesia Console','Operating Logic',body,'surgery')}
function paincare(){let body=`<div class="consoleGrid"><div class="consolePanel"><h3>Pain Medication</h3><div class="consoleRead">${state.inventory.painMeds} doses</div><div class="consoleSub">Available in pharmacy</div><div class="actionRow"><button class="btn primary" ${state.inventory.painMeds>0?'':'disabled'} onclick="if(state.inventory.painMeds>0){state.inventory.painMeds--;state.stats.pain-=22;state.stats.comfort+=12;state.logic.painPlan=true;clamp();note('Analgesic administered.');log('Pain medication administered from inventory.');}">Give Analgesic</button></div></div><div class="consolePanel"><h3>Non-Drug Comfort</h3><div class="actionRow"><button class="btn" onclick="state.stats.comfort+=10;state.stats.stress-=8;state.stats.trust+=5;clamp();note('Quiet positioning used.');log('Quiet positioning improved comfort.');">Quiet Positioning</button><button class="btn" onclick="state.stats.comfort+=8;state.stats.trust+=7;clamp();note('Gentle contact care completed.');log('Gentle contact improved trust.');">Gentle Contact</button></div>${meters(['pain','comfort','stress','trust'])}</div></div>`;return logicPage('Pain & Comfort','Supportive Care Logic',body,'recovery')}
function mobility(){let safe=state.stats.pain<=45;let doCheck=(label,inc)=>`<button class="btn" ${safe?'':'disabled'} onclick="state.logic.mobilityChecks++;state.stats.mobility+=${inc};state.stats.energy-=4;state.stats.trust+=2;clamp();note('${label} completed.');log('${label}: mobility response recorded.');">${label}</button>`;let body=`<div class="card pad"><div class="sectionTitle"><h2>Guarded Mobility Testing</h2><p>Pain must be ≤45 before active testing.</p></div><div class="actionRow">${doCheck('Weight Bearing',6)}${doCheck('Balance Test',5)}${doCheck('Short Walk',8)}${doCheck('Turn & Return',6)}</div><div style="margin-top:14px">${meters(['pain','mobility','energy','trust'])}</div></div>`;return logicPage('Mobility Lab','Recovery Logic',body,'recovery')}
function ward(){let body=`<div class="wardGrid"><div class="wardBed"><h3>Hydration Bay</h3><div class="bigDial" style="--n:${state.stats.hydration};--accent:var(--teal)" data-label="${state.stats.hydration}"></div><button class="btn" onclick="if(state.inventory.fluids>0){state.inventory.fluids--;state.stats.hydration+=15;state.stats.thirst-=18;state.logic.wardRounds++;clamp();note('Ward fluids given.');log('Recovery ward: hydration support completed.')}else log('No fluid bags. Restock pharmacy.');">Give Fluids</button></div><div class="wardBed"><h3>Nutrition Bay</h3><div class="bigDial" style="--n:${100-state.stats.hunger};--accent:var(--lime)" data-label="${100-state.stats.hunger}"></div><button class="btn" onclick="if(state.inventory.food>0){state.inventory.food--;state.stats.hunger-=22;state.stats.energy+=12;state.logic.wardRounds++;clamp();note('Recovery meal offered.');log('Recovery ward: food accepted.')}else log('No recovery meals. Restock pharmacy.');">Offer Food</button></div><div class="wardBed"><h3>Rest Bay</h3><div class="bigDial" style="--n:${state.stats.energy};--accent:var(--violet)" data-label="${state.stats.energy}"></div><button class="btn" onclick="state.stats.energy+=18;state.stats.stress-=10;state.logic.wardRounds++;clamp();note('Quiet rest period completed.');log('Recovery ward: quiet rest completed.');">Quiet Rest</button></div></div>`;return logicPage('Recovery Ward','Nursing Logic',body,'recovery')}
function records(){let events=[['Intake',state.stage>=1],['Stabilized',state.stage>=2],['Evidence Collected',state.tests.exam&&state.tests.imaging&&state.tests.lab],['Definitive Treatment',state.tx.definitive],['Surgery / Skip',state.stage>=5],['Recovery Proof',state.stage>=7]];return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Persistent Case Record</div><div class="h1">${p().name} // Case File</div><p class="lede">One timeline shared by every logic screen.</p><div class="caseTimeline">${events.map(x=>`<div class="caseEvent ${x[1]?'done':''}"><b>${x[0]}</b><span>${x[1]?'Complete':'Pending'}</span></div>`).join('')}</div><div class="log" style="margin-top:14px">${state.caseNotes.length?state.caseNotes.map(x=>`<div><time>${x.t}</time>${x.msg}</div>`).join(''):'<div>No case notes yet.</div>'}</div></div>`}
function funding(){let body=`<div class="consoleGrid"><div class="consolePanel"><h3>Clinic Treasury</h3><div class="consoleRead">$${state.funds.toLocaleString()}</div><div class="consoleSub">Available treatment funds</div><div class="actionRow"><button class="btn good" onclick="state.funds+=100;note('Emergency grant issued.');log('Funding: emergency $100 grant approved.');">Emergency Grant +$100</button></div></div><div class="consolePanel"><h3>Supply Burden</h3><p>Treatment, diagnostics, pharmacy purchases and procedures consume clinic funds. Completed cases return funding to the hospital.</p><div class="statusLights"><span class="light ${state.funds>500?'on':''}">OPERATING</span><span class="light ${state.funds>1500?'on':''}">RESERVE</span></div></div></div>`;return logicPage('Funding Department','Clinic Economy',body,'clinic')}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,label])=>`<button data-go="${id}">${label}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));renderScreen(id)}
function clinic(){return `<div class="hero"><div class="card pad"><div class="eyebrow">Active Rescue // ${p().species}</div><div class="h1">${p().name}</div><p class="lede">${p().breed} • ${p().condition}. The hospital never moves you automatically. Enter a department, work there, finish it, then choose where to go next.</p>${phaseStrip()}<div class="actionRow"><button class="btn primary" onclick="go('${nextArea()}')">Enter Next Department</button><button class="btn" onclick="go('pets')">Open My Pets</button></div></div><div class="card">${petArt()}</div></div>${kpis()}${logicHub()}<div class="grid"><div class="card pad"><div class="sectionTitle"><h2>Command Console</h2><p>Department access stays deliberate.</p></div><div class="instrumentGrid">${navItems.slice(1,7).map(([id,l],i)=>`<button class="instrument" onclick="go('${id}')"><div class="dial" style="--pct:${45+i*7}%;--accent:${i%2?'var(--teal)':'var(--cyan)'}"></div><b>${l}</b><small>${areaNote(id)}</small></button>`).join('')}</div></div><div class="card pad"><div class="sectionTitle"><h2>Live Telemetry</h2><p>No timer redraws.</p></div>${telemetry(['health','pain','oxygen','hydration','stress','trust'])}</div></div>${logBox()}`}
function nextArea(){return ['stabilize','stabilize','diagnostics','treatment',p().surgical?'surgery':'recovery','recovery','recovery','discharge'][state.stage]||'discharge'}
function areaNote(id){return ({stabilize:'Correct immediate risks',diagnostics:'Reveal evidence',treatment:'Support + definitive care',surgery:'Procedure only if required',recovery:'Playable aftercare',discharge:'Readiness proof'})[id]||''}
function areaTemplate(title,eyebrow,desc,controls,rightKeys,finish){return `<div class="hero"><div class="card pad"><div class="eyebrow">${eyebrow}</div><div class="h1">${title}</div><p class="lede">${desc}</p><div class="notice">Actions on this page stay on this page. Nothing below can secretly move you elsewhere.</div></div><div class="card">${petArt()}</div></div><div class="grid"><div class="card pad"><div class="sectionTitle"><h2>Work Surface</h2><p>Tap instruments to change patient state.</p></div><div class="instrumentGrid">${controls}</div>${finish||''}${logBox()}</div><div class="card pad"><div class="sectionTitle"><h2>Department Readout</h2><p>Immediate local feedback.</p></div>${telemetry(rightKeys)}</div></div>`}
function control(label,desc,js,pct=65,accent='var(--cyan)',disabled=false){return `<button class="instrument" ${disabled?'disabled':''} onclick="${js}"><div class="dial" style="--pct:${pct}%;--accent:${accent}"></div><b>${label}</b><small>${desc}</small></button>`}
function advance(to,msg){state.stage=Math.max(state.stage,to);log(msg)}
function stabilize(){let c='';c+=control('Oxygen Support','Raise saturation + calm breathing',"state.stats.oxygen+=5; state.stats.stress-=6; spend(5); clamp(); advance(1,'Oxygen support completed.');",77);c+=control('IV Fluids','Restore hydration gradually',"state.stats.hydration+=16; state.stats.health+=4; state.tx.fluids=true; spend(5); clamp(); advance(1,'IV fluids improved hydration.');",62,'var(--teal)');c+=control('Pain Control','Reduce pain before mobility',"state.stats.pain-=18; state.stats.comfort+=9; state.tx.pain=true; spend(5); clamp(); advance(1,'Pain control administered.');",55,'var(--amber)');return areaTemplate(`${p().name} // Stabilization`,'Department 01','Correct the dangerous basics before chasing a diagnosis.',c,['oxygen','hydration','pain','stress','health'],`<div class="actionRow"><button class="btn primary" onclick="advance(2,'Stabilization signed off.');go('diagnostics')">Finish Area → Diagnostics</button><button class="btn" onclick="go('clinic')">Return to Clinic</button></div>`)}
function diagnostics(){let c='';c+=control('Physical Exam',state.tests.exam?'Completed':'Check perfusion, tenderness, neuro signs',"state.tests.exam=true; spend(5); log('Physical exam: localized tenderness, stable neurologic status.');",72);c+=control('Imaging',state.tests.imaging?'Completed':'Reveal structural injury',"state.tests.imaging=true; spend(5); log('Imaging: no unstable fracture; soft-tissue injury visible.');",67,'var(--violet)');c+=control('Laboratory',state.tests.lab?'Completed':'Check hydration and inflammation',"state.tests.lab=true; spend(5); log('Lab: dehydration confirmed; no severe anemia.');",58,'var(--teal)');let ready=state.tests.exam&&state.tests.imaging&&state.tests.lab;return areaTemplate(`${p().name} // Diagnostics`,'Evidence Deck','Diagnosis becomes available only after evidence is collected.',c,['health','pain','hydration','stress','oxygen'],`<div class="actionRow"><button class="btn" onclick="go('imaging')">Open Imaging Bay</button><button class="btn" onclick="go('laboratory')">Open Laboratory</button></div><div class="finalGate"><div><b>${ready?'Evidence complete':'Evidence incomplete'}</b><div class="subtitle">${ready?'Trauma + dehydration confirmed':'Run all three diagnostic stations'}</div></div><button class="btn primary" ${ready?'':'disabled'} onclick="advance(3,'Diagnosis locked: trauma with dehydration.');go('treatment')">Lock Diagnosis</button></div>`)}
function treatment(){let c='';c+=control('Fluid Bolus','Support perfusion + hydration',"if(state.inventory.fluids>0){state.inventory.fluids--;state.stats.hydration+=13;state.stats.health+=5;state.tx.fluids=true;clamp();note('Fluid support administered.');log('Supportive fluids delivered from inventory.')}else{log('No fluid bags. Open Pharmacy to restock.');}",70,'var(--teal)');c+=control('Analgesia','Control pain, improve comfort',"if(state.inventory.painMeds>0){state.inventory.painMeds--;state.stats.pain-=20;state.stats.comfort+=12;state.tx.pain=true;state.logic.painPlan=true;clamp();note('Analgesia administered during treatment.');log('Analgesia response: pain reduced.')}else{log('No pain medication. Open Pharmacy to restock.');}",52,'var(--amber)');c+=control('Definitive Care',p().surgical?'Prepare wound for procedure':'Wound care, bandage, medication plan',"state.stats.health+=12;state.stats.stress-=10;state.tx.definitive=true;spend(10);clamp();advance(4,'Definitive treatment completed.');",82,'var(--lime)');let done=state.tx.definitive;return areaTemplate(`${p().name} // Treatment`,'Therapeutics','Supportive care improves stability; definitive care resolves the actual problem.',c,['health','pain','hydration','comfort','stress'],`<div class="actionRow"><button class="btn primary" ${done?'':'disabled'} onclick="go('${p().surgical?'surgery':'recovery'}')">${p().surgical?'Proceed to Surgery':'Surgery Skipped → Recovery'}</button><button class="btn" onclick="go('clinic')">Return to Clinic</button></div>`)}
function surgery(){if(!p().surgical)return areaTemplate('Surgery // Not Required','Procedure Deck','This case is nonsurgical. The game says so clearly instead of leaving a dead end.',control('Surgery Skipped','No procedure indicated',"advance(5,'Surgery visibly skipped for nonsurgical case.');",100,'var(--lime)',true),['health','pain','oxygen'],`<div class="actionRow"><button class="btn primary" onclick="advance(5,'Surgery skipped; recovery authorized.');go('recovery')">Continue to Recovery</button></div>`);let c='';c+=control('Anesthesia','Stabilize plane + oxygen',"state.stats.oxygen+=4;state.stats.stress-=16;spend(10);clamp();log('Anesthesia plane stable.');",72);c+=control('Repair','Complete controlled procedure',"if(!state.logic.anesthesia){log('Surgery blocked: complete Anesthesia Console clearance first.');}else{state.stats.health+=14;state.stats.pain+=8;state.tx.surgery=true;spend(25);clamp();note('Surgical repair completed.');advance(5,'Surgical repair complete.');}",78,'var(--violet)');c+=control('Closure','Protect site + recovery plan',"state.stats.comfort+=8;state.stats.pain-=5;spend(5);clamp();log('Closure and dressing complete.');",64,'var(--teal)');return areaTemplate(`${p().name} // Surgery`,'Operating Theater','A focused procedure deck with no navigation surprises.',c,['oxygen','health','pain','stress','comfort'],`<div class="actionRow"><button class="btn" onclick="go('anesthesia')">Open Anesthesia Console</button><button class="btn primary" ${state.tx.surgery?'':'disabled'} onclick="go('recovery')">Finish Procedure → Recovery</button></div>`)}
function recovery(){let c='';c+=control('Offer Water','Hydration + thirst relief',"state.stats.hydration+=12;state.stats.thirst-=20;state.stats.trust+=3;clamp();log('Water accepted.');",62,'var(--teal)');c+=control('Offer Food','Nutrition + energy',"state.stats.hunger-=22;state.stats.energy+=12;state.stats.trust+=3;clamp();log('Food accepted.');",60,'var(--lime)');c+=control('Comfort','Stress down, trust up',"state.stats.comfort+=14;state.stats.stress-=12;state.stats.trust+=10;clamp();log('Comfort session improved trust.');",74,'var(--violet)');c+=control('Pain Support','Pain must be controlled before walking',"state.stats.pain-=14;state.stats.comfort+=6;clamp();log('Pain support improved comfort.');",48,'var(--amber)');c+=control('Quiet Rest','Restore energy',"state.stats.energy+=20;state.stats.stress-=8;clamp();log('Quiet rest completed.');",68);c+=control('Gentle Walk','Mobility + confidence',"if(state.stats.pain>45){log('Walk blocked: pain must be 45 or lower.')}else{state.stats.mobility+=15;state.stats.energy-=8;state.stats.trust+=4;clamp();log('Gentle walk completed safely.');}",58,'var(--teal)');let ready=readiness()>=82 && state.stats.pain<=45 && state.stats.hydration>=60 && state.stats.mobility>=55;return areaTemplate(`${p().name} // Recovery`,'Aftercare Habitat','This is gameplay, not a waiting room. Hydrate, feed, rest, control pain, and prove mobility.',c,['health','pain','hydration','mobility','comfort','trust','energy'],`<div class="actionRow"><button class="btn" onclick="go('paincare')">Pain & Comfort</button><button class="btn" onclick="go('mobility')">Mobility Lab</button><button class="btn" onclick="go('ward')">Recovery Ward</button></div><div class="finalGate"><div><b>Readiness ${readiness()}%</b><div class="subtitle">Need pain ≤45 • hydration ≥60 • mobility ≥55 • score ≥82</div></div><button class="btn good" ${ready?'':'disabled'} onclick="advance(7,'Recovery proof complete.');go('discharge')">Prove Ready</button></div>`)}
function readiness(){let s=state.stats;return Math.round((s.health+(100-s.pain)+s.hydration+s.mobility+s.comfort+s.trust)/6)}
function discharge(){let r=readiness();return `<div class="hero"><div class="card pad"><div class="eyebrow">Final Gate</div><div class="h1">Discharge ${p().name}</div><p class="lede">The case ends once, visibly, with a reward and a clean handoff to My Pets or the next patient.</p>${phaseStrip()}<div class="finalGate"><div><b>Readiness ${r}%</b><div class="subtitle">Current evidence and aftercare state</div></div><button class="btn good" ${r>=82?'':'disabled'} onclick="finishCase()">Complete Case</button></div>${logBox()}</div><div class="card">${petArt()}</div></div>${kpis()}`}
function finishCase(){if(!state.rewarded){state.funds+=250;state.rewarded=true;state.stage=7;save()}document.getElementById('rewardTitle').textContent=`${p().name} is safe.`;document.getElementById('rewardText').textContent='Case reward: $250 clinic funding. You can keep this rescue in My Pets or continue to a fresh patient.';document.getElementById('rewardModal').classList.add('show');render()}
function pets(){if(!state.pets.length)return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">Completed patients you keep will live here with persistent needs, care actions, and their own recovery history.</p><div class="notice">No rescued pets yet. Finish a case and choose “Keep in My Pets.”</div></div>`;return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">Persistent rescued animals. Care updates happen inline and never kick you out of this screen.</p><div class="actionRow"><button class="btn good" onclick="careAll()">Care For All Pets</button></div></div><div class="petGrid" style="margin-top:14px">${state.pets.map((x,i)=>`<div class="petCard"><div class="petFace">${x.emoji}</div><h3>${x.name}</h3><div class="subtitle">${x.species} • ${x.breed}</div><div class="petStats"><span>Health <b>${x.stats.health}</b></span><span>Pain <b>${x.stats.pain}</b></span><span>Water <b>${x.stats.hydration}</b></span><span>Trust <b>${x.stats.trust}</b></span><span>Mobility <b>${x.stats.mobility}</b></span><span>Energy <b>${x.stats.energy}</b></span></div><div class="actionRow"><button class="btn" onclick="petCare(${i},'water')">Water</button><button class="btn" onclick="petCare(${i},'food')">Food</button><button class="btn" onclick="petCare(${i},'comfort')">Comfort</button><button class="btn" onclick="petCare(${i},'rest')">Rest</button></div></div>`).join('')}</div>`}
function petCare(i,type){let s=state.pets[i].stats;if(type==='water'){s.hydration=Math.min(100,s.hydration+15);s.thirst=Math.max(0,s.thirst-20)}if(type==='food'){s.hunger=Math.max(0,s.hunger-20);s.energy=Math.min(100,s.energy+10)}if(type==='comfort'){s.comfort=Math.min(100,s.comfort+14);s.trust=Math.min(100,s.trust+8)}if(type==='rest'){s.energy=Math.min(100,s.energy+18);s.stress=Math.max(0,s.stress-8)}save();renderScreen('pets')}
function careAll(){state.pets.forEach((_,i)=>['water','food','comfort','rest'].forEach(t=>petCare(i,t)));save();renderScreen('pets')}
function keepPet(){if(!state.pets.some(x=>x.caseId===state.idx)){state.pets.push({caseId:state.idx,name:p().name,species:p().species,breed:p().breed,emoji:p().emoji,stats:{...state.stats}});save()}document.getElementById('rewardModal').classList.remove('show');go('pets')}
function nextPatient(){state.idx=(state.idx+1)%patients.length;state.stage=0;state.stats=defaults();state.tests={exam:false,imaging:false,lab:false};state.tx={fluids:false,oxygen:false,pain:false,definitive:false,surgery:false};state.log=[];state.rewarded=false;state.logic={triage:false,imagingViews:0,labPanels:0,anesthesia:false,painPlan:false,mobilityChecks:0,wardRounds:0};state.caseNotes=[];save();document.getElementById('rewardModal').classList.remove('show');go('clinic')}
function renderScreen(id){document.getElementById('funds').textContent='$'+state.funds.toLocaleString();const el=document.getElementById(id);if(id==='clinic')el.innerHTML=clinic();if(id==='stabilize')el.innerHTML=stabilize();if(id==='diagnostics')el.innerHTML=diagnostics();if(id==='treatment')el.innerHTML=treatment();if(id==='surgery')el.innerHTML=surgery();if(id==='recovery')el.innerHTML=recovery();if(id==='discharge')el.innerHTML=discharge();if(id==='pets')el.innerHTML=pets();if(id==='triage')el.innerHTML=triage();if(id==='pharmacy')el.innerHTML=pharmacy();if(id==='imaging')el.innerHTML=imaging();if(id==='laboratory')el.innerHTML=laboratory();if(id==='anesthesia')el.innerHTML=anesthesia();if(id==='paincare')el.innerHTML=paincare();if(id==='mobility')el.innerHTML=mobility();if(id==='ward')el.innerHTML=ward();if(id==='records')el.innerHTML=records();if(id==='funding')el.innerHTML=funding()}
function render(){document.getElementById('funds').textContent='$'+state.funds.toLocaleString();const active=document.querySelector('.screen.active')?.id||'clinic';renderScreen(active)}
document.getElementById('keepPet').onclick=keepPet;document.getElementById('nextPatient').onclick=nextPatient;renderNav();go('clinic');
</script>
</body>
</html>
