<style>

}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:
 radial-gradient(circle at 10% 0%,rgba(56,215,255,.12),transparent 28%),
 radial-gradient(circle at 90% 8%,rgba(185,156,255,.11),transparent 24%),
 linear-gradient(180deg,#050b0f,var(--bg) 30%,#08141a 100%);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
button{font:inherit}.shell{max-width:1440px;margin:auto;padding:0 16px 70px}
.topbar{position:sticky;top:0;z-index:30;margin:0 -16px;padding:10px 16px;background:rgba(5,12,17,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(92,183,209,.18)}
.brandrow{display:flex;align-items:center;gap:12px;min-height:54px}.sigil{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 200deg,var(--cyan),var(--teal),var(--violet),var(--cyan));padding:2px;box-shadow:0 0 32px rgba(56,215,255,.23)}.sigil>i{display:grid;place-items:center;width:100%;height:100%;border-radius:12px;background:#071219;font-style:normal;font-weight:900}.brand{font-size:19px;font-weight:900;letter-spacing:.12em}.subtitle{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}.spacer{flex:1}.funds{padding:8px 12px;border:1px solid #365c68;border-radius:12px;background:#0b1c24}.funds b{color:var(--lime)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:1px solid #294a56;background:#0b1b23;color:#a9c4ce;border-radius:12px;padding:9px 12px;cursor:pointer}.nav button.active{color:white;border-color:rgba(56,215,255,.62);background:linear-gradient(180deg,rgba(56,215,255,.18),rgba(56,215,255,.05));box-shadow:inset 0 0 20px rgba(56,215,255,.06)}
.hero{margin:18px 0 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:14px}.card{background:linear-gradient(180deg,rgba(17,42,54,.92),rgba(9,25,33,.94));border:1px solid rgba(92,166,187,.24);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:18px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.18em}.h1{font-size:clamp(28px,4vw,52px);line-height:1;margin:8px 0 10px;font-weight:950;letter-spacing:-.045em}.lede{max-width:780px;color:#b6cbd3}.phasebar{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.phase{font-size:12px;padding:7px 9px;border-radius:999px;border:1px solid #294753;color:#7597a3}.phase.done{color:#91e6cf;border-color:#2e6c60;background:rgba(94,240,203,.07)}.phase.now{color:white;border-color:#4bdfff;background:rgba(56,215,255,.13);box-shadow:0 0 24px rgba(56,215,255,.11)}
.patientVisual{min-height:270px;position:relative;background:radial-gradient(circle at 50% 42%,rgba(56,215,255,.18),transparent 32%),linear-gradient(135deg,#0a1720,#102633)}.animal{position:absolute;inset:24px;display:grid;place-items:center}.animal svg{width:min(330px,86%);filter:drop-shadow(0 18px 28px rgba(0,0,0,.35))}.scanline{position:absolute;left:7%;right:7%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 18px var(--cyan);animation:scan 3.6s ease-in-out infinite}@keyframes scan{0%,100%{top:18%;opacity:.2}50%{top:82%;opacity:.9}}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.kpi{padding:13px;border:1px solid #274753;border-radius:16px;background:rgba(7,20,27,.77)}.kpi small{display:block;color:#7999a5;text-transform:uppercase;font-size:10px;letter-spacing:.12em}.kpi strong{font-size:21px}.kpi .mini{height:5px;margin-top:8px;border-radius:99px;background:#162c35;overflow:hidden}.kpi .mini i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:inherit}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.sectionTitle{display:flex;align-items:end;gap:12px;margin-bottom:12px}.sectionTitle h2{font-size:19px;margin:0}.sectionTitle p{margin:0;color:var(--muted);font-size:12px}
.instrumentGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.instrument{padding:14px;border:1px solid #2b4a55;border-radius:16px;background:linear-gradient(180deg,#102630,#0b1b22);min-height:118px;cursor:pointer;color:white;text-align:left;transition:.16s transform,.16s border-color}.instrument:hover{transform:translateY(-2px);border-color:#4fb5ce}.instrument:active{transform:scale(.985)}.instrument b{display:block;margin-bottom:5px}.instrument small{color:#80a4b0}.dial{width:44px;height:44px;border-radius:50%;margin-bottom:9px;background:conic-gradient(var(--accent,var(--cyan)) var(--pct,70%),#1d3942 0);padding:5px}.dial:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#0b1b22;box-shadow:inset 0 0 0 1px #2b4b55}
.readout{display:grid;gap:10px}.meter{padding:11px 12px;border:1px solid #24434e;border-radius:14px;background:#0a1b22}.meterhead{display:flex;justify-content:space-between;gap:10px}.meterbar{height:9px;margin-top:8px;border-radius:999px;background:#17313a;overflow:hidden}.meterbar i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:inherit}.meter.danger .meterbar i{background:linear-gradient(90deg,var(--amber),var(--red))}
.actionRow{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{border:1px solid #315561;border-radius:13px;padding:10px 13px;color:white;background:#102731;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#17445a,#113140);border-color:#3c91aa}.btn.good{background:linear-gradient(180deg,#194a42,#11352f);border-color:#3b8b79}.btn.warn{background:linear-gradient(180deg,#4b3920,#332617);border-color:#8a6e35}.btn:disabled{opacity:.38;cursor:not-allowed}
.log{margin-top:14px;padding:12px;border-radius:14px;background:#08181e;border:1px solid #213e48;min-height:90px}.log div{padding:6px 0;border-bottom:1px solid rgba(100,160,180,.1);color:#a9c0c8}.log div:last-child{border-bottom:0}.log time{color:#5f8491;margin-right:8px}
.notice{padding:12px;border:1px solid #335967;border-radius:14px;background:rgba(56,215,255,.055);color:#c6e8f0}.screen{display:none}.screen.active{display:block}
.petGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.petCard{padding:15px;border:1px solid #2d4d58;border-radius:18px;background:linear-gradient(180deg,#102831,#0b1a21)}.petFace{height:130px;border-radius:15px;background:radial-gradient(circle at 50% 50%,rgba(157,255,123,.13),transparent 45%),#09171d;display:grid;place-items:center;margin-bottom:12px;font-size:60px}.petStats{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px;color:#9cb4bd}
.finalGate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #4b6545;border-radius:16px;background:rgba(157,255,123,.06);margin-top:14px}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,8,11,.74);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalBox{max-width:560px;width:100%;border-radius:24px;background:#0d212a;border:1px solid #3d7c8f;box-shadow:0 30px 100px #000;padding:24px;text-align:center}.reward{font-size:62px}.modalBox h2{font-size:32px;margin:8px 0}.rewardBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:900px){.hero,.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.petGrid{grid-template-columns:1fr 1fr}}

<body>
<div class="shell">
<header class="topbar">
 <div class="brandrow"><div class="sigil"><i>VG</i></div><div><div class="brand">VET GODS</div><div class="subtitle">Veterinary Intervention Command</div></div><div class="spacer"></div><div class="funds">CLINIC <b id="funds">$2,400</b></div></div>
 <nav class="nav" id="nav"></nav>
</header>

<main>
<section id="clinic" class="screen active"></section>
<section id="stabilize" class="screen"></section>
<section id="diagnostics" class="screen"></section>
<section id="treatment" class="screen"></section>
<section id="surgery" class="screen"></section>
<section id="recovery" class="screen"></section>
<section id="discharge" class="screen"></section>
<section id="pets" class="screen"></section>
</main>
</div>
<div class="modal" id="rewardModal"><div class="modalBox"><div class="reward">✦</div><div class="eyebrow">Case Complete</div><h2 id="rewardTitle">Kota is safe.</h2><p id="rewardText"></p><div class="rewardBtns"><button class="btn good" id="keepPet">Keep in My Pets</button><button class="btn primary" id="nextPatient">Next Patient</button></div></div></div>
<script>
const stages=['Intake','Stabilize','Diagnose','Treat','Surgery','Recovery','Prove Ready','Discharge'];
const navItems=[['clinic','Clinic'],['stabilize','Stabilize'],['diagnostics','Diagnostics'],['treatment','Treatment'],['surgery','Surgery'],['recovery','Recovery'],['discharge','Discharge'],['pets','My Pets']];
const patients=[
 {name:'Kota',species:'Canine',breed:'Husky mix',sex:'Male',condition:'Trauma with dehydration',surgical:false,emoji:'🐕',story:'Kota was found exhausted beside a winter service road after slipping loose from a damaged transport crate. His coat was soaked, his pads were scraped, and he had gone long enough without water that every movement had become guarded. A highway worker stayed with him until the rescue team arrived.'},
 {name:'Mira',species:'Feline',breed:'Silver tabby',sex:'Female',condition:'Deep paw laceration',surgical:true,emoji:'🐈',story:'Mira is a small silver tabby rescued from an abandoned machine shed. She survived by hiding beneath shelving until a volunteer heard her crying. A torn rear paw had become painful enough that she stopped bearing weight, but she still leaned into the rescuer who carried her out.'},
 {name:'Orion',species:'Avian',breed:'Barn owl',sex:'Male',condition:'Wing strain and shock',surgical:false,emoji:'🦉',story:'Orion was recovered at dawn beneath a farm windbreak after a violent storm. He was alert but stunned, holding one wing low and refusing to launch. The wildlife team transported him in a dark quiet carrier to reduce stress while the clinic prepared for stabilization.'},
 {name:'Juniper',species:'Canine',breed:'Shepherd mix',sex:'Female',condition:'Foreign-body injury',surgical:true,emoji:'🐕‍🦺',story:'Juniper is a young shepherd mix brought in by a trail crew after she was discovered limping near an old fence line. She had remained close to the workers instead of running away, exhausted and frightened. Imaging is needed to find what is causing the deep pain before definitive repair.'}
];
const defaults=()=>({health:68,pain:61,oxygen:91,hydration:46,stress:72,trust:29,mobility:35,comfort:30,hunger:56,thirst:64,energy:42});
let state=JSON.parse(localStorage.getItem('vetgods_reimagined')||'null')||{idx:0,stage:0,funds:2400,stats:defaults(),tests:{exam:false,imaging:false,lab:false},tx:{fluids:false,oxygen:false,pain:false,definitive:false,surgery:false},pets:[],log:[],rewarded:false};
function p(){return patients[state.idx%patients.length]}
function save(){localStorage.setItem('vetgods_reimagined',JSON.stringify(state))}
function log(msg){state.log.unshift({t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),msg});state.log=state.log.slice(0,7);save();render()}
function spend(n){state.funds=Math.max(0,state.funds-n)}
function clamp(){for(const k in state.stats)state.stats[k]=Math.max(0,Math.min(100,state.stats[k]))}
function phaseStrip(){return `<div class="phasebar">${stages.map((x,i)=>`<span class="phase ${i<state.stage?'done':i===state.stage?'now':''}">${x}</span>`).join('')}</div>`}
function petArt(){
 const q=p(), key=(q.species+' '+q.breed).toLowerCase();
 const grad=`<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#69e8ff"/><stop offset="1" stop-color="#a993ff"/></linearGradient><linearGradient id="fur" x1="0" x2="1"><stop stop-color="#dff7ff"/><stop offset=".55" stop-color="#8fb8cb"/><stop offset="1" stop-color="#5d7487"/></linearGradient></defs>`;
 let art='';
 if(key.includes('owl')) art=`<svg viewBox="0 0 360 240" aria-label="cartoon barn owl patient">${grad}<ellipse cx="180" cy="207" rx="96" ry="14" fill="#000" opacity=".25"/><path d="M118 111c-37 7-61 35-67 73 27-7 54-18 77-38M242 111c37 7 61 35 67 73-27-7-54-18-77-38" fill="#b88c62" stroke="#e9c89e" stroke-width="5"/><ellipse cx="180" cy="126" rx="65" ry="77" fill="#caa477"/><path d="M140 84c18-28 62-28 80 0 18 25 10 63-40 89-50-26-58-64-40-89z" fill="#f3e9d4"/><circle cx="158" cy="111" r="17" fill="#4a2d20"/><circle cx="202" cy="111" r="17" fill="#4a2d20"/><circle cx="158" cy="111" r="6" fill="#05090b"/><circle cx="202" cy="111" r="6" fill="#05090b"/><path d="M180 124l-9 16h18z" fill="#e5b25b"/><path d="M145 62l-17-25 30 13M215 62l17-25-30 13" fill="#aa7f58" stroke="#e0bc8e" stroke-width="4"/><path d="M161 184v26M199 184v26" stroke="#d9ad71" stroke-width="7" stroke-linecap="round"/></svg>`;
 else if(key.includes('cat')||key.includes('feline')||key.includes('tabby')) art=`<svg viewBox="0 0 360 240" aria-label="cartoon silver tabby cat patient">${grad}<ellipse cx="180" cy="207" rx="108" ry="15" fill="#000" opacity=".25"/><ellipse cx="174" cy="142" rx="88" ry="55" fill="url(#fur)"/><circle cx="253" cy="104" r="43" fill="url(#fur)"/><path d="M226 74l7-43 29 34M271 67l34-34-5 48" fill="#8097a7" stroke="#d6edf6" stroke-width="5"/><circle cx="240" cy="103" r="6" fill="#15303d"/><circle cx="270" cy="103" r="6" fill="#15303d"/><path d="M255 116l-7 7h14z" fill="#e7a7b5"/><path d="M246 126c6 6 12 6 18 0" stroke="#426474" stroke-width="3" fill="none"/><path d="M105 135c-38-3-55-27-41-51" stroke="#879eac" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M132 98l12 29M165 89l9 31M207 94l-4 29M245 77l-8 20M270 76l6 20" stroke="#617886" stroke-width="6" stroke-linecap="round"/><path d="M125 165l-9 38M174 174l-5 31M220 171l8 34" stroke="#91a8b5" stroke-width="12" stroke-linecap="round"/></svg>`;
 else if(key.includes('husky')) art=`<svg viewBox="0 0 360 240" aria-label="cartoon husky mix dog patient">${grad}<ellipse cx="180" cy="208" rx="120" ry="16" fill="#000" opacity=".25"/><ellipse cx="168" cy="148" rx="91" ry="54" fill="#8199a8"/><circle cx="260" cy="103" r="48" fill="#738b9b"/><path d="M225 79l12-50 30 39M274 67l37-37-10 55" fill="#596f7d" stroke="#d9f3ff" stroke-width="6"/><path d="M229 93c10-23 25-30 31-31 9 3 22 13 31 35-10 30-20 42-31 44-14-3-25-18-31-48z" fill="#edf8fc"/><path d="M110 137c-40-11-52-41-31-64" stroke="#748b99" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M124 171l-8 37M174 176l-3 32M221 171l8 37" stroke="#d8edf5" stroke-width="14" stroke-linecap="round"/><circle cx="244" cy="99" r="7" fill="#49bfff"/><circle cx="277" cy="99" r="7" fill="#49bfff"/><ellipse cx="260" cy="120" rx="10" ry="7" fill="#172830"/><path d="M251 132c7 7 13 7 20 0" stroke="#29444f" stroke-width="4" fill="none"/><path d="M142 105c11 8 21 11 33 11M169 99c9 8 20 11 31 11" stroke="#5f7684" stroke-width="6" stroke-linecap="round"/></svg>`;
 else art=`<svg viewBox="0 0 360 240" aria-label="cartoon shepherd mix dog patient">${grad}<ellipse cx="180" cy="208" rx="120" ry="16" fill="#000" opacity=".25"/><ellipse cx="166" cy="148" rx="92" ry="54" fill="#b88c5d"/><circle cx="257" cy="104" r="47" fill="#b88c5d"/><path d="M222 77l7-49 31 39M273 68l32-35 0 48" fill="#3c3128" stroke="#d5b282" stroke-width="6"/><path d="M231 89c7-20 18-31 27-34 10 5 21 17 28 36l-8 41-20 15-21-15z" fill="#40342a"/><path d="M103 140c-42-7-57-36-39-61" stroke="#8c6949" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M119 171l-8 37M170 176l-4 32M220 172l8 36" stroke="#c49a69" stroke-width="14" stroke-linecap="round"/><circle cx="243" cy="101" r="6" fill="#241b14"/><circle cx="274" cy="101" r="6" fill="#241b14"/><ellipse cx="259" cy="122" rx="10" ry="7" fill="#1a1410"/><path d="M250 133c7 7 14 7 21 0" stroke="#201812" stroke-width="4" fill="none"/></svg>`;
 return `<div class="patientVisual"><div class="scanline"></div><div class="animal">${art}</div><div style="position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><span class="phase now">${q.species}</span><span class="phase">${q.breed}</span><span class="phase">${q.sex}</span></div></div>`
}
function kpis(){const s=state.stats;return `<div class="kpis">${[['Health',s.health],['Pain',100-s.pain],['O₂',s.oxygen],['Hydration',s.hydration],['Trust',s.trust],['Mobility',s.mobility]].map(([n,v])=>`<div class="kpi"><small>${n}</small><strong>${Math.round(n==='Pain'?100-v:v)}${n==='O₂'?'%':''}</strong><div class="mini"><i style="--v:${v}%"></i></div></div>`).join('')}</div>`}
function telemetry(keys=['health','pain','oxygen','hydration','stress','trust','mobility','comfort']){return `<div class="readout">${keys.map(k=>{let v=state.stats[k],bad=(k==='pain'||k==='stress')&&v>45;return `<div class="meter ${bad?'danger':''}"><div class="meterhead"><span>${k[0].toUpperCase()+k.slice(1)}</span><b>${Math.round(v)}${k==='oxygen'?'%':''}</b></div><div class="meterbar"><i style="--v:${k==='pain'||k==='stress'?100-v:v}%"></i></div></div>`}).join('')}</div>`}
function logBox(){return `<div class="log">${state.log.length?state.log.map(x=>`<div><time>${x.t}</time>${x.msg}</div>`).join(''):'<div>Hospital event log ready.</div>'}</div>`}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,label])=>`<button data-go="${id}">${label}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));renderScreen(id)}
function clinic(){return `<div class="hero"><div class="card pad"><div class="eyebrow">Active Rescue // ${p().species}</div><div class="h1">${p().name}</div><p class="lede">${p().breed} • ${p().sex} • ${p().condition}. The hospital never moves you automatically. Enter a department, work there, finish it, then choose where to go next.</p><div class="notice"><b>Rescue Story:</b> ${p().story}</div>${phaseStrip()}<div class="actionRow"><button class="btn primary" onclick="go('${nextArea()}')">Enter Next Department</button><button class="btn" onclick="go('pets')">Open My Pets</button></div></div><div class="card">${petArt()}</div></div>${kpis()}<div class="grid"><div class="card pad"><div class="sectionTitle"><h2>Command Console</h2><p>Department access stays deliberate.</p></div><div class="instrumentGrid">${navItems.slice(1,7).map(([id,l],i)=>`<button class="instrument" onclick="go('${id}')"><div class="dial" style="--pct:${45+i*7}%;--accent:${i%2?'var(--teal)':'var(--cyan)'}"></div><b>${l}</b><small>${areaNote(id)}</small></button>`).join('')}</div></div><div class="card pad"><div class="sectionTitle"><h2>Live Telemetry</h2><p>No timer redraws.</p></div>${telemetry(['health','pain','oxygen','hydration','stress','trust'])}</div></div>${logBox()}`}
function nextArea(){return ['stabilize','stabilize','diagnostics','treatment',p().surgical?'surgery':'recovery','recovery','recovery','discharge'][state.stage]||'discharge'}
function areaNote(id){return ({stabilize:'Correct immediate risks',diagnostics:'Reveal evidence',treatment:'Support + definitive care',surgery:'Procedure only if required',recovery:'Playable aftercare',discharge:'Readiness proof'})[id]||''}
function areaTemplate(title,eyebrow,desc,controls,rightKeys,finish){return `<div class="hero"><div class="card pad"><div class="eyebrow">${eyebrow}</div><div class="h1">${title}</div><p class="lede">${desc}</p><div class="notice"><b>${p().breed} • ${p().sex}</b><br>${p().story}</div><div class="notice">Actions on this page stay on this page. Nothing below can secretly move you elsewhere.</div></div><div class="card">${petArt()}</div></div><div class="grid"><div class="card pad"><div class="sectionTitle"><h2>Work Surface</h2><p>Tap instruments to change patient state.</p></div><div class="instrumentGrid">${controls}</div>${finish||''}${logBox()}</div><div class="card pad"><div class="sectionTitle"><h2>Department Readout</h2><p>Immediate local feedback.</p></div>${telemetry(rightKeys)}</div></div>`}
function control(label,desc,js,pct=65,accent='var(--cyan)',disabled=false){return `<button class="instrument" ${disabled?'disabled':''} onclick="${js}"><div class="dial" style="--pct:${pct}%;--accent:${accent}"></div><b>${label}</b><small>${desc}</small></button>`}
function advance(to,msg){state.stage=Math.max(state.stage,to);log(msg)}
function stabilize(){let c='';c+=control('Oxygen Support','Raise saturation + calm breathing',"state.stats.oxygen+=5; state.stats.stress-=6; spend(5); clamp(); advance(1,'Oxygen support completed.');",77);c+=control('IV Fluids','Restore hydration gradually',"state.stats.hydration+=16; state.stats.health+=4; state.tx.fluids=true; spend(5); clamp(); advance(1,'IV fluids improved hydration.');",62,'var(--teal)');c+=control('Pain Control','Reduce pain before mobility',"state.stats.pain-=18; state.stats.comfort+=9; state.tx.pain=true; spend(5); clamp(); advance(1,'Pain control administered.');",55,'var(--amber)');return areaTemplate(`${p().name} // Stabilization`,'Department 01','Correct the dangerous basics before chasing a diagnosis.',c,['oxygen','hydration','pain','stress','health'],`<div class="actionRow"><button class="btn primary" onclick="advance(2,'Stabilization signed off.');go('diagnostics')">Finish Area → Diagnostics</button><button class="btn" onclick="go('clinic')">Return to Clinic</button></div>`)}
function diagnostics(){let c='';c+=control('Physical Exam',state.tests.exam?'Completed':'Check perfusion, tenderness, neuro signs',"state.tests.exam=true; spend(5); log('Physical exam: localized tenderness, stable neurologic status.');",72);c+=control('Imaging',state.tests.imaging?'Completed':'Reveal structural injury',"state.tests.imaging=true; spend(5); log('Imaging: no unstable fracture; soft-tissue injury visible.');",67,'var(--violet)');c+=control('Laboratory',state.tests.lab?'Completed':'Check hydration and inflammation',"state.tests.lab=true; spend(5); log('Lab: dehydration confirmed; no severe anemia.');",58,'var(--teal)');let ready=state.tests.exam&&state.tests.imaging&&state.tests.lab;return areaTemplate(`${p().name} // Diagnostics`,'Evidence Deck','Diagnosis becomes available only after evidence is collected.',c,['health','pain','hydration','stress','oxygen'],`<div class="finalGate"><div><b>${ready?'Evidence complete':'Evidence incomplete'}</b><div class="subtitle">${ready?'Trauma + dehydration confirmed':'Run all three diagnostic stations'}</div></div><button class="btn primary" ${ready?'':'disabled'} onclick="advance(3,'Diagnosis locked: trauma with dehydration.');go('treatment')">Lock Diagnosis</button></div>`)}
function treatment(){let c='';c+=control('Fluid Bolus','Support perfusion + hydration',"state.stats.hydration+=13;state.stats.health+=5;state.tx.fluids=true;spend(5);clamp();log('Supportive fluids delivered.');",70,'var(--teal)');c+=control('Analgesia','Control pain, improve comfort',"state.stats.pain-=20;state.stats.comfort+=12;state.tx.pain=true;spend(5);clamp();log('Analgesia response: pain reduced.');",52,'var(--amber)');c+=control('Definitive Care',p().surgical?'Prepare wound for procedure':'Wound care, bandage, medication plan',"state.stats.health+=12;state.stats.stress-=10;state.tx.definitive=true;spend(10);clamp();advance(4,'Definitive treatment completed.');",82,'var(--lime)');let done=state.tx.definitive;return areaTemplate(`${p().name} // Treatment`,'Therapeutics','Supportive care improves stability; definitive care resolves the actual problem.',c,['health','pain','hydration','comfort','stress'],`<div class="actionRow"><button class="btn primary" ${done?'':'disabled'} onclick="go('${p().surgical?'surgery':'recovery'}')">${p().surgical?'Proceed to Surgery':'Surgery Skipped → Recovery'}</button><button class="btn" onclick="go('clinic')">Return to Clinic</button></div>`)}
function surgery(){if(!p().surgical)return areaTemplate('Surgery // Not Required','Procedure Deck','This case is nonsurgical. The game says so clearly instead of leaving a dead end.',control('Surgery Skipped','No procedure indicated',"advance(5,'Surgery visibly skipped for nonsurgical case.');",100,'var(--lime)',true),['health','pain','oxygen'],`<div class="actionRow"><button class="btn primary" onclick="advance(5,'Surgery skipped; recovery authorized.');go('recovery')">Continue to Recovery</button></div>`);let c='';c+=control('Anesthesia','Stabilize plane + oxygen',"state.stats.oxygen+=4;state.stats.stress-=16;spend(10);clamp();log('Anesthesia plane stable.');",72);c+=control('Repair','Complete controlled procedure',"state.stats.health+=14;state.stats.pain+=8;state.tx.surgery=true;spend(25);clamp();advance(5,'Surgical repair complete.');",78,'var(--violet)');c+=control('Closure','Protect site + recovery plan',"state.stats.comfort+=8;state.stats.pain-=5;spend(5);clamp();log('Closure and dressing complete.');",64,'var(--teal)');return areaTemplate(`${p().name} // Surgery`,'Operating Theater','A focused procedure deck with no navigation surprises.',c,['oxygen','health','pain','stress','comfort'],`<div class="actionRow"><button class="btn primary" ${state.tx.surgery?'':'disabled'} onclick="go('recovery')">Finish Procedure → Recovery</button></div>`)}
function recovery(){let c='';c+=control('Offer Water','Hydration + thirst relief',"state.stats.hydration+=12;state.stats.thirst-=20;state.stats.trust+=3;clamp();log('Water accepted.');",62,'var(--teal)');c+=control('Offer Food','Nutrition + energy',"state.stats.hunger-=22;state.stats.energy+=12;state.stats.trust+=3;clamp();log('Food accepted.');",60,'var(--lime)');c+=control('Comfort','Stress down, trust up',"state.stats.comfort+=14;state.stats.stress-=12;state.stats.trust+=10;clamp();log('Comfort session improved trust.');",74,'var(--violet)');c+=control('Pain Support','Pain must be controlled before walking',"state.stats.pain-=14;state.stats.comfort+=6;clamp();log('Pain support improved comfort.');",48,'var(--amber)');c+=control('Quiet Rest','Restore energy',"state.stats.energy+=20;state.stats.stress-=8;clamp();log('Quiet rest completed.');",68);c+=control('Gentle Walk','Mobility + confidence',"if(state.stats.pain>45){log('Walk blocked: pain must be 45 or lower.')}else{state.stats.mobility+=15;state.stats.energy-=8;state.stats.trust+=4;clamp();log('Gentle walk completed safely.');}",58,'var(--teal)');let ready=readiness()>=82 && state.stats.pain<=45 && state.stats.hydration>=60 && state.stats.mobility>=55;return areaTemplate(`${p().name} // Recovery`,'Aftercare Habitat','This is gameplay, not a waiting room. Hydrate, feed, rest, control pain, and prove mobility.',c,['health','pain','hydration','mobility','comfort','trust','energy'],`<div class="finalGate"><div><b>Readiness ${readiness()}%</b><div class="subtitle">Need pain ≤45 • hydration ≥60 • mobility ≥55 • score ≥82</div></div><button class="btn good" ${ready?'':'disabled'} onclick="advance(7,'Recovery proof complete.');go('discharge')">Prove Ready</button></div>`)}
function readiness(){let s=state.stats;return Math.round((s.health+(100-s.pain)+s.hydration+s.mobility+s.comfort+s.trust)/6)}
function discharge(){let r=readiness();return `<div class="hero"><div class="card pad"><div class="eyebrow">Final Gate</div><div class="h1">Discharge ${p().name}</div><p class="lede">The case ends once, visibly, with a reward and a clean handoff to My Pets or the next patient.</p>${phaseStrip()}<div class="finalGate"><div><b>Readiness ${r}%</b><div class="subtitle">Current evidence and aftercare state</div></div><button class="btn good" ${r>=82?'':'disabled'} onclick="finishCase()">Complete Case</button></div>${logBox()}</div><div class="card">${petArt()}</div></div>${kpis()}`}
function finishCase(){if(!state.rewarded){state.funds+=250;state.rewarded=true;state.stage=7;save()}document.getElementById('rewardTitle').textContent=`${p().name} is safe.`;document.getElementById('rewardText').textContent='Case reward: $250 clinic funding. You can keep this rescue in My Pets or continue to a fresh patient.';document.getElementById('rewardModal').classList.add('show');render()}
function pets(){
 const back=`<div class="actionRow"><button class="btn primary" onclick="go('clinic')">← Return to Active Habitat</button>${state.stage<7?`<button class="btn" onclick="go('${nextArea()}')">Return to ${nextArea()[0].toUpperCase()+nextArea().slice(1)}</button>`:''}</div>`;
 if(!state.pets.length)return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">Completed patients you keep will live here with persistent needs, care actions, and their own recovery history.</p>${back}<div class="notice">No rescued pets yet. Finish a case and choose “Keep in My Pets.”</div></div>`;
 return `<div class="card pad" style="margin-top:18px"><div class="eyebrow">Rescue Habitat</div><div class="h1">My Pets</div><p class="lede">Persistent rescued animals. Care updates happen inline and never kick you out of this screen.</p>${back}<div class="actionRow"><button class="btn good" onclick="careAll()">Care For All Pets</button></div></div><div class="petGrid" style="margin-top:14px">${state.pets.map((x,i)=>`<div class="petCard"><div class="petFace">${x.emoji}</div><h3>${x.name}</h3><div class="subtitle">${x.species} • ${x.breed}${x.sex?' • '+x.sex:''}</div>${x.story?`<div class="notice" style="margin-top:10px">${x.story}</div>`:''}<div class="petStats"><span>Health <b>${x.stats.health}</b></span><span>Pain <b>${x.stats.pain}</b></span><span>Water <b>${x.stats.hydration}</b></span><span>Trust <b>${x.stats.trust}</b></span><span>Mobility <b>${x.stats.mobility}</b></span><span>Energy <b>${x.stats.energy}</b></span></div><div class="actionRow"><button class="btn" onclick="petCare(${i},'water')">Water</button><button class="btn" onclick="petCare(${i},'food')">Food</button><button class="btn" onclick="petCare(${i},'comfort')">Comfort</button><button class="btn" onclick="petCare(${i},'rest')">Rest</button></div></div>`).join('')}</div>`
}
function petCare(i,type){let s=state.pets[i].stats;if(type==='water'){s.hydration=Math.min(100,s.hydration+15);s.thirst=Math.max(0,s.thirst-20)}if(type==='food'){s.hunger=Math.max(0,s.hunger-20);s.energy=Math.min(100,s.energy+10)}if(type==='comfort'){s.comfort=Math.min(100,s.comfort+14);s.trust=Math.min(100,s.trust+8)}if(type==='rest'){s.energy=Math.min(100,s.energy+18);s.stress=Math.max(0,s.stress-8)}save();renderScreen('pets')}
function careAll(){state.pets.forEach((_,i)=>['water','food','comfort','rest'].forEach(t=>petCare(i,t)));save();renderScreen('pets')}
function keepPet(){if(!state.pets.some(x=>x.caseId===state.idx)){state.pets.push({caseId:state.idx,name:p().name,species:p().species,breed:p().breed,sex:p().sex,story:p().story,emoji:p().emoji,stats:{...state.stats}});save()}document.getElementById('rewardModal').classList.remove('show');go('pets')}
function nextPatient(){state.idx=(state.idx+1)%patients.length;state.stage=0;state.stats=defaults();state.tests={exam:false,imaging:false,lab:false};state.tx={fluids:false,oxygen:false,pain:false,definitive:false,surgery:false};state.log=[];state.rewarded=false;save();document.getElementById('rewardModal').classList.remove('show');go('clinic')}
function renderScreen(id){document.getElementById('funds').textContent='$'+state.funds.toLocaleString();const el=document.getElementById(id);if(id==='clinic')el.innerHTML=clinic();if(id==='stabilize')el.innerHTML=stabilize();if(id==='diagnostics')el.innerHTML=diagnostics();if(id==='treatment')el.innerHTML=treatment();if(id==='surgery')el.innerHTML=surgery();if(id==='recovery')el.innerHTML=recovery();if(id==='discharge')el.innerHTML=discharge();if(id==='pets')el.innerHTML=pets()}
function render(){document.getElementById('funds').textContent='$'+state.funds.toLocaleString();const active=document.querySelector('.screen.active')?.id||'clinic';renderScreen(active)}
document.getElementById('keepPet').onclick=keepPet;document.getElementById('nextPatient').onclick=nextPatient;renderNav();go('clinic');

function installTopShopLink(){
 let existing=document.getElementById("hospitalTopShopLink");
 if(existing)return;

 let all=[...document.querySelectorAll("body *")];

 let status=all.find(el=>{
   let t=(el.textContent||"").trim();
   let r=el.getBoundingClientRect();
   return /\bclinic\b/i.test(t) && /\$[\d,]+/.test(t) &&
          r.top>=0 && r.top<220 && r.width>0 && r.height>0 &&
          el.children.length<=14;
 });

 let command=all.find(el=>{
   let t=(el.textContent||"").trim();
   let r=el.getBoundingClientRect();
   return /vet gods/i.test(t) && /intervention command/i.test(t) &&
          r.top>=0 && r.top<220 && r.width>0 && r.height>0 &&
          el.children.length<=12;
 });

 let mega={};
 try{mega=JSON.parse(localStorage.getItem("vetgods_mega_expansion_v1")||"{}")||{}}catch(e){}
 let active=mega.tempPacks||{};
 let activeCount=Object.values(active).filter(v=>Number(v)>0).length;
 let link='<span id="hospitalTopShopLink" role="button" tabindex="0">SHOP'+(activeCount?' • '+activeCount+' ACTIVE':'')+'</span>';

 if(status){
   status.insertAdjacentHTML("beforeend",link);
   return;
 }

 if(command){
   command.insertAdjacentHTML("beforeend",link);
 }
}

function installCalmingBadge(){
 let old=document.getElementById("calmingPackBadge");
 let mega={};
 try{mega=JSON.parse(localStorage.getItem("vetgods_mega_expansion_v1")||"{}")||{}}catch(e){}
 let rounds=Number((mega.tempPacks||{}).trust||0);

 if(rounds<=0){if(old)old.remove();return}
 if(old){old.textContent="CALMING PACK ACTIVE • "+rounds+" ROUNDS";return}

 let shop=document.getElementById("hospitalTopShopLink");
 if(shop){
   shop.insertAdjacentHTML("afterend",'<span id="calmingPackBadge">CALMING PACK ACTIVE • '+rounds+' ROUNDS</span>');
 }
}

installTopShopLink();
installCalmingBadge();
setTimeout(()=>{installTopShopLink();installCalmingBadge()},250);
setTimeout(()=>{installTopShopLink();installCalmingBadge()},900);

</script>
<style>

<script>
(function(){
const stories={

<script id="vg-mega-expansion-js">

", "condition": "Wing impact trauma", "story": "Struck debris during a windstorm and was recovered from a school athletic field at dawn.", "needsSurgery": false}, {"name": "Maple", "species": "Small Mammal", "breed": "Guinea Pig", "sex": "Female", "age": "3 yr", "condition": "Anorexia and dehydration", "story": "Surrendered with a handwritten note asking the clinic to 'please make her comfortable and safe.'", "needsSurgery": false}, {"name": "Titan", "species": "Canine", "breed": "German Shepherd", "sex": "Male", "age": "8 yr", "condition": "Mobility crisis", "story": "Retired search dog found unable to rise after a long night pacing beside his owner's hospital bed.", "needsSurgery": false}, {"name": "Pearl", "species": "Caprine", "breed": "Pygmy Goat", "sex": "Female", "age": "4 yr", "condition": "Leg wound and infection risk", "story": "Pulled free from collapsed fencing after a barn roof failure; she kept calling until her herd answered.", "needsSurgery": true}, {"name": "Sol", "species": "Chelonian", "breed": "Red-footed Tortoise", "sex": "Male", "age": "15 yr", "condition": "Shell trauma", "story": "Recovered after flood debris damaged his outdoor habitat and cracked the edge of his shell.", "needsSurgery": true}];
const KEY="vetgods_mega_expansion_v1";
let X={funds:2500,reputation:10,favor:0,level:1,hospitalTier:0,records:[],owned:[],critical:false,diag:{},tx:{},surgery:{},recovery:{},sound:true};
try{Object.assign(X,JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(X));}catch(e){}}
function pnow(){try{return patients[state.idx]||patients[0]}catch(e){return null}}
function clamp(v){return Math.max(0,Math.min(100,Number(v)||0))}
function stat(k,f=0){try{return Number(state.stats[k]??f)}catch(e){return f}}
function setstat(k,v){try{state.stats[k]=clamp(v);if(typeof save==="function")save();}catch(e){}}
function tone(freq=520,dur=.07){if(!X.sound)return;try{let A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=freq;g.gain.value=.025;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+dur);o.stop(A.currentTime+dur);}catch(e){}}
function currentName(){let p=pnow();return p?p.name:"Unknown"}
function ensureDiag(){let n=currentName();return X.diag[n]||(X.diag[n]={exam:false,img:false,lab:false,ecg:false,ultrasound:false,evidence:[]})}
function ensureTx(){let n=currentName();return X.tx[n]||(X.tx[n]={oxygen:0,fluids:0,pain:0,wound:0,nutrition:0,warming:0,bandage:0})}
function ensureSurg(){let n=currentName();return X.surgery[n]||(X.surgery[n]={prepped:false,anesthesia:false,repair:false,closure:false,monitoring:0})}
function ensureRec(){let n=currentName();return X.recovery[n]||(X.recovery[n]={water:0,food:0,rest:0,mobility:0,comfort:0,wound:0})}
const findings={
Kota:["Paw abrasions with cold exposure","Mild hemoconcentration","Sinus tachycardia","No fracture visualized"],
Mira:["Deep paw laceration","Soft-tissue swelling","Stress leukogram pattern","No thoracic abnormality"],
Orion:["Left wing soft-tissue strain","No open fracture","Mild dehydration pattern","Rapid regular rhythm"],
Juniper:["Focal abdominal guarding","Foreign-body shadow suspected","Mild inflammatory pattern","Stable thorax"]
};
function genericFindings(){return ["Painful focal finding","Soft-tissue abnormality","Mild stress pattern","No catastrophic instability identified"]}
function diagEvidence(kind){
 let d=ensureDiag(), arr=findings[currentName()]||genericFindings(), map={exam:arr[0],img:arr[1],lab:arr[2],ecg:arr[3]||"Sinus tachycardia",ultrasound:"Focused scan: no free-fluid crisis detected"};
 d[kind]=true;if(!d.evidence.includes(map[kind]))d.evidence.push(map[kind]);
 if(hospitalTier()>=1){
   let bonus=kind==="img"?"Advanced imaging: enhanced soft-tissue detail acquired":kind==="lab"?"Advanced laboratory: extended chemistry correlation complete":"ICU-grade diagnostic correlation complete";
   if(!d.evidence.includes(bonus))d.evidence.push(bonus);
 }
 if(hospitalTier()>=2){
   let celestial="Celestial array: cross-system scan confirms treatment priority";
   if(!d.evidence.includes(celestial))d.evidence.push(celestial);
   setstat("trust",stat("trust",29)+2);setstat("stress",stat("stress",72)-3);
 }
 X.reputation+=hospitalTier()>=2?3:hospitalTier()>=1?2:1;persist();tone(640);renderPanels();
}
function applyTx(kind){
 let t=ensureTx();
 const effects={
 oxygen:["oxygen",7,"stress",-5],
 fluids:["hydration",9,"health",3],
 pain:["pain",-10,"comfort",8],
 wound:["health",6,"pain",-4],
 nutrition:["hunger",-10,"energy",6],
 warming:["health",3,"stress",-3],
 bandage:["pain",-4,"mobility",4]
 };
 let e=effects[kind];if(!e)return;
 let mult=hospitalTier()>=2?1.6:hospitalTier()>=1?1.3:1;
 setstat(e[0],stat(e[0])+e[1]*mult);setstat(e[2],stat(e[2])+e[3]*mult);
 if(hospitalTier()>=1&&kind==="oxygen")setstat("health",stat("health")+3);
 if(hospitalTier()>=1&&kind==="fluids")setstat("comfort",stat("comfort")+3);
 if(hospitalTier()>=2&&kind==="pain")setstat("stress",stat("stress")-6);
 t[kind]=(t[kind]||0)+1;X.favor+=hospitalTier()>=2?3:hospitalTier()>=1?2:1;persist();tone(520);renderPanels();
}
function surgeryStep(kind){
 let s=ensureSurg();s[kind]=true;s.monitoring=(s.monitoring||0)+1;
 if(kind==="anesthesia"){
   setstat("stress",stat("stress")-(hospitalTier()>=2?16:hospitalTier()>=1?12:8));
   setstat("pain",stat("pain")-(hospitalTier()>=2?9:hospitalTier()>=1?7:5));
   if(hospitalTier()>=1)setstat("oxygen",stat("oxygen")+4);
 }
 if(kind==="repair"){
   setstat("health",stat("health")+(hospitalTier()>=2?20:hospitalTier()>=1?15:10));
   setstat("pain",stat("pain")-(hospitalTier()>=2?11:hospitalTier()>=1?8:5));
 }
 if(kind==="closure"){
   setstat("health",stat("health")+(hospitalTier()>=2?13:hospitalTier()>=1?10:7));
   setstat("comfort",stat("comfort")+(hospitalTier()>=2?12:hospitalTier()>=1?9:6));
 }
 X.reputation+=hospitalTier()>=2?5:hospitalTier()>=1?3:2;X.favor+=hospitalTier()>=2?5:hospitalTier()>=1?3:2;persist();tone(440);renderPanels();
}
function recoveryStep(kind){
 let r=ensureRec();r[kind]=(r[kind]||0)+1;
 const E={water:["hydration",8],food:["energy",7],rest:["stress",-8],mobility:["mobility",7],comfort:["comfort",8],wound:["health",5]},e=E[kind];
 let rm=hospitalTier()>=2?1.7:hospitalTier()>=1?1.35:1;
 setstat(e[0],stat(e[0])+e[1]*rm);
 if(hospitalTier()>=1)setstat("stress",stat("stress")-2);
 if(hospitalTier()>=2)setstat("comfort",stat("comfort")+4);
 X.reputation+=hospitalTier()>=2?3:hospitalTier()>=1?2:1;persist();tone(590);renderPanels();
}
function readiness(){return Math.round((stat("health",60)+stat("hydration",50)+stat("comfort",40)+stat("mobility",35)+(100-stat("pain",60))+(100-stat("stress",70)))/6)}
function maybeLevel(){X.level=Math.max(1,Math.floor(X.reputation/20)+1)}
function hospitalTier(){return Number(X.hospitalTier||0)}
function hospitalTierName(){
 return hospitalTier()>=2?"CELESTIAL VETERINARY MEDICAL CENTER":hospitalTier()>=1?"ADVANCED VETERINARY HOSPITAL":"FIELD CLINIC";
}
function buyHospitalUpgrade(tier){
 tier=Number(tier);
 if(tier===1){
   if(hospitalTier()>=1)return;
   if(state.funds<4000){alert("Advanced Veterinary Hospital requires $4,000 clinic funds.");return}
   state.funds-=4000; X.hospitalTier=1; X.level=Math.max(X.level,3); X.reputation+=15; X.favor+=10;
   state.stats.health=clamp((state.stats.health||68)+8);
   state.stats.comfort=clamp((state.stats.comfort||30)+8);
   save();persist();tone(760,.14);render();renderPanels();return;
 }
 if(tier===2){
   if(hospitalTier()<1){alert("Purchase the $4,000 Advanced Veterinary Hospital first.");return}
   if(hospitalTier()>=2)return;
   if(state.funds<10000){alert("Celestial Veterinary Medical Center requires $10,000 clinic funds.");return}
   state.funds-=10000; X.hospitalTier=2; X.level=Math.max(X.level,6); X.reputation+=35; X.favor+=30;
   state.stats.health=clamp((state.stats.health||68)+12);
   state.stats.oxygen=clamp((state.stats.oxygen||91)+8);
   state.stats.hydration=clamp((state.stats.hydration||46)+10);
   state.stats.comfort=clamp((state.stats.comfort||30)+12);
   save();persist();tone(920,.18);render();renderPanels();
 }
}
function hospitalBenefitsHTML(){
 if(hospitalTier()===0)return '<div class="vgxCaseStory">Current facility: Field Clinic. Earn clinic funds to unlock permanent hospital technology.</div>';
 if(hospitalTier()===1)return '<div class="vgxCaseStory"><b>ACTIVE:</b> Advanced Imaging Suite • ICU Monitoring • Precision Fluid & Oxygen Control • Improved Pain/Wound Care • Safer Surgery • Faster Recovery • +$250 bonus per recorded discharge.</div>';
 return '<div class="vgxCaseStory"><b>ACTIVE:</b> Everything in Tier I plus Celestial Imaging Array • Smart ICU • Advanced Anesthesia • Precision Surgery • Regeneration Recovery Bay • Stronger stabilization • +$750 bonus per recorded discharge.</div>';
}
function criticalEvent(){
 X.critical=!X.critical;
 if(X.critical){
   let shield=hospitalTier()>=2?0.35:hospitalTier()>=1?0.65:1;
   setstat("oxygen",stat("oxygen",91)-8*shield);setstat("stress",stat("stress",70)+12*shield);setstat("health",stat("health",68)-6*shield);
 }
 persist();tone(X.critical?220:720,.12);renderPanels();
}
function dischargeRecord(){
 let p=pnow();if(!p)return;
 const rec={name:p.name,species:p.species,breed:p.breed||p.type||"",time:new Date().toLocaleString(),health:stat("health"),pain:stat("pain"),hydration:stat("hydration"),mobility:stat("mobility"),readiness:readiness(),evidence:[...ensureDiag().evidence]};
 X.records=X.records.filter(r=>r.name!==p.name);X.records.unshift(rec);
 let bonus=hospitalTier()>=2?750:hospitalTier()>=1?250:0;
 X.funds+=250+bonus;state.funds+=bonus;
 X.reputation+=hospitalTier()>=2?12:hospitalTier()>=1?8:5;X.favor+=hospitalTier()>=2?8:hospitalTier()>=1?5:3;
 save();maybeLevel();persist();tone(880,.14);render();renderPanels();
}
function adoptCurrent(){
 let p=pnow();if(!p)return;if(!X.owned.some(x=>x.name===p.name))X.owned.push({name:p.name,species:p.species,breed:p.breed||p.type||"",bond:30,hunger:70,water:70,energy:65,fun:50,memories:["Joined the Vet Gods sanctuary."]});
 persist();renderPanels();
}
function petAction(name,kind){
 let p=X.owned.find(x=>x.name===name);if(!p)return;
 const e={feed:["hunger",15],water:["water",15],play:["fun",15],rest:["energy",15],bond:["bond",10]}[kind];p[e[0]]=clamp((p[e[0]]||0)+e[1]);p.memories.unshift(kind+" care completed.");persist();tone(700);renderPanels();

function gaugesHTML(){
 let arr=[["Health",stat("health",68)],["Pain",stat("pain",61)],["Oxygen",stat("oxygen",91)],["Hydration",stat("hydration",46)],["Stress",stat("stress",72)],["Trust",stat("trust",29)],["Mobility",stat("mobility",35)],["Comfort",stat("comfort",30)]];
 return '<div class="vgxGaugeStrip">'+arr.map(a=>'<div class="vgxGauge"><div>'+a[0]+'</div><div class="num">'+Math.round(a[1])+'</div><div class="bar"><i style="width:'+clamp(a[1])+'%"></i></div></div>').join("")+'</div>';
}
function panelHTML(){
 let p=pnow(),d=ensureDiag(),t=ensureTx(),sg=ensureSurg(),r=ensureRec();maybeLevel();
 let evidence=d.evidence.length?d.evidence.map(x=>'<div class="vgxRow"><span>Evidence</span><b>'+x+'</b></div>').join(""):'<div class="vgxRow"><span>Status</span><b>No advanced evidence yet</b></div>';
 let records=X.records.slice(0,8).map(x=>'<div class="vgxCaseCard"><strong>'+x.name+' • '+x.species+'</strong><div class="vgxCaseStory">Discharged '+x.time+' • Readiness '+x.readiness+'%</div></div>').join("")||'<div class="vgxCaseStory">No completed lives recorded yet.</div>';
 let pets=X.owned.map(q=>'<div class="vgxCard"><h4>'+q.name+' • '+q.breed+'</h4><div class="vgxRow"><span>Bond</span><b>'+q.bond+'</b></div><div class="vgxRow"><span>Food</span><b>'+q.hunger+'</b></div><div class="vgxRow"><span>Water</span><b>'+q.water+'</b></div><div class="vgxRow"><span>Energy</span><b>'+q.energy+'</b></div><div class="vgxBtns"><button class="vgxBtn" data-pet="'+q.name+'" data-pa="feed">Feed</button><button class="vgxBtn" data-pet="'+q.name+'" data-pa="water">Water</button><button class="vgxBtn" data-pet="'+q.name+'" data-pa="play">Play</button><button class="vgxBtn" data-pet="'+q.name+'" data-pa="rest">Rest</button><button class="vgxBtn" data-pet="'+q.name+'" data-pa="bond">Bond</button></div></div>').join("")||'<div class="vgxCaseStory">No sanctuary residents yet.</div>';
 let caseDeck=EXTRA_CASES.map(c=>'<div class="vgxCaseCard"><strong>'+c.name+' • '+c.breed+' • '+c.sex+'</strong><div class="vgxCaseStory">'+c.condition+' — '+c.story+'</div><span class="vgxBadge">'+(c.needsSurgery?'Possible surgery':'Medical management')+'</span></div>').join("");
 return `
 <section id="vgxMega" class="vgxDock">
   <div class="vgxTitle">VET GODS • MEGA EXPANSION LAYER</div>
   <h2>${p?p.name:"Patient"} Command Intelligence</h2>
   ${gaugesHTML()}
   <div class="vgxGrid" style="margin-top:10px">
     <div class="vgxCard"><h4>Hospital Upgrades</h4>
 <div class="vgxRow"><span>Facility</span><b>${hospitalTierName()}</b></div>
 <div class="vgxRow"><span>Clinic Funds</span><b>$${state.funds.toLocaleString()}</b></div>
 <div class="vgxRow"><span>Level</span><b>${X.level}</b></div>
 <div class="vgxRow"><span>Reputation</span><b>${X.reputation}</b></div>
 ${hospitalBenefitsHTML()}
 <div class="vgxBtns">
   <button class="vgxBtn" data-upgrade="1" ${hospitalTier()>=1?"disabled":""}>${hospitalTier()>=1?"✓ ADVANCED HOSPITAL OWNED":"UPGRADE • $4,000"}</button>
   <button class="vgxBtn" data-upgrade="2" ${hospitalTier()>=2?"disabled":""}>${hospitalTier()>=2?"✓ CELESTIAL CENTER OWNED":"UPGRADE • $10,000"}</button>
 </div>
 <div class="vgxCaseStory" style="margin-top:8px"><b>$4,000:</b> Advanced imaging, ICU monitoring, stronger treatment, safer surgery, faster recovery, +$250 discharge bonus.<br><b>$10,000:</b> Celestial imaging, smart ICU, advanced anesthesia/surgery, regeneration recovery, strong critical protection, +$750 discharge bonus.</div>
 </div>
     <div class="vgxCard"><h4>Critical Case</h4><div class="vgxRow"><span>Status</span><b>${X.critical?"ACTIVE ALERT":"Stable watch"}</b></div><div class="vgxBtns"><button class="vgxBtn" data-vgx="critical">${X.critical?"Resolve Alert":"Trigger Training Alert"}</button><button class="vgxBtn" data-vgx="sound">Sound: ${X.sound?"On":"Off"}</button></div></div>
     <div class="vgxCard"><h4>Recovery Readiness</h4><div class="vgxRow"><span>Score</span><b>${readiness()}%</b></div><div class="vgxRow"><span>Goal</span><b>75%+</b></div></div>
   </div>

   <div class="vgxTabs">
    <button data-vgtab="diag">Advanced Diagnostics</button><button data-vgtab="tx">Treatment Inventory</button><button data-vgtab="surg">Operating Theater</button><button data-vgtab="rec">Recovery Ward</button><button data-vgtab="cases">Future Cases</button><button data-vgtab="records">Wall of Lives</button><button data-vgtab="pets">Sanctuary</button>
   </div>

   <div data-vgpanel="diag" class="vgxCard">
    <h4>Advanced Diagnostic Evidence</h4><div>${evidence}</div>
    <div class="vgxBtns"><button class="vgxBtn" data-diag="exam">Focused Physical Exam</button><button class="vgxBtn" data-diag="img">Imaging</button><button class="vgxBtn" data-diag="lab">CBC/Chemistry</button><button class="vgxBtn" data-diag="ecg">ECG</button><button class="vgxBtn" data-diag="ultrasound">Focused Ultrasound</button></div>
   </div>

   <div data-vgpanel="tx" class="vgxCard vgxHidden">
    <h4>Treatment Inventory</h4>
    <div class="vgxBtns"><button class="vgxBtn" data-tx="oxygen">Oxygen Support</button><button class="vgxBtn" data-tx="fluids">IV Fluid Support</button><button class="vgxBtn" data-tx="pain">Pain Management</button><button class="vgxBtn" data-tx="wound">Wound Care</button><button class="vgxBtn" data-tx="nutrition">Nutrition Support</button><button class="vgxBtn" data-tx="warming">Thermal Support</button><button class="vgxBtn" data-tx="bandage">Bandage/Splint</button></div>
   </div>

   <div data-vgpanel="surg" class="vgxCard vgxHidden">
    <h4>Operating Theater</h4>
    <div class="vgxRow"><span>Prep</span><b>${sg.prepped?"Ready":"Pending"}</b></div><div class="vgxRow"><span>Anesthesia</span><b>${sg.anesthesia?"Stable":"Pending"}</b></div><div class="vgxRow"><span>Repair</span><b>${sg.repair?"Complete":"Pending"}</b></div><div class="vgxRow"><span>Closure</span><b>${sg.closure?"Complete":"Pending"}</b></div>
    <div class="vgxBtns"><button class="vgxBtn" data-surg="prepped">Prep Patient</button><button class="vgxBtn" data-surg="anesthesia">Induce Anesthesia</button><button class="vgxBtn" data-surg="repair">Perform Repair</button><button class="vgxBtn" data-surg="closure">Close & Dress</button></div>
   </div>

   <div data-vgpanel="rec" class="vgxCard vgxHidden">
    <h4>Recovery Ward</h4><div class="vgxRow"><span>Readiness</span><b>${readiness()}%</b></div>
    <div class="vgxBtns"><button class="vgxBtn" data-rec="water">Hydrate</button><button class="vgxBtn" data-rec="food">Offer Food</button><button class="vgxBtn" data-rec="rest">Quiet Rest</button><button class="vgxBtn" data-rec="mobility">Mobility Test</button><button class="vgxBtn" data-rec="comfort">Comfort Care</button><button class="vgxBtn" data-rec="wound">Wound Check</button><button class="vgxBtn" data-vgx="record">Create Discharge Report</button><button class="vgxBtn" data-vgx="adopt">Add to Sanctuary</button></div>
   </div>

   <div data-vgpanel="cases" class="vgxHidden"><div class="vgxGrid">${caseDeck}</div></div>
   <div data-vgpanel="records" class="vgxHidden"><div class="vgxGrid">${records}</div></div>
   <div data-vgpanel="pets" class="vgxHidden"><div class="vgxGrid">${pets}</div></div>
 </section>`;
}
function renderPanels(){
 let old=document.getElementById("vgxMega"),active=old&&old.dataset.activeTab||"diag";if(old)old.remove();
 let host=document.querySelector("#screen,.screen,main");if(!host)return;
 host.insertAdjacentHTML("beforeend",panelHTML());
 let root=document.getElementById("vgxMega");if(root){root.dataset.activeTab=active;showTab(active);}
}
function showTab(n){
 document.querySelectorAll("[data-vgpanel]").forEach(x=>x.classList.toggle("vgxHidden",x.dataset.vgpanel!==n));
 let root=document.getElementById("vgxMega");if(root)root.dataset.activeTab=n;
}
document.addEventListener("click",e=>{
 let b=e.target.closest("button");if(!b)return;
 if(b.dataset.upgrade){buyHospitalUpgrade(b.dataset.upgrade);return}
 if(b.dataset.vgtab){showTab(b.dataset.vgtab);return}
 if(b.dataset.diag){diagEvidence(b.dataset.diag);return}
 if(b.dataset.tx){applyTx(b.dataset.tx);return}
 if(b.dataset.surg){surgeryStep(b.dataset.surg);return}
 if(b.dataset.rec){recoveryStep(b.dataset.rec);return}
 if(b.dataset.pet){petAction(b.dataset.pet,b.dataset.pa);return}
 if(b.dataset.vgx==="critical"){criticalEvent();return}
 if(b.dataset.vgx==="record"){dischargeRecord();return}
 if(b.dataset.vgx==="adopt"){adoptCurrent();return}
 if(b.dataset.vgx==="sound"){X.sound=!X.sound;persist();renderPanels();return}
});
let last="";
setInterval(()=>{let p=pnow(),key=(p?p.name:"")+"|"+stat("health")+"|"+stat("pain")+"|"+stat("hydration")+"|"+stat("oxygen")+"|"+stat("stress")+"|"+stat("mobility");if(key!==last){last=key;renderPanels();}},1200);
renderPanels();
})();
</script>

 try{return JSON.parse(localStorage.getItem("vetgods_mega_expansion_v1")||"{}")||{}}catch(e){return{}}
}
function writeCore(v){localStorage.setItem("vetgods_reimagined",JSON.stringify(v))}
function writeMega(v){localStorage.setItem("vetgods_mega_expansion_v1",JSON.stringify(v))}
function tier(){return Number(readMega().hospitalTier||0)}
function money(){return Number(readCore().funds||0)}

function packCatalog(){
 return {
 trauma:{name:"Trauma Response Pack",price:450,rounds:3,desc:"Stronger stabilization, oxygen, hydration and stress control."},
 pain:{name:"Pain & Comfort Pack",price:350,rounds:4,desc:"Pain support works harder and comfort rises faster."},
 diagnostics:{name:"Rapid Diagnostics Pack",price:600,rounds:3,desc:"Bonus diagnostic evidence and extra reputation."},
 surgery:{name:"Surgical Precision Pack",price:850,rounds:2,desc:"Stronger repair/closure and improved anesthesia support."},
 recovery:{name:"Recovery Booster Pack",price:500,rounds:4,desc:"Boosts water, food, rest, comfort and mobility recovery."},
 supplies:{name:"Emergency Supply Drop",price:700,rounds:5,desc:"Premium temporary supplies add health and comfort support."},
 trust:{name:"Calming Pack",price:300,rounds:4,desc:"For 4 patient rounds: every care phase lowers stress and raises trust. A CALMING PACK ACTIVE badge stays visible while it is running."},
 reward:{name:"Sponsor Bonus Pack",price:1000,rounds:3,desc:"Earn an extra $400 clinic funds on each completed patient round."}
 };
}
function packMega(){let m=readMega();m.tempPacks=m.tempPacks||{};return m}
function activeBoostHTML(){
 let m=packMega(),cat=packCatalog(),rows=[];
 Object.keys(m.tempPacks).forEach(k=>{if(Number(m.tempPacks[k])>0&&cat[k])rows.push("<b>"+cat[k].name+"</b>: "+m.tempPacks[k]+" rounds remaining")});
 return '<div class="activeBoosts">'+(rows.length?"<b>ACTIVE TEMPORARY PACKS</b><br>"+rows.join("<br>"):"No temporary packs active.")+"</div>";
}
function tempPackCards(){
 let cat=packCatalog();
 return Object.keys(cat).sort((a,b)=>cat[a].price-cat[b].price).map(k=>{let x=cat[k];return `<article class="tempPack"><h3>${x.name}</h3><div class="shopPrice">$${x.price.toLocaleString()}</div><div class="packRounds">TEMPORARY • ${x.rounds} PATIENT ROUNDS</div><div style="font-size:.78rem;line-height:1.45">${x.desc}</div><button class="shopBuy" style="margin-top:10px" data-packbuy="${k}">BUY PACK</button></article>`}).join("");
}
function showBoostNotice(msg){
 let bar=document.getElementById("boostNoticeBar");
 if(!bar){document.body.insertAdjacentHTML("beforeend",'<div id="boostNoticeBar"></div>');bar=document.getElementById("boostNoticeBar")}
 bar.innerHTML='<div class="boostNotice">'+msg+'</div>';
 setTimeout(()=>{if(bar)bar.innerHTML=""},3900);
}
function buyTempPack(key){
 let item=packCatalog()[key];if(!item)return;
 let core=readCore(),mega=packMega();core.funds=Number(core.funds||0);
 if(core.funds<item.price){alert(item.name+" requires $"+item.price.toLocaleString()+". Current funds: $"+core.funds.toLocaleString());return}
 core.funds-=item.price;mega.tempPacks[key]=Number(mega.tempPacks[key]||0)+item.rounds;
 writeCore(core);writeMega(mega);
 showBoostNotice((key==="trust"?"CALMING PACK ACTIVE: ":"PURCHASED: ")+item.name+" • "+item.rounds+" rounds active");
 screen();document.getElementById("hospitalShopScreen").classList.add("open");
}
function jackpotCatalog(){
 return [
  {id:"fifty",name:"Lucky $50",cost:10,label:"+$50 CLINIC FUNDS",reward:"money",value:50,sprite:"💰"},
  {id:"comfort",name:"Comfort Spark",cost:15,label:"+8 COMFORT",reward:"comfort",value:8,sprite:"✨"},
  {id:"trust",name:"Trust Token",cost:20,label:"+7 TRUST",reward:"trust",value:7,sprite:"🐾"},
  {id:"calm",name:"Calm Burst",cost:20,label:"-10 STRESS",reward:"stress",value:-10,sprite:"💙"},
  {id:"health",name:"Health Patch",cost:25,label:"+6 HEALTH",reward:"health",value:6,sprite:"❤️"},
  {id:"hydrate",name:"Hydration Chip",cost:25,label:"+8 HYDRATION",reward:"hydration",value:8,sprite:"💧"},
  {id:"miniSponsor",name:"Mini Sponsor",cost:40,label:"+$100 CLINIC FUNDS",reward:"money",value:100,sprite:"🎁"}
 ];
}
function jackpotCards(){
 return jackpotCatalog().map(x=>`<article class="jackpotCard" data-jackpot-card="${x.id}">
   <div class="jackpotCost">ONE-PRESS CARD • COST $${x.cost}</div>
   <h3>${x.sprite} ${x.name}</h3>
   <div class="jackpotReward">${x.label}</div>
   <div style="font-size:.72rem;opacity:.72;margin-bottom:9px">Instant in-game reward.</div>
   <button class="jackpotBtn" data-jackpot="${x.id}">ACTIVATE CARD</button>
 </article>`).join("");
}
function playJackpotTone(){
 try{
   let AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
   let o=ac.createOscillator(),g=ac.createGain();
   o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(660,ac.currentTime);
   o.frequency.exponentialRampToValueAtTime(990,ac.currentTime+.16);
   g.gain.setValueAtTime(.09,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.28);
   o.start();o.stop(ac.currentTime+.3);
 }catch(e){}
}
function spawnJackpotSprite(sprite,btn){
 let r=btn.getBoundingClientRect();
 let el=document.createElement("div");
 el.className="jackpotSprite";el.textContent=sprite;
 el.style.left=(r.left+r.width/2-12)+"px";el.style.top=(r.top-2)+"px";
 document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
}
function activateJackpot(id,btn){
 let item=jackpotCatalog().find(x=>x.id===id);if(!item)return;
 let core=readCore();core.funds=Number(core.funds||0);core.stats=core.stats||{};
 if(core.funds<item.cost){showBoostNotice("Not enough clinic funds for "+item.name);return}
 core.funds-=item.cost;
 if(item.reward==="money")core.funds+=item.value;
 else{
   let cur=Number(core.stats[item.reward]||0);
   core.stats[item.reward]=Math.max(0,Math.min(100,cur+item.value));
 }
 writeCore(core);
 playJackpotTone();
 spawnJackpotSprite(item.sprite,btn);
 let card=btn.closest(".jackpotCard");if(card){card.classList.remove("jackpotFlash");void card.offsetWidth;card.classList.add("jackpotFlash")}
 showBoostNotice("JACKPOT CARD: "+item.label+" • ACTIVATED");
 setTimeout(()=>{screen();document.getElementById("hospitalShopScreen").classList.add("open")},500);
}
function screen(){
 let old=document.getElementById("hospitalShopScreen");if(old)old.remove();
 let t=tier(),m=money();
 document.body.insertAdjacentHTML("beforeend",`<section id="hospitalShopScreen">
 <div class="shopScreenInner">
  <div class="shopScreenTop"><button class="shopBack" id="closeHospitalShop">← BACK TO PATIENT</button><div class="shopMoney">Clinic Funds: $${m.toLocaleString()}</div></div>
  <div style="font-size:.7rem;letter-spacing:.14em;opacity:.65">VET GODS FACILITIES DIVISION</div>
  <h2>🏥 Hospital Shop</h2>
  <p style="opacity:.7">Temporary care packs are listed cheapest-to-most-expensive first. Permanent hospital upgrades are at the bottom.</p>

  <div class="jackpotSection">
  <h2>🎴 Jackpot Cards</h2>
  <p style="opacity:.7;font-size:.8rem">Cheap one-press reward cards for testing. Press once and the reward activates immediately.</p>
  <div class="jackpotGrid">${jackpotCards()}</div>
 </div>
 <h2 class="tempPackTitle">⚡ Temporary Care Packs</h2>
  ${activeBoostHTML()}
  <div class="shopGrid">${tempPackCards()}</div>

  <h2 class="tempPackTitle">🏥 Permanent Hospital Upgrades</h2>
  <div class="shopGrid">
   <article class="shopTier"><div>LEVEL II</div><h3>Advanced Veterinary Hospital</h3><div class="shopPrice">$4,000</div>
    <ul><li>Advanced imaging suite</li><li>ICU monitoring</li><li>Precision oxygen and fluid support</li><li>Improved pain and wound care</li><li>Safer anesthesia and surgery</li><li>Faster recovery</li><li>+$250 upgraded discharge bonus</li></ul>
    <button class="shopBuy" data-shopbuy="1" ${t>=1?"disabled":""}>${t>=1?"✓ PURCHASED":"BUY • $4,000"}</button>
   </article>
   <article class="shopTier"><div>LEVEL III</div><h3>Celestial Veterinary Medical Center</h3><div class="shopPrice">$10,000</div>
    <ul><li>Celestial imaging array</li><li>Smart ICU stabilization</li><li>Advanced anesthesia</li><li>Precision surgery systems</li><li>Regeneration recovery bay</li><li>Major critical-case protection</li><li>+$750 upgraded discharge bonus</li></ul>
    <button class="shopBuy" data-shopbuy="2" ${t>=2?"disabled":""}>${t>=2?"✓ PURCHASED":"BUY • $10,000"}</button>
   </article>
  </div>
 </div></section>`);
}
function performUpgrade(tier){
 tier=Number(tier);
 try{
  let core=readCore(), mega=readMega();
  core.funds=Number(core.funds||0);
  mega.hospitalTier=Number(mega.hospitalTier||0);
  mega.level=Number(mega.level||1);
  mega.reputation=Number(mega.reputation||10);
  mega.favor=Number(mega.favor||0);

  if(tier===1){
   if(mega.hospitalTier>=1){alert("Advanced Veterinary Hospital is already purchased.");return}
   if(core.funds<4000){alert("Advanced Veterinary Hospital requires $4,000 clinic funds. Current funds: $"+core.funds.toLocaleString());return}
   core.funds-=4000;
   mega.hospitalTier=1;
   mega.level=Math.max(mega.level,3);
   mega.reputation+=15;
   mega.favor+=10;
   if(core.stats){
    core.stats.health=Math.min(100,Number(core.stats.health||68)+8);
    core.stats.comfort=Math.min(100,Number(core.stats.comfort||30)+8);
   }
   writeCore(core); writeMega(mega);
   alert("Advanced Veterinary Hospital purchased for $4,000.");
   location.reload();
   return;
  }

  if(tier===2){
   if(mega.hospitalTier<1){alert("Purchase the $4,000 Advanced Veterinary Hospital first.");return}
   if(mega.hospitalTier>=2){alert("Celestial Veterinary Medical Center is already purchased.");return}
   if(core.funds<10000){alert("Celestial Veterinary Medical Center requires $10,000 clinic funds. Current funds: $"+core.funds.toLocaleString());return}
   core.funds-=10000;
   mega.hospitalTier=2;
   mega.level=Math.max(mega.level,6);
   mega.reputation+=35;
   mega.favor+=30;
   if(core.stats){
    core.stats.health=Math.min(100,Number(core.stats.health||68)+12);
    core.stats.oxygen=Math.min(100,Number(core.stats.oxygen||91)+8);
    core.stats.hydration=Math.min(100,Number(core.stats.hydration||46)+10);
    core.stats.comfort=Math.min(100,Number(core.stats.comfort||30)+12);
   }
   writeCore(core); writeMega(mega);
   alert("Celestial Veterinary Medical Center purchased for $10,000.");
   location.reload();
  }
 }catch(err){
  alert("Upgrade shop error: "+err.message);
 }
}
function openShop(){screen();document.getElementById("hospitalShopScreen").classList.add("open")}
function closeShop(){let x=document.getElementById("hospitalShopScreen");if(x)x.classList.remove("open")}
document.addEventListener("click",function(e){
 if(e.target.closest("#openHospitalShop")||e.target.closest("#hospitalTopShopLink")){openShop();return}
 if(e.target.closest("#closeHospitalShop")){closeShop();return}
 let jb=e.target.closest("[data-jackpot]");if(jb){activateJackpot(jb.dataset.jackpot,jb);return}
 let pb=e.target.closest("[data-packbuy]");if(pb){buyTempPack(pb.dataset.packbuy);return}
 let b=e.target.closest("[data-shopbuy]");if(b){
  try{performUpgrade(Number(b.dataset.shopbuy));screen();document.getElementById("hospitalShopScreen").classList.add("open")}
  catch(err){alert("Upgrade shop error: "+err.message)}
 }
});

})();
</script>


<script id="temporary-pack-runtime">
(function(){
const CK="vetgods_reimagined",MK="vetgods_mega_expansion_v1";
function rd(k){try{return JSON.parse(localStorage.getItem(k)||"{}")||{}}catch(e){return{}}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function notice(msg){
 let bar=document.getElementById("boostNoticeBar");
 if(!bar){document.body.insertAdjacentHTML("beforeend",'<div id="boostNoticeBar"></div>');bar=document.getElementById("boostNoticeBar")}
 bar.innerHTML='<div class="boostNotice">'+msg+'</div>';
 setTimeout(()=>{if(bar)bar.innerHTML=""},3800);
}
let lastStage=null,lastIdx=null,lastRewarded=false;
function tick(){
 let c=rd(CK),m=rd(MK);m.tempPacks=m.tempPacks||{};c.stats=c.stats||{};
 let st=String(c.stage||""),idx=Number(c.idx||0),p=m.tempPacks;
 if(lastStage===null){lastStage=st;lastIdx=idx;lastRewarded=!!c.rewarded;return}
 const add=(k,n)=>c.stats[k]=Math.max(0,Math.min(100,Number(c.stats[k]||0)+n));
 let triggered=[];

 if(st!==lastStage){
   if(st==="stabilize"&&p.trauma>0){add("oxygen",4);add("hydration",4);add("stress",-4);triggered.push("Trauma Response")}
   if((st==="treatment"||st==="recovery")&&p.pain>0){add("pain",-4);add("comfort",4);triggered.push("Pain & Comfort")}
   if(st==="diagnostics"&&p.diagnostics>0){m.reputation=Number(m.reputation||0)+2;triggered.push("Rapid Diagnostics")}
   if(st==="surgery"&&p.surgery>0){add("health",5);add("stress",-5);triggered.push("Surgical Precision")}
   if(st==="recovery"&&p.recovery>0){add("hydration",4);add("energy",4);add("comfort",4);add("mobility",3);triggered.push("Recovery Booster")}
   if((st==="stabilize"||st==="treatment")&&p.supplies>0){add("health",3);add("comfort",2);triggered.push("Emergency Supply Drop")}
   if(p.trust>0){add("trust",5);add("stress",-7);add("comfort",3);triggered.push("CALMING PACK ACTIVE")}
   wr(CK,c);wr(MK,m);lastStage=st;
   if(triggered.length)notice("ACTIVE BOOST: "+triggered.join(" + ")+" applied");
 }

 let done=(idx!==lastIdx)||(!!c.rewarded&&!lastRewarded);
 if(done){
   if(Number(p.reward||0)>0){c.funds=Number(c.funds||0)+400;notice("SPONSOR BONUS: +$400 clinic funds")}
   let expired=[];
   Object.keys(p).forEach(k=>{
     if(Number(p[k]||0)>0){
       p[k]=Math.max(0,Number(p[k])-1);
       if(p[k]===0)expired.push(k);
     }
   });
   wr(CK,c);wr(MK,m);lastIdx=idx;
   if(expired.length)setTimeout(()=>notice("PACK EXPIRED: "+expired.join(", ")),900);
 }
 lastRewarded=!!c.rewarded;
 try{
   let b=document.getElementById("calmingPackBadge"),r=Number((m.tempPacks||{}).trust||0);
   if(r>0){
     if(!b){
       let shop=document.getElementById("hospitalTopShopLink");
       if(shop)shop.insertAdjacentHTML("afterend",'<span id="calmingPackBadge">CALMING PACK ACTIVE • '+r+' ROUNDS</span>');
     }else b.textContent="CALMING PACK ACTIVE • "+r+" ROUNDS";
   }else if(b)b.remove();
 }catch(e){}
}
setInterval(tick,1200);
})();
</script>


<style id="emergency-narrative-off">
.emergencyNarrative,.emergency-case-narrative,[data-emergency-narrative]{display:none!important}
</style>
<script id="remove-emergency-narrative-safe">
(function(){
 function clean(){
  const nodes=[...document.querySelectorAll("h1,h2,h3,h4,h5,h6,.title,.label,strong,b")];
  nodes.forEach(el=>{
   if((el.textContent||"").trim().toUpperCase()==="EMERGENCY CASE NARRATIVE"){
    let box=el.closest(".card,.panel,article,section");
    if(box) box.style.display="none";
    else el.style.display="none";
   }
  });
 }
 clean();
 new MutationObserver(clean).observe(document.body,{childList:true,subtree:true});
})();
</script>


<script id="remove-emergency-narrative-menu">
(function(){
 function cleanMenu(){
  const targets=[...document.querySelectorAll("button,a,[role='button'],.menuItem,.navItem,.tab,.chip,.pill,li")];
  targets.forEach(el=>{
   const t=(el.textContent||"").trim().toUpperCase();
   if(t==="EMERGENCY CASE NARRATIVE" || t.includes("EMERGENCY CASE NARRATIVE")){
     el.remove();
   }
  });

  // Also remove select/options if one exists.
  document.querySelectorAll("option").forEach(opt=>{
    if((opt.textContent||"").trim().toUpperCase().includes("EMERGENCY CASE NARRATIVE")){
      opt.remove();
    }
  });
 }
 cleanMenu();
 new MutationObserver(cleanMenu).observe(document.body,{childList:true,subtree:true});
})();

<style id="vg-clean-panel-numbers">
.vg-numbered-panel{position:relative!important}
.vg-panel-num{
 position:absolute;top:8px;right:8px;z-index:25;
 padding:4px 7px;border:1px solid rgba(56,215,255,.58);
 border-radius:8px;background:rgba(5,16,23,.92);
 color:#8cecff;font-size:9px;font-weight:900;
 letter-spacing:.08em;line-height:1;pointer-events:none
}
</style>
<script id="vg-clean-panel-numbering">
(function(){
 let busy=false,timer;
 function renumber(){
   if(busy)return; busy=true;
   document.querySelectorAll(".vg-panel-num").forEach(x=>x.remove());
   document.querySelectorAll(".vg-numbered-panel").forEach(x=>x.classList.remove("vg-numbered-panel"));
   const active=document.querySelector(".screen.active");
   if(active){
     [...active.querySelectorAll(".card")]
       .filter(x=>x.offsetParent!==null && !x.closest("#hospitalShopScreen"))
       .forEach((x,i)=>{
         x.classList.add("vg-numbered-panel");
         const n=document.createElement("span");
         n.className="vg-panel-num";
         n.textContent="P"+(i+1);
         x.appendChild(n);
       });
   }
   busy=false;
 }
 function queue(){clearTimeout(timer);timer=setTimeout(renumber,40)}
 addEventListener("load",renumber);
 document.addEventListener("click",()=>setTimeout(renumber,80));
 const main=document.querySelector("main");
 if(main)new MutationObserver(queue).observe(main,{childList:true,subtree:true});
 setTimeout(renumber,120);
})();
</script>
