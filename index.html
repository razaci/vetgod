   let center="";
   if(c.completed){
     center=`<div class="tw-complete"><h2>THE LIVING ARCHIVE</h2><p>${p.name}'s campaign is complete. Seven expeditions connected fossil recovery, reanimation, morph research and the buried Institute mystery.</p><button class="tw-choice" onclick="VG_closeTool('VG_WORKING_TWINE')">RETURN TO SANCTUARY</button></div>`;
   } else if(c.phase==="prep"){
     center=`<div class="tw-card"><div class="tw-kicker">${ch[0]} · EXPEDITION PREPARATION</div><h2>${ch[1]}</h2><p>Choose one field tool, one recovered artifact if available, and one morph capability. Preparation changes the options that can appear in the expedition.</p>
     <b>FIELD TOOL</b><div class="tw-prep">${VG_TOOLS.map(x=>`<button class="vg-btn ${c.prep.tool===x?"selected":""}" onclick='VG_prepPick("tool",${JSON.stringify(x)})'>${x}</button>`).join("")}</div>
     <b>ARTIFACT</b><div class="tw-prep">${(c.artifacts.length?c.artifacts:["None"]).map(x=>`<button class="vg-btn ${c.prep.artifact===x?"selected":""}" onclick='VG_prepPick("artifact",${JSON.stringify(x)})'>${x}</button>`).join("")}</div>
     <b>MORPH CAPABILITY</b><div class="tw-prep">${(abilities.length?abilities:["General Field Training"]).map(x=>`<button class="vg-btn ${c.prep.ability===x?"selected":""}" onclick='VG_prepPick("ability",${JSON.stringify(x)})'>${x}</button>`).join("")}</div>
     <button class="tw-choice" onclick="VG_launchExpedition()">🧭 DEPART FOR ${ch[2].toUpperCase()}</button><button class="tw-choice secret" onclick="VG_openLivingBoard()">🏕️ OPEN 30-MINUTE LIVING EXPEDITION BOARD</button></div>`;
   } else if(c.phase==="return"){
     const a=VG_ARTS[c.chapter-1];
     center=`<div class="tw-complete"><div class="tw-kicker">CHAPTER FINALE · RETURN TO INSTITUTE</div><h2>${a} Recovered</h2><p>${p.name} returns safely. The artifact, clues, map discoveries and decisions are now part of this resident's permanent record.</p><button class="tw-choice" onclick="VG_useArtifact('${a}','science')">🔬 RESEARCH ARTIFACT</button><button class="tw-choice" onclick="VG_useArtifact('${a}','resonance')">◉ INSTALL IN CRADLE RESEARCH</button><button class="tw-choice" onclick="VG_useArtifact('${a}','exploration')">🧭 REGISTER FOR FIELD USE</button><button class="tw-choice secret" onclick="VG_nextChapter()">CONTINUE TO NEXT ACT →</button></div>`;
   } else {
     let title,txt,choices="";
     if(c.node===0){title=ch[2];txt=`At base camp, ${p.name} reacts to a signal beyond the surveyed boundary. A normal expedition route and a creature-led route diverge ahead.`;choices=`<button class="tw-choice" onclick="VG_storyAct('science')">🔬 SCAN THE EXCAVATION GRID</button><button class="tw-choice" onclick="VG_storyAct('instinct')">🐾 TRUST ${p.name.toUpperCase()}'S INSTINCT</button><button class="tw-choice" onclick="VG_storyAct('exploration')">🧭 LEAVE THE MARKED ROUTE</button>`}
     else if(c.node===1){title=ch[3];txt="The first clue points toward terrain ordinary equipment cannot easily cross. Your morph design can now matter.";choices=`<button class="tw-choice" onclick="VG_storyAct('compassion')">💙 SEARCH CAREFULLY WITH THE RESIDENT</button>${abilities.slice(0,3).map(a=>`<button class="tw-choice ability" onclick='VG_useAbility(${JSON.stringify(a)})'>🧬 USE MORPH ABILITY · ${a}</button>`).join("")}${c.prep.artifact?`<button class="tw-choice secret" onclick="VG_storyAct('resonance')">◆ USE ${c.prep.artifact}</button>`:""}`}
     else if(c.node===2){title=ch[4];txt="An abandoned research station contains conflicting records. Someone investigated this signal before the current Institute existed.";choices=Object.keys(VG_SCI).map(k=>`<button class="tw-choice" onclick="VG_storyScientist('${k}')"><b>TRANSMIT TO ${VG_SCI[k][0]}</b><br><span class="story-require">${VG_SCI[k][1]}</span></button>`).join("")}
     else if(c.node===3){title=ch[5];txt="Clues converge on a sealed structure. Your earlier choices determine whether an additional route appears.";const secret=c.science>=2||c.instinct>=2||c.resonance>=2||c.exploration>=2;choices=`${secret?`<button class="tw-choice secret" onclick="VG_storyAct('resonance')">✦ SECRET ROUTE · CONNECT THE CLUES</button>`:""}<button class="tw-choice danger" onclick="VG_storyAct('risk')">⚠ ENTER THE PRIMARY CHAMBER</button>`}
     else {title="Chapter Discovery";txt=`The expedition resolves around a recoverable ${VG_ARTS[c.chapter-1]}. This is a conclusive chapter ending, not a dead end.`;choices=`<button class="tw-choice secret" onclick="VG_finishChapter()">◆ RECOVER ARTIFACT · RETURN TO INSTITUTE</button>`}
     choices+=`<button class="tw-choice secret" onclick="VG_openLivingBoard()">🏕️ ENTER LIVING EXPEDITION BOARD</button>`;
     center=`<div class="tw-card"><div class="tw-kicker">CURRENT LOCATION · ${title}</div><h2>${title}</h2>${c.node===2?`<div class="tw-memory">RESONANCE ECHO: ${p.name} pauses as if recognizing the shape of the buried structure. The game records this as an unexplained reconstructed-memory event.</div>`:""}<p>${txt}</p>${choices}<div class="tw-nextcards"><div>NEXT POSSIBILITY<br>Discovery</div><div>NEXT POSSIBILITY<br>Creature Event</div><div>NEXT POSSIBILITY<br>Artifact/Puzzle</div></div></div>`;
   }
   const map=ch.slice(2).map((x,j)=>`<div class="tw-map-node ${c.locations.includes(x)?"found":""} ${(c.phase==="field"&&Math.min(c.node,3)===j)?"current":""}">${c.locations.includes(x)?"◆":"◇"} ${x}</div>`).join("");
   const clues=c.clues.slice(-8).map(x=>`<div class="tw-clue">CLUE · ${x}</div>`).join("")||"<small>No clues recovered.</small>";
   const arts=c.artifacts.map(a=>`<div class="artifact-card"><b>◆ ${a}</b><br><button onclick="VG_useArtifact('${a}','science')">Research</button> <button onclick="VG_useArtifact('${a}','resonance')">Cradle</button> <button onclick="VG_useArtifact('${a}','exploration')">Field</button></div>`).join("")||"<small>No artifacts yet.</small>";
   e.innerHTML=`<div class="tw-rpg"><div class="vg-head"><div><small>${ch[0]} · ${p.name}</small><br><b>🧭 RESONANCE EXPEDITION DECK</b></div><button class="vg-btn" onclick="VG_closeTool('VG_WORKING_TWINE')">✕ CLOSE</button></div>
   <div class="campaign-hud"><div><span>CAMPAIGN</span><b>${pct}%</b><div class="tw-bar"><i style="width:${pct}%"></i></div></div><div><span>FIELD XP</span><b>${c.fieldXP}</b></div><div><span>BOND</span><b>${c.bond}</b></div><div><span>CLUES</span><b>${c.clues.length}</b></div></div>
   <div class="tw-rpg-grid"><aside class="tw-left"><div class="tw-card"><b>🦖 ${p.name}</b><div style="font-size:54px">${p.icon||"🦖"}</div><small>${p.formName||p.species||""}</small><br>${abilities.map(a=>`<span class="tw-chip on">${a}</span>`).join("")||'<span class="tw-chip">General Training</span>'}<hr><small>Curiosity ${c.curiosity} · Courage ${c.courage}<br>Science ${c.science} · Instinct ${c.instinct}<br>Exploration ${c.exploration} · Resonance ${c.resonance}</small></div><div class="tw-card"><b>EXPEDITION MAP</b>${map}</div></aside>
   <main>${center}</main>
   <aside class="tw-right"><div class="tw-card"><b>INVESTIGATION BOARD</b>${clues}</div><div class="tw-card"><b>FIELD INVENTORY</b>${arts}</div><div class="tw-card"><b>SCIENTIST COMMS</b>${Object.keys(VG_SCI).map(k=>`<div class="scientist-card"><b>${VG_SCI[k][0]}</b><br><small>Trust ${c.scientist[k]||0}</small></div>`).join("")}</div><div class="tw-card"><b>RECENT DECISIONS</b><div style="font-size:7px;max-height:130px;overflow:auto">${c.decisions.slice(-10).reverse().map(x=>"• "+x+"<br>").join("")||"No decisions yet."}</div></div></aside></div></div>`;
   e.querySelectorAll(".vg-btn,.artifact-card button").forEach(b=>{b.style.cssText+=";margin:3px;padding:6px;border:1px solid #5fbfd0;border-radius:7px;background:#0b2936;color:white;font-weight:bold;font-size:7px"});
 };

 const F30_LOCATIONS=["Base Camp","Fossil Wall","Collapsed Tunnel","Research Tent","Excavation Pit","Underground Pool","Ancient Door","Lower Laboratory"];
 const F30_SPOTS=[
  ["Fossil Wall","🦴","Layered bones and mineral traces cover the exposed wall."],
  ["Collapsed Tunnel","⛰️","A blocked passage carries a faint repeating vibration."],
  ["Research Tent","⛺","Abandoned field equipment and damaged notes remain inside."],
  ["Excavation Pit","⛏️","A marked 4×4 grid waits for careful excavation."],
  ["Underground Pool","🌊","Dark water conceals a submerged ledge and metallic reflection."],
  ["Ancient Door","🚪","A constructed doorway sits beneath strata older than the current dig."],
  ["Lower Laboratory","⚙️","A hidden laboratory contains dormant Institute-compatible machinery."]
 ];
 const F30_EVENTS=[
  ["DISCOVERY","A mineral seam flashes with the same spectrum as the Resonance Cradle."],
  ["CREATURE MEMORY","The resident freezes and looks toward a place it has never visited in its reconstructed life."],
  ["SCIENTIST TRANSMISSION","A scientist requests a live sample and challenges your current theory."],
  ["EQUIPMENT","The field scanner reports two contradictory depths for the same object."],
  ["HIDDEN PASSAGE","Airflow reveals a narrow route behind the excavation wall."],
  ["MYSTERY","A symbol matches one found at a completely different fossil recovery site."]
 ];
 function F30(p){
   const c=VG_campaign(p);
   c.board=c.board||{location:"Base Camp",visited:["Base Camp"],searched:[],grid:{},samples:[],journal:[],heldCards:[],deck:18,energy:12,actions:0,theories:[],labA:"",labB:"",last:"Expedition board ready.",major:false};
   return c.board;
 }
 function f30stamp(){const d=new Date();return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
 function f30log(b,s){b.journal.push(f30stamp()+" — "+s);if(b.journal.length>80)b.journal.shift();b.last=s}
 function f30save(){try{save()}catch(e){}}
 window.VG_openLivingBoard=function(){
   const p=vgResident();if(!p)return false;const c=VG_campaign(p);c.phase="board";F30(p);VG_drawTwine();return false
 };
 window.F30_visit=function(name){
   const p=vgResident(),b=F30(p);b.location=name;if(!b.visited.includes(name))b.visited.push(name);b.actions++;b.energy=Math.max(0,b.energy-1);f30log(b,"Moved to "+name+".");f30save();VG_drawTwine();return false
 };
 window.F30_search=function(name){
   const p=vgResident(),c=VG_campaign(p),b=F30(p);if(!b.searched.includes(name))b.searched.push(name);
   const clue=["Three-band transmission","Unknown excavation marks","Fossil mineral anomaly","Missing-team equipment","Subsurface power trace","Resident recognition event","Founder-era insignia"][b.searched.length%7];
   if(!c.clues.includes(clue))c.clues.push(clue);b.actions++;b.energy=Math.max(0,b.energy-1);f30log(b,"Investigated "+name+" and recorded clue: "+clue+".");f30save();VG_drawTwine();return false
 };
 window.F30_dig=function(cell,tool){
   const p=vgResident(),c=VG_campaign(p),b=F30(p);if(b.grid[cell])return false;
   const n=cell.charCodeAt(0)+Number(cell[1])+c.chapter;
   let result=(n%5===0)?"Fossil Fragment":(n%7===0)?"Mineral Sample":(n%9===0)?"Machine Component":"Stone Matrix";
   b.grid[cell]=result;b.actions++;b.energy=Math.max(0,b.energy-1);
   if(result!=="Stone Matrix"&&!b.samples.includes(result))b.samples.push(result);
   if(result!=="Stone Matrix"){const clue="Excavation "+cell+": "+result;if(!c.clues.includes(clue))c.clues.push(clue)}
   f30log(b,"Excavated sector "+cell+" with "+tool+": "+result+".");f30save();VG_drawTwine();return false
 };
 window.F30_drawCard=function(){
   const p=vgResident(),b=F30(p);if(b.deck<=0||b.heldCards.length>=3)return false;
   const ev=F30_EVENTS[(b.deck+b.actions)%F30_EVENTS.length];b.deck--;b.heldCards.push(ev);f30log(b,"Drew "+ev[0]+" card.");f30save();VG_drawTwine();return false
 };
 window.F30_playCard=function(i){
   const p=vgResident(),c=VG_campaign(p),b=F30(p),ev=b.heldCards.splice(i,1)[0];if(!ev)return false;
   if(ev[0]==="DISCOVERY"||ev[0]==="MYSTERY"){const clue=ev[1];if(!c.clues.includes(clue))c.clues.push(clue)}
   if(ev[0]==="CREATURE MEMORY"){c.bond++;c.resonance++}
   if(ev[0]==="HIDDEN PASSAGE"&&!b.visited.includes("Lower Laboratory"))b.visited.push("Lower Laboratory");
   b.actions++;f30log(b,"Played "+ev[0]+": "+ev[1]);f30save();VG_drawTwine();return false
 };
 window.F30_labPick=function(slot,item){const p=vgResident(),b=F30(p);b[slot]=item;VG_drawTwine();return false};
 window.F30_analyze=function(){
   const p=vgResident(),c=VG_campaign(p),b=F30(p);if(!b.labA||!b.labB){b.last="Load two discoveries into the field workstation.";VG_drawTwine();return false}
   const theory="Connection: "+b.labA+" + "+b.labB;
   if(!b.theories.includes(theory))b.theories.push(theory);c.science++;c.resonance++;b.actions++;
   f30log(b,"Field workstation established "+theory+".");b.labA="";b.labB="";
   if(b.theories.length>=2&&c.clues.length>=6&&!b.major){b.major=true;if(!b.visited.includes("Ancient Door"))b.visited.push("Ancient Door");f30log(b,"MAJOR DISCOVERY: a constructed chamber has been located beneath sector C4.")}
   f30save();VG_drawTwine();return false
 };
 window.F30_companion=function(action){
   const p=vgResident(),c=VG_campaign(p),b=F30(p);if(action==="follow"){c.bond+=2;c.instinct++;if(!b.visited.includes("Ancient Door"))b.visited.push("Ancient Door");f30log(b,p.name+" led the team toward a concealed structure.")}
   if(action==="observe"){c.curiosity+=2;c.resonance++;f30log(b,"Observed "+p.name+" quietly; a resonance behavior was recorded.")}
   if(action==="scan"){c.science++;f30log(b,"Scanned the wall indicated by "+p.name+".")}
   b.actions++;f30save();VG_drawTwine();return false
 };
 window.F30_rest=function(){const p=vgResident(),b=F30(p);b.energy=Math.min(12,b.energy+5);f30log(b,"Established a short field camp and restored expedition energy.");f30save();VG_drawTwine();return false};
 window.F30_return=function(){const p=vgResident(),c=VG_campaign(p),b=F30(p);c.phase="field";c.fieldXP+=Math.floor(b.actions/3);vgLog(c,"Returned from living expedition board with "+c.clues.length+" clues and "+b.theories.length+" theories.");f30save();VG_drawTwine();return false};

 function F30_render(p,c,b){
   const abilities=VG_ABILITIES.filter(a=>vgHasAbility(p,a));
   const cells=[];for(const r of ["A","B","C","D"])for(let n=1;n<=4;n++)cells.push(r+n);
   const samplePool=[...new Set([...(b.samples||[]),...(c.artifacts||[]),...(p.fieldItems||[])])];
   const spots=F30_SPOTS.map(x=>`<button class="f30spot ${b.searched.includes(x[0])?"done":""} ${x[0]===b.location?"hot":""}" onclick='F30_visit(${JSON.stringify(x[0])})'>${x[1]} ${x[0]}<br><small>${x[2]}</small></button>`).join("");
   return `<div class="field30"><div class="vg-head"><div><small>LIVING EXPEDITION BOARD · ${p.name}</small><br><b>CURRENT LOCATION · ${b.location}</b></div><button class="vg-btn" onclick="F30_return()">← STORY DECK</button></div>
   <div class="campaign-hud"><div><span>FIELD ENERGY</span><b>${b.energy}/12</b></div><div><span>ACTIONS</span><b>${b.actions}</b></div><div><span>CLUES</span><b>${c.clues.length}</b></div><div><span>DECK</span><b>${b.deck}</b></div></div>
   <div class="field30grid"><aside>
    <div class="f30panel"><b>🦖 ${p.name}</b><div style="font-size:58px">${p.icon||"🦖"}</div><small>Bond ${c.bond} · Courage ${c.courage} · Curiosity ${c.curiosity}</small><br>${abilities.map(a=>`<span class="tw-chip on">${a}</span>`).join("")||'<span class="tw-chip">General Field Training</span>'}<div class="f30actions"><button onclick="F30_companion('follow')">🐾 FOLLOW COMPANION</button><button onclick="F30_companion('observe')">👁 OBSERVE QUIETLY</button><button onclick="F30_companion('scan')">🔬 SCAN WHAT IT FOUND</button></div></div>
    <div class="f30panel"><b>EXPEDITION LOCATIONS</b>${F30_LOCATIONS.filter(x=>b.visited.includes(x)).map(x=>`<div class="tw-map-node ${x===b.location?"current":""}" onclick='F30_visit(${JSON.stringify(x)})'>◆ ${x}</div>`).join("")}</div>
    <div class="f30panel"><b>FIELD JOURNAL</b><div class="f30journal">${b.journal.slice().reverse().map(x=>`<div>${x}</div>`).join("")||"<div>No field entries yet.</div>"}</div></div>
   </aside><main>
    <div class="f30scene"><div class="tw-kicker">EXPLORE WITHOUT LEAVING THIS PAGE</div><h2>${b.location}</h2><p>Inspect locations, excavate the grid, play expedition cards, work with ${p.name}, connect clues and analyze discoveries. The page changes around your investigation rather than sending you through menus.</p><div class="f30spots">${spots}</div>
    <div class="f30actions"><button onclick='F30_search(${JSON.stringify(b.location)})'>🔎 INVESTIGATE CURRENT LOCATION</button><button onclick="F30_drawCard()">🃏 DRAW EXPEDITION CARD</button><button onclick="F30_rest()">⛺ ESTABLISH SHORT FIELD CAMP</button></div>
    ${b.major?`<div class="tw-memory"><b>MAJOR DISCOVERY</b><br>A constructed chamber has been located beneath excavation sector C4. The resident recognizes the doorway and the Resonance Cradle signature is present.</div>`:""}</div>
    <div class="f30panel"><b>EXCAVATION GRID · A1–D4</b><p class="small">Choose a sector. Each square is persistent for this resident.</p><div class="f30gridmap">${cells.map(cell=>`<button class="f30cell ${b.grid[cell]?"dug":""} ${b.grid[cell]&&b.grid[cell]!=="Stone Matrix"?"find":""}" onclick='F30_dig(${JSON.stringify(cell)},"Brush + Scanner")'>${cell}<br>${b.grid[cell]||"?"}</button>`).join("")}</div></div>
    <div class="f30panel"><b>HELD EXPEDITION CARDS · MAX 3</b><div class="f30deck">${b.heldCards.map((x,i)=>`<button class="f30card" onclick="F30_playCard(${i})"><b>${x[0]}</b><br>${x[1]}</button>`).join("")||'<div class="f30card">Draw cards to inject discoveries, memories, equipment problems and hidden passages into this location.</div>'}</div></div>
    <div class="f30panel"><b>PORTABLE FIELD WORKSTATION</b><div class="f30lab"><div class="f30slot"><b>SLOT A</b><br>${b.labA||"Empty"}</div><div class="f30slot"><b>SLOT B</b><br>${b.labB||"Empty"}</div></div><div>${samplePool.map(x=>`<span class="tw-chip" onclick='F30_labPick(${b.labA?JSON.stringify("labB"):JSON.stringify("labA")},${JSON.stringify(x)})'>${x}</span>`).join("")||"<small>Excavate or recover artifacts to obtain samples.</small>"}</div><button class="story-choice" onclick="F30_analyze()">🔬 CONNECT + ANALYZE LOADED DISCOVERIES</button></div>
   </main><aside>
    <div class="f30panel"><b>INVESTIGATION BOARD</b>${c.clues.slice(-12).map(x=>`<div class="f30clue">${x}</div>`).join("")||"<small>No clues yet.</small>"}${b.theories.map(x=>`<div class="f30theory">THEORY · ${x}</div>`).join("")}</div>
    <div class="f30panel"><b>INVENTORY / SAMPLES</b>${samplePool.map(x=>`<span class="tw-chip on">${x}</span>`).join("")||"<small>Empty.</small>"}</div>
    <div class="f30panel"><b>INSTITUTE UPLINK</b><div class="scientist-card"><b>Dr. Mara Venn</b><br><small>Biological resonance research</small></div><div class="scientist-card"><b>Dr. Elias Rook</b><br><small>Signal-origin investigation</small></div><div class="scientist-card"><b>Dr. Nia Sol</b><br><small>Mineral/site analysis</small></div><button class="vg-btn" onclick="VG_open3DObject('settings-current')">3D INSPECTION*</button><p class="small">*3D remains available from the resident's normal Sanctuary controls if this temporary board context has no viewer registration.</p></div>
   </aside></div><div class="f30toast">${b.last}</div></div>`;
 }
 window.VG_open3D=function(i){
   const p=getResident(i);if(!p){alert("Resident unavailable.");return false}
   const e=make("VG_WORKING_3D");e.dataset.i=String(i);e.dataset.ry="0";e.dataset.zoom="1";
   VG_draw3D();e.style.display="block";e.scrollTop=0;return false;
 };
 window.VG_rotate3D=function(n){const e=make("VG_WORKING_3D");e.dataset.ry=String(Number(e.dataset.ry||0)+n);VG_apply3D()};
 window.VG_zoom3D=function(n){const e=make("VG_WORKING_3D");e.dataset.zoom=String(Math.max(.6,Math.min(1.6,Number(e.dataset.zoom||1)+n)));VG_apply3D()};
 window.VG_apply3D=function(){const e=make("VG_WORKING_3D"),r=e.querySelector("#VG_RIG");if(r)r.style.transform=`translate(-50%,-50%) rotateY(${e.dataset.ry||0}deg) scale(${e.dataset.zoom||1})`};
 window.VG_draw3D=function(){
   const e=make("VG_WORKING_3D"),p=e.__resident||getResident(Number(e.dataset.i));if(!p)return;
   const rec=p.morphRecord||{},data=rec.channels||rec.customizations||rec.designSnapshot?.channels||{};
   e.innerHTML=`<div style="max-width:950px;margin:auto"><div style="position:sticky;top:0;background:#02070c;padding:8px;border-bottom:1px solid #31596b"><small>CONCEPTUAL PSEUDO-3D · NOT MEDICAL ANATOMY</small><br><b>🔬 ${p.name} · ${p.formName||p.species||"Resident"}</b><button style="float:right" onclick="VG_closeTool('VG_WORKING_3D')">✕ CLOSE</button></div>
   <div id="VG_STAGE" style="height:430px;position:relative;overflow:hidden;border:1px solid #557b8d;border-radius:16px;margin-top:10px;background:radial-gradient(circle,#173b4b,#02070c 70%);perspective:800px;touch-action:none"><div style="position:absolute;left:8px;top:8px;font-size:8px">DRAG OR USE BUTTONS TO ROTATE</div><div id="VG_RIG" style="position:absolute;left:50%;top:50%;width:210px;height:210px;transform:translate(-50%,-50%);transition:transform .15s"><div style="position:absolute;inset:0;border:2px solid #63d9ee;border-radius:50%;transform:rotateX(70deg)"></div><div style="font-size:115px;text-align:center;padding-top:35px">${p.icon||"🦖"}</div></div></div>
   <div style="margin-top:8px"><button onclick="VG_rotate3D(-30)">← ROTATE</button><button onclick="VG_rotate3D(30)">ROTATE →</button><button onclick="VG_zoom3D(.1)">＋ ZOOM</button><button onclick="VG_zoom3D(-.1)">－ ZOOM</button><button onclick="document.getElementById('VG_WORKING_3D').dataset.ry='0';document.getElementById('VG_WORKING_3D').dataset.zoom='1';VG_apply3D()">RESET</button></div>
   <div style="border:1px solid #31596b;border-radius:12px;padding:10px;margin-top:8px"><b>SAVED MORPH FEATURES</b><br>${Object.entries(data).slice(0,60).map(([k,v])=>`<span style="display:inline-block;border:1px solid #45697a;border-radius:99px;padding:4px 7px;margin:3px;font-size:8px">${k}: ${v}</span>`).join("")||"Resident morph record retained."}</div></div>`;
   e.querySelectorAll("button").forEach(b=>{b.style.cssText="margin:5px;padding:9px;border:1px solid #63d9ee;border-radius:8px;background:#0b2936;color:white;font-weight:bold"});
   const st=e.querySelector("#VG_STAGE");let down=false,lx=0;st.onpointerdown=q=>{down=true;lx=q.clientX;st.setPointerCapture(q.pointerId)};st.onpointermove=q=>{if(!down)return;VG_rotate3D((q.clientX-lx)*.5);lx=q.clientX};st.onpointerup=()=>down=false;st.onpointercancel=()=>down=false;
 };
})();
</script>
<script id="vetgods-global-polish-js">
(function(){
  function safe(v,f){return (v===undefined||v===null||v==="")?f:v}
  function activeResident(){
    try{
      if(window.state){
        if(state.activePatient) return state.activePatient;
        if(state.activeCase) return state.activeCase;
        if(state.currentPatient) return state.currentPatient;
        if(Array.isArray(state.sanctuary) && state.sanctuary.length) return state.sanctuary[0];
      }
    }catch(e){}
    return null;
  }
  function stage(){
    try{return safe(state.careStage||state.stage||state.currentStage||state.phase,"Institute") }catch(e){return "Institute"}
  }
  function form(p){
    return safe(p&&(p.formName||p.morphName||p.form||p.species),"Unassigned");
  }
  function stability(p){
    if(!p)return "Standby";
    const v=p.stability ?? p.health ?? p.condition ?? p.vitals?.stability;
    return typeof v==="number" ? Math.round(v)+"%" : safe(v,"Stable");
  }
  function updateStrip(){
    let bar=document.getElementById("vg-case-strip");
    if(!bar){
      bar=document.createElement("div");bar.id="vg-case-strip";
      const nav=document.getElementById("nav");
      if(nav&&nav.parentNode) nav.parentNode.insertBefore(bar,nav.nextSibling);
      else document.body.insertBefore(bar,document.body.firstChild);
    }
    const p=activeResident();
    let saved="Local";
    try{ if(localStorage) saved="Saved"; }catch(e){}
    bar.innerHTML=
      '<div class="vgcs resident"><small>ACTIVE RESIDENT</small><b>'+safe(p&&p.name,"No active case")+'</b></div>'+
      '<div class="vgcs"><small>CARE STAGE</small><b>'+stage()+'</b></div>'+
      '<div class="vgcs"><small>STABILITY</small><b>'+stability(p)+'</b></div>'+
      '<div class="vgcs optional"><small>MORPH</small><b>'+form(p)+'</b></div>'+
      '<div class="vgcs save optional"><small>SAVE STATUS</small><b>● '+saved+'</b></div>';
  }
  window.VG_updateCaseStrip=updateStrip;
  document.addEventListener("click",function(){setTimeout(updateStrip,30)},true);
  document.addEventListener("change",function(){setTimeout(updateStrip,30)},true);
  window.addEventListener("load",updateStrip);
  setTimeout(updateStrip,100);
})();
</script>
