<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VET GODS · Veterinary Morph Institute</title>
<style>
:root{
  --bg:#050b13;--bg2:#07131f;--panel:#0b1926;--panel2:#0e2231;
  --line:#27495c;--line2:#3d6d7f;--cyan:#79e7ff;--mint:#7cf0b1;
  --gold:#ffd66f;--red:#ff7d8e;--violet:#bd9cff;--text:#eef9ff;--muted:#8faebb;
  --shadow:0 14px 36px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html{overflow-y:scroll;overflow-x:hidden;scroll-behavior:auto;background:var(--bg)}
body{
  margin:0;min-height:100vh;overflow-x:hidden;overflow-y:visible;
  font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 12% 0%,rgba(76,191,255,.11),transparent 27%),
    radial-gradient(circle at 89% 11%,rgba(170,100,255,.08),transparent 25%),
    linear-gradient(180deg,#040911,#07121c 42%,#050b12);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
a{color:inherit}
#app{min-height:100vh}
.top-shell{
  position:sticky;top:0;z-index:1000;
  background:rgba(4,10,17,.96);backdrop-filter:blur(13px);
  border-bottom:1px solid #203c4c;box-shadow:0 8px 25px rgba(0,0,0,.28)
}
.brand-row{
  max-width:1500px;margin:auto;padding:11px 18px 9px;
  display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center
}
.brand{display:flex;gap:12px;align-items:center}
.sig{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:1px solid #4b7990;background:
    radial-gradient(circle at 38% 32%,#7ce7ff 0 3%,transparent 4%),
    conic-gradient(from 20deg,#11364b,#351f5d,#133d31,#11364b);
  box-shadow:inset 0 0 19px #76eaff30,0 0 20px #65dfff15;font-size:22px
}
.brand h1{font-size:17px;letter-spacing:.16em;margin:0;font-weight:1000}
.brand .sub{font-size:8px;color:var(--muted);letter-spacing:.12em;margin-top:3px}
.resources{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  border:1px solid #294f63;background:#0a1b27;border-radius:9px;
  padding:6px 9px;min-width:86px
}
.chip b{display:block;color:#8eabba;font-size:7px;letter-spacing:.08em}
.chip span{font-size:11px;font-weight:900}
.nav-wrap{max-width:1500px;margin:auto;padding:0 18px 10px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{
  border:1px solid #27495b;border-radius:8px;background:#0a1721;color:#a6bfca;
  min-height:34px;padding:6px 10px;font-size:8px;font-weight:900;letter-spacing:.03em
}
.nav button.active{background:#13384a;border-color:#6bcde6;color:#effcff;box-shadow:inset 0 0 18px #55dcff12}
.nav button.done{border-color:#356b51;color:#83e4ac}
.nav button.locked{opacity:.33}
.nav button.meta{border-color:#554578;color:#ccb7ff}
main{max-width:1500px;margin:auto;padding:16px 18px 70px}
.hero{
  position:relative;overflow:hidden;border:1px solid #315468;border-radius:18px;
  background:
    radial-gradient(circle at 83% 25%,rgba(131,113,255,.16),transparent 22%),
    radial-gradient(circle at 25% 0%,rgba(76,215,255,.12),transparent 32%),
    linear-gradient(135deg,#0b1a27,#08121d);
  box-shadow:var(--shadow);padding:18px;margin-bottom:13px
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.23;
  background-image:
    linear-gradient(rgba(105,218,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(105,218,255,.08) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(90deg,transparent,#000 45%,#000)
}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:center}
.eyebrow{font-size:8px;letter-spacing:.2em;color:#7ddcf5;font-weight:1000;text-transform:uppercase}
.hero h2{font-size:29px;line-height:1.05;margin:7px 0 8px;letter-spacing:-.02em}
.hero p{margin:0;color:#a3bfcb;max-width:790px;font-size:11px;line-height:1.65}
.creature-emblem{
  pointer-events:none;user-select:none;
  min-height:160px;border:1px solid #315368;border-radius:16px;
  background:radial-gradient(circle at 50% 45%,#17394a,#09131e 65%);
  display:grid;place-items:center;position:relative;overflow:hidden
}
.creature-emblem .animal{font-size:76px;filter:drop-shadow(0 0 16px #6edfff38)}
.creature-emblem .ring{position:absolute;width:135px;height:135px;border:1px solid #5cd8ff52;border-radius:50%}
.creature-emblem .ring:before,.creature-emblem .ring:after{content:"";position:absolute;border-radius:50%;inset:10px;border:1px dashed #8adfff35}
.creature-emblem .ring:after{inset:-16px;border-style:solid;border-color:#9b7dff24}
.status-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status-pill{
  padding:6px 9px;border:1px solid #2c5061;border-radius:999px;background:#07141d;
  font-size:8px;color:#a7c3ce
}
.status-pill strong{color:#f1fbff}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.7fr);gap:13px}
.panel{
  border:1px solid #29495a;border-radius:14px;background:linear-gradient(180deg,#0a1824,#09141e);
  box-shadow:0 9px 24px rgba(0,0,0,.22);padding:13px;margin-bottom:12px
}
.panel h3{font-size:11px;letter-spacing:.08em;margin:0 0 8px}
.panel h4{font-size:9px;letter-spacing:.06em;margin:12px 0 7px;color:#cdebf4}
.muted{color:var(--muted)}
.small{font-size:8px;line-height:1.5}
.callout{
  border-left:3px solid var(--cyan);padding:8px 10px;background:#0b202d;border-radius:0 8px 8px 0;
  font-size:9px;color:#b9d2dc;line-height:1.55;margin:9px 0
}
.callout.good{border-left-color:var(--mint)}
.callout.warn{border-left-color:var(--gold)}
.callout.danger{border-left-color:var(--red)}
.stagebar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:13px}
.stage{
  height:5px;border-radius:8px;background:#172a36;border:1px solid #243c49
}
.stage.done{background:#2a8b5a;border-color:#4acc83}
.stage.current{background:#34a9ca;border-color:#65defd;box-shadow:0 0 10px #57dfff44}
.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}
.action-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.action{
  min-height:62px;text-align:left;border:1px solid #305467;border-radius:10px;
  background:linear-gradient(180deg,#102534,#0b1b27);color:#effbff;padding:10px
}
.action:hover:not(:disabled){border-color:#62bdd6;background:#123042}
.action.done{border-color:#397d58;background:#112b22}
.action strong{display:block;font-size:9px;letter-spacing:.04em}
.action span{display:block;font-size:8px;color:#8faebb;line-height:1.45;margin-top:3px}
.gate{
  border:1px solid #426374;border-radius:12px;background:#08141e;padding:11px;margin-top:12px
}
.gate.good{border-color:#3e7657;background:#0c1f18}
.gate h4{margin:0 0 6px;font-size:9px}
.gate-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.check{
  border:1px solid #263f4c;border-radius:7px;padding:6px;background:#091822;font-size:8px;color:#9fb8c3
}
.check.ok{border-color:#34694d;color:#82dfaa;background:#0d2118}
.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.primary,.secondary,.danger-btn{
  border-radius:9px;min-height:40px;padding:8px 13px;font-size:8px;font-weight:1000;letter-spacing:.04em
}
.primary{border:1px solid #56bdd7;background:#123d50;color:#effdff}
.secondary{border:1px solid #4c6672;background:#0b1a24;color:#bad0d9}
.danger-btn{border:1px solid #8a4852;background:#33151d;color:#ffd8de}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.metric{border:1px solid #294553;border-radius:9px;padding:8px;background:#081620}
.metric b{font-size:7px;color:#82a3b2;display:block}
.metric .num{font-size:16px;font-weight:1000;margin-top:2px}
.bar{height:6px;background:#13252f;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#49b6d7,#7ae6b0);width:50%}
.log{
  max-height:none;border:1px solid #263f4b;border-radius:9px;background:#061019;padding:8px;
  font-size:8px;line-height:1.55;color:#93adba
}
.log div+div{margin-top:4px;padding-top:4px;border-top:1px solid #142630}
.morph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.morph-card{
  position:relative;border:1px solid #345466;border-radius:13px;background:#0a1823;padding:12px;
  min-height:286px
}
.morph-card.selected{border-color:#8c7be9;box-shadow:0 0 0 1px #8e7df25e,0 0 24px #7d6fff18}
.morph-icon{font-size:42px}
.morph-card h3{font-size:14px;margin:7px 0 3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.tag{font-size:7px;border:1px solid #38586a;border-radius:999px;padding:3px 6px;color:#9fc4d0}
.procon{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.procon div{font-size:8px;line-height:1.45;border:1px solid #263f4b;border-radius:7px;padding:6px}
.procon .pro{color:#93e9b4}.procon .con{color:#ffadba}
.ability-list{display:grid;gap:5px;margin-top:8px}
.ability{font-size:8px;border:1px solid #27424e;border-radius:7px;padding:6px;background:#07141d}
.phase{
  border:1px solid #294b5d;border-radius:10px;padding:9px;background:#081721;margin-bottom:7px
}
.phase.current{border-color:#62c7df;background:#0d2633}
.phase.done{border-color:#377054;background:#0b2018}
.phase-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.phase-name{font-size:9px;font-weight:1000}
.phase-state{font-size:7px;color:#89a7b4}
.world-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.world{
  border:1px solid #345262;border-radius:12px;padding:11px;background:#0a1823
}
.world.selected{border-color:#c09cff;background:#18132b}
.world h3{font-size:11px;margin:0 0 5px}
.world p{font-size:8px;color:#91aebb;line-height:1.5;margin:0}
.sanctuary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pet{
  border:1px solid #345366;border-radius:13px;background:#0a1924;padding:11px
}
.pet .face{font-size:36px}
.pet h3{font-size:12px;margin:5px 0 2px}
.pet-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.pet-story-btn{
  width:100%;margin-top:7px;min-height:38px;border-radius:8px;
  border:1px solid #7765ad;background:#201b3c;color:#eadfff;
  font-size:7px;font-weight:1000;letter-spacing:.05em
}
.pet-story-btn:hover{background:#2b2550;border-color:#a995ed}
.story-card{
  border:1px solid #5d4e87;border-radius:14px;
  background:linear-gradient(180deg,#15152b,#0b1320);padding:14px
}
.story-card h2{margin:6px 0 8px;font-size:24px}
.story-beat{
  border:1px solid #314a5a;border-radius:10px;background:#091722;
  padding:9px;margin-top:8px;font-size:8px;line-height:1.6;color:#aac3cd
}

.pet-actions button{min-height:33px;border:1px solid #315464;border-radius:7px;background:#102735;color:#dff7ff;font-size:7px;font-weight:900}
.codex-table{width:100%;border-collapse:collapse;font-size:8px}
.codex-table th,.codex-table td{border-bottom:1px solid #1f3845;padding:8px;text-align:left;vertical-align:top}
.codex-table th{color:#86a7b5;font-size:7px;letter-spacing:.08em}
.empty{padding:22px;text-align:center;border:1px dashed #345364;border-radius:12px;color:#88a6b4;font-size:9px}
.modal{
  position:fixed;inset:0;z-index:5000;display:none;place-items:center;padding:20px;
  background:rgba(1,5,9,.82);backdrop-filter:blur(8px)
}
.modal.open{display:grid}
.modal-card{
  width:min(720px,96vw);border:1px solid #54778a;border-radius:18px;
  background:linear-gradient(180deg,#0c1e2c,#08131e);box-shadow:0 30px 80px #0009;padding:18px
}
.modal-card h2{font-size:24px;margin:7px 0}
.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.reward{border:1px solid #315264;border-radius:9px;padding:9px;background:#081620;text-align:center}
.reward b{font-size:15px;display:block}.reward span{font-size:7px;color:#8facb8}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:6000;max-width:360px;
  border:1px solid #3f6a7d;border-radius:10px;background:#0a1b27;color:#dff8ff;
  padding:10px 12px;font-size:8px;line-height:1.45;box-shadow:var(--shadow);display:none
}
.toast.show{display:block}
@media(max-width:1050px){
  .grid,.hero-grid{grid-template-columns:1fr}
  .morph-grid,.sanctuary-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .brand-row{grid-template-columns:1fr}.resources{justify-content:flex-start}
  .action-grid,.action-grid.three,.morph-grid,.sanctuary-grid,.world-grid{grid-template-columns:1fr}
  .gate-list{grid-template-columns:1fr}.stagebar{grid-template-columns:repeat(5,1fr)}
}

/* ADVANCED INSTITUTE REDESIGN */
.hub-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hub-card{border:1px solid #2d5366;background:linear-gradient(180deg,#0e2231,#09141f);border-radius:14px;padding:12px;min-height:148px;box-shadow:var(--shadow)}
.hub-card.unlocked{border-color:#447c61;background:linear-gradient(180deg,#102b26,#091c1a)}
.hub-card.locked{opacity:.68}
.hub-card h3{margin:5px 0 7px;font-size:13px}.hub-card p{font-size:8px;line-height:1.55;color:var(--muted)}
.big-kpi{font-size:25px;font-weight:1000;color:var(--cyan);line-height:1}.mini-kpi{font-size:8px;color:var(--muted);margin-top:4px}
.inventory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.inv-item{border:1px solid #315365;background:#0a1721;border-radius:9px;padding:8px;font-size:8px}.inv-item b{color:#fff}.inv-item .qty{float:right;color:var(--gold);font-weight:900}
.room-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.room-node{border:1px solid #345264;border-radius:11px;padding:10px;background:#081721}.room-node.open{border-color:#4a8467;background:#0c211b}.room-node strong{display:block;font-size:9px;margin-bottom:5px}.room-node span{font-size:7px;color:var(--muted)}
.assignment{border:1px solid #36576a;border-radius:11px;padding:10px;background:#091722;margin-top:8px}.assignment.done{border-color:#4a8467;background:#0d221c}.assignment h4{margin:0 0 6px;font-size:10px}.assignment .reward{color:var(--gold);font-weight:800}
.recipe-card{border:1px solid #475067;border-radius:11px;padding:10px;background:#0d1420}.recipe-card.done{border-color:#4a8467;background:#0c211a}.recipe-card h3{margin:0 0 6px}.requirement-line{font-size:7px;line-height:1.6;color:#b8c9d1}.requirement-line .yes{color:var(--mint)}.requirement-line .no{color:var(--red)}
.rank-banner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;border:1px solid #6f5f2f;background:linear-gradient(90deg,#2a2411,#101b26);padding:12px;border-radius:14px}.rank-badge{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#162a39;border:2px solid var(--gold);font-size:27px}.rank-title{font-size:18px;font-weight:1000}.rank-progress{height:7px;background:#172733;border-radius:99px;overflow:hidden;margin-top:7px}.rank-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));border-radius:99px}
.expectation-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.expectation{border:1px solid #315163;background:#091722;border-radius:10px;padding:9px}.expectation b{display:block;font-size:9px}.expectation span{font-size:7px;color:var(--muted)}
.field-skill{border:1px solid #6a5c91;background:linear-gradient(180deg,#17162d,#0a1420);border-radius:12px;padding:10px;margin-top:10px}
@media(max-width:1050px){.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.inventory-grid,.room-map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.hub-grid,.inventory-grid,.room-map,.expectation-board{grid-template-columns:1fr}.rank-banner{grid-template-columns:auto 1fr}.rank-banner>.big-kpi{grid-column:1/-1}}

.institute-floor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.floor-room{border:1px solid var(--line);border-radius:13px;padding:12px;background:linear-gradient(180deg,#0d2030,#08131d)}
.floor-room.open{border-color:#37735a;box-shadow:inset 0 0 0 1px rgba(124,240,177,.08)}
.floor-room.locked{opacity:.48}
.floor-room .room-icon{font-size:28px}
.floor-room button{width:100%;margin-top:8px}
.mission-step{border:1px solid var(--line);border-radius:11px;padding:10px;margin:8px 0;background:#091722}
.mission-step.current{border-color:var(--gold);background:#171b1d}
.mission-step.done{border-color:#347558;background:#0b1c17}
.tool-rack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tool-card{border:1px solid var(--line);border-radius:10px;padding:9px;background:#091722}
.tool-card.equipped{border-color:var(--mint);background:#0b211c}
.project-stage{display:flex;gap:6px;align-items:center;margin:9px 0}
.project-stage i{height:7px;flex:1;border-radius:99px;background:#162b37;border:1px solid #284555}
.project-stage i.done{background:var(--mint);border-color:#57b98a}
.room-console{border:1px solid var(--line2);border-radius:13px;padding:13px;background:linear-gradient(145deg,#0b1b28,#101a2d)}
.room-console .console-readout{font-family:ui-monospace,monospace;color:var(--cyan);font-size:12px;padding:9px;border:1px solid #244657;background:#051017;border-radius:8px;margin:7px 0}
@media(max-width:850px){.institute-floor{grid-template-columns:1fr}.tool-rack{grid-template-columns:1fr}}


/* ===== ANIMATED MORPH SHOWCASE ===== */
@keyframes pulseRing{0%{transform:scale(.7);opacity:.8}70%{transform:scale(1.45);opacity:.08}100%{transform:scale(1.6);opacity:0}}
@keyframes morphGlow{0%,100%{filter:drop-shadow(0 0 10px #5de6ff) brightness(1)}50%{filter:drop-shadow(0 0 28px #b88cff) brightness(1.35)}}
@keyframes holoSweep{0%{transform:translateY(-120%)}100%{transform:translateY(220%)}}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cardReveal{0%{transform:scale(.82) rotateX(18deg);opacity:0}100%{transform:scale(1) rotateX(0);opacity:1}}
@keyframes chargeFlash{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spinCore{to{transform:rotate(360deg)}}
@keyframes starDrift{0%{background-position:0 0,0 0}100%{background-position:180px 320px,-220px 440px}}
@keyframes scanBlink{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes morphShake{0%,100%{transform:translate(0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.morph-showcase{
 position:relative;overflow:hidden;border:1px solid #3a6c85;border-radius:18px;
 min-height:330px;background:
 radial-gradient(circle at 50% 35%,rgba(88,174,255,.16),transparent 28%),
 radial-gradient(circle at 50% 60%,rgba(170,95,255,.12),transparent 30%),
 linear-gradient(180deg,#06101b,#071827 60%,#03080e);
 box-shadow:inset 0 0 50px rgba(80,190,255,.07),0 18px 45px rgba(0,0,0,.35);
}
.morph-showcase::before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background-image:radial-gradient(circle,#7ee8ff 1px,transparent 1px),radial-gradient(circle,#a986ff 1px,transparent 1px);
 background-size:42px 42px,67px 67px;opacity:.12;animation:starDrift 18s linear infinite;
}
.morph-platform{
 position:absolute;left:50%;bottom:38px;transform:translateX(-50%);
 width:230px;height:70px;border-radius:50%;
 border:2px solid #4fd4ef;background:radial-gradient(ellipse,rgba(78,213,239,.2),rgba(2,12,18,.8) 65%);
 box-shadow:0 0 32px rgba(70,220,255,.35),inset 0 0 25px rgba(70,220,255,.2);
}
.morph-core{
 position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
 width:150px;height:150px;border-radius:50%;display:grid;place-items:center;
 animation:floatBob 2.4s ease-in-out infinite,morphGlow 2s ease-in-out infinite;
}
.morph-creature{

<style id="vetgods-global-polish">
:root{
  --vg-gap:8px; --vg-radius:10px; --vg-radius-lg:14px;
  --vg-panel:#07151d; --vg-panel2:#0a1c26; --vg-line:#294b5b;
  --vg-text:#edfaff; --vg-muted:#8faeba; --vg-hot:#70dbea;
  --vg-shadow:0 8px 22px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{line-height:1.35}
main,section,.panel,.card,.vg-card,.tw-card,.f30panel{min-width:0}
h1,h2,h3,h4{line-height:1.08;letter-spacing:.015em}
h1{margin:5px 0 7px!important}
h2{margin:5px 0 7px!important}
h3,h4{margin:4px 0 6px!important}
p{margin:5px 0 8px}
hr{border:0;border-top:1px solid var(--vg-line);margin:8px 0}

/* One compact control language */
button,.btn,.fx-button,.pet-story-btn,.secondary,.primary{
  min-height:30px;
  border-radius:8px!important;
  transition:transform .08s ease,filter .12s ease,border-color .12s ease,background .12s ease!important;
}
button:active,.btn:active,.fx-button:active,.pet-story-btn:active{transform:translateY(1px) scale(.99)}
button:focus-visible{outline:2px solid var(--vg-hot);outline-offset:2px}
button:disabled{filter:saturate(.4);opacity:.45}

/* Tight, aligned panel system */
.panel,.card,.vg-card,.tw-card,.f30panel{
  border-radius:var(--vg-radius)!important;
  box-shadow:var(--vg-shadow);
}
.panel,.card{margin-bottom:var(--vg-gap)!important}
.grid,.cards,.row,.controls,.actions{gap:var(--vg-gap)!important}

/* Reduce competing animation; preserve meaningful scanners/rewards */
.panel,.card,.vg-card,.nav-group,#nav button,.pet-story-btn{
  animation-duration:2.8s!important;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* Compact navigation stays compact everywhere */
#nav{
  position:relative!important;
  display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;
  gap:3px!important;padding:3px 2px!important;margin:0 0 5px!important;
  scrollbar-width:thin;
}
#nav button{
  flex:0 0 auto!important;width:auto!important;min-width:0!important;
  height:24px!important;min-height:24px!important;max-height:24px!important;
  padding:2px 7px!important;margin:0!important;font-size:6.5px!important;
  line-height:1!important;border-radius:6px!important;white-space:nowrap!important;
}

#vg-case-strip{
  position:sticky;top:0;z-index:9000;
  display:grid;grid-template-columns:minmax(115px,1.2fr) repeat(4,minmax(70px,.7fr));
  gap:4px;padding:5px 7px;margin:0 0 7px;
  border:1px solid #31596b;border-radius:9px;
  background:rgba(4,15,22,.94);backdrop-filter:blur(9px);
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}

function residentSettingsRows(p){
  const r=p.morphRecord||{},snap=r.designSnapshot||{},live=r.livingChoices||snap.livingChoices||{},ch=r.channels||r.customizations||{};
  const rows=[];
  const add=(group,key,value)=>{
    if(value===undefined||value===null||value===""||(Array.isArray(value)&&!value.length))return;
    let v=value;
    if(Array.isArray(v))v=v.join(", ");
    else if(typeof v==="object")v=Object.values(v).map(x=>x?.value||x?.name||x).join(", ");
    rows.push({group,key,value:v});
  };
  add("IDENTITY","Resident",p.name);add("IDENTITY","Original Species",p.species);add("IDENTITY","Final Morph",p.formName);
  add("IDENTITY","Morph Theme",p.theme);add("IDENTITY","Temperament",p.temperament);add("IDENTITY","Habitat",p.habitat);
  add("CORE FORM","Catalyst",r.catalyst);add("CORE FORM","Strength",r.strength);add("CORE FORM","Tradeoff",r.trade);
  add("CORE FORM","Abilities",r.abilities);add("CORE FORM","Tags",p.tags||r.tags);add("CORE FORM","Base Traits",r.baseTags);
  Object.entries(live).forEach(([k,v])=>{
    const chosen=v?.value||v;
    let opts="";
    if(typeof STEPS!=="undefined"){
      const st=STEPS.find(s=>s.key===k);
      if(st)opts=st.choices.map(q=>q[0]).join(" / ");
    }
    add("LIVING MORPH DECISIONS",k,chosen+(opts?"  ·  OPTIONS: "+opts:""));
  });
  Object.entries(ch).forEach(([k,v])=>{
    const def=(typeof MORPH_CUSTOMIZATIONS!=="undefined"?MORPH_CUSTOMIZATIONS:[]).find(x=>x[0]===k);
    add("30-CHANNEL TRANSFORMATION DATA",k,def ? (v+"  ·  OPTIONS: "+def[1].join(" / ")) : v);
  });
  Object.entries(r.workshop||{}).forEach(([k,v])=>add("MORPH WORKSHOP",k.replace(/([A-Z])/g," $1"),v));
  Object.entries((r.architecture||{}).systems||{}).forEach(([k,v])=>add("EXOTIC BODY SYSTEMS",k.replace(/([A-Z])/g," $1"),v?.name||v));
  add("RESIDENT STATUS","Health",p.health);add("RESIDENT STATUS","Hydration",p.hydration);add("RESIDENT STATUS","Energy",p.energy);
  add("RESIDENT STATUS","Comfort",p.comfort);add("RESIDENT STATUS","Bond",p.bond);add("RESIDENT STATUS","Mastery",p.mastery);
  const derived=["Adaptation Profile","Mobility Profile","Sensory Profile","Field Stability","Resonance Profile","Quest Readiness","Environmental Fit","Rescue Utility","Exploration Bias","Artifact Affinity"];
  derived.forEach(k=>{if(rows.length<60){let seed=(String(p.name)+k).split("").reduce((a,c)=>a+c.charCodeAt(0),0);add("DERIVED PROFILE READOUTS",k,(45+(seed%51))+"%")}});
  return rows.slice(0,60);
}

const RLT_INTERVAL=15*60*1000;
const RLT_PLACES=["Sanctuary Habitat","Feeding Station","Water Station","Rest Nest","Observation Deck","Morphology Lab","Fossil Garden","Training Yard","Medical Check","Research Wing"];
const RLT_ACTS={
 "Sanctuary Habitat":["wandering through the habitat","watching the other residents","settling near a familiar shelter"],
 "Feeding Station":["investigating the feeding station","eating quietly","checking a new enrichment feeder"],
 "Water Station":["drinking at the water station","watching reflections in the water","resting beside the water system"],
 "Rest Nest":["sleeping","stretching after a rest","nesting with familiar enrichment items"],
 "Observation Deck":["watching activity beyond the Institute","tracking movement through the observation glass","sitting quietly beside the western window"],
 "Morphology Lab":["watching technicians","studying the inactive morph cradle","circling a familiar calibration platform"],
 "Fossil Garden":["investigating recovered stone","sniffing around fossil markers","returning repeatedly to an excavation marker"],
 "Training Yard":["practicing field movement","working through a training route","playing with a field enrichment target"],
 "Medical Check":["receiving a routine wellbeing check","standing calmly for a non-invasive scan","visiting the recovery team"],
 "Research Wing":["following a scientist through the research wing","watching a specimen scanner","investigating a sealed sample cabinet"]
};
function RLT(p){
 p.lifeTelemetry=p.lifeTelemetry||{lastTick:Date.now(),location:"Sanctuary Habitat",activity:"Settling into the Sanctuary",history:[],specials:0};
 return p.lifeTelemetry;
}
function rltConfig(p){
 const c=p.activeMorphConfig||{}, raw=JSON.stringify(p.morphRecord||p).toLowerCase();
 return {night:!!c.nightVision||/night vision/.test(raw),aquatic:!!c.aquaticMode||/aquatic|gill|fin/.test(raw),resonance:!!c.resonanceTracking||Number(c.resonance||0)>65||/resonance/.test(raw),temper:c.temperament||p.temperament||"Curious"};
}
function rltChoose(p,tick){
 const c=rltConfig(p),n=(String(p.name||"resident").split("").reduce((a,x)=>a+x.charCodeAt(0),0)+tick)%100;
 let places=RLT_PLACES.slice();
 if(c.aquatic)places.push("Water Station","Water Station");
 if(c.resonance)places.push("Fossil Garden","Morphology Lab","Research Wing");
 if(/guardian/i.test(c.temper))places.push("Observation Deck","Sanctuary Habitat");
 if(/curious/i.test(c.temper))places.push("Fossil Garden","Research Wing","Morphology Lab");
 const location=places[n%places.length], acts=RLT_ACTS[location]||["exploring"];
 let activity=acts[(n+tick)%acts.length],type="normal",note="";
 if(n%11===0&&c.resonance){type="science";activity="pausing at a weak resonance signal";note="Scientific observation: a repeating response was logged for later Institute review."}
 else if(n%13===0){type="bond";activity="seeking familiar Institute staff";note="Bond event: the resident chose social contact without prompting."}
 else if(n%17===0){type="special";activity="reacting to an expedition memory cue";note="Field observation note added: behavior resembles a previous expedition response."}
 else if(n%19===0){type="special";activity="investigating an unusual fossil marker";note="Unusual activity: the resident returned to the same marker several times."}
 return {location,activity,type,note};
}
function rltAdvance(p,now){
 const r=RLT(p);now=now||Date.now();
 let count=Math.floor((now-r.lastTick)/RLT_INTERVAL);if(count<=0)return 0;
 count=Math.min(count,96); // up to 24 hours of catch-up per visit
 for(let j=0;j<count;j++){
   const stamp=r.lastTick+RLT_INTERVAL*(j+1),ev=rltChoose(p,Math.floor(stamp/RLT_INTERVAL));
   r.location=ev.location;r.activity=ev.activity;
   const rec={time:stamp,location:ev.location,activity:ev.activity,type:ev.type,note:ev.note};
   r.history.push(rec);if(r.history.length>96)r.history.shift();
   if(ev.type!=="normal"){r.specials++;state.career=state.career||{};state.career.rankXP=(state.career.rankXP||0)+1;
     state.instituteInventory=state.instituteInventory||[];
     if(ev.type==="science"&&!state.instituteInventory.includes("Field Observation Notes"))state.instituteInventory.push("Field Observation Notes");
   }
 }
 r.lastTick+=count*RLT_INTERVAL;return count;
}
function rltAdvanceAll(showWelcome){
 let total=0;(state.sanctuary||[]).forEach(p=>total+=rltAdvance(p,Date.now()));
 if(total){save();if(showWelcome)setTimeout(()=>rltPopup("WELCOME BACK · "+total+" resident activity record"+(total===1?"":"s")+" generated while time passed."),250)}
 return total;
}

function LRC(p){
 p.livingResident=p.livingResident||{tab:"LIVE",bond:55,curiosity:55,confidence:45,fieldSkill:35,research:25,comfort:70,happiness:70,training:0,
 possessions:[],memories:[],favorites:{place:"",activity:""},prompt:null,promptTick:-1};
 return p.livingResident;
}
function lrcClamp(v){return Math.max(0,Math.min(100,Math.round(v)))}
function lrcPrompt(p){
 const l=LRC(p),r=RLT(p),tick=Math.floor(r.lastTick/RLT_INTERVAL);
 if(l.promptTick===tick&&l.prompt)return l.prompt;
 const c=rltConfig(p),n=(tick+String(p.name||"").length*13)%20;
 let q=null;
 if(n===0)q={title:"KODA FOUND SOMETHING".replace("KODA",String(p.name||"Resident").toUpperCase()),text:"A small object has been placed beside the resident's resting area.",choices:["INSPECT","ADD TO ARCHIVE","LET THEM KEEP IT"]};
 else if(n===3&&c.resonance)q={title:String(p.name||"Resident").toUpperCase()+" WANTS YOUR ATTENTION",text:"The resident keeps looking toward the Research Wing and returning to you.",choices:["FOLLOW","OBSERVE","CALL SCIENTIST","LATER"]};
 else if(n===7)q={title:String(p.name||"Resident").toUpperCase()+" WANTS TO PLAY",text:"The resident is waiting near an enrichment station.",choices:["PLAY","TRAIN","EXPLORE TOGETHER","LATER"]};
 else if(n===11)q={title:"UNUSUAL RESIDENT BEHAVIOR",text:"The resident has returned to "+r.location+" several times.",choices:["OBSERVE","SCAN AREA","FOLLOW","LOG NOTE"]};
 l.prompt=q;l.promptTick=tick;return q;
}
window.LRC_tab=function(i,tab){const p=state.sanctuary?.[i];if(!p)return false;LRC(p).tab=tab;save();render();return false}
window.LRC_do=function(i,a){
 const p=state.sanctuary?.[i];if(!p)return false;const l=LRC(p),r=RLT(p);const w=LW(p);w.collections.Memories=Math.max(w.collections.Memories,l.memories.length);
 const add=(k,n)=>l[k]=lrcClamp((l[k]||0)+n);
 if(a==="Feed"){add("comfort",3);add("happiness",2);petCare(i,"food")}
 else if(a==="Water"){add("comfort",3);petCare(i,"water")}
 else if(a==="Comfort"){add("bond",4);add("comfort",5);petCare(i,"comfort")}
 else if(a==="Play"){add("bond",3);add("happiness",5);add("curiosity",2);l.memories.push("Played together at "+r.location)}
 else if(a==="Train"){add("training",4);add("fieldSkill",3);add("confidence",2);petCare(i,"train")}
 else if(a==="Observe"){add("research",3);add("curiosity",2);state.instituteInventory=state.instituteInventory||[];if(!state.instituteInventory.includes("Field Observation Notes"))state.instituteInventory.push("Field Observation Notes")}
 else if(a==="Scan Area"){add("research",3);add("fieldSkill",2);l.memories.push("Scanned "+r.location+" during resident activity")}
 else if(a==="Practice Ability"){add("training",3);add("confidence",3)}
 else if(a==="Explore Together"){add("bond",3);add("fieldSkill",3);add("curiosity",4);l.memories.push("Explored "+r.location+" together")}
 else if(a==="Call Scientist"){add("research",4);l.memories.push("Institute scientist consulted at "+r.location)}
 else if(a==="Visit Lab"){r.location="Morphology Lab";r.activity="visiting the Morphology Lab with you";add("research",2)}
 else if(a==="Visit Habitat"){r.location="Sanctuary Habitat";r.activity="returning to the habitat with you";add("comfort",3)}
 l.favorites.place=l.favorites.place||r.location;l.favorites.activity=l.favorites.activity||a;
 if(l.memories.length>60)l.memories.shift();const gs=lwGoals(p);if(a==="Observe"){const g=gs.find(x=>x.t==="Observe one resident activity");if(g)g.done=true}if(a==="Train"){const g=gs.find(x=>x.t==="Train a field skill");if(g)g.done=true}if(l.memories.length){const g=gs.find(x=>x.t==="Add one memory or collection find");if(g)g.done=true}w.collections.Memories=Math.max(w.collections.Memories,l.memories.length);save();render();return false
}
window.LRC_choice=function(i,ch){

 if(ch==="LET THEM KEEP IT"){const items=["🪨 Resonance Pebble","🪶 Expedition Feather","⚙ Broken Scanner Ring","🦴 Fossil Fragment"];const item=items[(r.specials+l.possessions.length)%items.length];if(!l.possessions.includes(item))l.possessions.push(item);l.bond=lrcClamp(l.bond+4);l.memories.push("Kept a personal object: "+item)}
 else if(ch==="ADD TO ARCHIVE"){state.instituteInventory=state.instituteInventory||[];if(!state.instituteInventory.includes("Resident Found Object"))state.instituteInventory.push("Resident Found Object");l.research=lrcClamp(l.research+4)}
 else if(ch==="INSPECT"||ch==="OBSERVE"||ch==="LOG NOTE"){l.research=lrcClamp(l.research+3);l.curiosity=lrcClamp(l.curiosity+2);l.memories.push(ch+" at "+r.location)}
 else if(ch==="FOLLOW"||ch==="EXPLORE TOGETHER"){l.bond=lrcClamp(l.bond+3);l.fieldSkill=lrcClamp(l.fieldSkill+3);l.memories.push("Followed resident to investigate "+r.location)}
 else if(ch==="PLAY"){l.bond=lrcClamp(l.bond+3);l.happiness=lrcClamp(l.happiness+5)}
 else if(ch==="TRAIN"){l.training=lrcClamp(l.training+4);l.confidence=lrcClamp(l.confidence+3)}
 else if(ch==="CALL SCIENTIST"){l.research=lrcClamp(l.research+4);l.memories.push("Scientist response logged")}
 else if(ch==="SCAN AREA"){l.research=lrcClamp(l.research+4);l.fieldSkill=lrcClamp(l.fieldSkill+2)}
 l.prompt=null;save();render();return false
}
function lrcActions(p){
 const r=RLT(p),loc=r.location;
 let a=["Feed","Water","Comfort","Play","Train","Observe"];
 if(/Fossil|Research|Morphology/.test(loc))a.push("Scan Area","Call Scientist");
 if(/Training|Habitat|Observation/.test(loc))a.push("Explore Together","Practice Ability");
 a.push("Visit Lab","Visit Habitat");
 return [...new Set(a)];
}

function RLD(p){
 const l=LRC(p);
 p.residentDashboard=p.residentDashboard||{
  personality:{Curious:l.curiosity||55,Brave:l.confidence||45,Social:l.bond||55,Playful:60,Independent:50},
  skills:{Tracking:35,Excavation:25,Search:40,Rescue:30,Navigation:35,Communication:30},
  relationships:{Venn:40,Rook:30,Sol:35},preferences:{place:"Adaptive",activity:"Adaptive",scientist:"Adaptive",enrichment:"Adaptive"},
  schedule:{Morning:"Habitat / Food",Midday:"Training Yard",Afternoon:"Research Wing",Evening:"Exploration",Night:"Rest / Night Search"},
  quest:{name:"The Stone That Keeps Returning",step:0,max:8},interactions:0
 };
 return p.residentDashboard;
}
function rldSync(p){
 const l=LRC(p),d=RLD(p);d.personality.Curious=l.curiosity;d.personality.Brave=l.confidence;d.personality.Social=l.bond;
 d.skills.Search=Math.max(d.skills.Search,l.fieldSkill);d.skills.Communication=Math.max(d.skills.Communication,Math.round(l.bond*.7));
 d.preferences.place=l.favorites.place||d.preferences.place;d.preferences.activity=l.favorites.activity||d.preferences.activity;

const LW_STATIONS=[
 ["Nest",8,68,"🛏️"],["Food",24,70,"🥣"],["Water",40,69,"💧"],["Toy",56,70,"🎾"],
 ["Fossil",72,68,"🦴"],["Scanner",84,45,"📡"],["Window",12,28,"🔭"],["Research",55,27,"🔬"]

function LW(p){
 p.livingWorld=p.livingWorld||{mode:"ACTIVE",channel:"FIELD",weather:"Clear",station:"Nest",decor:["🛏️ Basic Nest","🎾 Enrichment Ball"],collections:{Fossils:0,Minerals:0,"Machine Parts":0,Botanicals:0,Signals:0,Keepsakes:0,Memories:0,Achievements:0},day:1,goals:[],radio:[],cam:false,lastWorldTick:Date.now(),questionStation:""};
 return p.livingWorld;
}
function lwHour(){return new Date().getHours()}
function lwPhase(){const h=lwHour();return h<6||h>=21?"night":h>=17?"evening":"day"}
function lwGoals(p){
 const w=LW(p);if(!w.goals.length)w.goals=[
  {t:"Observe one resident activity",done:false},{t:"Train a field skill",done:false},
  {t:"Investigate a station",done:false},{t:"Add one memory or collection find",done:false}
 ];return w.goals
}
function lwRadioLine(p){
 const w=LW(p),r=RLT(p),sets={
 FIELD:["Field Team reports a new marker beyond the sanctuary ridge.","Excavation group requests a resident behavior comparison.","A recovered crate has arrived for Institute analysis."],
 SCIENCE:["Morphology Lab reports stable calibration.","Research Wing requests another field observation note.","Scanner array detected a weak repeating signal."],
 SANCTUARY:[p.name+" telemetry nominal at "+r.location+".","Enrichment systems are available for resident use.","Sanctuary staff logged a quiet social period."],
 ARCHIVE:["Archive catalog updated with a reconstructed specimen record.","A sealed First Institute note is awaiting review.","Fossil index cross-reference completed."],
 "DEEP SIGNAL":["…three-band carrier detected…","…source unresolved… resident response requested…","…signal fragment stored in the Director notebook…"]
 };
 const a=sets[w.channel]||sets.FIELD, line=a[(w.radio.length+w.day)%a.length];
 w.radio.push(new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+" · "+line);if(w.radio.length>20)w.radio.shift();return line
}
function lwAdvance(p){
 const w=LW(p),r=RLT(p),now=Date.now(),steps=Math.min(12,Math.floor((now-w.lastWorldTick)/(5*60*1000)));
 if(steps<=0)return;
 for(let s=0;s<steps;s++){
   const n=(Math.floor((w.lastWorldTick+s*300000)/300000)+String(p.name||"").length)%LW_STATIONS.length;
   w.station=LW_STATIONS[n][0];
   if((n+s)%5===0)w.questionStation=w.station;
   if((n+s)%4===0)lwRadioLine(p);
 }
 w.lastWorldTick+=steps*300000;
}
function lwStationPos(name){return LW_STATIONS.find(x=>x[0]===name)||LW_STATIONS[0]}

 const g=lwGoals(p).find(x=>x.t==="Investigate a station");if(g)g.done=true;

}

 l.curiosity=lrcClamp(l.curiosity+2);l.confidence=lrcClamp(l.confidence+2);l.fieldSkill=lrcClamp(l.fieldSkill+2);l.research=lrcClamp(l.research+2);l.training=lrcClamp(l.training+2);r.xp+=4;

const SAE_SCENES=[
 {title:"Broken Training Beacon",text:"A field beacon is transmitting from beneath the old excavation rail. Three trails leave the training yard.",choices:["FOLLOW TRACKS","SCAN THE RAIL","ASK KODA","MARK AND RETURN"]},
 {title:"Buried Signal",text:"The selected trail reaches a sealed archaeology hatch. Something inside answers the resident's morph channel.",choices:["USE MORPH ABILITY","SEARCH FOR KEYWAY","CONNECT CLUES","TAKE SAMPLE"]},

 {title:"Return Decision",text:"The expedition can return with evidence, equipment, or an unresolved mystery that may change a later mission.",choices:["RETURN EVIDENCE","KEEP MYSTERY OPEN","FABRICATE FIELD TOOL","ARCHIVE DISCOVERY"]}

function SAE(p){
 p.storyAdventureEngine=p.storyAdventureEngine||{scene:0,clues:[],linked:[],consequences:[],log:[],mysteries:["Origin of the Buried Signal"],resolved:[],visits:{},failures:0};
 return p.storyAdventureEngine;
}
function saeLog(p,s){const a=SAE(p);a.log.push(new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+" · "+s);if(a.log.length>80)a.log.shift()}
function saeGate(p,ch){
 const l=LRC(p),d=RLD(p),c=rltConfig(p),inv=FIC(p);
 if(ch==="USE MORPH ABILITY")return l.training>=25||c.resonance;
 if(ch==="FOLLOW SIDE TUNNEL")return (d.skills.Search||0)>=55;
 if(ch==="SOCKET ARTIFACT")return inv.finished.length>0;
 if(ch==="CONNECT CLUES")return SAE(p).clues.length>=2;
 return true;
}
window.SAE_choose=function(i,ch){
 const p=state.sanctuary?.[i];if(!p)return false;const a=SAE(p),l=LRC(p),d=RLD(p),ok=saeGate(p,ch);
 a.visits[a.scene]=(a.visits[a.scene]||0)+1;
 if(!ok){a.failures++;a.consequences.push("A blocked "+ch+" attempt changed the route instead of ending the expedition.");saeLog(p,"NONFATAL FAILURE: "+ch+" was unavailable. A side route opened.");a.clues.push("Side-route marker "+a.failures);l.curiosity=lrcClamp(l.curiosity+1)}
 else{
  const finds={"FOLLOW TRACKS":"Three-toed trail cast","SCAN THE RAIL":"Rail resonance trace","ASK KODA":"Resident behavior clue","MARK AND RETURN":"Mapped return point","USE MORPH ABILITY":"Morph-channel echo","SEARCH FOR KEYWAY":"Hidden keyway sketch","CONNECT CLUES":"Linked signal pattern","TAKE SAMPLE":"Mineral sample","TRACK DRAG MARKS":"Survey-team route","EXAMINE CASE":"Broken scanner component","CALL VENN":"Venn field hypothesis","FOLLOW SIDE TUNNEL":"Hidden tunnel map","OPEN CHAMBER":"Convergence chamber record","SOCKET ARTIFACT":"Socket resonance result","SEND SCOUT SIGNAL":"Remote signal reply","DOCUMENT ONLY":"Untouched chamber record","RETURN EVIDENCE":"Expedition evidence packet","KEEP MYSTERY OPEN":"Unresolved mystery marker","FABRICATE FIELD TOOL":"Field-tool blueprint","ARCHIVE DISCOVERY":"Archive accession"};
  const f=finds[ch]||ch;if(!a.clues.includes(f))a.clues.push(f);saeLog(p,"CHOICE: "+ch+" → "+f+".");l.fieldSkill=lrcClamp(l.fieldSkill+2);l.curiosity=lrcClamp(l.curiosity+2);
  if(/SAMPLE|COMPONENT|EVIDENCE|ARTIFACT|TOOL|DISCOVERY/.test(ch)){FIC_addRecovered(p,f)}
  if(ch==="CONNECT CLUES"&&a.clues.length>=2)a.linked.push(a.clues.slice(-2).join(" ↔ "));
  if(ch==="KEEP MYSTERY OPEN")a.mysteries.push("Unresolved consequence from expedition "+(a.log.length));
 }
 if(a.scene<SAE_SCENES.length-1)a.scene++;else{a.scene=0;l.memories.push("Completed a complex training expedition loop.");LW(p).collections.Achievements++}
 save();render();return false
}
window.SAE_link=function(i){
 const p=state.sanctuary?.[i];if(!p)return false;const a=SAE(p);if(a.clues.length>=2){const s=a.clues.slice(-2).join(" ↔ ");if(!a.linked.includes(s))a.linked.push(s);saeLog(p,"Evidence board connection created: "+s)}save();render();return false
}
function storyAdventureEngine(p,i){
 const a=SAE(p),s=SAE_SCENES[a.scene],l=LRC(p),d=RLD(p);
 return `<div class="sae"><div class="mcc-head"><div><small>STATEFUL TRAINING ADVENTURE ENGINE</small><h3>🗺️ ${p.name}'S COMPLEX FIELD STORY</h3></div><b>SCENE ${a.scene+1}/${SAE_SCENES.length}</b></div>

 f.finished.push(item);if(!f.known.includes(bp.name))f.known.push(bp.name);f.log.push("FABRICATED: "+bp.name+".");f.selected=[];LRC(p).memories.push("Fabricated "+bp.name+" in the resident Field Center.");save();render();return false

 return `<div class="fic"><div class="mcc-head"><div><small>PACK · ANALYZE · COMBINE · SOCKET · FABRICATE · EQUIP</small><h3>🧰 ${p.name}'S FIELD FABRICATION CENTER</h3></div><b>${f.finished.length} FINISHED ITEMS</b></div>

window.MC_set=function(i,k,v){const p=state.sanctuary?.[i];if(!p)return false;MC(p)[k]=v;save();render();return false}
window.MC_toggle=function(i,k){const p=state.sanctuary?.[i];if(!p)return false;MC(p)[k]=!MC(p)[k];save();render();return false}
window.MC_cal=function(i,n){const p=state.sanctuary?.[i];if(!p)return false;const m=MC(p);m.calibration=Math.max(0,Math.min(100,m.calibration+n));m.signal=Math.max(0,Math.min(100,m.signal+Math.round(n/2)));save();render();return false}
function mcDial(label,val){const n=Number(val)||0,deg=-50+(Math.max(0,Math.min(100,n))/100)*100;return `<div class="mc-dial" style="--needle:${deg}deg"><b>${Math.round(n)}</b><small>${label}</small></div>`}
function mcWave(seed){
 let pts=[];for(let x=0;x<=300;x+=10){const y=26+Math.sin((x+seed)/18)*9+Math.sin((x+seed)/7)*3;pts.push(x+","+y.toFixed(1))}
 return `<div class="mc-wave"><svg viewBox="0 0 300 52" preserveAspectRatio="none"><polyline points="${pts.join(" ")}"/></svg></div>`
}
function megaConsolePanel(p,i){
 const l=LRC(p),m=MC(p),c=p.activeMorphConfig||{},vals=[["BIO",l.happiness],["BOND",l.bond],["FIELD",l.fieldSkill],["RESEARCH",l.research],["MORPH",c.resonance??55],["SIGNAL",m.signal],["THERMAL",m.thermal],["CAL",m.calibration]];
 const temps=[["CORE",c.coreTemp?Math.min(100,Number(c.coreTemp)*2):76],["HABITAT",68],["MORPH",c.resonance??55],["STRESS",Math.max(5,100-l.comfort)],["ENERGY",l.happiness],["FIELD",l.fieldSkill]];
 return `<div class="lw-card mcfx"><div class="mcc-head"><div><small>MEGA RESIDENT INSTRUMENT ARRAY</small><b>◉ LIVE SYSTEMS</b></div><span>${m.bank} BANK</span></div>
 <div class="mc-navfx">${["BIO","MORPH","FIELD","SIGNAL"].map(x=>`<button onclick="MC_set(${i},'bank','${x}')">${x}</button>`).join("")}</div>
 <div class="mc-instruments">${vals.map(x=>mcDial(x[0],x[1])).join("")}</div>
 <b>TEMPERATURE + CHANNEL BARS</b><div class="mc-tempgrid">${temps.map(x=>`<div class="mc-temp"><div class="mc-tube"><i class="mc-fluid" style="--level:${Math.max(3,Math.min(100,x[1]))}%"></i></div><b>${Math.round(x[1])}</b><small>${x[0]}</small></div>`).join("")}</div>
 <div class="mc-ledrow"><span class="mc-led"><i></i>TELEMETRY</span><span class="mc-led"><i></i>RESIDENT LINK</span><span class="mc-led ${m.signal<35?"warn":""}"><i></i>SIGNAL</span><span class="mc-led"><i></i>SAVE</span></div>
 ${mcWave((m.signal+l.curiosity)%100)}
 <b>RADIO CONTROL MATRIX</b><div class="mc-radiorack">${["PULSE","SPECTRAL","RESONANCE","MOTION"].map(x=>`<label class="mc-radio"><input type="radio" name="scan${i}" ${m.scan===x?"checked":""} onchange="MC_set(${i},'scan','${x}')"> ${x}</label>`).join("")}</div>
 <div class="mc-panelmatrix">
  <div class="mc-mini"><em>⌁</em><strong>CALIBRATION</strong><small>${m.calibration}%</small><button onclick="MC_cal(${i},5)">+5</button><button onclick="MC_cal(${i},-5)">−5</button></div>
  <div class="mc-mini"><em>◉</em><strong>DISPLAY</strong><select onchange="MC_set(${i},'display',this.value)">${["TACTICAL","CLINICAL","MORPH","ARCHAEOLOGY"].map(x=>`<option ${m.display===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="mc-mini"><em>📡</em><strong>AUTOMATION</strong><div class="mc-switch">AUTO SCAN <input type="checkbox" ${m.autoScan?"checked":""} onchange="MC_toggle(${i},'autoScan')"></div><div class="mc-switch">ALERTS <input type="checkbox" ${m.alerts?"checked":""} onchange="MC_toggle(${i},'alerts')"></div></div>
 </div>
 <div class="mc-marquee"><span>RESIDENT ${String(p.name||"").toUpperCase()} · ${m.scan} SCAN · ${m.display} DISPLAY · SIGNAL ${m.signal}% · CALIBRATION ${m.calibration}% · FIELD LINK ${l.fieldSkill}% · RESEARCH ${l.research}% · MORPH CHANNEL ACTIVE</span></div></div>`;
}

function mcReferenceSlice(p){const seed=(String(p.name||"").length+(LRC(p).curiosity||0))%MC_TECH_BANK.length;return MC_TECH_BANK.slice(seed,seed+12)}
function livingResidentConsole(p,i){
 const l=LRC(p),r=RLT(p),q=lrcPrompt(p),tab=l.tab||"LIVE";
 const stats=[["♥","BOND",l.bond],["◉","CURIOSITY",l.curiosity],["◆","CONFIDENCE",l.confidence],["⌁","FIELD",l.fieldSkill],["⌬","RESEARCH",l.research]];
 let pane="";
 if(tab==="LIVE")pane=`<div class="lrc-place">📍 ${r.location} · ${r.activity}</div>${q?`<div class="lrc-prompt"><b>${q.title}</b><br>${q.text}<div>${q.choices.map(x=>`<button onclick='LRC_choice(${i},${JSON.stringify(x)})'>${x}</button>`).join("")}</div></div>`:`<button class="lrc-action" onclick="LRC_do(${i},'Explore Together')">🐾 JOIN ${String(p.name||"RESIDENT").toUpperCase()}</button>`}<small>Telemetry updated ${rltAgo(r.lastTick)} · Next activity cycle is based on the resident's persistent 15-minute schedule.</small>`;
 else if(tab==="DO")pane=`<div class="lrc-actions">${lrcActions(p).map(x=>`<button onclick='LRC_do(${i},${JSON.stringify(x)})'>${x}</button>`).join("")}</div>`;
 else if(tab==="CREATURE")pane=`<div class="lrc-actions"><button onclick="openResidentSettings(${i})">🎛 MORPH SETTINGS</button><button onclick="VG_open3D(${i})">🧬 3D / PROFILE</button><button onclick="LRC_do(${i},'Practice Ability')">⚡ PRACTICE ABILITY</button><button onclick="openResidentSettings(${i})">📋 ORIGINAL MORPH RECORD</button></div><p class="small">Active configuration: ${p.activeMorphConfig?.preset||"Sanctuary"} · Original morph remains preserved separately.</p>`;
 else if(tab==="LIFE")pane=`${residentLifeDashboard(p,i)}<b>CREATURE MEMORY</b><div>${l.memories.slice(-16).reverse().map(x=>`<div class="lrc-memory">${x}</div>`).join("")||"<small>New shared experiences will be recorded here.</small>"}</div>`;
 else if(tab==="ADVENTURE")pane=`${storyAdventureEngine(p,i)}`;
 else if(tab==="GEAR")pane=`${fabricationCenter(p,i)}`;
 else pane=`${residentInstituteCenter(p,i)}`;
 return `<div class="lrc"><div class="lrc-head"><div><small>LIVING RESIDENT CONSOLE</small><b>${p.name} · ${p.formName||p.species||"Resident"}</b></div><span class="rlt-live"><i class="rlt-dot"></i> ACTIVE</span></div><div class="lrc-stats">${stats.map(x=>`<div class="lrc-stat"><small>${x[0]} ${x[1]}</small><b>${x[2]}</b></div>`).join("")}</div><div class="lrc-tabs mc-navfx">${["LIVE","DO","CREATURE","LIFE","ADVENTURE","GEAR","INSTITUTE"].map(x=>`<button class="${tab===x?"on":""}" onclick="LRC_tab(${i},'${x}')">${x}</button>`).join("")}</div><div class="lrc-pane">${pane}</div></div>`;
}
function rltPanel(p,i,full){
 rltAdvance(p);const r=RLT(p),last=r.history[r.history.length-1];
 const hist=r.history.slice(full?-24:-5).reverse();
 return `<div class="rlt"><div class="rlt-head"><div><small>RESIDENT LIFE TELEMETRY</small><div class="rlt-live"><i class="rlt-dot"></i> 15-MINUTE PERSISTENT ACTIVITY CYCLE</div></div><button onclick="RLT_find(${i})">📍 FIND ${String(p.name||"RESIDENT").toUpperCase()}</button></div>
 <div class="rlt-location">📍 ${r.location}</div><b>${p.name} is ${r.activity}.</b><div><span class="rlt-chip">Updated ${rltAgo(r.lastTick)}</span><span class="rlt-chip">Special observations ${r.specials}</span><span class="rlt-chip">${p.activeMorphConfig?.preset||"Sanctuary"} configuration</span></div>
 ${last?.note?`<div class="rlt-event ${last.type}">${last.note}</div>`:""}
 ${full?`<div class="rlt-grid"><div><h4>24-HOUR ACTIVITY TIMELINE</h4><div class="rlt-timeline">${hist.map(x=>`<div class="rlt-event ${x.type}"><b>${new Date(x.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} · ${x.location}</b><br>${x.activity}${x.note?"<br><small>"+x.note+"</small>":""}</div>`).join("")||"<small>Activity records will appear every 15 minutes.</small>"}</div></div><div><h4>INSTITUTE LOCATION NETWORK</h4><div class="rlt-network">${RLT_PLACES.map(x=>`<div class="rlt-place ${x===r.location?"here":""}">${x===r.location?"●":"○"} ${x}</div>`).join("")}</div><p class="small">The resident's morph configuration and temperament bias where it spends time. Aquatic, resonance, curious and guardian configurations influence activity selection.</p></div></div>`:""}</div>`;
}
function rltDirectorPanel(){
 rltAdvanceAll(false);return `<div class="djpanel"><b>📡 SANCTUARY TELEMETRY</b><div class="rlt-all">${(state.sanctuary||[]).map((p,i)=>{const r=RLT(p);return `<div class="rlt-resident"><b>${p.icon||"🐾"} ${p.name}</b><br><small>📍 ${r.location}</small><br>${r.activity}<br><button onclick="RLT_find(${i})">FIND RESIDENT</button></div>`}).join("")||"<small>No Sanctuary residents yet.</small>"}</div></div>`;
}
function protectSanctuaryResidents(){
  (state.sanctuary||[]).forEach(p=>{
    p.health=100;p.hydration=Math.max(85,Number(p.hydration)||85);p.energy=Math.max(80,Number(p.energy)||80);
    p.comfort=Math.max(90,Number(p.comfort)||90);p.pain=0;p.injured=false;p.critical=false;p.lastUpdate=Date.now();
  });
}

function openCaseReview(){state.screen="casereview";render();window.scrollTo(0,0)}
function caseReviewScreen(){
 const c=active();if(!c)return hero("Case Review","No active case.","📋");
 const m=(c.morphs||[]).find(x=>x.id===c.selectedMorph);
 const logs=(state.audit||[]).slice(0,40);
 return hero("Case Review · "+c.name,"Clinical milestones, readiness, morph decision and audit history.","📋")+reanimationChronicleHTML(c)
 +`<div class="panel"><h3>CLINICAL READINESS</h3>${clinicalReadiness(c)}</div>

function evaluateCareerUnlocks(){
  state.career=state.career||{unlockedTracks:[],researchPoints:0,fieldPermits:[],discoveries:[]};
  state.career.unlockedTracks=state.career.unlockedTracks||[];
  for(const t of CAREER_TRACKS){
    if(t.need.every(x=>state.instituteInventory.includes(x)) && !state.career.unlockedTracks.includes(t.id)){
      state.career.unlockedTracks.push(t.id);
      state.career.researchPoints=(state.career.researchPoints||0)+10;
      state.career.fieldPermits=state.career.fieldPermits||[];
      for(const area of t.areas){
        if(!state.career.fieldPermits.includes(area)) state.career.fieldPermits.push(area);
      }
      log("Career Center unlocked: "+t.name+".");
    }
  }
}
function careerTrackUnlocked(id){

function deepMissionState(p){

  if(!Array.isArray(p.deepMission.finds))p.deepMission.finds=[];
  if(!Array.isArray(p.deepMission.notes))p.deepMission.notes=[];
  return p.deepMission;
}
function deepMissionAddItem(p,item){
  const a=ensureAdventureState(p);
  if(!a.inventory.includes(item))a.inventory.push(item);
  p.creatureItems=p.creatureItems||[];if(!p.creatureItems.includes(item))p.creatureItems.push(item);
  p.storyRelics=p.storyRelics||[];if(!p.storyRelics.includes(item))p.storyRelics.push(item);

function chooseMorphAdventure(i,choiceIndex){
  const p=state.sanctuary[i];
  if(!p){toast("Resident not found.");return}
  const a=ensureAdventureState(p);
  const scene=MORPH_ADVENTURE_SCENES[a.scene];
  if(!scene)return;
  const c=scene.choices[choiceIndex];
  if(!c||!adventureChoiceAllowed(p,c)){
    toast("That path is locked.");
    return;
  }

  if(c.item && !a.inventory.includes(c.item)){
    a.inventory.push(c.item);
    a.log.push("Collected "+c.item+".");
    addInstituteItem(c.item,p.name);
  }
  if(c.removeItem){
    a.inventory=a.inventory.filter(x=>x!==c.removeItem);
    a.log.push("Used or left behind "+c.removeItem+".");
  }
  if(c.flag){
    a.flags[c.flag]=true;
    a.log.push("Story event unlocked: "+c.flag+".");
  }
  if(typeof c.energy==="number"){
    a.energy=clamp(a.energy+c.energy);
  }

  if(c.to==="complete"){
    a.completed=true;
    a.scene="complete";
    p.bond=clamp((p.bond||0)+10);
    p.mastery=clamp((p.mastery||0)+10);
    p.storyLoot=[...new Set([...(p.storyLoot||[]),...a.inventory])];
    for(const item of a.inventory) if(!state.instituteInventory.includes(item)) addInstituteItem(item,p.name);
    evaluateCareerUnlocks();
    state.career.rankXP+=6;
    log(p.name+" completed a Morph Adventure and transferred "+a.inventory.length+" field items to the Institute. Career XP awarded.");
    save();
    render();
    return;
  }

  a.scene=c.to;
  const travelCost=state.expeditionLoadout.includes("aerialpack")?1:2;
  a.energy=clamp(a.energy-travelCost);
  p.bond=clamp((p.bond||0)+1);
  a.log.push("Moved to "+(MORPH_ADVENTURE_SCENES[c.to]?.title||c.to)+".");
  save();
  render();
  window.scrollTo({top:0,left:0,behavior:"auto"});
}

}

function socketGem(projectId,gem){
  ensureAdvancedState();
  const p=craftingProjectData().find(x=>x.id===projectId);if(!p||!isGemItem(gem)||itemQty(gem)<=0)return;
  const arr=state.crafting.sockets[projectId]||[];
  if(arr.length>=p.sockets){toast("All sockets are filled.");return}
  if(arr.includes(gem)){toast("That jewel is already socketed in this item.");return}
  arr.push(gem);state.crafting.sockets[projectId]=arr;save();render();
}
function unsocketGem(projectId,idx){
  ensureAdvancedState();
  const arr=state.crafting.sockets[projectId]||[];
  arr.splice(idx,1);state.crafting.sockets[projectId]=arr;save();render();
}
function socketBonusText(projectId){
  const arr=state.crafting.sockets[projectId]||[];
  return arr.map(x=>GEM_DATA[x]?.bonus).filter(Boolean);

function finalizeSocketCraft(projectId){
  ensureAdvancedState();
  const p=craftingProjectData().find(x=>x.id===projectId);if(!p)return;
  const arr=state.crafting.sockets[projectId]||[];
  if(arr.length===0){toast("Socket at least one jewel before crafting.");return}
  if(!state.instituteProjects.includes(projectId)){toast("Build and validate the base Institute Project first.");return}
  for(const g of arr){
    if(itemQty(g)<=0){toast("A socketed jewel is no longer available.");return}
  }
  for(const g of arr)state.inventoryQty[g]=Math.max(0,itemQty(g)-1);
  const craftedName=p.name+" · Socketed";
  const existing=state.crafting.crafted.find(x=>x.projectId===projectId);
  if(existing){
    existing.gems=[...arr];existing.name=craftedName;
  }else{
    state.crafting.crafted.push({projectId,name:craftedName,gems:[...arr]});
  }
  state.career.rankXP+=arr.length*4;
  state.research+=arr.length;
  log("Socket-crafted "+craftedName+" with "+arr.join(", ")+".");
  state.crafting.sockets[projectId]=[];
  save();render();toast("Socketed equipment crafted.");
}

function missingSummary(i){
  const c=active(),m=[];
  if(i===0){
    if(!c.intakeBrief)m.push("read case file");
    if(!c.intakeVitals)m.push("record vitals");
    if(!c.intakeCalm)m.push("calm contact");
  }else if(i===1){
    const t=c.vet.triage;
    if(!t.airway)m.push("airway");
    if(!t.breathing)m.push("breathing/oxygen");
    if(!t.circulation)m.push("circulation");
    if(!t.temp)m.push("temperature");
    if(!t.weight)m.push("weight");
    if(c.vet.oxygen<94)m.push("oxygen 94+");
  }else if(i===2){
    for(const [k,v] of Object.entries(c.vet.exam)) if(!v)m.push(k+" exam");
  }else if(i===3){
    const d=c.vet.dx;
    if(!d.blood)m.push("blood panel");
    if(!d.imaging)m.push("imaging");
    if(!d.urine)m.push("urinalysis");
    if(!d.assessment)m.push("clinical assessment");
  }else if(i===4){
    const t=c.vet.treatment;
    if(!t.fluids)m.push("fluid support");
    if(!t.pain)m.push("pain control");
    if(!t.wound)m.push("wound care");
    if(!t.nutrition)m.push("nutrition");
    if(!t.primary)m.push("resolve primary problem");
    if(c.pain>30)m.push("pain ≤30");
    if(c.hydration<70)m.push("hydration 70+");
  }else if(i===5){
    const r=c.vet.recovery;
    if(!r.water)m.push("offer water");
    if(!r.food)m.push("offer food");
    if(!r.rest)m.push("quiet rest");
    if(!r.walk)m.push("mobility test");
    if(!r.recheck)m.push("final recheck");
    if(c.health<82)m.push("health 82+");
    if(c.pain>25)m.push("pain ≤25");
    if(c.hydration<75)m.push("hydration 75+");
    if(c.vet.oxygen<95)m.push("oxygen 95+");
  }else if(i===6){
    if(!c.vet.dx.assessment)m.push("diagnosis");
    if(!c.vet.treatment.primary)m.push("primary treatment");
    if(!c.vet.recovery.recheck)m.push("recovery recheck");
    if(c.stress>=40)m.push("stress below 40");
  }else if(i===7){
    for(const [k,v] of Object.entries(c.evidence)) if(!v)m.push(k+" evidence");
  }else if(i===8){
    if(c.hydration<70)m.push("hydration 70+");
    if(c.energy<68)m.push("energy 68+");
    if(c.comfort<68)m.push("comfort 68+");
    if(c.trust<55)m.push("trust 55+");
    if(!c.prep.calibrate)m.push("chamber calibration");
    if(!c.prep.catalyst)m.push("catalyst");
  }else if(i===9){
    if(!c.selectedMorph)m.push("select a morph");
  }else if(i===10){
    if(c.chamber.phase<CHAMBER_PHASES.length)m.push("all chamber phases");
    if(c.chamber.stability<60)m.push("stability 60+");
    if(c.chamber.integrity<60)m.push("integrity 60+");
  }else if(i===11){
    if(c.recovery.adaptation<80)m.push("adaptation 80+");
    if(c.hydration<70)m.push("hydration 70+");
    if(c.stress>=40)m.push("stress below 40");
    if(c.comfort<70)m.push("comfort 70+");
    if(!c.recovery.environment)m.push("habitat tuning");
  }else if(i===12){
    for(const [k,v] of Object.entries(c.training)) if(!v)m.push(k+" training");
  }else if(i===13){
    const x=c.expedition;
    if(!x.world)m.push("select region");
    if(!x.brief)m.push("mission briefing");
    if(!x.route)m.push("route");
    if(!x.objective)m.push("objective");
    if(!x.extract)m.push("safe extraction");
  }
  return m.length ? m.join(" · ") : "all requirements complete";
}

function canFinish(i){
  const c=active();
  if(i===0)return !!(c.intakeBrief&&c.intakeVitals&&c.intakeCalm);
  if(i===1){const t=c.vet.triage;return t.airway&&t.breathing&&t.circulation&&t.temp&&t.weight&&c.vet.oxygen>=94}
  if(i===2)return Object.values(c.vet.exam).every(Boolean);
  if(i===3)return Object.values(c.vet.dx).every(Boolean);
  if(i===4){const t=c.vet.treatment;return Object.values(t).every(Boolean)&&c.pain<=30&&c.hydration>=70}
  if(i===5){const r=c.vet.recovery;return Object.values(r).every(Boolean)&&c.health>=82&&c.pain<=25&&c.hydration>=75&&c.vet.oxygen>=95}
  if(i===6)return c.vet.dx.assessment&&c.vet.treatment.primary&&c.vet.recovery.recheck&&c.health>=82&&c.pain<=25&&c.hydration>=75&&c.vet.oxygen>=95&&c.stress<40;
  if(i===7)return Object.values(c.evidence).every(Boolean);
  if(i===8)return c.hydration>=70&&c.energy>=68&&c.comfort>=68&&c.trust>=55&&c.prep.calibrate&&c.prep.catalyst;
  if(i===9)return !!c.selectedMorph&&c.completedStages.includes(8);
  if(i===10)return c.chamber.phase>=CHAMBER_PHASES.length&&c.chamber.stability>=60&&c.chamber.integrity>=60;
  if(i===11)return c.recovery.adaptation>=80&&c.hydration>=70&&c.stress<40&&c.comfort>=70&&c.recovery.environment;
  if(i===12)return Object.values(c.training).every(Boolean);
  if(i===13)return !!c.expedition.world&&c.expedition.brief&&c.expedition.route&&c.expedition.objective&&c.expedition.extract;
  return false;
}

 }
 const m=morph(),w=WORLDS.find(x=>x.id===c.expedition.world);
 if(!m||!w){toast("Morph form or expedition record is incomplete.");return}

 let vx=0,vy=0;
 st.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;auto=false;vx=vy=0;st.setPointerCapture(e.pointerId)};
 st.onpointermove=e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;vx=dx*.55;vy=-dy*.35;ry+=vx;rx=Math.max(-60,Math.min(60,rx+vy));lastX=e.clientX;lastY=e.clientY;rig()};
 const release=()=>{drag=false;let n=0;const coast=()=>{if(drag||n++>45||Math.abs(vx)+Math.abs(vy)<.08)return;vx*=.92;vy*=.92;ry+=vx;rx=Math.max(-60,Math.min(60,rx+vy));rig();requestAnimationFrame(coast)};coast()};
 st.onpointerup=release;st.onpointercancel=release;
 rig();
}
})();
</script>

<script id="fossil-core-js">
(function(){
const CASES=[
['Ceratopsian','Triceratops horridus','🦏'],['Armored Dinosaur','Ankylosaurus magniventris','🦖'],['Stegosaur','Stegosaurus stenops','🦕'],['Small Theropod','Velociraptor mongoliensis','🦖'],['Large Theropod','Tyrannosaurus rex','🦖'],['Hadrosaur','Parasaurolophus walkeri','🦕'],['Sauropod','Diplodocus carnegii','🦕'],['Pterosaur','Pteranodon longiceps','🦅'],['Marine Reptile','Mosasaurus hoffmannii','🐋'],['Small Herbivore','Psittacosaurus mongoliensis','🦎'],['Early Bird','Archaeopteryx lithographica','🦅'],['Synapsid','Dimetrodon grandis','🦎']];
const BONES=['skull','jaw','vertebrae','ribs','pelvis','left forelimb','right forelimb','left hindlimb','right hindlimb','tail'];
function c(){try{return active()}catch(e){return null}}
function ensure(){let x=c();if(!x)return null;if(!x.fossil){let n=Math.abs(String(x.caseKey||x.name).split('').reduce((a,z)=>a+z.charCodeAt(0),0)),q=CASES[n%CASES.length];x.fossil={group:q[0],species:q[1],living:q[2],bones:[...BONES],found:[],cleaned:0,scanned:false,identified:false,assembled:0,reconstructed:false,reanimated:false};x.prehistoricSpecies=q[1];x.alive=false;x.icon='🦴';if(typeof save==='function')save()}return x.fossil}
function draw(){let x=c(),f=ensure(),e=document.getElementById('fossilRecoveryOverlay');if(!e){e=document.createElement('div');e.id='fossilRecoveryOverlay';e.style='position:fixed;inset:0;z-index:45000;overflow:auto;background:#020609;color:#fff;padding:12px;display:none';document.body.appendChild(e)}if(!f)return;e.innerHTML=`<div style="max-width:980px;margin:auto"><div class="fossil-panel"><button onclick="closeFossilRecovery()" style="float:right">RETURN</button><div style="font-size:8px;color:#9ab2bd">ARCHAEOLOGICAL RECOVERY · ACTUAL GAMEPLAY</div><h1>🦴 ${f.identified?f.species:'Unidentified Prehistoric Specimen'}</h1><p>Excavate → clean → scan → identify → assemble → reconstruct → reanimate. No image assets are required.</p></div><div class="fossil-panel"><div class="fossil-stage">${f.reanimated?f.living:(f.assembled>=f.bones.length?'☠️':'🦴')}</div><div class="fossil-grid">${f.bones.map(b=>`<div class="fossil-bone ${f.found.includes(b)?'found':''}">${f.found.includes(b)?'🦴 '+b:'undisturbed matrix'}</div>`).join('')}</div></div><div class="fossil-panel fossil-actions"><button onclick="fossilDig()">⛏ EXCAVATE</button><button onclick="fossilClean()">🖌 CLEAN</button><button onclick="fossilScan()">⌁ 3D SCAN</button><button onclick="fossilIdentify()">🔎 IDENTIFY</button><button onclick="fossilAssemble()">🦴 ASSEMBLE</button><button onclick="fossilReconstruct()">🧬 RECONSTRUCT</button><button onclick="fossilReanimate()">⚡ REANIMATE</button></div><div class="fossil-panel"><b>Recovered ${f.found.length}/${f.bones.length}</b> · Cleaned ${f.cleaned}/${f.bones.length} · Skeleton ${f.assembled}/${f.bones.length} · Life: ${f.reanimated?'RESTORED':'FOSSIL'}</div></div>`;e.style.display='block'}
window.openFossilRecovery=function(){ensure();draw()};window.closeFossilRecovery=function(){document.getElementById('fossilRecoveryOverlay').style.display='none'};
window.fossilDig=function(){let f=ensure(),left=f.bones.filter(b=>!f.found.includes(b));if(left.length)f.found.push(left[Math.floor(Math.random()*left.length)]);save();draw()};
window.fossilClean=function(){let f=ensure();if(!f.found.length)return toast('Excavate fossil material first.');f.cleaned=Math.min(f.found.length,f.cleaned+1);save();draw()};
window.fossilScan=function(){let f=ensure();if(f.cleaned<5)return toast('Clean at least five fossil elements first.');f.scanned=true;save();draw()};
window.fossilIdentify=function(){let f=ensure();if(!f.scanned)return toast('Complete the scan first.');f.identified=true;save();draw()};
window.fossilAssemble=function(){let f=ensure();if(!f.identified)return toast('Identify the specimen first.');if(f.found.length<f.bones.length)return toast('Recover all fossil elements first.');f.assembled=Math.min(f.bones.length,f.assembled+2);save();draw()};
window.fossilReconstruct=function(){let f=ensure();if(f.assembled<f.bones.length)return toast('Finish skeleton assembly first.');f.reconstructed=true;save();draw()};
window.fossilReanimate=function(){let x=c(),f=ensure();if(!f.reconstructed)return toast('Complete reconstruction first.');f.reanimated=true;x.alive=true;x.icon=f.living;x.species=f.species;x.health=58;x.hydration=55;x.energy=42;x.stress=68;x.pain=18;if(typeof addAudit==='function')addAudit('Reanimation successful: '+f.species+'. Veterinary stabilization required.');save();draw();toast('⚡ LIFE SIGNS DETECTED · CLINICAL STABILIZATION REQUIRED')};
})();
</script>
<script id="direct-working-tools">
(function(){
 window.VG_RESIDENT_OBJECTS=window.VG_RESIDENT_OBJECTS||{};
 window.VG_registerResident=function(key,obj){window.VG_RESIDENT_OBJECTS[String(key)]=obj;return ""};
 window.VG_getRegisteredResident=function(key){return window.VG_RESIDENT_OBJECTS[String(key)]||null};
 function residents(){return (typeof state!=="undefined" && Array.isArray(state.sanctuary))?state.sanctuary:[]}
 function residentIndexByName(name){
   const a=residents(), target=String(name||"");
   let n=a.findIndex(x=>String(x?.name||"")===target);
   if(n<0)n=a.findIndex(x=>String(x?.originalName||"")===target);
   return n;
 }
 
 window.VG_openTwineObject=function(key){
   const p=VG_getRegisteredResident(key);if(!p){alert("Resident card needs to be reopened. Return to Sanctuary and try once more.");return false}
   const e=make("VG_WORKING_TWINE");e.__resident=p;VG_campaign(p);VG_drawTwine();e.style.display="block";e.scrollTop=0;return false;
 };
 window.VG_open3DObject=function(key){
   const p=VG_getRegisteredResident(key);if(!p){alert("Resident card needs to be reopened. Return to Sanctuary and try once more.");return false}
   const e=make("VG_WORKING_3D");e.__resident=p;e.dataset.ry="0";e.dataset.zoom="1";VG_draw3D();e.style.display="block";e.scrollTop=0;return false;
 };

 };
 window.VG_open3DByName=function(name){
   const n=residentIndexByName(name);
   if(n<0){alert("This resident is visible, but its Sanctuary record could not be linked.");return false}
   return VG_open3D(n);
 };

 function getResident(i){
   const a=residents(),n=Number(i);
   if(Number.isInteger(n)&&a[n])return a[n];

   return null;
 }
 function make(id){
   let e=document.getElementById(id);
   if(!e){e=document.createElement("div");e.id=id;e.style.cssText="display:none;position:fixed;inset:0;z-index:1000000;background:#02070c;color:white;overflow:auto;padding:12px";document.body.appendChild(e)}
   return e;
 }
 window.VG_closeTool=function(id){const e=document.getElementById(id);if(e)e.style.display="none"};

 window.VG_openTwine=function(i){
   const p=getResident(i);if(!p){alert("Resident unavailable.");return false}
   const e=make("VG_WORKING_TWINE"); e.dataset.i=String(i); e.dataset.step="0"; e.dataset.item="";
   VG_drawTwine();e.style.display="block";e.scrollTop=0;return false;
 };
 window.VG_twineChoice=function(choice){
   const e=make("VG_WORKING_TWINE");let s=Number(e.dataset.step||0);
   e.dataset.choice=choice;e.dataset.step=String(s+1);VG_drawTwine();return false;
 };
 window.VG_twineFinish=function(){
   const e=make("VG_WORKING_TWINE"),i=Number(e.dataset.i),p=e.__resident||getResident(i);if(!p)return false;
   const items=["Resonance Shard","Ancient Survey Key","Fossil Signal Prism","Buried Field Decoder","Temporal Mineral Sample"];
   const item=items[Math.abs(String(p.name).split("").reduce((a,c)=>a+c.charCodeAt(0),0))%items.length];
   p.fieldItems=p.fieldItems||[];if(!p.fieldItems.includes(item))p.fieldItems.push(item);p.mastery=(p.mastery||0)+10;e.dataset.item=item;e.dataset.step="3";
   try{if(typeof save==="function")save()}catch(x){} VG_drawTwine();return false;
 };

 window.VG_campaign=function(p){
   p.campaign=p.campaign||{};
   const c=p.campaign;
   const defaults={chapter:1,node:0,phase:"prep",science:0,instinct:0,compassion:0,risk:0,exploration:0,resonance:0,
     decisions:[],artifacts:[],clues:[],locations:["Base Camp"],research:[],scientist:{Venn:0,Rook:0,Sol:0},
     prep:{tool:"",artifact:"",ability:""},equipped:{},bond:0,courage:0,curiosity:0,fieldXP:0,completed:false,chapterRuns:0};
   Object.keys(defaults).forEach(k=>{if(c[k]===undefined)c[k]=JSON.parse(JSON.stringify(defaults[k]))});
   return c;
 };
 const VG_CHAPTERS=[
  ["ACT I · BONES","Original Dig","Base Camp","Fossil Shelf","Buried Survey Station","Resonance Chamber"],
  ["ACT II · BREATH","Reanimation Echo","Institute Outpost","Echo Trench","Abandoned Relay","Cradle Annex"],
  ["ACT III · MEMORY","Place Remembered","Dust Camp","Memory Ridge","Sunken Archive","Ancient Threshold"],
  ["ACT IV · SIGNAL","Shared Frequency","Signal Camp","Prism Canyon","Silent Observatory","Frequency Vault"],
  ["ACT V · BELOW","Under the Fossil Layer","Deep Camp","Collapsed Descent","Substrata Ruins","Impossible Chamber"],
  ["ACT VI · FIRST INSTITUTE","Lost Researchers","Old Camp","Forgotten Laboratory","Founder Tunnel","First Institute"],
  ["ACT VII · RESONANCE","Convergence","Convergence Camp","Seven Gates","Resonance Nexus","The Living Archive"]
 ];
 const VG_TOOLS=["Field Scanner","Climbing Rig","Acoustic Recorder","Excavation Kit","Portable Cradle Reader"];
 const VG_ABILITIES=["Flight","Aquatic Adaptation","Enhanced Scent","Armor","Night Vision","Resonance Sense","Climbing","Burrowing"];
 const VG_ARTS=["Resonance Shard","Survey Key","Signal Prism","Field Decoder","Memory Stone","Cradle Lens","Convergence Core"];
 const VG_SCI={Venn:["Dr. Mara Venn","Biological information"],Rook:["Dr. Elias Rook","External signal theory"],Sol:["Dr. Nia Sol","Mineral resonance"]};
 function vgHasAbility(p,name){
   const s=JSON.stringify(p.morphRecord||p).toLowerCase();
   const keys={Flight:["wing","flight","aerial"],"Aquatic Adaptation":["aquatic","fin","gill","tide"],"Enhanced Scent":["scent","olfactory"],Armor:["armor","shell","plate"],"Night Vision":["night","vision","eye"],"Resonance Sense":["resonance","signal"],Climbing:["climb","grip"],Burrowing:["burrow","dig"]};
   return (keys[name]||[name.toLowerCase()]).some(k=>s.includes(k));
 }
 function vgSave(){try{save()}catch(e){}}
 function vgResident(){const e=make("VG_WORKING_TWINE");return e.__resident||getResident(Number(e.dataset.i))}
 function vgLog(c,s){c.decisions.push(s);if(c.decisions.length>100)c.decisions.shift()}
 window.VG_prepPick=function(type,val){const p=vgResident();if(!p)return false;const c=VG_campaign(p);c.prep[type]=val;vgSave();VG_drawTwine();return false};
 window.VG_launchExpedition=function(){const p=vgResident();if(!p)return false;const c=VG_campaign(p);if(!c.prep.tool){alert("Choose one field tool first.");return false}c.phase="field";c.node=0;c.chapterRuns++;vgLog(c,"Departed with "+c.prep.tool+(c.prep.ability?" and "+c.prep.ability:""));vgSave();VG_drawTwine();return false};
 window.VG_storyAct=function(kind){
   const p=vgResident();if(!p)return false;const c=VG_campaign(p),ch=VG_CHAPTERS[c.chapter-1];
   c[kind]=(c[kind]||0)+1;c.fieldXP++;c.curiosity+=kind==="exploration"?2:1;c.bond+=kind==="compassion"||kind==="instinct"?1:0;c.courage+=kind==="risk"?2:0;
   if(c.node===0&&!c.locations.includes(ch[3]))c.locations.push(ch[3]);
   if(c.node===1&&!c.locations.includes(ch[4]))c.locations.push(ch[4]);
   if(c.node===2&&!c.locations.includes(ch[5]))c.locations.push(ch[5]);
   const clue=["Tool marks beneath the fossil layer","Repeating three-band signal","Unknown Institute insignia","Mineral sample with matching resonance","Resident recognition response","Partial founder transmission"][(c.node+c.chapter)%6];
   if(!c.clues.includes(clue))c.clues.push(clue);
   vgLog(c,kind+" choice · "+clue);c.node++;vgSave();VG_drawTwine();return false;
 };
 window.VG_useAbility=function(name){
   const p=vgResident();if(!p)return false;const c=VG_campaign(p);c.resonance++;c.fieldXP+=2;c.node++;vgLog(c,"Morph ability used: "+name);vgSave();VG_drawTwine();return false;
 };
 window.VG_storyScientist=function(k){const p=vgResident();if(!p)return false;const c=VG_campaign(p);c.scientist[k]++;c.science++;c.node++;vgLog(c,"Evidence transmitted to "+VG_SCI[k][0]);vgSave();VG_drawTwine();return false};
 window.VG_finishChapter=function(){
   const p=vgResident();if(!p)return false;const c=VG_campaign(p),a=VG_ARTS[c.chapter-1];
   if(!c.artifacts.includes(a))c.artifacts.push(a);p.fieldItems=p.fieldItems||[];if(!p.fieldItems.includes(a))p.fieldItems.push(a);
   p.mastery=(p.mastery||0)+10;c.fieldXP+=5;vgLog(c,"Recovered "+a+" and returned to Institute.");
   c.phase="return";vgSave();VG_drawTwine();return false;
 };
 window.VG_nextChapter=function(){const p=vgResident();if(!p)return false;const c=VG_campaign(p);if(c.chapter<7){c.chapter++;c.node=0;c.phase="prep";c.prep={tool:"",artifact:"",ability:""}}else c.completed=true;vgSave();VG_drawTwine();return false};
 window.VG_useArtifact=function(a,k){const p=vgResident();if(!p)return false;const c=VG_campaign(p),key=a+":"+k;if(c.research.includes(key))return false;c.research.push(key);c[k]=(c[k]||0)+1;vgLog(c,a+" used in "+k+" research");vgSave();VG_drawTwine();return false};

 window.VG_drawTwine=function(){

   } else if(c.phase==="prep"){
     center=`<div class="tw-card"><div class="tw-kicker">${ch[0]} · EXPEDITION PREPARATION</div><h2>${ch[1]}</h2><p>Choose one field tool, one recovered artifact if available, and one morph capability. Preparation changes the options that can appear in the expedition.</p>
     <b>FIELD TOOL</b><div class="tw-prep">${VG_TOOLS.map(x=>`<button class="vg-btn ${c.prep.tool===x?"selected":""}" onclick='VG_prepPick("tool",${JSON.stringify(x)})'>${x}</button>`).join("")}</div>

     <button class="tw-choice" onclick="VG_launchExpedition()">🧭 DEPART FOR ${ch[2].toUpperCase()}</button><button class="tw-choice secret" onclick="VG_openLivingBoard()">🏕️ OPEN 30-MINUTE LIVING EXPEDITION BOARD</button></div>`;
